[package]
name = "rch-fcp-registry-probe"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
fcp-registry = { path = "../../../crates/fcp-registry" }

[dev-dependencies]
base64 = "0.22"
fcp-async-core = { path = "../../../crates/fcp-async-core" }
fcp-cbor = { path = "../../../crates/fcp-cbor" }
fcp-core = { path = "../../../crates/fcp-core" }
fcp-crypto = { path = "../../../crates/fcp-crypto" }
fcp-manifest = { path = "../../../crates/fcp-manifest" }
fcp-raptorq = { path = "../../../crates/fcp-raptorq" }
fcp-store = { path = "../../../crates/fcp-store" }
hex = { version = "0.4", features = ["serde"] }
semver = { version = "1.0.27", features = ["serde"] }
serde_json = "1.0"
sha2 = "0.10"

[[test]]
name = "no_mock_integration"
path = "../../../crates/fcp-registry/tests/no_mock_integration.rs"

