# Workspace-level clippy configuration.
#
# Bead `flywheel_connectors-y1daf.1` (B.6): when the
# `use fcp_core::...` migration to `use fcp_prelude::...` completes
# across all workspace consumers, uncomment the `disallowed-types`
# section below to lint-error any new direct fcp-core import.
#
# Today (2026-05-02) `rg "use fcp_core::" crates/ connectors/` reports
# >1000 import sites across >1000 files; flipping the lint now would
# break every cargo check/build until the migration finishes. The
# migration is tracked under follow-on `y1daf.1.x` per-crate-group
# beads.
#
# When the migration completes:
#   1. Uncomment the disallowed-types entries below.
#   2. Add `disallowed_types = "deny"` to the workspace [lints.clippy]
#      section in Cargo.toml.
#   3. Verify `cargo clippy --workspace --all-targets` is clean.
#   4. Move fcp-core to `crates/fcp-core-junk-drawer-archive/`.
#
# disallowed-types = [
#     # Force consumers through the canonical import path.
#     { path = "fcp_core::CapabilityToken",
#       reason = "import from fcp_prelude::CapabilityToken instead" },
#     { path = "fcp_core::ZoneId",
#       reason = "import from fcp_prelude::ZoneId instead" },
#     { path = "fcp_core::PrincipalId",
#       reason = "import from fcp_prelude::PrincipalId instead" },
#     # ... full list to be generated by migration tooling at flip time
# ]
#
# Migration cookbook for follow-on beads (y1daf.1.x):
#
#   # 1. Per consumer crate, replace direct fcp-core imports:
#   rg -l "use fcp_core::" crates/<crate>/src/ \
#     | xargs sed -i.bak 's/use fcp_core::/use fcp_prelude::/g'
#
#   # 2. Add fcp-prelude as a dep to that crate (Cargo.toml):
#   #    fcp-prelude = { path = "../fcp-prelude" }
#
#   # 3. Verify the crate builds:
#   cargo check -p <crate> --all-targets
#
#   # 4. After every consumer migrates, drop fcp-core dep where the
#   #    crate only used it through the prelude path (fcp-prelude
#   #    itself becomes the only fcp-core consumer).
