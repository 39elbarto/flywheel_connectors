[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = []
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:f554a68539893103b391f7e1fd76a141a7e37bb554298b2b9b8a53f975b0ec92"

[connector]
id = "fcp.algolia"
name = "Algolia Connector"
version = "0.1.0"
description = "FCP connector for Algolia search (indices, search, records)"
archetypes = ["knowledge"]
format = "wasi"

[connector.state]
model = "singleton_writer"
state_schema_version = "1"
migration_hint = "Stores Application ID and API key."

[zones]
home = "z:work"
allowed_sources = [
    "z:owner",
    "z:private",
    "z:work",
]
allowed_targets = ["z:work"]
forbidden = [
    "z:public",
    "z:community",
]

[capabilities]
required = [
    "network.dns",
    "network.egress",
    "network.tls.sni",
    "storage.state",
]
optional = []
forbidden = [
    "system.exec",
    "network.listen",
    "media.upload",
    "media.download",
]

[provides.operations."algolia.indices.list"]
description = "List indices"
capability = "algolia.indices.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"

[provides.operations."algolia.indices.list".input_schema]
required = []
type = "object"

[provides.operations."algolia.indices.list".output_schema]
required = ["items"]
type = "object"

[provides.operations."algolia.indices.list".output_schema.properties.items]
type = "array"

[provides.operations."algolia.indices.list".network_constraints]
host_allow = [
    "*.algolia.net",
    "*.algolianet.com",
]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 3
connect_timeout_ms = 5000
total_timeout_ms = 15000
max_response_bytes = 10485760

[provides.operations."algolia.indices.list".ai_hints]
when_to_use = "List Algolia search indices."
common_mistakes = ["Not distinguishing between primary and replica indices in the results."]
examples = ["{}"]
related = ["algolia.search"]

[provides.operations."algolia.records.delete"]
description = "Delete a record"
capability = "algolia.records.write"
risk_level = "high"
safety_tier = "dangerous"
requires_approval = "interactive"
idempotency = "strict"

[provides.operations."algolia.records.delete".input_schema]
required = [
    "index_name",
    "object_id",
]
type = "object"

[provides.operations."algolia.records.delete".input_schema.properties.index_name]
type = "string"

[provides.operations."algolia.records.delete".input_schema.properties.object_id]
type = "string"

[provides.operations."algolia.records.delete".output_schema]
type = "object"

[provides.operations."algolia.records.delete".network_constraints]
host_allow = [
    "*.algolia.net",
    "*.algolianet.com",
]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 3
connect_timeout_ms = 5000
total_timeout_ms = 10000
max_response_bytes = 1048576

[provides.operations."algolia.records.delete".ai_hints]
when_to_use = "Delete a record from an index. Cannot be undone."
common_mistakes = ["Deleting from a replica index instead of the primary — replicas are read-only and the request will fail."]
examples = ['{"index_name": "products", "object_id": "abc123"}']
related = ["algolia.records.get"]

[provides.operations."algolia.records.get"]
description = "Get a record by objectID"
capability = "algolia.records.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"

[provides.operations."algolia.records.get".input_schema]
required = [
    "index_name",
    "object_id",
]
type = "object"

[provides.operations."algolia.records.get".input_schema.properties.index_name]
type = "string"

[provides.operations."algolia.records.get".input_schema.properties.object_id]
type = "string"

[provides.operations."algolia.records.get".output_schema]
required = ["objectID"]
type = "object"

[provides.operations."algolia.records.get".output_schema.properties.objectID]
type = "string"

[provides.operations."algolia.records.get".network_constraints]
host_allow = [
    "*.algolia.net",
    "*.algolianet.com",
]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 3
connect_timeout_ms = 5000
total_timeout_ms = 10000
max_response_bytes = 1048576

[provides.operations."algolia.records.get".ai_hints]
when_to_use = "Get a specific record by its objectID."
common_mistakes = ["Using a search-only API key which lacks the getObject permission required for direct record retrieval."]
examples = ['{"index_name": "products", "object_id": "abc123"}']
related = ["algolia.search"]

[provides.operations."algolia.search"]
description = "Search an index"
capability = "algolia.search.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"

[provides.operations."algolia.search".input_schema]
required = [
    "index_name",
    "query",
]
type = "object"

[provides.operations."algolia.search".input_schema.properties.hits_per_page]
maximum = 1000
type = "integer"

[provides.operations."algolia.search".input_schema.properties.index_name]
type = "string"

[provides.operations."algolia.search".input_schema.properties.query]
type = "string"

[provides.operations."algolia.search".output_schema]
required = ["hits"]
type = "object"

[provides.operations."algolia.search".output_schema.properties.hits]
type = "array"

[provides.operations."algolia.search".network_constraints]
host_allow = [
    "*.algolia.net",
    "*.algolianet.com",
]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 3
connect_timeout_ms = 5000
total_timeout_ms = 10000
max_response_bytes = 10485760

[provides.operations."algolia.search".ai_hints]
when_to_use = "Search for records in an Algolia index."
common_mistakes = ["Passing raw filter expressions in the query string instead of using the separate filters parameter."]
examples = ['{"index_name": "products", "query": "laptop", "hits_per_page": 20}']
related = [
    "algolia.indices.list",
    "algolia.records.get",
]

[sandbox]
profile = "strict"
memory_mb = 256
cpu_percent = 50
wall_clock_timeout_ms = 300000
fs_readonly_paths = [
    "/usr",
    "/lib",
]
fs_writable_paths = ["$CONNECTOR_STATE"]
deny_exec = true
deny_ptrace = true

[[rate_limits.pools]]
id = "algolia.indices.read"
requests = 100
window_ms = 60000
burst = 10
scope = "instance"

[[rate_limits.pools]]
id = "algolia.search.read"
requests = 500
window_ms = 60000
burst = 50
scope = "instance"

[[rate_limits.pools]]
id = "algolia.records.read"
requests = 200
window_ms = 60000
burst = 20
scope = "instance"

[[rate_limits.pools]]
id = "algolia.records.write"
requests = 50
window_ms = 60000
burst = 10
scope = "instance"

[rate_limits.operation_pools]
"algolia.records.get" = ["algolia.records.read"]
"algolia.records.delete" = ["algolia.records.write"]
"algolia.indices.list" = ["algolia.indices.read"]
"algolia.search" = ["algolia.search.read"]
