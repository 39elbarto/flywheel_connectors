[provides.operations."anthropic.message.stream".output_schema.properties.id]
type = "string"

[provides.operations."anthropic.message.stream".output_schema.properties.model]
type = "string"

[provides.operations."anthropic.message.stream".output_schema.properties.stop_reason]
