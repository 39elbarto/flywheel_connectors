[provides.operations."anthropic.message.stream".network_constraints]
host_allow = ["api.anthropic.com"]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 5
connect_timeout_ms = 10000
total_timeout_ms = 120000
max_response_bytes = 10485760

[provides.operations."anthropic.message.stream".ai_hints]
when_to_use = "Use for streaming Claude responses via SSE for lower time-to-first-token."
common_mistakes = [
    "Not handling SSE events incrementally.",
    "Sending an empty messages array.",
    "Using an unsupported model name.",
]
examples = ['{"messages": [{"role": "user", "content": "Write a poem about Rust"}]}']
related = [
    "anthropic.message",
    "anthropic.chat",
    "anthropic.get_usage",
]

[event_caps]
streaming = true
replay = false
min_buffer_events = 10

[sandbox]
profile = "strict"
memory_mb = 256
cpu_percent = 50
wall_clock_timeout_ms = 120000
fs_readonly_paths = [
    "/usr",
    "/lib",
]
fs_writable_paths = ["$CONNECTOR_STATE"]
deny_exec = true
deny_ptrace = true
