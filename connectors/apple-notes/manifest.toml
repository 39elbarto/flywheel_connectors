[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = []
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:a52489d5e27b1f103b7f2dd7972fb3c1dd771a5cc7112b3588da057de9b1b781"

[connector]
id = "fcp.apple-notes"
name = "Apple Notes"
version = "0.1.0"
description = "macOS-local Apple Notes connector for note inventory, note search, note retrieval, and note creation"
archetypes = ["knowledge", "operational"]
format = "native"

[connector.state]
model = "stateless"
state_schema_version = "1"
migration_hint = "Apple Notes state remains inside the macOS Notes app; the connector keeps no durable local state."

[zones]
home = "z:owner"
allowed_sources = ["z:owner", "z:private"]
allowed_targets = ["z:owner", "z:private"]
forbidden = ["z:public", "z:community", "z:work"]

[capabilities]
required = ["apple_notes.read", "apple_notes.write"]
optional = []
# Raw ambient exec remains forbidden; the connector runtime only launches a
# validated absolute osascript binary with static AppleScript and argv payloads.
forbidden = ["network.listen", "network.outbound", "system.exec", "system.privileged"]

[provides.operations."apple_notes.health"]
description = "Report Apple Notes connector health and platform support"
capability = "apple_notes.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"

[provides.operations."apple_notes.health".input_schema]
type = "object"
properties = {}

[provides.operations."apple_notes.health".output_schema]
type = "object"

[provides.operations."apple_notes.health".output_schema.properties.status]
type = "string"

[provides.operations."apple_notes.health".output_schema.properties.platform]
type = "string"

[provides.operations."apple_notes.health".output_schema.properties.manifest_hash]
type = "string"

[provides.operations."apple_notes.health".ai_hints]
when_to_use = "Use this before Apple Notes operations on a new macOS host or when diagnosing a failed Notes automation request."
common_mistakes = [
    "Treating a healthy connector as proof that the Notes app has granted Automation permission; creation and reads can still fail until macOS grants the permission.",
    "Running this on Linux or Windows and interpreting the platform failure as a note-data problem.",
]
examples = ['{"check":"platform-and-configuration"}']
related = ["apple_notes.list_notes", "apple_notes.search_notes"]

[provides.operations."apple_notes.list_notes"]
description = "List Apple Notes note summaries"
capability = "apple_notes.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"

[provides.operations."apple_notes.list_notes".input_schema]
type = "object"

[provides.operations."apple_notes.list_notes".input_schema.properties.folder]
type = "string"

[provides.operations."apple_notes.list_notes".output_schema]
type = "object"

[provides.operations."apple_notes.list_notes".output_schema.properties.notes]
type = "array"

[provides.operations."apple_notes.list_notes".output_schema.properties.notes.items]
type = "object"

[provides.operations."apple_notes.list_notes".output_schema.properties.notes.items.properties.id]
type = "string"

[provides.operations."apple_notes.list_notes".output_schema.properties.notes.items.properties.title]
type = "string"

[provides.operations."apple_notes.list_notes".output_schema.properties.notes.items.properties.folder]
type = "string"

[provides.operations."apple_notes.list_notes".ai_hints]
when_to_use = "Use this when an agent needs a browseable inventory of Apple Notes before choosing a specific note to read."
common_mistakes = [
    "Assuming summaries include full note bodies; use apple_notes.get_note after selecting the note identifier.",
    "Using a display folder name that does not exist in the local Notes app and treating the empty result as global absence.",
]
examples = ['{"folder":"Project Plans"}']
related = ["apple_notes.get_note", "apple_notes.search_notes"]

[provides.operations."apple_notes.search_notes"]
description = "Search Apple Notes by title/body substring"
capability = "apple_notes.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"

[provides.operations."apple_notes.search_notes".input_schema]
required = ["query"]
type = "object"

[provides.operations."apple_notes.search_notes".input_schema.properties.query]
type = "string"

[provides.operations."apple_notes.search_notes".output_schema]
type = "object"

[provides.operations."apple_notes.search_notes".output_schema.properties.notes]
type = "array"

[provides.operations."apple_notes.search_notes".output_schema.properties.notes.items]
type = "object"

[provides.operations."apple_notes.search_notes".output_schema.properties.notes.items.properties.id]
type = "string"

[provides.operations."apple_notes.search_notes".output_schema.properties.notes.items.properties.title]
type = "string"

[provides.operations."apple_notes.search_notes".output_schema.properties.notes.items.properties.folder]
type = "string"

[provides.operations."apple_notes.search_notes".ai_hints]
when_to_use = "Use this when the user gives a keyword, topic, or phrase and the agent needs candidate Apple Notes before reading one."
common_mistakes = [
    "Sending an empty or whitespace query; the connector rejects empty search text.",
    "Assuming substring search has semantic ranking; inspect candidate titles and folders before acting on a result.",
]
examples = ['{"query":"release checklist"}']
related = ["apple_notes.get_note", "apple_notes.list_notes"]

[provides.operations."apple_notes.get_note"]
description = "Get one Apple Note by note identifier"
capability = "apple_notes.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"

[provides.operations."apple_notes.get_note".input_schema]
required = ["note_id"]
type = "object"

[provides.operations."apple_notes.get_note".input_schema.properties.note_id]
type = "string"

[provides.operations."apple_notes.get_note".output_schema]
type = "object"

[provides.operations."apple_notes.get_note".output_schema.properties.id]
type = "string"

[provides.operations."apple_notes.get_note".output_schema.properties.title]
type = "string"

[provides.operations."apple_notes.get_note".output_schema.properties.folder]
type = "string"

[provides.operations."apple_notes.get_note".output_schema.properties.body]
type = "string"

[provides.operations."apple_notes.get_note".ai_hints]
when_to_use = "Use this after list_notes or search_notes returns a note identifier and the agent needs the full note body."
common_mistakes = [
    "Passing a note title instead of the stable note identifier returned by list_notes or search_notes.",
    "Logging or forwarding the returned body without considering that Apple Notes content may be private user data.",
]
examples = ['{"note_id":"x-coredata://NOTE-ID"}']
related = ["apple_notes.list_notes", "apple_notes.search_notes"]

[provides.operations."apple_notes.create_note"]
description = "Create a new Apple Note"
capability = "apple_notes.write"
risk_level = "medium"
safety_tier = "risky"
requires_approval = "policy"
idempotency = "none"

[provides.operations."apple_notes.create_note".input_schema]
required = ["title", "body"]
type = "object"

[provides.operations."apple_notes.create_note".input_schema.properties.title]
type = "string"

[provides.operations."apple_notes.create_note".input_schema.properties.body]
type = "string"

[provides.operations."apple_notes.create_note".input_schema.properties.folder]
type = "string"

[provides.operations."apple_notes.create_note".output_schema]
type = "object"

[provides.operations."apple_notes.create_note".output_schema.properties.id]
type = "string"

[provides.operations."apple_notes.create_note".output_schema.properties.title]
type = "string"

[provides.operations."apple_notes.create_note".output_schema.properties.folder]
type = "string"

[provides.operations."apple_notes.create_note".ai_hints]
when_to_use = "Use this when the user explicitly wants a new Apple Notes note created from agent-generated or user-provided content."
common_mistakes = [
    "Creating notes without policy approval or clear user intent; this is a write operation in the owner/private zone.",
    "Using an empty title; the connector rejects blank note titles.",
    "Embedding secrets or access tokens in example or audit payloads.",
]
examples = ['{"title":"Release checklist","body":"- Review conformance logs\\n- Confirm rollback plan","folder":"Project Plans"}']
related = ["apple_notes.list_notes", "apple_notes.get_note"]

[sandbox]
profile = "strict"
memory_mb = 64
cpu_percent = 25
wall_clock_timeout_ms = 30000
deny_exec = false
deny_ptrace = true
