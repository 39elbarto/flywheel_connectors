[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = []
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:34429cb074351c9ad5dc5cb14f06c40dc08f03614dc2101e4ac09756b0066a5a"

[connector]
id = "fcp.apple-notes"
name = "Apple Notes"
version = "0.1.0"
description = "macOS-local Apple Notes connector for note inventory, note search, note retrieval, and note creation"
archetypes = ["knowledge", "operational"]
format = "native"

[connector.state]
model = "stateless"
state_schema_version = "1"
migration_hint = "Apple Notes state remains inside the macOS Notes app; the connector keeps no durable local state."

[zones]
home = "z:owner"
allowed_sources = ["z:owner", "z:private"]
allowed_targets = ["z:owner", "z:private"]
forbidden = ["z:public", "z:community", "z:work"]

[capabilities]
required = ["apple_notes.read", "apple_notes.write"]
optional = []
# Raw ambient exec remains forbidden; the connector runtime only launches a
# validated absolute osascript binary with static AppleScript and argv payloads.
forbidden = ["network.listen", "network.outbound", "system.exec", "system.privileged"]

[provides.operations."apple_notes.health"]
description = "Report Apple Notes connector health and platform support"
capability = "apple_notes.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"

[provides.operations."apple_notes.health".input_schema]
type = "object"

[provides.operations."apple_notes.health".output_schema]
type = "object"

[provides.operations."apple_notes.health".ai_hints]
when_to_use = "Use during setup or diagnostics to confirm the Apple Notes connector is configured and running on a supported macOS host before note operations."
common_mistakes = [
    "Treating a successful health check as proof that a specific note or folder exists.",
    "Calling this from non-macOS hosts where Apple Notes automation cannot run.",
]
examples = [
    "{}",
]
related = ["apple_notes.list_notes"]

[provides.operations."apple_notes.list_notes"]
description = "List Apple Notes note summaries"
capability = "apple_notes.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"

[provides.operations."apple_notes.list_notes".input_schema]
type = "object"

[provides.operations."apple_notes.list_notes".input_schema.properties.folder]
type = "string"

[provides.operations."apple_notes.list_notes".output_schema]
type = "object"

[provides.operations."apple_notes.list_notes".output_schema.properties.notes]
type = "array"

[provides.operations."apple_notes.list_notes".ai_hints]
when_to_use = "Use when an agent needs to browse available Apple Notes summaries or discover note identifiers before opening individual notes."
common_mistakes = [
    "Expecting full note bodies from this summary listing operation.",
    "Assuming folder names are portable across different macOS Apple Notes accounts.",
]
examples = [
    "{}",
    '{"folder":"Inbox"}',
]
related = ["apple_notes.get_note", "apple_notes.search_notes"]

[provides.operations."apple_notes.search_notes"]
description = "Search Apple Notes by title/body substring"
capability = "apple_notes.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"

[provides.operations."apple_notes.search_notes".input_schema]
required = ["query"]
type = "object"

[provides.operations."apple_notes.search_notes".input_schema.properties.query]
type = "string"

[provides.operations."apple_notes.search_notes".output_schema]
type = "object"

[provides.operations."apple_notes.search_notes".output_schema.properties.notes]
type = "array"

[provides.operations."apple_notes.search_notes".ai_hints]
when_to_use = "Use when the user gives keywords, titles, or remembered text and the agent needs matching Apple Notes summaries before selecting a note."
common_mistakes = [
    "Using this for complex ranking, semantic search, or cross-account discovery beyond Apple Notes substring matching.",
    "Sending broad personal-data searches when a narrower folder or title hint is available.",
]
examples = [
    '{"query":"deployment checklist"}',
]
related = ["apple_notes.list_notes", "apple_notes.get_note"]

[provides.operations."apple_notes.get_note"]
description = "Get one Apple Note by note identifier"
capability = "apple_notes.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"

[provides.operations."apple_notes.get_note".input_schema]
required = ["note_id"]
type = "object"

[provides.operations."apple_notes.get_note".input_schema.properties.note_id]
type = "string"

[provides.operations."apple_notes.get_note".output_schema]
type = "object"

[provides.operations."apple_notes.get_note".output_schema.properties.note]
type = "object"

[provides.operations."apple_notes.get_note".ai_hints]
when_to_use = "Use after list_notes or search_notes returns a note identifier and the agent needs the selected note content."
common_mistakes = [
    "Guessing note identifiers instead of using an identifier returned by list_notes or search_notes.",
    "Fetching full note content when a summary from list_notes is sufficient for the task.",
]
examples = [
    '{"note_id":"x-coredata://example-note-id"}',
]
related = ["apple_notes.list_notes", "apple_notes.search_notes"]

[provides.operations."apple_notes.create_note"]
description = "Create a new Apple Note"
capability = "apple_notes.write"
risk_level = "medium"
safety_tier = "risky"
requires_approval = "policy"
idempotency = "none"

[provides.operations."apple_notes.create_note".input_schema]
required = ["title", "body"]
type = "object"

[provides.operations."apple_notes.create_note".input_schema.properties.title]
type = "string"

[provides.operations."apple_notes.create_note".input_schema.properties.body]
type = "string"

[provides.operations."apple_notes.create_note".input_schema.properties.folder]
type = "string"

[provides.operations."apple_notes.create_note".output_schema]
type = "object"

[provides.operations."apple_notes.create_note".output_schema.properties.note]
type = "object"

[provides.operations."apple_notes.create_note".ai_hints]
when_to_use = "Use when the user explicitly wants a new Apple Note created with a title and body, optionally in a known folder."
common_mistakes = [
    "Creating notes without user intent or without checking whether an existing note should be updated manually instead.",
    "Assuming the requested folder exists; Apple Notes automation may fall back or fail depending on local account state.",
    "Putting credentials, private tokens, or unrelated personal data into a note body.",
]
examples = [
    '{"title":"Deploy checklist","body":"- verify logs\\n- notify team"}',
    '{"title":"Meeting notes","body":"Follow up on release blockers","folder":"Work"}',
]
related = ["apple_notes.list_notes", "apple_notes.search_notes"]

[sandbox]
profile = "strict"
memory_mb = 64
cpu_percent = 25
wall_clock_timeout_ms = 30000
deny_exec = false
deny_ptrace = true
