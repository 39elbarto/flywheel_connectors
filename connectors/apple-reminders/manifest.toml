[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = []
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:c941db7b0bcc0b329546507851846f43d39610144894cf16997abc595dad0e2f"

[connector]
id = "fcp.apple-reminders"
name = "Apple Reminders"
version = "0.1.0"
description = "macOS-local Apple Reminders connector for list inventory, reminder inventory, reminder creation, and completion"
archetypes = ["knowledge", "operational"]
format = "native"

[connector.state]
model = "stateless"
state_schema_version = "1"
migration_hint = "Apple Reminders state remains inside the macOS Reminders app; the connector keeps no durable local state."

[zones]
home = "z:owner"
allowed_sources = ["z:owner", "z:private"]
allowed_targets = ["z:owner", "z:private"]
forbidden = ["z:public", "z:community", "z:work"]

[capabilities]
required = ["apple_reminders.read", "apple_reminders.write"]
optional = []
# Raw ambient exec remains forbidden; the connector runtime only launches a
# validated absolute osascript binary with static AppleScript and argv payloads.
forbidden = ["network.listen", "network.outbound", "system.exec", "system.privileged"]

[provides.operations."apple_reminders.health"]
description = "Report Apple Reminders connector health and platform support"
capability = "apple_reminders.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"

[provides.operations."apple_reminders.health".input_schema]
type = "object"

[provides.operations."apple_reminders.health".output_schema]
type = "object"

[provides.operations."apple_reminders.health".ai_hints]
when_to_use = "Use this before Apple Reminders operations on a new macOS host or when diagnosing a failed reminder automation request."
common_mistakes = [
    "Treating health success as proof that the Reminders app has already granted Automation permission.",
    "Running this on a non-macOS host and interpreting the platform failure as missing reminder data.",
]
examples = ['{"check":"platform-and-configuration"}']
related = ["apple_reminders.list_lists", "apple_reminders.list_reminders"]

[provides.operations."apple_reminders.list_lists"]
description = "List reminder lists"
capability = "apple_reminders.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"

[provides.operations."apple_reminders.list_lists".input_schema]
type = "object"

[provides.operations."apple_reminders.list_lists".output_schema]
type = "object"

[provides.operations."apple_reminders.list_lists".output_schema.properties.lists]
type = "array"

[provides.operations."apple_reminders.list_lists".ai_hints]
when_to_use = "Use this when the agent needs the available Reminders lists before listing or creating reminders in a specific list."
common_mistakes = [
    "Guessing a list name before inspecting the user's local Reminders lists.",
    "Assuming list names are globally stable across machines or Apple IDs.",
]
examples = ['{"scope":"all-lists"}']
related = ["apple_reminders.list_reminders", "apple_reminders.create_reminder"]

[provides.operations."apple_reminders.list_reminders"]
description = "List reminders in a list or across all lists"
capability = "apple_reminders.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"

[provides.operations."apple_reminders.list_reminders".input_schema]
type = "object"

[provides.operations."apple_reminders.list_reminders".input_schema.properties.list_name]
type = "string"

[provides.operations."apple_reminders.list_reminders".output_schema]
type = "object"

[provides.operations."apple_reminders.list_reminders".output_schema.properties.reminders]
type = "array"

[provides.operations."apple_reminders.list_reminders".ai_hints]
when_to_use = "Use this when the agent needs reminder inventory, optionally scoped to a known Reminders list."
common_mistakes = [
    "Passing a display list name that has not been confirmed with list_lists.",
    "Treating completed and active reminder filtering as implicit; inspect the returned reminder fields before deciding what is pending.",
]
examples = ['{"list_name":"Work"}']
related = ["apple_reminders.list_lists", "apple_reminders.complete_reminder"]

[provides.operations."apple_reminders.create_reminder"]
description = "Create a reminder"
capability = "apple_reminders.write"
risk_level = "medium"
safety_tier = "risky"
requires_approval = "policy"
idempotency = "none"

[provides.operations."apple_reminders.create_reminder".input_schema]
required = ["title"]
type = "object"

[provides.operations."apple_reminders.create_reminder".input_schema.properties.title]
type = "string"

[provides.operations."apple_reminders.create_reminder".input_schema.properties.list_name]
type = "string"

[provides.operations."apple_reminders.create_reminder".output_schema]
type = "object"

[provides.operations."apple_reminders.create_reminder".output_schema.properties.reminder]
type = "object"

[provides.operations."apple_reminders.create_reminder".ai_hints]
when_to_use = "Use this when the user explicitly asks the agent to add a new reminder to Apple Reminders."
common_mistakes = [
    "Creating reminders without explicit user intent or policy approval; this mutates the user's local Reminders data.",
    "Sending an empty title; the connector rejects blank reminder titles.",
    "Guessing a list name instead of using list_lists or the configured default list.",
]
examples = ['{"title":"Review deployment notes","list_name":"Work"}']
related = ["apple_reminders.list_lists", "apple_reminders.list_reminders"]

[provides.operations."apple_reminders.complete_reminder"]
description = "Mark a reminder complete"
capability = "apple_reminders.write"
risk_level = "medium"
safety_tier = "risky"
requires_approval = "policy"
idempotency = "best_effort"

[provides.operations."apple_reminders.complete_reminder".input_schema]
required = ["reminder_id"]
type = "object"

[provides.operations."apple_reminders.complete_reminder".input_schema.properties.reminder_id]
type = "string"

[provides.operations."apple_reminders.complete_reminder".output_schema]
type = "object"

[provides.operations."apple_reminders.complete_reminder".output_schema.properties.reminder]
type = "object"

[provides.operations."apple_reminders.complete_reminder".ai_hints]
when_to_use = "Use this when the user has identified a specific reminder and wants it marked complete."
common_mistakes = [
    "Passing the reminder title instead of the stable reminder identifier returned by list_reminders.",
    "Treating best-effort idempotency as strict exactly-once behavior; confirm the returned completed flag when the caller needs certainty.",
]
examples = ['{"reminder_id":"x-apple-reminder://REMINDER-ID"}']
related = ["apple_reminders.list_reminders", "apple_reminders.list_lists"]

[sandbox]
profile = "strict"
memory_mb = 64
cpu_percent = 25
wall_clock_timeout_ms = 30000
deny_exec = false
deny_ptrace = true
