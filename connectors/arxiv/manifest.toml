[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = []
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:01863eda5449fb8338e29e5e47aa2d8757646406ed80167c2b998b05a00ef639"

[connector]
id = "fcp.arxiv"
name = "arXiv Connector"
version = "0.1.0"
description = "FCP connector for arXiv (paper search, metadata, PDF access, citation graph, author info, category classification, new paper monitoring)"
archetypes = [
    "knowledge",
    "operational",
    "streaming",
]
format = "wasi"

[connector.state]
model = "singleton_writer"
state_schema_version = "1"
migration_hint = "Stores monitor cursors for new-paper polling, bounded metadata cache (max 50 MB), and last-seen paper timestamps per category."

[zones]
home = "z:work"
allowed_sources = [
    "z:owner",
    "z:private",
    "z:work",
]
allowed_targets = [
    "z:work",
    "z:private",
]
forbidden = [
    "z:public",
    "z:community",
]

[capabilities]
required = [
    "network.dns",
    "network.egress",
    "network.tls.sni",
    "storage.state",
    "media.download",
]
optional = []
forbidden = [
    "system.exec",
    "network.listen",
    "media.upload",
]

[provides.operations."arxiv.download_pdf"]
