type = "object"

[provides.operations."arxiv.search_semantic".output_schema.properties.papers]
type = "array"

[provides.operations."arxiv.search_semantic".network_constraints]
host_allow = [
    "export.arxiv.org",
    "arxiv.org",
    "api.semanticscholar.org",
]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 3
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 10485760

[provides.operations."arxiv.search_semantic".ai_hints]
when_to_use = "Search using natural language descriptions rather than keyword queries."
common_mistakes = ["Using arXiv query syntax (ti:, au:) instead of plain natural language — this endpoint expects free-text descriptions."]
examples = ['{"query": "papers about using graph neural networks for drug discovery", "max_results": 10, "categories": ["cs.LG", "q-bio.QM"]}']
related = ["arxiv.search_papers"]

[event_caps]
streaming = true
replay = false
min_buffer_events = 200

[sandbox]
profile = "strict"
memory_mb = 256
cpu_percent = 50
wall_clock_timeout_ms = 300000
fs_readonly_paths = [
    "/usr",
    "/lib",
]
fs_writable_paths = ["$CONNECTOR_STATE"]
deny_exec = true
deny_ptrace = true

[[rate_limits.pools]]
id = "arxiv.search"
description = "Search operations (arXiv API allows ~1 req/3s)"
requests = 20
window_ms = 60000
burst = 3
scope = "instance"

[[rate_limits.pools]]
id = "arxiv.read"
description = "Paper metadata and content access"
requests = 20
window_ms = 60000
burst = 3
scope = "instance"

[[rate_limits.pools]]
id = "arxiv.citations"
description = "Citation graph operations (may use Semantic Scholar)"
requests = 100
window_ms = 300000
burst = 10
scope = "instance"

[[rate_limits.pools]]
id = "arxiv.authors"
description = "Author lookup operations"
requests = 30
window_ms = 60000
burst = 5
scope = "instance"

[[rate_limits.pools]]
id = "arxiv.categories"
description = "Category listing and new paper retrieval"
requests = 20
window_ms = 60000
burst = 3
scope = "instance"

[[rate_limits.pools]]
id = "arxiv.monitor"
description = "Monitor/streaming operations (polling-backed)"
requests = 10
window_ms = 60000
burst = 2
scope = "instance"

[rate_limits.operation_pools]
"arxiv.list_categories" = ["arxiv.categories"]
"arxiv.download_pdf" = ["arxiv.read"]
"arxiv.get_paper" = ["arxiv.read"]
"arxiv.get_citations" = ["arxiv.citations"]
"arxiv.get_references" = ["arxiv.citations"]
"arxiv.monitor_category" = ["arxiv.monitor"]
"arxiv.monitor_query" = ["arxiv.monitor"]
"arxiv.extract_references" = ["arxiv.citations"]
"arxiv.get_new_papers" = ["arxiv.categories"]
"arxiv.get_author" = ["arxiv.authors"]
"arxiv.search_papers" = ["arxiv.search"]
"arxiv.search_semantic" = ["arxiv.search"]
"arxiv.get_full_text" = ["arxiv.read"]
