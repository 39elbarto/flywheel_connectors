risk_level = "medium"
safety_tier = "risky"
requires_approval = "none"
idempotency = "best_effort"

[provides.operations."aws_bedrock.invoke_model".input_schema]
type = "object"
required = ["model_id"]
additionalProperties = false
anyOf = [{ required = ["body"] }, { required = ["model_family"] }]
allOf = [
    { if = { properties = { model_family = { const = "anthropic_claude" } }, required = ["model_family"] }, then = { required = ["messages"] } },
