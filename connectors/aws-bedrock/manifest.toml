[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = []
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:348f916c7839be0a2ef8e87a61d1b50ebcdd5309b3ec89389fb4e52649c94a56"

[connector]
id = "fcp.aws-bedrock"
name = "AWS Bedrock"
version = "0.1.0"
description = "AWS-native Bedrock Runtime connector for Converse, InvokeModel, streaming event-stream decoding, and foundation model discovery"
archetypes = ["operational", "streaming"]
format = "native"

[connector.state]
model = "stateless"
state_schema_version = "1"
migration_hint = "No durable connector state; credentials and HTTP clients live only inside the current connector instance."

[zones]
home = "z:work"
allowed_sources = ["z:work", "z:private"]
allowed_targets = ["z:work"]
forbidden = ["z:public", "z:community"]

[capabilities]
required = ["network.dns", "network.egress", "network.tls.sni"]
optional = []
forbidden = ["system.exec", "network.listen", "system.privileged"]

[provides.operations."aws_bedrock.converse"]
description = "Invoke the recommended Bedrock Converse API with unified message shape."
capability = "aws_bedrock.chat"
risk_level = "medium"
safety_tier = "risky"
requires_approval = "none"
idempotency = "best_effort"
input_schema = { type = "object", required = ["model_id", "messages"] }
output_schema = { type = "object" }

[provides.operations."aws_bedrock.converse".network_constraints]
host_allow = ["bedrock-runtime.us-east-1.amazonaws.com", "bedrock-runtime.us-west-2.amazonaws.com"]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 0
connect_timeout_ms = 10000
total_timeout_ms = 240000
max_response_bytes = 25000000

[provides.operations."aws_bedrock.converse".ai_hints]
when_to_use = "Use for Bedrock chat requests that can use the unified Converse API message format across supported foundation models."
common_mistakes = [
    "Passing a raw InvokeModel body to converse; use messages and model_id for Converse or aws_bedrock.invoke_model for raw model-family payloads.",
    "Logging prompts, completions, AWS credentials, session tokens, or SigV4 signatures while debugging Bedrock requests.",
    "Using a model or region that Bedrock does not expose on the configured account.",
]
examples = [
    '{"model_id": "anthropic.claude-3-haiku-20240307-v1:0", "messages": [{"role": "user", "content": [{"text": "Summarize this incident report."}]}]}',
]
related = [
    "aws_bedrock.converse_stream",
    "aws_bedrock.models.list",
]

[provides.operations."aws_bedrock.converse_stream"]
description = "Invoke the Bedrock ConverseStream API and decode AWS event-stream frames."
capability = "aws_bedrock.chat"
risk_level = "medium"
safety_tier = "risky"
requires_approval = "none"
idempotency = "best_effort"
input_schema = { type = "object", required = ["model_id", "messages"] }
output_schema = { type = "object" }

[provides.operations."aws_bedrock.converse_stream".network_constraints]
host_allow = ["bedrock-runtime.us-east-1.amazonaws.com", "bedrock-runtime.us-west-2.amazonaws.com"]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 0
connect_timeout_ms = 10000
total_timeout_ms = 240000
max_response_bytes = 25000000

[provides.operations."aws_bedrock.converse_stream".ai_hints]
when_to_use = "Use when an agent needs lower time-to-first-token from Bedrock and can consume decoded AWS event-stream chunks."
common_mistakes = [
    "Treating each stream chunk as a complete final answer; stream output must be accumulated or handled incrementally.",
    "Using this operation for models that only support non-streaming InvokeModel or Converse calls.",
    "Forgetting that the connector still enforces normal capability, region, and network constraints before opening the stream.",
]
examples = [
    '{"model_id": "anthropic.claude-3-haiku-20240307-v1:0", "messages": [{"role": "user", "content": [{"text": "Draft a short launch checklist."}]}]}',
]
related = [
    "aws_bedrock.converse",
    "aws_bedrock.invoke_model_stream",
]

[provides.operations."aws_bedrock.invoke_model"]
description = "Invoke legacy Bedrock InvokeModel with either raw JSON body or connector-built model-family body."
capability = "aws_bedrock.chat"
risk_level = "medium"
safety_tier = "risky"
requires_approval = "none"
idempotency = "best_effort"
input_schema = { type = "object", required = ["model_id"] }
output_schema = { type = "object" }

[provides.operations."aws_bedrock.invoke_model".network_constraints]
host_allow = ["bedrock-runtime.us-east-1.amazonaws.com", "bedrock-runtime.us-west-2.amazonaws.com"]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 0
connect_timeout_ms = 10000
total_timeout_ms = 240000
max_response_bytes = 25000000

[provides.operations."aws_bedrock.invoke_model".ai_hints]
when_to_use = "Use for Bedrock models or legacy request shapes that require InvokeModel rather than the Converse API."
common_mistakes = [
    "Sending Converse messages to invoke_model without selecting a model_family or providing the raw body expected by that Bedrock model.",
    "Assuming all model families share one JSON payload shape; Anthropic, Titan, Llama, Cohere, and Mistral bodies differ.",
    "Retrying non-idempotent prompt workflows without considering duplicate model charges or side effects in downstream tool chains.",
]
examples = [
    '{"model_id": "amazon.titan-text-express-v1", "model_family": "titan_text", "prompt": "Write a concise status update.", "max_tokens": 256}',
    '{"model_id": "anthropic.claude-v2", "body": {"prompt": "\\n\\nHuman: Hello\\n\\nAssistant:", "max_tokens_to_sample": 128}}',
]
related = [
    "aws_bedrock.invoke_model_stream",
    "aws_bedrock.converse",
]

[provides.operations."aws_bedrock.invoke_model_stream"]
description = "Invoke legacy Bedrock InvokeModelWithResponseStream and decode AWS event-stream frames."
capability = "aws_bedrock.chat"
risk_level = "medium"
safety_tier = "risky"
requires_approval = "none"
idempotency = "best_effort"
input_schema = { type = "object", required = ["model_id"] }
output_schema = { type = "object" }

[provides.operations."aws_bedrock.invoke_model_stream".network_constraints]
host_allow = ["bedrock-runtime.us-east-1.amazonaws.com", "bedrock-runtime.us-west-2.amazonaws.com"]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 0
connect_timeout_ms = 10000
total_timeout_ms = 240000
max_response_bytes = 25000000

[provides.operations."aws_bedrock.invoke_model_stream".ai_hints]
when_to_use = "Use for legacy Bedrock streaming model APIs when the target model does not fit ConverseStream or needs a model-family payload."
common_mistakes = [
    "Using InvokeModelWithResponseStream for models that do not advertise streaming support in models.list.",
    "Assuming event-stream frames contain only text deltas; provider-specific payloads may include metadata and completion reasons.",
    "Dropping partial chunks during cancellation or timeout instead of returning structured evidence about the incomplete stream.",
]
examples = [
    '{"model_id": "amazon.titan-text-express-v1", "model_family": "titan_text", "prompt": "List three test cases.", "max_tokens": 128}',
]
related = [
    "aws_bedrock.invoke_model",
    "aws_bedrock.converse_stream",
]

[provides.operations."aws_bedrock.models.list"]
description = "List Bedrock foundation models on the control-plane Bedrock endpoint."
capability = "aws_bedrock.models.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "none"
input_schema = { type = "object" }
output_schema = { type = "object" }

[provides.operations."aws_bedrock.models.list".network_constraints]
host_allow = ["bedrock.us-east-1.amazonaws.com", "bedrock.us-west-2.amazonaws.com"]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 0
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 10485760

[provides.operations."aws_bedrock.models.list".ai_hints]
when_to_use = "Use before invoking Bedrock when an agent needs to discover available foundation models, modalities, providers, or streaming support in the configured region."
common_mistakes = [
    "Treating the model list as global; Bedrock model availability is region and account dependent.",
    "Assuming a listed model supports every API shape; check streaming and inference metadata before choosing Converse, InvokeModel, or streaming variants.",
    "Logging account-specific model access diagnostics with credentials or request signatures attached.",
]
examples = [
    '{}',
]
related = [
    "aws_bedrock.converse",
    "aws_bedrock.invoke_model",
]

[provides.operations."aws_bedrock.health"]
description = "Check configured Bedrock control-plane connectivity using foundation model discovery."
capability = "aws_bedrock.models.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "none"
input_schema = { type = "object" }
output_schema = { type = "object" }

[provides.operations."aws_bedrock.health".network_constraints]
host_allow = ["bedrock.us-east-1.amazonaws.com", "bedrock.us-west-2.amazonaws.com"]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 0
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 10485760

[provides.operations."aws_bedrock.health".ai_hints]
when_to_use = "Use during setup or diagnostics to verify the configured region, endpoint, credentials, and control-plane Bedrock access are usable."
common_mistakes = [
    "Running health before configure; an unconfigured connector reports readiness guidance rather than live AWS status.",
    "Treating a healthy control-plane probe as proof that a specific runtime model invocation will succeed.",
    "Using health as a hot-path heartbeat for every request instead of reserving it for readiness and troubleshooting.",
]
examples = [
    '{}',
]
related = [
    "aws_bedrock.models.list",
]

[sandbox]
profile = "strict"
memory_mb = 192
cpu_percent = 25
wall_clock_timeout_ms = 240000
fs_readonly_paths = ["/usr", "/lib"]
fs_writable_paths = ["$CONNECTOR_STATE"]
deny_exec = true
deny_ptrace = true
