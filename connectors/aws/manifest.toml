[format]
type = "fcp-connector-manifest"
schema_version = "2.1"

[connector]
id = "fcp.aws"
name = "AWS"
version = "0.1.0"
description = "AWS connector for S3, EC2, Lambda, and STS workflows; deterministic verification currently relies on custom endpoint overrides until SigV4 signing is implemented"
archetype = "cloud-control-plane"
homepage = "https://docs.aws.amazon.com/"

[zones]
home = "z:work"
allowed_sources = ["z:work", "z:private"]
allowed_targets = ["z:work"]
tailscale_tag = "tag:fcp-work"

[capabilities]
required = ["network.outbound"]
optional = []
forbidden = ["system.exec", "system.privileged"]

# ── S3 operations ──

[provides.operations.s3_list_buckets]
summary = "List all S3 buckets"
capability = "aws.s3.read"
risk = "low"
safety_tier = "safe"
idempotency = "none"

[provides.operations.s3_list_buckets.network_constraints]
host_allow = ["s3.*.amazonaws.com"]
port_allow = [443]
require_tls = true
deny_localhost = true
deny_private_ranges = true
max_redirects = 0

[provides.operations.s3_list_buckets.ai_hints]
when_to_use = "When you need to list all S3 buckets in the account"

[provides.operations.s3_list_objects]
summary = "List objects in an S3 bucket"
capability = "aws.s3.read"
risk = "low"
safety_tier = "safe"
idempotency = "none"

[provides.operations.s3_list_objects.network_constraints]
host_allow = ["s3.*.amazonaws.com"]
port_allow = [443]
require_tls = true
deny_localhost = true
deny_private_ranges = true
max_redirects = 0

[provides.operations.s3_list_objects.ai_hints]
when_to_use = "When you need to list objects/keys in a specific S3 bucket"

[provides.operations.s3_get_object]
summary = "Get an object from S3"
capability = "aws.s3.read"
risk = "low"
safety_tier = "safe"
idempotency = "none"

[provides.operations.s3_get_object.network_constraints]
host_allow = ["s3.*.amazonaws.com"]
port_allow = [443]
require_tls = true
deny_localhost = true
deny_private_ranges = true
max_redirects = 0

[provides.operations.s3_get_object.ai_hints]
when_to_use = "When you need to download or read an S3 object"

[provides.operations.s3_put_object]
summary = "Upload an object to S3"
capability = "aws.s3.write"
risk = "medium"
safety_tier = "risky"
idempotency = "strict"

[provides.operations.s3_put_object.network_constraints]
host_allow = ["s3.*.amazonaws.com"]
port_allow = [443]
require_tls = true
deny_localhost = true
deny_private_ranges = true
max_redirects = 0

[provides.operations.s3_put_object.ai_hints]
when_to_use = "When you need to upload or create an S3 object"

[provides.operations.s3_delete_object]
summary = "Delete an object from S3"
capability = "aws.s3.write"
