[format]
type = "fcp-connector-manifest"
schema_version = "2.1"

[connector]
id = "fcp.azure"
name = "Azure"
version = "0.1.0"
description = "Azure connector for subscriptions, resource groups, blob storage, and Key Vault management"
archetype = "cloud-control-plane"
homepage = "https://learn.microsoft.com/en-us/rest/api/azure/"

[zones]
home = "z:work"
allowed_sources = ["z:work", "z:private"]
allowed_targets = ["z:work"]
tailscale_tag = "tag:fcp-work"

[capabilities]
required = ["network.outbound"]
optional = []
forbidden = ["system.exec", "system.privileged"]

[provides.operations.list_subscriptions]
summary = "List Azure subscriptions"
capability = "azure.management.read"
risk = "low"
safety_tier = "safe"
idempotency = "none"

[provides.operations.list_subscriptions.network_constraints]
host_allow = ["management.azure.com"]
port_allow = [443]
require_tls = true
deny_localhost = true
deny_private_ranges = true
max_redirects = 0

[provides.operations.list_subscriptions.ai_hints]
when_to_use = "When you need to enumerate Azure subscriptions available to the configured credentials"

[provides.operations.list_resource_groups]
summary = "List resource groups in a subscription"
capability = "azure.management.read"
risk = "low"
safety_tier = "safe"
idempotency = "none"

[provides.operations.list_resource_groups.network_constraints]
host_allow = ["management.azure.com"]
port_allow = [443]
require_tls = true
deny_localhost = true
deny_private_ranges = true
max_redirects = 0

[provides.operations.list_resource_groups.ai_hints]
when_to_use = "When you need to list resource groups within a specific Azure subscription"

[provides.operations.list_resources]
summary = "List resources in a resource group"
capability = "azure.management.read"
risk = "low"
safety_tier = "safe"
idempotency = "none"

[provides.operations.list_resources.network_constraints]
host_allow = ["management.azure.com"]
port_allow = [443]
require_tls = true
deny_localhost = true
deny_private_ranges = true
max_redirects = 0

[provides.operations.list_resources.ai_hints]
when_to_use = "When you need to enumerate resources within a specific Azure resource group"

[provides.operations.blob_list_containers]
summary = "List blob storage containers"
capability = "azure.storage.read"
risk = "low"
safety_tier = "safe"
idempotency = "none"

[provides.operations.blob_list_containers.network_constraints]
host_allow = ["*.blob.core.windows.net"]
port_allow = [443]
require_tls = true
deny_localhost = true
deny_private_ranges = true
max_redirects = 0

[provides.operations.blob_list_containers.ai_hints]
when_to_use = "When you need to list blob containers in an Azure storage account"

[provides.operations.blob_list_blobs]
summary = "List blobs in a container"
capability = "azure.storage.read"
risk = "low"
safety_tier = "safe"
idempotency = "none"

[provides.operations.blob_list_blobs.network_constraints]
host_allow = ["*.blob.core.windows.net"]
port_allow = [443]
require_tls = true
deny_localhost = true
deny_private_ranges = true
max_redirects = 0

[provides.operations.blob_list_blobs.ai_hints]
when_to_use = "When you need to list blobs within a specific Azure storage container"

[provides.operations.blob_get]
summary = "Download a blob"
capability = "azure.storage.read"
risk = "low"
safety_tier = "safe"
idempotency = "none"

[provides.operations.blob_get.network_constraints]
host_allow = ["*.blob.core.windows.net"]
port_allow = [443]
require_tls = true
deny_localhost = true
deny_private_ranges = true
max_redirects = 0

[provides.operations.blob_get.ai_hints]
when_to_use = "When you need to download or read the contents of a specific blob"

[provides.operations.blob_put]
summary = "Upload a blob"
capability = "azure.storage.write"
risk = "medium"
safety_tier = "risky"
idempotency = "strict"

[provides.operations.blob_put.network_constraints]
host_allow = ["*.blob.core.windows.net"]
port_allow = [443]
require_tls = true
deny_localhost = true
deny_private_ranges = true
max_redirects = 0

[provides.operations.blob_put.ai_hints]
when_to_use = "When you need to upload or overwrite a blob in an Azure storage container"

[provides.operations.keyvault_list_secrets]
summary = "List Key Vault secrets"
capability = "azure.keyvault.read"
risk = "low"
safety_tier = "safe"
idempotency = "none"

[provides.operations.keyvault_list_secrets.network_constraints]
host_allow = ["*.vault.azure.net"]
port_allow = [443]
require_tls = true
deny_localhost = true
deny_private_ranges = true
max_redirects = 0

[provides.operations.keyvault_list_secrets.ai_hints]
when_to_use = "When you need to list secret names stored in an Azure Key Vault"

[provides.operations.keyvault_get_secret]
summary = "Get a Key Vault secret value"
capability = "azure.keyvault.read"
risk = "medium"
safety_tier = "risky"
idempotency = "none"

[provides.operations.keyvault_get_secret.network_constraints]
host_allow = ["*.vault.azure.net"]
port_allow = [443]
require_tls = true
deny_localhost = true
deny_private_ranges = true
max_redirects = 0

[provides.operations.keyvault_get_secret.ai_hints]
when_to_use = "When you need to retrieve the actual value of a specific secret from Azure Key Vault"

[provides.operations.keyvault_set_secret]
summary = "Set a Key Vault secret"
capability = "azure.keyvault.write"
risk = "high"
safety_tier = "dangerous"
idempotency = "strict"

[provides.operations.keyvault_set_secret.network_constraints]
host_allow = ["*.vault.azure.net"]
port_allow = [443]
require_tls = true
deny_localhost = true
deny_private_ranges = true
max_redirects = 0

[provides.operations.keyvault_set_secret.ai_hints]
when_to_use = "When you need to create or update a secret in Azure Key Vault"
