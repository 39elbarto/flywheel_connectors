[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = []
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:8d79d6e6a1e8ea22960d4b7d806f636b3d070884e5b2629eef9ba1b9f54967db"

[connector]
id = "fcp.azure"
name = "Azure Connector"
version = "0.1.0"
description = "FCP connector for Azure Resource Manager, Blob Storage, and Key Vault operations"
archetypes = [
    "operational",
    "storage",
]
format = "native"

[connector.state]
model = "stateless"
state_schema_version = "1"
migration_hint = "No durable connector state; configuration and HTTP runtime live only inside the current connector instance."

[zones]
home = "z:work"
allowed_sources = [
    "z:owner",
    "z:private",
    "z:work",
]
allowed_targets = ["z:work"]
forbidden = [
    "z:public",
    "z:community",
]

[capabilities]
required = [
    "network.dns",
    "network.egress",
    "network.tls.sni",
]
optional = []
forbidden = [
    "system.exec",
    "network.listen",
    "system.privileged",
]

