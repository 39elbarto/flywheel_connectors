[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = []
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:5897547956b0a160834fa53244feb24994a7a342a113b6e310250ede3ed48414"

[connector]
id = "fcp.bitwarden"
name = "Bitwarden Connector"
version = "0.1.0"
description = "FCP connector for Bitwarden password and secret management (items, collections, folders)"
archetypes = ["knowledge"]
format = "wasi"

[connector.state]
model = "singleton_writer"
state_schema_version = "1"
migration_hint = "Stores API client credentials and sync token."

[zones]
home = "z:private"
allowed_sources = [
    "z:owner",
    "z:private",
]
allowed_targets = ["z:private"]
forbidden = [
    "z:public",
    "z:community",
    "z:work",
]

[capabilities]
required = [
    "network.dns",
    "network.egress",
    "network.tls.sni",
    "storage.state",
]
optional = [
    "bitwarden.collections.read",
    "bitwarden.items.write",
    "bitwarden.items.read",
]
forbidden = [
    "system.exec",
    "network.listen",
    "media.upload",
    "media.download",
]

[provides.operations."bitwarden.collections.list"]
description = "List collections"
capability = "bitwarden.collections.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"

[provides.operations."bitwarden.collections.list".input_schema]
required = []
type = "object"

[provides.operations."bitwarden.collections.list".output_schema]
required = ["data"]
type = "object"

[provides.operations."bitwarden.collections.list".output_schema.properties.data]
type = "array"

[provides.operations."bitwarden.collections.list".network_constraints]
host_allow = [
    "*.bitwarden.com",
    "*.bitwarden.eu",
]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 3
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 1048576

[provides.operations."bitwarden.collections.list".ai_hints]
when_to_use = "List available collections."
common_mistakes = ["Only collections the API client has been granted access to are returned — missing collections indicate a permissions issue."]
examples = ["{}"]
related = ["bitwarden.items.list"]

[provides.operations."bitwarden.items.create"]
description = "Create a new vault item"
capability = "bitwarden.items.write"
risk_level = "medium"
safety_tier = "risky"
requires_approval = "policy"
idempotency = "none"

[provides.operations."bitwarden.items.create".input_schema]
required = [
    "type",
    "name",
]
type = "object"

[provides.operations."bitwarden.items.create".input_schema.properties.collection_ids]
type = "array"

[provides.operations."bitwarden.items.create".input_schema.properties.login]
type = "object"

[provides.operations."bitwarden.items.create".input_schema.properties.name]
type = "string"

[provides.operations."bitwarden.items.create".input_schema.properties.type]
description = "1=Login, 2=SecureNote, 3=Card, 4=Identity"
type = "integer"

[provides.operations."bitwarden.items.create".output_schema]
required = ["id"]
type = "object"

[provides.operations."bitwarden.items.create".output_schema.properties.id]
type = "string"

[provides.operations."bitwarden.items.create".network_constraints]
host_allow = [
    "*.bitwarden.com",
    "*.bitwarden.eu",
]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 3
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 1048576

[provides.operations."bitwarden.items.create".ai_hints]
when_to_use = "Create a new vault item."
common_mistakes = ["Using an invalid type integer — must be 1 (Login), 2 (SecureNote), 3 (Card), or 4 (Identity)."]
examples = ['{"type": 1, "name": "API Key", "login": {"username": "api", "password": "secret123"}}']
related = [
    "bitwarden.items.list",
    "bitwarden.items.delete",
]

[provides.operations."bitwarden.items.delete"]
description = "Delete a vault item"
capability = "bitwarden.items.write"
risk_level = "high"
safety_tier = "dangerous"
requires_approval = "interactive"
idempotency = "strict"

[provides.operations."bitwarden.items.delete".input_schema]
required = ["item_id"]
type = "object"

[provides.operations."bitwarden.items.delete".input_schema.properties.item_id]
type = "string"

[provides.operations."bitwarden.items.delete".output_schema]
type = "object"

[provides.operations."bitwarden.items.delete".network_constraints]
host_allow = [
    "*.bitwarden.com",
    "*.bitwarden.eu",
]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 3
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 1048576

[provides.operations."bitwarden.items.delete".ai_hints]
when_to_use = "Delete a vault item. Cannot be undone."
common_mistakes = ["Deleting shared items that other organization members depend on for credentials."]
examples = ['{"item_id": "abc123"}']
related = ["bitwarden.items.get"]

[provides.operations."bitwarden.items.get"]
description = "Get a single item with secret fields"
capability = "bitwarden.items.read"
risk_level = "medium"
safety_tier = "risky"
requires_approval = "policy"
idempotency = "strict"

[provides.operations."bitwarden.items.get".input_schema]
required = ["item_id"]
type = "object"

[provides.operations."bitwarden.items.get".input_schema.properties.item_id]
type = "string"

[provides.operations."bitwarden.items.get".output_schema]
required = ["item"]
type = "object"

[provides.operations."bitwarden.items.get".output_schema.properties.item]
type = "object"

[provides.operations."bitwarden.items.get".network_constraints]
host_allow = [
    "*.bitwarden.com",
    "*.bitwarden.eu",
]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 3
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 1048576

[provides.operations."bitwarden.items.get".ai_hints]
when_to_use = "Retrieve a specific item including passwords/secrets."
common_mistakes = ["Logging or caching passwords."]
examples = ['{"item_id": "abc123"}']
related = ["bitwarden.items.list"]

[provides.operations."bitwarden.items.list"]
description = "List vault items"
capability = "bitwarden.items.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"

[provides.operations."bitwarden.items.list".input_schema]
required = []
type = "object"

[provides.operations."bitwarden.items.list".input_schema.properties.collection_id]
type = "string"

[provides.operations."bitwarden.items.list".input_schema.properties.folder_id]
type = "string"

[provides.operations."bitwarden.items.list".output_schema]
required = ["data"]
type = "object"

[provides.operations."bitwarden.items.list".output_schema.properties.data]
type = "array"

[provides.operations."bitwarden.items.list".network_constraints]
host_allow = [
    "*.bitwarden.com",
    "*.bitwarden.eu",
]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 3
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 10485760

[provides.operations."bitwarden.items.list".ai_hints]
when_to_use = "List vault items (without revealing passwords)."
common_mistakes = ["Assuming passwords are included — list returns metadata only, use items.get to retrieve secrets."]
examples = ["{}"]
related = [
    "bitwarden.items.get",
    "bitwarden.collections.list",
]

[sandbox]
profile = "strict"
memory_mb = 128
cpu_percent = 25
wall_clock_timeout_ms = 120000
fs_readonly_paths = [
    "/usr",
    "/lib",
]
fs_writable_paths = ["$CONNECTOR_STATE"]
deny_exec = true
deny_ptrace = true

[[rate_limits.pools]]
id = "bitwarden.items.read"
requests = 200
window_ms = 60000
burst = 20
scope = "instance"

[[rate_limits.pools]]
id = "bitwarden.items.write"
requests = 50
window_ms = 60000
burst = 5
scope = "instance"

[[rate_limits.pools]]
id = "bitwarden.collections.read"
requests = 100
window_ms = 60000
burst = 10
scope = "instance"

[rate_limits.operation_pools]
"bitwarden.items.delete" = ["bitwarden.items.write"]
"bitwarden.items.get" = ["bitwarden.items.read"]
"bitwarden.collections.list" = ["bitwarden.collections.read"]
"bitwarden.items.create" = ["bitwarden.items.write"]
"bitwarden.items.list" = ["bitwarden.items.read"]
