[package]
name = "fcp-bluebubbles"
description = "Dedicated BlueBubbles bridge connector for the Flywheel Connector Protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "fcp_bluebubbles"
path = "src/lib.rs"

[[bin]]
name = "fcp-bluebubbles"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
fcp-async-core = { path = "../../crates/fcp-async-core" }
fcp-core = { path = "../../crates/fcp-core" }
fcp-prelude = { path = "../../crates/fcp-prelude" }
fcp-imessage = { path = "../imessage" }
fcp-sdk = { path = "../../crates/fcp-sdk" }
reqwest = { workspace = true, features = ["json"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }

