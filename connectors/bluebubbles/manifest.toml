[format]
type = "fcp-connector-manifest"
schema_version = "2.1"

[connector]
id = "fcp.bluebubbles"
name = "BlueBubbles"
version = "0.1.0"
description = "Dedicated BlueBubbles bridge connector for iMessage-compatible chat, message, and attachment workflows"
archetype = "operational"
homepage = "https://bluebubbles.app"

[zones]
home = "z:private"
allowed_sources = ["z:private"]
allowed_targets = ["z:private"]
tailscale_tag = "tag:fcp-private"

[capabilities]
required = ["network.dns", "network.outbound"]
optional = []
forbidden = ["system.privileged"]

[event_caps]
streaming = true
replay = true
min_buffer_events = 64

[provides.events.message_inbound]
description = "Inbound BlueBubbles message accepted after webhook auth, policy, dedupe, enrichment, and coalescing"
streaming = true
replay = true
topic = "imessage.message.inbound"
requires_ack = false

[provides.events.message_outbound]
description = "Outbound BlueBubbles message observed through accepted webhook ingress"
streaming = true
replay = true
topic = "imessage.message.outbound"
requires_ack = false

[provides.events.message_updated]
description = "Updated BlueBubbles message observed through accepted webhook ingress"
streaming = true
replay = true
topic = "imessage.message.updated"
requires_ack = false

[provides.events.message_tapback]
description = "Tapback or associated-message activity observed through accepted webhook ingress"
streaming = true
replay = true
topic = "imessage.message.tapback"
requires_ack = false

[provides.operations.send_message]
summary = "Send a message through BlueBubbles"
capability = "imessage.send"
risk = "medium"
safety_tier = "risky"
idempotency = "none"

[provides.operations.send_message.network_constraints]
host_allow = ["localhost", "127.0.0.1"]
port_allow = [1234]
require_tls = false
deny_private_ranges = false
max_redirects = 0

[provides.operations.send_message.ai_hints]
when_to_use = "When you need to send an iMessage through a local BlueBubbles bridge to a known chat GUID. The shared implementation refreshes server info and explicitly selects private-api for macOS 26+ hosts when Private API is enabled; otherwise it uses an observable apple-script fallback. Optional reply_to_message_guid, reply_to_part_index, and effect_id fields require known enabled Private API support and fail closed when unavailable."

[provides.operations.send_media]
summary = "Send a local media attachment through BlueBubbles"
capability = "imessage.send"
risk = "medium"
safety_tier = "risky"
idempotency = "none"

[provides.operations.send_media.network_constraints]
host_allow = ["localhost", "127.0.0.1"]
port_allow = [1234]
require_tls = false
deny_private_ranges = false
max_redirects = 0

[provides.operations.send_media.ai_hints]
when_to_use = "When you need to upload an image, video, audio file, or allowed document from configured media_send.local_roots only. Reply threading is included only when BlueBubbles Private API is known enabled; local files outside configured roots or outside size/MIME bounds are rejected before upload."

[provides.operations.resolve_send_target]
summary = "Resolve a BlueBubbles send target"
capability = "imessage.read"
risk = "low"
safety_tier = "safe"
idempotency = "strict"

[provides.operations.resolve_send_target.network_constraints]
host_allow = ["localhost", "127.0.0.1"]
port_allow = [1234]
require_tls = false
deny_private_ranges = false
max_redirects = 0

[provides.operations.resolve_send_target.ai_hints]
when_to_use = "When you have a handle, chat ID, or chat identifier and need a chat GUID before sending. Handle resolution preserves explicit SMS intent, otherwise prefers iMessage, and never routes to a group chat just because the handle is a participant."

[provides.operations.create_chat]
summary = "Create a BlueBubbles DM chat"
capability = "imessage.send"
risk = "medium"
safety_tier = "risky"
idempotency = "none"

[provides.operations.create_chat.network_constraints]
host_allow = ["localhost", "127.0.0.1"]
port_allow = [1234]
require_tls = false
deny_private_ranges = false
max_redirects = 0

[provides.operations.create_chat.ai_hints]
when_to_use = "When no existing DM chat can be resolved and the caller explicitly wants to create a new iMessage conversation by sending the first message through BlueBubbles Private API."

[provides.operations.get_action_availability]
summary = "Inspect BlueBubbles private-API action availability"
capability = "imessage.admin"
risk = "low"
safety_tier = "safe"
idempotency = "strict"

[provides.operations.get_action_availability.network_constraints]
host_allow = ["localhost", "127.0.0.1"]
port_allow = [1234]
require_tls = false
deny_private_ranges = false
max_redirects = 0

[provides.operations.get_action_availability.ai_hints]
when_to_use = "When you need to know whether edit, unsend, tapback reactions, typing indicators, or read receipts are supported on the local BlueBubbles server before invoking them."

[provides.operations.edit_message]
summary = "Edit a sent BlueBubbles message"
capability = "imessage.send"
risk = "medium"
safety_tier = "risky"
idempotency = "none"

[provides.operations.edit_message.network_constraints]
host_allow = ["localhost", "127.0.0.1"]
port_allow = [1234]
require_tls = false
deny_private_ranges = false
max_redirects = 0

[provides.operations.edit_message.ai_hints]
when_to_use = "When the caller explicitly wants to edit a sent bridge message by GUID. Requires known enabled Private API and fails closed on macOS 26+ where iMessage editing is unsupported."

[provides.operations.unsend_message]
summary = "Unsend a sent BlueBubbles message"
capability = "imessage.send"
risk = "high"
safety_tier = "dangerous"
idempotency = "none"

[provides.operations.unsend_message.network_constraints]
host_allow = ["localhost", "127.0.0.1"]
port_allow = [1234]
require_tls = false
deny_private_ranges = false
max_redirects = 0

[provides.operations.unsend_message.ai_hints]
when_to_use = "When the caller explicitly wants to retract a sent bridge message by GUID. Requires known enabled Private API and returns deterministic unsupported errors when unavailable."

[provides.operations.send_reaction]
summary = "Send or remove a BlueBubbles tapback"
capability = "imessage.send"
risk = "medium"
safety_tier = "risky"
idempotency = "best_effort"

[provides.operations.send_reaction.network_constraints]
host_allow = ["localhost", "127.0.0.1"]
port_allow = [1234]
require_tls = false
deny_private_ranges = false
max_redirects = 0

[provides.operations.send_reaction.ai_hints]
when_to_use = "When the caller wants to add or remove a tapback reaction. Reaction input is normalized to love, like, dislike, laugh, emphasize, or question."

[provides.operations.set_typing]
summary = "Start or stop a BlueBubbles typing indicator"
capability = "imessage.send"
risk = "low"
safety_tier = "safe"
idempotency = "best_effort"

[provides.operations.set_typing.network_constraints]
host_allow = ["localhost", "127.0.0.1"]
port_allow = [1234]
require_tls = false
deny_private_ranges = false
max_redirects = 0

[provides.operations.set_typing.ai_hints]
when_to_use = "When the caller wants to explicitly show or clear a typing indicator. Requires known enabled Private API support."

[provides.operations.get_chats]
summary = "List BlueBubbles chats"
capability = "imessage.read"
risk = "low"
safety_tier = "safe"
idempotency = "strict"

[provides.operations.get_chats.network_constraints]
host_allow = ["localhost", "127.0.0.1"]
port_allow = [1234]
require_tls = false
deny_private_ranges = false
max_redirects = 0

[provides.operations.get_chats.ai_hints]
when_to_use = "When you need to browse or search bridge-exposed chats"

[provides.operations.get_chat]
summary = "Get one BlueBubbles chat"
capability = "imessage.read"
risk = "low"
safety_tier = "safe"
idempotency = "strict"

[provides.operations.get_chat.network_constraints]
host_allow = ["localhost", "127.0.0.1"]
port_allow = [1234]
require_tls = false
deny_private_ranges = false
max_redirects = 0

[provides.operations.get_chat.ai_hints]
when_to_use = "When you need metadata for a single BlueBubbles chat"

[provides.operations.get_messages]
summary = "Get messages from a BlueBubbles chat"
capability = "imessage.read"
risk = "low"
safety_tier = "safe"
idempotency = "strict"

[provides.operations.get_messages.network_constraints]
host_allow = ["localhost", "127.0.0.1"]
port_allow = [1234]
require_tls = false
deny_private_ranges = false
max_redirects = 0

[provides.operations.get_messages.ai_hints]
when_to_use = "When you need to read recent message history from a bridge chat"

[provides.operations.sync_events]
summary = "Sync BlueBubbles events"
capability = "imessage.read"
risk = "low"
safety_tier = "safe"
idempotency = "strict"

[provides.operations.sync_events.network_constraints]
host_allow = ["localhost", "127.0.0.1"]
port_allow = [1234]
require_tls = false
deny_private_ranges = false
max_redirects = 0

[provides.operations.sync_events.ai_hints]
when_to_use = "When you need a polling-friendly view of bridge activity"

[provides.operations.download_attachment]
summary = "Download a BlueBubbles attachment"
capability = "imessage.read"
risk = "low"
safety_tier = "safe"
idempotency = "strict"

[provides.operations.download_attachment.network_constraints]
host_allow = ["localhost", "127.0.0.1"]
port_allow = [1234]
require_tls = false
deny_private_ranges = false
max_redirects = 0

[provides.operations.download_attachment.ai_hints]
when_to_use = "When you need attachment bytes for a bridge-backed message"

[provides.operations.mark_read]
summary = "Mark a bridge chat as read"
capability = "imessage.send"
risk = "low"
safety_tier = "safe"
idempotency = "best_effort"

[provides.operations.mark_read.network_constraints]
host_allow = ["localhost", "127.0.0.1"]
port_allow = [1234]
require_tls = false
deny_private_ranges = false
max_redirects = 0

[provides.operations.mark_read.ai_hints]
when_to_use = "When you want to mark a bridge-exposed conversation as read"

[provides.operations.register_webhook]
summary = "Register a BlueBubbles webhook"
capability = "imessage.admin"
risk = "medium"
safety_tier = "risky"
idempotency = "best_effort"

[provides.operations.register_webhook.network_constraints]
host_allow = ["localhost", "127.0.0.1"]
port_allow = [1234]
require_tls = false
deny_private_ranges = false
max_redirects = 0

[provides.operations.register_webhook.ai_hints]
when_to_use = "When a supervised FCP webhook receiver URL is ready and the local BlueBubbles bridge should deliver new-message and updated-message events to it"

[provides.operations.list_webhooks]
summary = "List BlueBubbles webhooks"
capability = "imessage.admin"
risk = "low"
safety_tier = "safe"
idempotency = "strict"

[provides.operations.list_webhooks.network_constraints]
host_allow = ["localhost", "127.0.0.1"]
port_allow = [1234]
require_tls = false
deny_private_ranges = false
max_redirects = 0

[provides.operations.list_webhooks.ai_hints]
when_to_use = "When you need to inspect existing BlueBubbles webhook callback registrations before register or cleanup"

[provides.operations.unregister_webhook]
summary = "Unregister BlueBubbles webhooks"
capability = "imessage.admin"
risk = "medium"
safety_tier = "risky"
idempotency = "best_effort"

[provides.operations.unregister_webhook.network_constraints]
host_allow = ["localhost", "127.0.0.1"]
port_allow = [1234]
require_tls = false
deny_private_ranges = false
max_redirects = 0

[provides.operations.unregister_webhook.ai_hints]
when_to_use = "When a BlueBubbles callback URL is no longer valid or duplicate webhook registrations need cleanup"

[provides.operations.ingest_webhook_event]
summary = "Accept, normalize, enrich, and optionally coalesce a BlueBubbles webhook event"
capability = "imessage.read"
risk = "low"
safety_tier = "safe"
idempotency = "best_effort"

[provides.operations.ingest_webhook_event.network_constraints]
host_allow = ["localhost", "127.0.0.1"]
port_allow = [1234]
require_tls = false
deny_private_ranges = false
max_redirects = 0

[provides.operations.ingest_webhook_event.ai_hints]
when_to_use = "When a trusted FCP webhook receiver has authenticated a BlueBubbles POST and needs connector-local sender/conversation acceptance, duplicate replay suppression, opt-in privacy-gated Contacts enrichment for group participants, opt-in scoped reply-context fallback, optional same-sender DM split-send coalescing, or an explicit coalescing flush"

[provides.operations.ingest_webhook_request]
summary = "Process a host-forwarded BlueBubbles webhook request"
capability = "imessage.read"
risk = "low"
safety_tier = "safe"
idempotency = "best_effort"

[provides.operations.ingest_webhook_request.network_constraints]
host_allow = ["localhost", "127.0.0.1"]
port_allow = [1234]
require_tls = false
deny_private_ranges = false
max_redirects = 0

[provides.operations.ingest_webhook_request.ai_hints]
when_to_use = "When a supervised FCP host/webhook receiver request region has accepted a raw BlueBubbles POST and needs callback auth, method/path/body guardrails, sender/conversation policy, replay dedupe, coalescing, and EventEnvelope fan-out in one route contract"

[provides.operations.get_server_info]
summary = "Get BlueBubbles server info"
capability = "imessage.admin"
risk = "low"
safety_tier = "safe"
idempotency = "strict"

[provides.operations.get_server_info.network_constraints]
host_allow = ["localhost", "127.0.0.1"]
port_allow = [1234]
require_tls = false
deny_private_ranges = false
max_redirects = 0

[provides.operations.get_server_info.ai_hints]
when_to_use = "When you need to confirm the local BlueBubbles bridge is reachable"

[sandbox]
profile = "strict"
memory_mb = 64
cpu_percent = 25
wall_clock_timeout_ms = 30000
deny_exec = true
deny_ptrace = true
