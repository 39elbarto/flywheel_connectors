[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = []
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:brave-search-web-llm-context"

[connector]
id = "fcp.brave-search"
name = "Brave Search"
version = "0.1.0"
description = "Brave Search web and LLM-context query connector"
archetypes = ["request-response"]
format = "native"

[connector.state]
model = "stateless"
state_schema_version = "1"
migration_hint = "Stateless request-response search; no listener surface."

[zones]
home = "z:public"
allowed_sources = ["z:public", "z:work"]
allowed_targets = ["z:public", "z:work"]

[capabilities]
required = ["network.dns", "network.egress", "network.tls.sni"]
optional = []
forbidden = ["network.listen", "system.exec"]

[sandbox]
profile = "strict"
memory_mb = 96
cpu_percent = 25
wall_clock_timeout_ms = 30000
deny_exec = true
deny_ptrace = true
