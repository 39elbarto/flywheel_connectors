[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = []
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:61eb9423ea929e0cb202cf36acfb9e7206547faaf919dfc080901743b9652183"

[connector]
id = "fcp.circleci"
name = "CircleCI"
version = "0.1.0"
description = "CircleCI CI/CD connector for project discovery, pipeline and workflow control, job inspection, and health operations"
archetypes = ["operational"]
format = "native"
status = "proven"

[connector.state]
model = "stateless"
state_schema_version = "1"
migration_hint = "No durable connector state; auth and HTTP runtime are recreated from the current config."

[zones]
home = "z:work"
allowed_sources = ["z:work"]
allowed_targets = ["z:work"]
forbidden = ["z:public"]

[capabilities]
required = [
    "network.dns",
    "network.egress",
    "network.tls.sni",
]
optional = [
    "circleci.projects.read",
    "circleci.pipelines.read",
    "circleci.pipelines.write",
    "circleci.workflows.read",
    "circleci.workflows.write",
    "circleci.jobs.read",
]
forbidden = [
    "system.exec",
    "network.listen",
    "system.privileged",
]

[provides.operations."circleci.health"]
description = "Check CircleCI API reachability and token validity against the /me endpoint."
capability = "circleci.projects.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"
revocation_freshness = "safe"

[provides.operations."circleci.health".input_schema]
additionalProperties = false
type = "object"

[provides.operations."circleci.health".output_schema]
additionalProperties = false
required = ["status"]
type = "object"

[provides.operations."circleci.health".output_schema.properties.status]
enum = ["ok"]
type = "string"

[provides.operations."circleci.health".network_constraints]
host_allow = ["circleci.com"]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 0
connect_timeout_ms = 10000
total_timeout_ms = 60000
max_response_bytes = 10485760

[provides.operations."circleci.health".ai_hints]
when_to_use = "Use when you need a lightweight readiness probe for hosted CircleCI connectivity."
common_mistakes = ["Treating a successful health probe as proof that every project_slug or mutation path is permitted."]
examples = []
related = ["circleci.projects.list"]

