[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = []
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:ead666d257eb3973012a094b983470688454351b80c43a3a447ce6975db5e356"

[connector]
id = "fcp.clickup"
name = "ClickUp Connector"
version = "0.1.0"
description = "FCP connector for ClickUp project management (spaces, lists, tasks)"
archetypes = [
    "knowledge",
    "operational",
]
format = "wasi"

[connector.state]
model = "singleton_writer"
state_schema_version = "1"
migration_hint = "Stores personal API token."

[zones]
home = "z:work"
allowed_sources = [
    "z:owner",
    "z:private",
    "z:work",
]
allowed_targets = ["z:work"]
forbidden = [
    "z:public",
    "z:community",
]

[capabilities]
required = [
    "network.dns",
    "network.egress",
    "network.tls.sni",
    "storage.state",
]
optional = [
    "clickup.lists.read",
    "clickup.spaces.read",
    "clickup.tasks.write",
    "clickup.tasks.read",
]
forbidden = [
    "system.exec",
    "network.listen",
    "media.upload",
    "media.download",
]

[provides.operations."clickup.lists.list"]
description = "List lists in a ClickUp space"
capability = "clickup.lists.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"

[provides.operations."clickup.lists.list".input_schema]
required = ["space_id"]
type = "object"

[provides.operations."clickup.lists.list".input_schema.properties.space_id]
description = "ClickUp space identifier"
type = "string"

[provides.operations."clickup.lists.list".output_schema]
required = ["lists"]
type = "object"

[provides.operations."clickup.lists.list".output_schema.properties.lists]
type = "array"

[provides.operations."clickup.lists.list".network_constraints]
host_allow = ["api.clickup.com"]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 3
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 10485760

[provides.operations."clickup.lists.list".ai_hints]
when_to_use = "List all lists within a ClickUp space."
common_mistakes = ["Passing a team_id instead of a space_id; lists belong to spaces, not directly to teams."]
examples = ['{"space_id": "12345678"}']
related = [
    "clickup.spaces.list",
    "clickup.tasks.list",
]

[provides.operations."clickup.spaces.list"]
description = "List spaces in a ClickUp workspace"
capability = "clickup.spaces.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"

[provides.operations."clickup.spaces.list".input_schema]
required = ["team_id"]
type = "object"

[provides.operations."clickup.spaces.list".input_schema.properties.team_id]
description = "ClickUp team (workspace) identifier"
type = "string"

[provides.operations."clickup.spaces.list".output_schema]
required = ["spaces"]
type = "object"

[provides.operations."clickup.spaces.list".output_schema.properties.spaces]
type = "array"

[provides.operations."clickup.spaces.list".network_constraints]
host_allow = ["api.clickup.com"]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 3
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 10485760

[provides.operations."clickup.spaces.list".ai_hints]
when_to_use = "List all spaces in a ClickUp workspace/team."
common_mistakes = ["Using the workspace name instead of the numeric team_id; retrieve the team_id from the ClickUp workspace settings or API first."]
examples = ['{"team_id": "9012345"}']
related = [
    "clickup.lists.list",
    "clickup.tasks.list",
]

[provides.operations."clickup.tasks.create"]
description = "Create a task in a ClickUp list"
capability = "clickup.tasks.write"
risk_level = "medium"
safety_tier = "risky"
requires_approval = "policy"
idempotency = "none"

[provides.operations."clickup.tasks.create".input_schema]
required = [
    "list_id",
    "name",
]
type = "object"

[provides.operations."clickup.tasks.create".input_schema.properties.list_id]
description = "ClickUp list identifier"
type = "string"

[provides.operations."clickup.tasks.create".input_schema.properties.name]
description = "Name of the task to create"
type = "string"

[provides.operations."clickup.tasks.create".output_schema]
required = ["id"]
type = "object"

[provides.operations."clickup.tasks.create".output_schema.properties.id]
type = "string"

[provides.operations."clickup.tasks.create".network_constraints]
host_allow = ["api.clickup.com"]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 3
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 1048576

[provides.operations."clickup.tasks.create".ai_hints]
when_to_use = "Create a new task in a ClickUp list."
common_mistakes = ["Omitting the list_id and trying to create a task directly under a space or folder; tasks must be created within a specific list."]
examples = ['{"list_id": "900100200300", "name": "Implement login page"}']
related = [
    "clickup.tasks.list",
    "clickup.tasks.delete",
]

[provides.operations."clickup.tasks.delete"]
description = "Delete a task from ClickUp"
capability = "clickup.tasks.write"
risk_level = "high"
safety_tier = "dangerous"
requires_approval = "interactive"
idempotency = "none"

[provides.operations."clickup.tasks.delete".input_schema]
required = ["task_id"]
type = "object"

[provides.operations."clickup.tasks.delete".input_schema.properties.task_id]
description = "ClickUp task identifier to delete"
type = "string"

[provides.operations."clickup.tasks.delete".output_schema]
required = []
type = "object"

[provides.operations."clickup.tasks.delete".network_constraints]
host_allow = ["api.clickup.com"]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 3
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 1048576

[provides.operations."clickup.tasks.delete".ai_hints]
when_to_use = "Permanently delete a task from ClickUp."
common_mistakes = ["Confusing delete with closing a task; deletion is permanent and cannot be undone, whereas setting status to closed preserves the task."]
examples = ['{"task_id": "abc123xyz"}']
related = [
    "clickup.tasks.list",
    "clickup.tasks.create",
]

[provides.operations."clickup.tasks.list"]
description = "List tasks in a ClickUp list"
capability = "clickup.tasks.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"

[provides.operations."clickup.tasks.list".input_schema]
required = ["list_id"]
type = "object"

[provides.operations."clickup.tasks.list".input_schema.properties.list_id]
description = "ClickUp list identifier"
type = "string"

[provides.operations."clickup.tasks.list".output_schema]
required = ["tasks"]
type = "object"

[provides.operations."clickup.tasks.list".output_schema.properties.tasks]
type = "array"

[provides.operations."clickup.tasks.list".network_constraints]
host_allow = ["api.clickup.com"]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 3
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 10485760

[provides.operations."clickup.tasks.list".ai_hints]
when_to_use = "List all tasks within a ClickUp list."
common_mistakes = ["Not accounting for pagination; the API returns a limited page of tasks by default and additional pages must be fetched separately."]
examples = ['{"list_id": "900100200300"}']
related = [
    "clickup.lists.list",
    "clickup.tasks.create",
]

[sandbox]
profile = "strict"
memory_mb = 256
cpu_percent = 50
wall_clock_timeout_ms = 300000
fs_readonly_paths = [
    "/usr",
    "/lib",
]
fs_writable_paths = ["$CONNECTOR_STATE"]
deny_exec = true
deny_ptrace = true

[[rate_limits.pools]]
id = "clickup.spaces.read"
requests = 200
window_ms = 60000
burst = 20
scope = "instance"

[[rate_limits.pools]]
id = "clickup.lists.read"
requests = 200
window_ms = 60000
burst = 20
scope = "instance"

[[rate_limits.pools]]
id = "clickup.tasks.read"
requests = 200
window_ms = 60000
burst = 20
scope = "instance"

[[rate_limits.pools]]
id = "clickup.tasks.write"
requests = 50
window_ms = 60000
burst = 10
scope = "instance"

[rate_limits.operation_pools]
"clickup.tasks.create" = ["clickup.tasks.write"]
"clickup.spaces.list" = ["clickup.spaces.read"]
"clickup.tasks.delete" = ["clickup.tasks.write"]
"clickup.tasks.list" = ["clickup.tasks.read"]
"clickup.lists.list" = ["clickup.lists.read"]
