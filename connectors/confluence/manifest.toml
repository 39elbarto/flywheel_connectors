[format]
type = "fcp-connector-manifest"
schema_version = "2.1"

[connector]
id = "fcp.confluence"
name = "Confluence"
version = "0.1.0"
description = "Tenant-scoped Atlassian Confluence Cloud connector for spaces, pages, CQL search, and health operations"
archetype = "operational"
homepage = "https://developer.atlassian.com/cloud/confluence/rest/v2/"

[zones]
home = "z:work"
allowed_sources = ["z:work"]
allowed_targets = ["z:work"]
tailscale_tag = "tag:fcp-work"

[capabilities]
required = ["network.dns", "network.outbound"]
optional = []
forbidden = ["system.exec", "system.privileged"]

[provides.operations.spaces_list]
summary = "List Confluence spaces"
capability = "confluence.spaces.read"
risk = "low"
safety_tier = "safe"
idempotency = "none"
input_schema = { type = "object", properties = { start = { type = "integer", default = 0 }, limit = { type = "integer", default = 25 } } }
output_schema = { type = "object", properties = { results = { type = "array" }, size = { type = "integer" } } }

[provides.operations.spaces_list.network_constraints]
host_allow = ["*.atlassian.net"]
port_allow = [443]
require_tls = true
require_sni = true
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
deny_ip_literals = true
max_redirects = 0

[provides.operations.spaces_list.ai_hints]
when_to_use = "When you need to list available Confluence spaces"

[provides.operations.spaces_get]
summary = "Get a Confluence space"
capability = "confluence.spaces.read"
risk = "low"
safety_tier = "safe"
idempotency = "none"
input_schema = { type = "object", required = ["space_key"], properties = { space_key = { type = "string", description = "Space key (e.g., DEV)" } } }
output_schema = { type = "object", properties = { id = { type = "string" }, key = { type = "string" }, name = { type = "string" } } }

[provides.operations.spaces_get.network_constraints]
host_allow = ["*.atlassian.net"]
port_allow = [443]
require_tls = true
require_sni = true
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
deny_ip_literals = true
max_redirects = 0

[provides.operations.spaces_get.ai_hints]
when_to_use = "When you need details about a specific Confluence space"

[provides.operations.pages_list]
summary = "List pages in a Confluence space"
capability = "confluence.pages.read"
risk = "low"
safety_tier = "safe"
idempotency = "none"
input_schema = { type = "object", required = ["space_key"], properties = { space_key = { type = "string", description = "Space key" }, start = { type = "integer", default = 0 }, limit = { type = "integer", default = 25 } } }
output_schema = { type = "object", properties = { results = { type = "array" }, size = { type = "integer" } } }

[provides.operations.pages_list.network_constraints]
host_allow = ["*.atlassian.net"]
port_allow = [443]
require_tls = true
require_sni = true
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
deny_ip_literals = true
max_redirects = 0

[provides.operations.pages_list.ai_hints]
when_to_use = "When you need to list pages in a Confluence space"

[provides.operations.pages_get]
summary = "Get a Confluence page by ID"
capability = "confluence.pages.read"
risk = "low"
safety_tier = "safe"
idempotency = "none"
input_schema = { type = "object", required = ["page_id"], properties = { page_id = { type = "string", description = "Page ID" } } }
output_schema = { type = "object", properties = { id = { type = "string" }, title = { type = "string" }, body = { type = "object" } } }

[provides.operations.pages_get.network_constraints]
host_allow = ["*.atlassian.net"]
port_allow = [443]
require_tls = true
require_sni = true
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
deny_ip_literals = true
max_redirects = 0

[provides.operations.pages_get.ai_hints]
when_to_use = "When you need the full content of a specific Confluence page"

[provides.operations.pages_create]
summary = "Create a Confluence page"
capability = "confluence.pages.write"
risk = "medium"
safety_tier = "risky"
idempotency = "best_effort"
input_schema = { type = "object", required = ["space_key", "title", "body"], properties = { space_key = { type = "string", description = "Space key to create page in" }, title = { type = "string", description = "Page title" }, body = { type = "string", description = "Page body in Confluence storage format (XHTML)" }, parent_id = { type = "string", description = "Optional parent page ID" } } }
output_schema = { type = "object", properties = { id = { type = "string" }, title = { type = "string" } } }

[provides.operations.pages_create.network_constraints]
host_allow = ["*.atlassian.net"]
port_allow = [443]
require_tls = true
require_sni = true
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
deny_ip_literals = true
max_redirects = 0

[provides.operations.pages_create.ai_hints]
when_to_use = "When you need to create a new Confluence page"

[provides.operations.pages_update]
summary = "Update a Confluence page"
capability = "confluence.pages.write"
risk = "medium"
safety_tier = "risky"
idempotency = "best_effort"
input_schema = { type = "object", required = ["page_id", "title", "body", "version_number"], properties = { page_id = { type = "string", description = "Page ID to update" }, title = { type = "string", description = "New page title" }, body = { type = "string", description = "New page body in storage format" }, version_number = { type = "integer", description = "Current page version number; the connector increments it by 1 for the provider request" }, version_message = { type = "string", description = "Optional version comment" } } }
output_schema = { type = "object", properties = { id = { type = "string" }, title = { type = "string" }, version = { type = "object" } } }

[provides.operations.pages_update.network_constraints]
host_allow = ["*.atlassian.net"]
port_allow = [443]
require_tls = true
require_sni = true
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
deny_ip_literals = true
max_redirects = 0

[provides.operations.pages_update.ai_hints]
when_to_use = "When you need to update an existing Confluence page"

[provides.operations.pages_delete]
summary = "Delete a Confluence page"
capability = "confluence.pages.write"
risk = "high"
safety_tier = "dangerous"
idempotency = "best_effort"
input_schema = { type = "object", required = ["page_id"], properties = { page_id = { type = "string", description = "Page ID to delete" } } }
output_schema = { type = "object", properties = { deleted = { type = "boolean" } } }

[provides.operations.pages_delete.network_constraints]
host_allow = ["*.atlassian.net"]
port_allow = [443]
require_tls = true
require_sni = true
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
deny_ip_literals = true
max_redirects = 0

[provides.operations.pages_delete.ai_hints]
when_to_use = "When you need to delete a Confluence page"

[provides.operations.search]
summary = "Search Confluence content with CQL"
capability = "confluence.pages.read"
risk = "low"
safety_tier = "safe"
idempotency = "none"
input_schema = { type = "object", required = ["cql"], properties = { cql = { type = "string", description = "CQL query string" }, start = { type = "integer", default = 0 }, limit = { type = "integer", default = 25 } } }
output_schema = { type = "object", properties = { results = { type = "array" }, size = { type = "integer" } } }

[provides.operations.search.network_constraints]
host_allow = ["*.atlassian.net"]
port_allow = [443]
require_tls = true
require_sni = true
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
deny_ip_literals = true
max_redirects = 0

[provides.operations.search.ai_hints]
when_to_use = "When you need to search Confluence content across the tenant"

[provides.operations.health]
summary = "Check Confluence API health"
capability = "confluence.spaces.read"
risk = "low"
safety_tier = "safe"
idempotency = "strict"
input_schema = { type = "object" }
output_schema = { type = "object", properties = { status = { type = "string" } } }

[provides.operations.health.network_constraints]
host_allow = ["*.atlassian.net"]
port_allow = [443]
require_tls = true
require_sni = true
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
deny_ip_literals = true
max_redirects = 0

[provides.operations.health.ai_hints]
when_to_use = "When you need to validate Confluence connectivity and auth"

[sandbox]
profile = "strict"
memory_mb = 64
cpu_percent = 25
wall_clock_timeout_ms = 30000
deny_exec = true
deny_ptrace = true
