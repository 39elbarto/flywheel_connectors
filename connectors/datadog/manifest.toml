[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = []
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:0024d3507c4e34caf55ba5bcd24e9f008337912d2a56a484eda4a1919d34bbaa"

[connector]
id = "fcp.datadog"
name = "Datadog Connector"
version = "0.1.0"
description = "FCP connector for Datadog observability platform (metrics, events, monitors, logs, dashboards)"
archetypes = [
    "knowledge",
    "operational",
]
format = "wasi"

[connector.state]
model = "singleton_writer"
state_schema_version = "1"
migration_hint = "Stores API/app key pair and last-sync cursor for log streaming."

[zones]
home = "z:work"
allowed_sources = [
    "z:owner",
    "z:private",
    "z:work",
]
allowed_targets = ["z:work"]
forbidden = [
    "z:public",
    "z:community",
]

[capabilities]
required = [
    "network.dns",
    "network.egress",
    "network.tls.sni",
    "storage.state",
]
optional = []
forbidden = [
    "system.exec",
    "network.listen",
    "media.upload",
    "media.download",
]

[provides.operations."datadog.events.create"]
description = "Post an event"
capability = "datadog.events.write"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "none"

[provides.operations."datadog.events.create".input_schema]
