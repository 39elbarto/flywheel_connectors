window_ms = 60000
burst = 20
scope = "instance"

[[rate_limits.pools]]
id = "datadog.monitors.write"
requests = 50
window_ms = 60000
burst = 10
scope = "instance"

[[rate_limits.pools]]
id = "datadog.logs.read"
requests = 100
window_ms = 60000
burst = 10
scope = "instance"

[rate_limits.operation_pools]
"datadog.metrics.submit" = ["datadog.metrics.write"]
"datadog.logs.search" = ["datadog.logs.read"]
"datadog.monitors.create" = ["datadog.monitors.write"]
"datadog.metrics.query" = ["datadog.metrics.read"]
"datadog.events.list" = ["datadog.events.read"]
