[format]
type = "fcp-connector-manifest"
schema_version = "2.1"

[connector]
id = "fcp.dockerhub"
name = "Docker Hub"
version = "0.1.0"
description = "Docker Hub connector for Repositories, Tags, and Organizations"
archetypes = ["operational"]
homepage = "https://docs.docker.com/docker-hub/api/latest/"

[zones]
home = "z:work"
allowed_sources = ["z:work", "z:private"]
allowed_targets = ["z:work"]
tailscale_tag = "tag:fcp-work"

[capabilities]
required = ["network.dns", "network.outbound"]
optional = []
forbidden = ["system.exec", "system.privileged"]

[provides.operations.repos_list]
summary = "List repositories"
capability = "dockerhub.repos.read"
risk = "low"
safety_tier = "safe"
idempotency = "none"

[provides.operations.repos_list.input_schema]
type = "object"
required = ["namespace"]
additionalProperties = false

[provides.operations.repos_list.input_schema.properties.namespace]
type = "string"
minLength = 1
description = "Docker Hub namespace, username, or organization whose repositories should be listed."

[provides.operations.repos_list.output_schema]
type = "array"

[provides.operations.repos_list.output_schema.items]
type = "object"
required = ["name", "namespace"]
additionalProperties = false

[provides.operations.repos_list.output_schema.items.properties.name]
type = "string"

[provides.operations.repos_list.output_schema.items.properties.namespace]
type = "string"

[provides.operations.repos_list.output_schema.items.properties.description]
type = ["string", "null"]

[provides.operations.repos_list.output_schema.items.properties.is_private]
type = ["boolean", "null"]

[provides.operations.repos_list.output_schema.items.properties.star_count]
type = ["integer", "null"]
minimum = 0

[provides.operations.repos_list.output_schema.items.properties.pull_count]
type = ["integer", "null"]
minimum = 0

[provides.operations.repos_list.output_schema.items.properties.last_updated]
type = ["string", "null"]
format = "date-time"

[provides.operations.repos_list.output_schema.items.properties.date_registered]
type = ["string", "null"]
format = "date-time"

[provides.operations.repos_list.output_schema.items.properties.status]
type = ["integer", "null"]
minimum = 0

[provides.operations.repos_list.output_schema.items.properties.full_description]
type = ["string", "null"]

[provides.operations.repos_list.network_constraints]
host_allow = ["hub.docker.com"]
port_allow = [443]
require_tls = true
deny_localhost = true
deny_private_ranges = true
max_redirects = 0

[provides.operations.repos_list.ai_hints]
when_to_use = "When you need to list Docker Hub repositories"

