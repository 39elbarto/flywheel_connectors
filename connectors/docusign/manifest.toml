[event_caps]
streaming = true
replay = false
min_buffer_events = 50

[sandbox]
profile = "strict"
memory_mb = 256
cpu_percent = 50
wall_clock_timeout_ms = 120000
fs_readonly_paths = [
    "/usr",
    "/lib",
]
fs_writable_paths = ["$CONNECTOR_STATE"]
deny_exec = true
deny_ptrace = true

[[rate_limits.pools]]
id = "docusign.read"
description = "Read operations against DocuSign API"
requests = 1000
window_ms = 3600000
burst = 25
scope = "instance"

[[rate_limits.pools]]
id = "docusign.write"
description = "Envelope creation and modification operations"
requests = 200
window_ms = 3600000
burst = 10
scope = "instance"

[[rate_limits.pools]]
id = "docusign.send"
description = "Envelope send and void operations (high impact)"
requests = 50
window_ms = 3600000
burst = 5
scope = "instance"

[rate_limits.operation_pools]
"docusign.create_envelope" = ["docusign.write"]
"docusign.download_documents" = ["docusign.read"]
