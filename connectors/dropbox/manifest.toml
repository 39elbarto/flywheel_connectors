[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = []
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:6eb01b8236ab052ad9dc2581aef63fb197d1d004aaf6efff6913dbd610e1963f"

[connector]
id = "fcp.dropbox"
name = "Dropbox Connector"
version = "0.1.0"
description = "FCP connector for Dropbox file storage (files, folders, sharing)"
archetypes = [
    "knowledge",
    "storage",
]
format = "wasi"

[connector.state]
model = "singleton_writer"
state_schema_version = "1"
migration_hint = "Stores OAuth2 access and refresh tokens."

[zones]
home = "z:work"
allowed_sources = [
    "z:owner",
    "z:private",
    "z:work",
]
allowed_targets = ["z:work"]
forbidden = [
    "z:public",
    "z:community",
]

[capabilities]
required = [
    "network.dns",
    "network.egress",
    "network.tls.sni",
    "storage.state",
]
optional = ["media.download"]
forbidden = [
    "system.exec",
    "network.listen",
    "media.upload",
]

[provides.operations."dropbox.files.delete"]
description = "Delete a file or folder"
capability = "dropbox.files.write"
risk_level = "high"
safety_tier = "dangerous"
requires_approval = "interactive"
idempotency = "strict"

[provides.operations."dropbox.files.delete".input_schema]
required = ["path"]
type = "object"

[provides.operations."dropbox.files.delete".input_schema.properties.path]
type = "string"

[provides.operations."dropbox.files.delete".output_schema]
type = "object"

[provides.operations."dropbox.files.delete".network_constraints]
host_allow = [
    "api.dropboxapi.com",
    "content.dropboxapi.com",
]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 3
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 1048576

[provides.operations."dropbox.files.delete".ai_hints]
when_to_use = "Delete a file or folder. Moves to trash (recoverable for 30 days)."
common_mistakes = []
examples = ['{"path": "/Documents/old_report.pdf"}']
related = ["dropbox.files.list"]

[provides.operations."dropbox.files.get_metadata"]
description = "Get metadata for a file or folder"
capability = "dropbox.files.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"

[provides.operations."dropbox.files.get_metadata".input_schema]
required = ["path"]
type = "object"

[provides.operations."dropbox.files.get_metadata".input_schema.properties.path]
type = "string"

[provides.operations."dropbox.files.get_metadata".output_schema]
required = [
    "name",
    "path_display",
]
type = "object"

[provides.operations."dropbox.files.get_metadata".output_schema.properties.name]
type = "string"

[provides.operations."dropbox.files.get_metadata".output_schema.properties.path_display]
type = "string"

[provides.operations."dropbox.files.get_metadata".network_constraints]
host_allow = [
    "api.dropboxapi.com",
    "content.dropboxapi.com",
]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 3
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 1048576

[provides.operations."dropbox.files.get_metadata".ai_hints]
when_to_use = "Get metadata for a specific file or folder."
common_mistakes = []
examples = ['{"path": "/Documents/report.pdf"}']
related = ["dropbox.files.list"]

[provides.operations."dropbox.files.list"]
description = "List files and folders in a path"
capability = "dropbox.files.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"

[provides.operations."dropbox.files.list".input_schema]
required = ["path"]
type = "object"

[provides.operations."dropbox.files.list".input_schema.properties.path]
description = "Folder path (empty string for root)"
type = "string"

[provides.operations."dropbox.files.list".output_schema]
required = ["entries"]
type = "object"

[provides.operations."dropbox.files.list".output_schema.properties.entries]
type = "array"

[provides.operations."dropbox.files.list".network_constraints]
host_allow = [
    "api.dropboxapi.com",
    "content.dropboxapi.com",
]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 3
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 10485760

[provides.operations."dropbox.files.list".ai_hints]
when_to_use = "List files and folders at a Dropbox path."
common_mistakes = ["Using / instead of empty string for root."]
examples = ['{"path": "/Documents"}']
related = [
    "dropbox.files.get_metadata",
    "dropbox.files.delete",
]

[provides.operations."dropbox.sharing.list"]
description = "List shared links"
capability = "dropbox.sharing.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"

[provides.operations."dropbox.sharing.list".input_schema]
required = []
type = "object"

[provides.operations."dropbox.sharing.list".output_schema]
required = ["links"]
type = "object"

[provides.operations."dropbox.sharing.list".output_schema.properties.links]
type = "array"

[provides.operations."dropbox.sharing.list".network_constraints]
host_allow = [
    "api.dropboxapi.com",
    "content.dropboxapi.com",
]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 3
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 10485760

[provides.operations."dropbox.sharing.list".ai_hints]
when_to_use = "List shared links."
common_mistakes = []
examples = ["{}"]
related = ["dropbox.files.list"]

[sandbox]
profile = "strict"
memory_mb = 256
cpu_percent = 50
wall_clock_timeout_ms = 300000
fs_readonly_paths = [
    "/usr",
    "/lib",
]
fs_writable_paths = ["$CONNECTOR_STATE"]
deny_exec = true
deny_ptrace = true

[[rate_limits.pools]]
id = "dropbox.files.read"
requests = 200
window_ms = 60000
burst = 20
scope = "instance"

[[rate_limits.pools]]
id = "dropbox.files.write"
requests = 50
window_ms = 60000
burst = 10
scope = "instance"

[[rate_limits.pools]]
id = "dropbox.sharing.read"
requests = 100
window_ms = 60000
burst = 10
scope = "instance"

[rate_limits.operation_pools]
"dropbox.files.get_metadata" = ["dropbox.files.read"]
"dropbox.files.list" = ["dropbox.files.read"]
"dropbox.sharing.list" = ["dropbox.sharing.read"]
"dropbox.files.delete" = ["dropbox.files.write"]
