[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = []
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:0a53a2aa889b8a0d914e428a6a0ce732cbdbf8eb9a548e8f608d47d9c63f47c1"

[connector]
id = "fcp.duckdb"
name = "DuckDB Connector"
version = "0.1.0"
description = "FCP connector for DuckDB embedded analytics (queries, tables)"
archetypes = [
    "knowledge",
    "storage",
]
format = "wasi"

[connector.state]
model = "singleton_writer"
state_schema_version = "1"
migration_hint = "Stores database file path."

[zones]
home = "z:private"
allowed_sources = [
    "z:owner",
    "z:private",
]
allowed_targets = ["z:private"]
forbidden = [
    "z:public",
    "z:community",
    "z:work",
]

[capabilities]
required = ["storage.state"]
optional = [
    "duckdb.execute.write",
    "duckdb.query.read",
    "duckdb.tables.read",
]
forbidden = [
    "system.exec",
    "network.listen",
    "network.dns",
    "network.egress",
    "media.upload",
    "media.download",
]

[provides.operations."duckdb.execute"]
description = "Execute a write SQL statement"
capability = "duckdb.execute.write"
risk_level = "high"
safety_tier = "dangerous"
requires_approval = "interactive"
idempotency = "none"

[provides.operations."duckdb.execute".input_schema]
required = ["sql"]
type = "object"

[provides.operations."duckdb.execute".input_schema.properties.sql]
description = "SQL statement to execute (write operations)"
type = "string"

[provides.operations."duckdb.execute".output_schema]
required = ["rows_affected"]
type = "object"

[provides.operations."duckdb.execute".output_schema.properties.rows_affected]
type = "integer"

[provides.operations."duckdb.execute".network_constraints]
host_allow = ["none.invalid"]
port_allow = [0]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = false
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 0
max_redirects = 0
connect_timeout_ms = 1000
total_timeout_ms = 120000
max_response_bytes = 1048576

[provides.operations."duckdb.execute".ai_hints]
when_to_use = "Execute a write SQL statement (INSERT, UPDATE, DELETE, CREATE) against DuckDB."
common_mistakes = ["Executing destructive DDL without confirmation"]
examples = ['{"sql": "INSERT INTO logs (msg) VALUES (?)"}']
related = [
    "duckdb.query",
    "duckdb.tables.list",
]

[provides.operations."duckdb.query"]
description = "Execute a read-only SQL query"
capability = "duckdb.query.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"

[provides.operations."duckdb.query".input_schema]
required = ["sql"]
type = "object"

[provides.operations."duckdb.query".input_schema.properties.sql]
description = "SQL query to execute (read-only)"
type = "string"

[provides.operations."duckdb.query".output_schema]
required = [
    "columns",
    "rows",
]
type = "object"

[provides.operations."duckdb.query".output_schema.properties.columns]
type = "array"

[provides.operations."duckdb.query".output_schema.properties.rows]
type = "array"

[provides.operations."duckdb.query".network_constraints]
host_allow = ["none.invalid"]
port_allow = [0]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = false
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 0
max_redirects = 0
connect_timeout_ms = 1000
total_timeout_ms = 120000
max_response_bytes = 52428800

[provides.operations."duckdb.query".ai_hints]
when_to_use = "Execute a read-only SQL query against DuckDB."
common_mistakes = ["Attempting write operations (INSERT, UPDATE, DELETE) through the read query endpoint"]
examples = ['{"sql": "SELECT count(*) FROM sales WHERE year = 2025"}']
related = [
    "duckdb.tables.list",
    "duckdb.execute",
]

[provides.operations."duckdb.tables.list"]
description = "List tables in the database"
capability = "duckdb.tables.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"

[provides.operations."duckdb.tables.list".input_schema]
required = []
type = "object"

[provides.operations."duckdb.tables.list".output_schema]
required = ["tables"]
type = "object"

[provides.operations."duckdb.tables.list".output_schema.properties.tables]
type = "array"

[provides.operations."duckdb.tables.list".network_constraints]
host_allow = ["none.invalid"]
port_allow = [0]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = false
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 0
max_redirects = 0
connect_timeout_ms = 1000
total_timeout_ms = 15000
max_response_bytes = 10485760

[provides.operations."duckdb.tables.list".ai_hints]
when_to_use = "List all tables in the DuckDB database."
common_mistakes = [
    "Expecting views and temporary tables to appear — only persistent base tables are listed.",
    "Using PostgreSQL or MySQL system catalog queries instead of DuckDB's information_schema dialect.",
]
examples = ["{}"]
related = ["duckdb.query"]

[sandbox]
profile = "strict"
memory_mb = 512
cpu_percent = 50
wall_clock_timeout_ms = 300000
fs_readonly_paths = [
    "/usr",
    "/lib",
]
fs_writable_paths = ["$CONNECTOR_STATE"]
deny_exec = true
deny_ptrace = true

[[rate_limits.pools]]
id = "duckdb.query.read"
requests = 200
window_ms = 60000
burst = 20
scope = "instance"

[[rate_limits.pools]]
id = "duckdb.tables.read"
requests = 100
window_ms = 60000
burst = 10
scope = "instance"

[[rate_limits.pools]]
id = "duckdb.execute.write"
requests = 50
window_ms = 60000
burst = 10
scope = "instance"

[rate_limits.operation_pools]
"duckdb.tables.list" = ["duckdb.tables.read"]
"duckdb.execute" = ["duckdb.execute.write"]
"duckdb.query" = ["duckdb.query.read"]
