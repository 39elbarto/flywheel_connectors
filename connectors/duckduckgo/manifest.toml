pattern = "^blake3:[0-9a-f]{64}$"

[provides.operations."duckduckgo.search.images".output_schema.properties.region]
type = "string"

[provides.operations."duckduckgo.search.images".output_schema.properties.safe_search]
type = "string"
enum = ["on", "moderate", "off"]

[provides.operations."duckduckgo.search.images".output_schema.properties.time_range]
type = ["string", "null"]

[provides.operations."duckduckgo.search.images".output_schema.properties.count]
type = "integer"
