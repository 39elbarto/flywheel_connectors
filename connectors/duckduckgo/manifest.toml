[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = []
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:b41c831db4dd2b1c27ee874d5215aefe619d593017e2cf21be37aff9b4be09e2"

[connector]
id = "fcp.duckduckgo"
name = "DuckDuckGo"
version = "0.1.0"
description = "Privacy-preserving DuckDuckGo search connector using no-key HTML, autocomplete, and vertical search endpoints"
archetypes = ["operational"]
format = "native"

[connector.state]
model = "stateless"
state_schema_version = "1"
migration_hint = "Stateless no-key search. Queries and result URLs must not be logged by the connector."

[zones]
home = "z:public"
allowed_sources = ["z:public", "z:work"]
allowed_targets = ["z:public", "z:work"]

[capabilities]
required = ["network.dns", "network.egress", "network.tls.sni"]
optional = ["duckduckgo.search.read"]
forbidden = ["network.listen", "system.exec"]

[provides.operations."duckduckgo.search.text"]
description = "Run a no-key DuckDuckGo HTML web search and return normalized untrusted result records."
capability = "duckduckgo.search.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"
revocation_freshness = "safe"

[provides.operations."duckduckgo.search.text".input_schema]
type = "object"
required = ["query"]
additionalProperties = false

[provides.operations."duckduckgo.search.text".input_schema.properties.query]
type = "string"
minLength = 1
maxLength = 499
description = "Search query text. The connector trims whitespace and never logs raw query contents."

[provides.operations."duckduckgo.search.text".input_schema.properties.region]
type = "string"
minLength = 4
maxLength = 8
description = "DuckDuckGo region code such as us-en or wt-wt."

[provides.operations."duckduckgo.search.text".input_schema.properties.safe_search]
type = "string"
enum = ["on", "moderate", "off"]

[provides.operations."duckduckgo.search.text".input_schema.properties.time_range]
type = "string"
enum = ["day", "week", "month", "year"]

[provides.operations."duckduckgo.search.text".input_schema.properties.max_results]
type = "integer"
minimum = 1
maximum = 50

[provides.operations."duckduckgo.search.text".output_schema]
type = "object"
required = ["provider", "mode", "query_hash", "region", "safe_search", "count", "results", "external_content"]
additionalProperties = true

[provides.operations."duckduckgo.search.text".output_schema.properties.provider]
const = "duckduckgo"

[provides.operations."duckduckgo.search.text".output_schema.properties.mode]
const = "text"

[provides.operations."duckduckgo.search.text".output_schema.properties.query_hash]
type = "string"
pattern = "^blake3:[0-9a-f]{64}$"

[provides.operations."duckduckgo.search.text".output_schema.properties.region]
type = "string"

[provides.operations."duckduckgo.search.text".output_schema.properties.safe_search]
type = "string"
enum = ["on", "moderate", "off"]

[provides.operations."duckduckgo.search.text".output_schema.properties.time_range]
type = ["string", "null"]

[provides.operations."duckduckgo.search.text".output_schema.properties.count]
type = "integer"
minimum = 0
maximum = 50

[provides.operations."duckduckgo.search.text".output_schema.properties.results]
type = "array"
maxItems = 50

[provides.operations."duckduckgo.search.text".output_schema.properties.results.items]
type = "object"
additionalProperties = true

[provides.operations."duckduckgo.search.text".output_schema.properties.external_content]
type = "object"
additionalProperties = true

[provides.operations."duckduckgo.search.text".network_constraints]
host_allow = ["html.duckduckgo.com", "lite.duckduckgo.com"]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 5
connect_timeout_ms = 10000
total_timeout_ms = 15000
max_response_bytes = 5242880

[provides.operations."duckduckgo.search.text".ai_hints]
when_to_use = "Use when the caller needs privacy-preserving general web results and does not need image, news, or autocomplete-specific fields."
common_mistakes = ["Do not send credentials; DuckDuckGo search is no-auth.", "Do not expect the connector to return raw query text; results include only a query hash.", "Use duckduckgo.search.images, duckduckgo.search.news, or duckduckgo.search.suggestions for vertical-specific result shapes."]
examples = ['{"query":"rust ownership model","region":"us-en","safe_search":"moderate","max_results":5}']
related = ["duckduckgo.search.images", "duckduckgo.search.news", "duckduckgo.search.suggestions"]

[provides.operations."duckduckgo.search.images"]
