[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = []
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:17848e4f643e37d0207a2b7403debe1756fadde6690b5bc4ab3e71c599e323d3"

[connector]
id = "fcp.elasticsearch"
name = "Elasticsearch Connector"
version = "0.1.0"
description = "FCP connector for Elasticsearch (search, index, bulk, cluster health, index management)"
archetypes = [
    "knowledge",
    "operational",
]
format = "wasi"

[connector.state]
model = "singleton_writer"
state_schema_version = "1"
migration_hint = "Stores cluster URL, API key, and scroll IDs for paginated searches."

[zones]
home = "z:work"
allowed_sources = [
    "z:owner",
    "z:private",
    "z:work",
]
allowed_targets = ["z:work"]
forbidden = [
    "z:public",
    "z:community",
]

[capabilities]
required = [
    "network.dns",
    "network.egress",
    "network.tls.sni",
    "storage.state",
]
optional = []
forbidden = [
    "system.exec",
    "network.listen",
    "media.upload",
    "media.download",
]

[provides.operations."elasticsearch.bulk"]
description = "Bulk index, update, or delete documents"
capability = "elasticsearch.index.write"
risk_level = "medium"
safety_tier = "risky"
requires_approval = "policy"
idempotency = "none"

[provides.operations."elasticsearch.bulk".input_schema]
required = ["operations"]
type = "object"

[provides.operations."elasticsearch.bulk".input_schema.properties.operations]
description = "Array of bulk action objects"
type = "array"

[provides.operations."elasticsearch.bulk".output_schema]
required = [
    "items",
    "errors",
]
type = "object"

[provides.operations."elasticsearch.bulk".output_schema.properties.errors]
type = "boolean"

[provides.operations."elasticsearch.bulk".output_schema.properties.items]
type = "array"

[provides.operations."elasticsearch.bulk".output_schema.properties.took]
type = "integer"

[provides.operations."elasticsearch.bulk".network_constraints]
host_allow = [
    "*.elastic-cloud.com",
    "*.found.io",
]
port_allow = [
    443,
    9243,
]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 3
connect_timeout_ms = 10000
total_timeout_ms = 120000
max_response_bytes = 52428800

[provides.operations."elasticsearch.bulk".ai_hints]
when_to_use = "Perform bulk indexing, updating, or deleting of documents."
common_mistakes = ["Sending too many operations in one request — use batches of 1000-5000."]
examples = ['{"operations": [{"index": {"_index": "products", "_id": "1"}}, {"name": "Widget"}]}']
related = ["elasticsearch.index_document"]

[provides.operations."elasticsearch.cluster.health"]
description = "Get cluster health status"
capability = "elasticsearch.cluster.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"

[provides.operations."elasticsearch.cluster.health".input_schema]
required = []
type = "object"

[provides.operations."elasticsearch.cluster.health".output_schema]
required = [
    "cluster_name",
    "status",
]
type = "object"

[provides.operations."elasticsearch.cluster.health".output_schema.properties.cluster_name]
type = "string"

[provides.operations."elasticsearch.cluster.health".output_schema.properties.number_of_nodes]
type = "integer"

[provides.operations."elasticsearch.cluster.health".output_schema.properties.status]
type = "string"

[provides.operations."elasticsearch.cluster.health".network_constraints]
host_allow = [
    "*.elastic-cloud.com",
    "*.found.io",
]
port_allow = [
    443,
    9243,
]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 3
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 1048576

[provides.operations."elasticsearch.cluster.health".ai_hints]
when_to_use = "Check cluster health (green/yellow/red)."
common_mistakes = []
examples = ["{}"]
related = ["elasticsearch.indices.list"]

[provides.operations."elasticsearch.get_document"]
description = "Get a single document by ID"
capability = "elasticsearch.search.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"

[provides.operations."elasticsearch.get_document".input_schema]
required = [
    "index",
    "id",
]
type = "object"

[provides.operations."elasticsearch.get_document".input_schema.properties.id]
type = "string"

[provides.operations."elasticsearch.get_document".input_schema.properties.index]
type = "string"

[provides.operations."elasticsearch.get_document".output_schema]
required = ["_source"]
type = "object"

[provides.operations."elasticsearch.get_document".output_schema.properties._id]
type = "string"

[provides.operations."elasticsearch.get_document".output_schema.properties._source]
type = "object"

[provides.operations."elasticsearch.get_document".network_constraints]
host_allow = [
    "*.elastic-cloud.com",
    "*.found.io",
]
port_allow = [
    443,
    9243,
]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 3
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 10485760

[provides.operations."elasticsearch.get_document".ai_hints]
when_to_use = "Retrieve a specific document by ID."
common_mistakes = []
examples = ['{"index": "logs-2026.03", "id": "abc123"}']
related = ["elasticsearch.search"]

[provides.operations."elasticsearch.index_document"]
description = "Index (create or update) a single document"
capability = "elasticsearch.index.write"
risk_level = "medium"
safety_tier = "risky"
requires_approval = "policy"
idempotency = "strict"

[provides.operations."elasticsearch.index_document".input_schema]
required = [
    "index",
    "document",
]
type = "object"

[provides.operations."elasticsearch.index_document".input_schema.properties.document]
type = "object"

[provides.operations."elasticsearch.index_document".input_schema.properties.id]
description = "Document ID (auto-generated if omitted)"
type = "string"

[provides.operations."elasticsearch.index_document".input_schema.properties.index]
type = "string"

[provides.operations."elasticsearch.index_document".output_schema]
required = [
    "_id",
    "result",
]
type = "object"

[provides.operations."elasticsearch.index_document".output_schema.properties._id]
type = "string"

[provides.operations."elasticsearch.index_document".output_schema.properties.result]
type = "string"

[provides.operations."elasticsearch.index_document".network_constraints]
host_allow = [
    "*.elastic-cloud.com",
    "*.found.io",
]
port_allow = [
    443,
    9243,
]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 3
connect_timeout_ms = 10000
total_timeout_ms = 60000
max_response_bytes = 1048576

[provides.operations."elasticsearch.index_document".ai_hints]
when_to_use = "Index a single document."
common_mistakes = []
examples = ['{"index": "products", "id": "1", "document": {"name": "Widget", "price": 9.99}}']
related = ["elasticsearch.bulk"]

[provides.operations."elasticsearch.indices.delete"]
description = "Delete an index"
capability = "elasticsearch.indices.write"
risk_level = "high"
safety_tier = "dangerous"
requires_approval = "interactive"
idempotency = "strict"

[provides.operations."elasticsearch.indices.delete".input_schema]
required = ["index"]
type = "object"

[provides.operations."elasticsearch.indices.delete".input_schema.properties.index]
type = "string"

[provides.operations."elasticsearch.indices.delete".output_schema]
required = ["acknowledged"]
type = "object"

[provides.operations."elasticsearch.indices.delete".output_schema.properties.acknowledged]
type = "boolean"

[provides.operations."elasticsearch.indices.delete".network_constraints]
host_allow = [
    "*.elastic-cloud.com",
    "*.found.io",
]
port_allow = [
    443,
    9243,
]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 3
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 1048576

[provides.operations."elasticsearch.indices.delete".ai_hints]
when_to_use = "Delete an index and all its documents. Cannot be undone."
common_mistakes = ["Deleting indices with active aliases."]
examples = ['{"index": "old-logs-2024"}']
related = ["elasticsearch.indices.list"]

[provides.operations."elasticsearch.indices.list"]
description = "List indices"
capability = "elasticsearch.indices.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"

[provides.operations."elasticsearch.indices.list".input_schema]
required = []
type = "object"

[provides.operations."elasticsearch.indices.list".input_schema.properties.pattern]
description = "Index name pattern (e.g. logs-*)"
type = "string"

[provides.operations."elasticsearch.indices.list".output_schema]
required = ["indices"]
type = "object"

[provides.operations."elasticsearch.indices.list".output_schema.properties.indices]
type = "array"

[provides.operations."elasticsearch.indices.list".network_constraints]
host_allow = [
    "*.elastic-cloud.com",
    "*.found.io",
]
port_allow = [
    443,
    9243,
]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 3
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 10485760

[provides.operations."elasticsearch.indices.list".ai_hints]
when_to_use = "List indices and their metadata."
common_mistakes = []
