related = ["elasticsearch.indices.delete"]

[provides.operations."elasticsearch.search"]
description = "Search documents across one or more indices"
capability = "elasticsearch.search.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"

[provides.operations."elasticsearch.search".input_schema]
required = ["index"]
type = "object"

[provides.operations."elasticsearch.search".input_schema.properties.from]
type = "integer"

[provides.operations."elasticsearch.search".input_schema.properties.index]
description = "Index name or pattern"
type = "string"

[provides.operations."elasticsearch.search".input_schema.properties.query]
description = "Elasticsearch query DSL"
type = "object"

[provides.operations."elasticsearch.search".input_schema.properties.size]
maximum = 10000
minimum = 0
type = "integer"

[provides.operations."elasticsearch.search".input_schema.properties.sort]
type = "array"

[provides.operations."elasticsearch.search".output_schema]
required = ["hits"]
type = "object"

[provides.operations."elasticsearch.search".output_schema.properties.hits]
type = "object"

[provides.operations."elasticsearch.search".output_schema.properties.took]
type = "integer"

[provides.operations."elasticsearch.search".network_constraints]
host_allow = [
    "*.elastic-cloud.com",
    "*.found.io",
]
port_allow = [
    443,
    9243,
]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 3
connect_timeout_ms = 10000
total_timeout_ms = 60000
max_response_bytes = 52428800

[provides.operations."elasticsearch.search".ai_hints]
when_to_use = "Search documents using Elasticsearch query DSL."
common_mistakes = [
    "Not specifying size — defaults to 10 results.",
    "Using match_all without size limit on large indices.",
]
examples = ['{"index": "logs-*", "query": {"match": {"message": "error"}}, "size": 100}']
related = [
    "elasticsearch.get_document",
    "elasticsearch.index_document",
]

[sandbox]
profile = "strict"
memory_mb = 256
cpu_percent = 50
wall_clock_timeout_ms = 300000
fs_readonly_paths = [
    "/usr",
    "/lib",
]
fs_writable_paths = ["$CONNECTOR_STATE"]
deny_exec = true
deny_ptrace = true

[[rate_limits.pools]]
id = "elasticsearch.search.read"
requests = 500
window_ms = 60000
burst = 50
scope = "instance"

[[rate_limits.pools]]
id = "elasticsearch.index.write"
requests = 200
window_ms = 60000
burst = 30
scope = "instance"

[[rate_limits.pools]]
id = "elasticsearch.indices.read"
requests = 100
window_ms = 60000
burst = 10
scope = "instance"

[[rate_limits.pools]]
id = "elasticsearch.indices.write"
requests = 10
window_ms = 60000
burst = 2
scope = "instance"

[[rate_limits.pools]]
id = "elasticsearch.cluster.read"
requests = 60
window_ms = 60000
burst = 10
scope = "instance"

[rate_limits.operation_pools]
"elasticsearch.index_document" = ["elasticsearch.index.write"]
"elasticsearch.cluster.health" = ["elasticsearch.cluster.read"]
"elasticsearch.indices.delete" = ["elasticsearch.indices.write"]
"elasticsearch.bulk" = ["elasticsearch.index.write"]
"elasticsearch.indices.list" = ["elasticsearch.indices.read"]
"elasticsearch.get_document" = ["elasticsearch.search.read"]
"elasticsearch.search" = ["elasticsearch.search.read"]
