[provides.operations."elevenlabs.tts.generate".ai_hints]
when_to_use = "Use for finite request-response speech synthesis when the caller has complete text and needs a single audio object."
common_mistakes = ["Pass a stable voice_id; display names are not accepted by the API path.", "Do not log text prompts, generated audio bytes, or provider error bodies.", "Use elevenlabs.tts.stream when the caller needs bounded chunk accounting."]
examples = ['{"voice_id":"21m00Tcm4TlvDq8ikWAM","text":"Short status update","model_id":"eleven_multilingual_v2"}']
related = ["elevenlabs.voices.list", "elevenlabs.tts.stream"]

