[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = []
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:0294250276be028f928ae85582ec78447d5c385acc981b16d50f2bb796e0abe6"

[connector]
id = "fcp.elevenlabs"
name = "ElevenLabs"
version = "0.1.0"
description = "ElevenLabs text-to-speech, streaming synthesis, realtime transcription, and voice discovery connector"
archetypes = ["operational", "streaming"]
format = "native"

[connector.state]
model = "stateless"
state_schema_version = "1"
migration_hint = "Supports voice discovery, request-response TTS, bounded HTTP chunked TTS streaming, and finite Scribe realtime transcription. Long-running Scribe sessions and WebSocket input-stream TTS are retired from connector-local invoke until the host owns stream session lifecycle, fan-in/fan-out, shutdown, and restart supervision."

[zones]
home = "z:work"
allowed_sources = ["z:owner", "z:private", "z:work"]
allowed_targets = ["z:work"]

[capabilities]
required = ["network.dns", "network.egress", "network.tls.sni"]
optional = ["elevenlabs.voices", "elevenlabs.tts", "elevenlabs.tts.streaming", "elevenlabs.stt.streaming"]
forbidden = ["network.listen", "system.exec"]

[provides.operations."elevenlabs.voices.list"]
description = "List ElevenLabs voices"
capability = "elevenlabs.voices"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"
revocation_freshness = "safe"

[provides.operations."elevenlabs.voices.list".input_schema]
type = "object"
properties = {}

[provides.operations."elevenlabs.voices.list".output_schema]
type = "object"

[provides.operations."elevenlabs.voices.list".network_constraints]
host_allow = ["elevenlabs.io", "*.elevenlabs.io"]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 5
connect_timeout_ms = 10000
total_timeout_ms = 60000
max_response_bytes = 2097152

[provides.operations."elevenlabs.voices.list".ai_hints]
when_to_use = "Use to discover voice identifiers before text-to-speech synthesis."
common_mistakes = ["Do not infer a voice_id from a display name without checking the returned catalog.", "Do not log the caller's API key or the full provider response when troubleshooting."]
examples = ["{}"]
related = ["elevenlabs.tts.generate", "elevenlabs.tts.stream"]

[provides.operations."elevenlabs.tts.generate"]
