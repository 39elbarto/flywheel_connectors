[package]
name = "fcp-email-generic"
description = "Generic IMAP/SMTP email connector for the Flywheel Connector Protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "fcp_email_generic"
path = "src/lib.rs"

[[bin]]
name = "fcp-email-generic"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
fcp-core = { path = "../../crates/fcp-core" }
fcp-prelude = { path = "../../crates/fcp-prelude" }
fcp-async-core = { path = "../../crates/fcp-async-core" }
fcp-sdk = { path = "../../crates/fcp-sdk" }

anyhow.workspace = true
async-trait.workspace = true
lettre = { version = "0.11.19", default-features = false, features = ["builder", "smtp-transport", "pool", "native-tls", "hostname"] }
native-tls = "0.2.18"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
uuid.workspace = true
hex.workspace = true

[dev-dependencies]
chrono.workspace = true
ciborium.workspace = true
fcp-crypto = { path = "../../crates/fcp-crypto" }
