[format]
type = "fcp-connector-manifest"
schema_version = "2.1"

[connector]
id = "fcp.email-generic"
name = "Generic Email"
version = "0.1.0"
description = "Generic email connector covering IMAP mailbox inventory/search, SMTP sending, and redacted inbound monitor policy configuration"
archetype = "operational"
homepage = "https://datatracker.ietf.org/doc/html/rfc3501"

[zones]
home = "z:private"
allowed_sources = ["z:owner", "z:private", "z:work"]
allowed_targets = ["z:private", "z:work"]
tailscale_tag = "tag:fcp-private"

[capabilities]
required = ["network.dns", "network.outbound"]
optional = []
forbidden = ["system.exec", "system.privileged", "network.listen"]

# IMAP and SMTP hosts are operator-configured and may point at public, private,
# or tailnet infrastructure, so the host allowlist is intentionally deferred to
# runtime configuration.

[provides.operations.health]
summary = "Report connector configuration, IMAP reachability, and inbound monitor policy state"
capability = "email_generic.read"
risk = "low"
safety_tier = "safe"
idempotency = "strict"
input_schema = { type = "object", additionalProperties = false }
output_schema = { type = "object", required = ["status", "imap_host", "smtp_host", "manifest_hash", "monitor_policy", "inbound_monitor"], additionalProperties = false, properties = { status = { type = "string", enum = ["ok"] }, imap_host = { type = "string", minLength = 1 }, smtp_host = { type = "string", minLength = 1 }, manifest_hash = { type = "string", pattern = "^sha256:[0-9a-f]{64}$" }, monitor_policy = { type = "object", required = ["allowed_senders_configured", "allowed_senders_count", "require_allowed_sender", "drop_automated", "allow_attachments", "poll_interval_secs", "max_body_chars", "seen_uid_cap"], additionalProperties = false, properties = { allowed_senders_configured = { type = "boolean" }, allowed_senders_count = { type = "integer", minimum = 0 }, require_allowed_sender = { type = "boolean" }, drop_automated = { type = "boolean" }, allow_attachments = { type = "boolean" }, poll_interval_secs = { type = "integer", minimum = 1 }, max_body_chars = { type = "integer", minimum = 1 }, seen_uid_cap = { type = "integer", minimum = 1 } } }, inbound_monitor = { type = "object", required = ["status", "streaming", "reason", "pre_emission_policy"], additionalProperties = false, properties = { status = { type = "string", enum = ["deferred"] }, streaming = { type = "boolean", enum = [false] }, reason = { type = "string", minLength = 1 }, pre_emission_policy = { type = "object", required = ["sender_allowlist", "automated_sender_suppression", "bounded_uid_cache", "body_length_bound", "attachment_classification", "thread_metadata"], additionalProperties = false, properties = { sender_allowlist = { type = "boolean" }, automated_sender_suppression = { type = "boolean" }, bounded_uid_cache = { type = "boolean" }, body_length_bound = { type = "boolean" }, attachment_classification = { type = "boolean" }, thread_metadata = { type = "boolean" } } } } } } }

[provides.operations.list_mailboxes]
summary = "List IMAP mailboxes"
capability = "email_generic.read"
risk = "low"
safety_tier = "safe"
idempotency = "strict"
input_schema = { type = "object", additionalProperties = false }
output_schema = { type = "object", required = ["mailboxes"], additionalProperties = false, properties = { mailboxes = { type = "array", items = { type = "string" } } } }

[provides.operations.search_messages]
summary = "Search IMAP messages and return matching UIDs"
capability = "email_generic.read"
risk = "low"
safety_tier = "safe"
idempotency = "strict"
input_schema = { type = "object", required = ["mailbox", "query"], additionalProperties = false, properties = { mailbox = { type = "string", minLength = 1 }, query = { type = "string", minLength = 1 } } }
output_schema = { type = "object", required = ["mailbox", "query", "uids"], additionalProperties = false, properties = { mailbox = { type = "string", minLength = 1 }, query = { type = "string", minLength = 1 }, uids = { type = "array", items = { type = "integer", minimum = 0 } } } }

[provides.operations.send_message]
summary = "Send an email through SMTP"
capability = "email_generic.write"
risk = "medium"
safety_tier = "risky"
idempotency = "none"
input_schema = { type = "object", required = ["to", "subject", "body"], additionalProperties = false, properties = { to = { type = "array", minItems = 1, items = { type = "string", minLength = 1 } }, cc = { type = "array", items = { type = "string", minLength = 1 } }, subject = { type = "string" }, body = { type = "string" } } }
output_schema = { type = "object", required = ["status", "to", "cc", "subject"], additionalProperties = false, properties = { status = { type = "string", enum = ["sent"] }, to = { type = "array", minItems = 1, items = { type = "string", minLength = 1 } }, cc = { type = "array", items = { type = "string", minLength = 1 } }, subject = { type = "string" } } }

[sandbox]
profile = "strict"
memory_mb = 96
cpu_percent = 25
wall_clock_timeout_ms = 30000
deny_exec = true
deny_ptrace = true
