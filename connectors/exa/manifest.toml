[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = []
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:e43e2779d5b1e17726d2adc1b01ebcf5697d24b65ec48c275d80e0e04046b01f"

[connector]
id = "fcp.exa"
name = "Exa"
version = "0.1.0"
description = "Exa connector for search"
archetypes = ["operational"]
format = "native"

[connector.state]
model = "stateless"
state_schema_version = "1"
migration_hint = "First slice: search only. Content retrieval and crawling are deferred."

[zones]
home = "z:work"
allowed_sources = ["z:owner", "z:private", "z:work"]
allowed_targets = ["z:work"]

[capabilities]
required = ["network.dns", "network.egress", "network.tls.sni"]
optional = ["exa.search"]
forbidden = ["network.listen", "system.exec"]

[provides.operations."exa.search"]
description = "Execute a read-only Exa search request"
capability = "exa.search"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"
revocation_freshness = "safe"

[provides.operations."exa.search".input_schema]
type = "object"
required = ["query"]

[provides.operations."exa.search".input_schema.properties.query]
type = "string"
minLength = 1

[provides.operations."exa.search".input_schema.properties.numResults]
type = "integer"
minimum = 1
maximum = 100

[provides.operations."exa.search".input_schema.properties.type]
type = "string"
enum = ["auto", "neural", "fast", "deep", "deep-reasoning", "instant"]

[provides.operations."exa.search".input_schema.properties.useAutoprompt]
type = "boolean"

[provides.operations."exa.search".input_schema.properties.category]
type = "string"

[provides.operations."exa.search".input_schema.properties.includeDomains]
type = "array"

[provides.operations."exa.search".input_schema.properties.includeDomains.items]
type = "string"

[provides.operations."exa.search".input_schema.properties.excludeDomains]
type = "array"

[provides.operations."exa.search".input_schema.properties.excludeDomains.items]
type = "string"

[provides.operations."exa.search".input_schema.properties.contents]
type = "object"
description = "Optional Exa content extraction controls for text, highlights, and summary."

[provides.operations."exa.search".output_schema]
type = "object"
additionalProperties = true

[provides.operations."exa.search".output_schema.properties.results]
type = "array"

[provides.operations."exa.search".output_schema.properties.results.items]
type = "object"
additionalProperties = true

[provides.operations."exa.search".network_constraints]
host_allow = ["exa.ai", "*.exa.ai"]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 5
connect_timeout_ms = 10000
total_timeout_ms = 60000
max_response_bytes = 10485760

[provides.operations."exa.search".ai_hints]
when_to_use = "Use for read-only Exa web search when the caller provides a concise natural-language query."
common_mistakes = ["Do not use this operation for crawling or page-content expansion outside the search response.", "Do not include API keys or private credentials in query text."]
examples = ['{"query":"secure connector protocol","numResults":2,"type":"auto"}']
related = []

[sandbox]
profile = "strict"
memory_mb = 96
cpu_percent = 25
wall_clock_timeout_ms = 30000
deny_exec = true
deny_ptrace = true
