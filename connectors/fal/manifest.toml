[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = []
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:af0215e8d0100cddd49317e204cdf0b744037af846945839f1b3a96774c47e19"

[connector]
id = "fcp.fal"
name = "Fal"
version = "0.1.0"
description = "Fal AI queue media-generation connector for image and video model routes"
archetypes = ["operational"]
format = "native"

[connector.state]
model = "stateless"
state_schema_version = "1"
migration_hint = "Stores no durable state. Operators provide api_key/fal_key or credential_id, optional queue_base_url, timeout, poll interval, and retry bounds."

[zones]
home = "z:work"
allowed_sources = ["z:owner", "z:private", "z:work"]
allowed_targets = ["z:work"]
forbidden = ["z:public"]

[capabilities]
required = ["network.dns", "network.egress", "network.tls.sni"]
optional = ["fal.media.generate", "fal.jobs", "fal.health.read"]
forbidden = ["system.exec", "network.listen"]

[sandbox]
profile = "strict"
memory_mb = 128
cpu_percent = 25
wall_clock_timeout_ms = 300000
deny_exec = true
deny_ptrace = true

[provides.operations."fal.media.submit"]
description = "Submit a model-specific media-generation job to the Fal queue without proxying binary output."
capability = "fal.media.generate"
risk_level = "medium"
safety_tier = "safe"
requires_approval = "none"
idempotency = "none"
input_schema = { type = "object", required = ["model_route"], properties = { model_route = { type = "string", examples = ["fal-ai/flux/schnell", "fal-ai/fast-sdxl"] }, params = { type = "object" }, input = { type = "object" }, webhook_url = { type = "string" }, no_retry = { type = "boolean", default = false } } }
output_schema = { type = "object" }
network_constraints = { host_allow = ["queue.fal.run"], port_allow = [443], ip_allow = [], cidr_deny = [], require_sni = true, spki_pins = [], deny_localhost = true, deny_private_ranges = true, deny_tailnet_ranges = true, deny_ip_literals = true, require_host_canonicalization = true, dns_max_ips = 16, max_redirects = 0, connect_timeout_ms = 10000, total_timeout_ms = 60000, max_response_bytes = 1048576 }

[provides.operations."fal.media.submit".ai_hints]
when_to_use = "Use to enqueue an image or video generation request for a Fal model route such as fal-ai/flux/schnell."
common_mistakes = ["Do not log prompts, raw params, API keys, or signed output URLs.", "Do not use this connector to fetch binary media; it returns URLs and redacted metadata only.", "Do not assume model-specific params are stable; Fal owns per-model schema validation."]
examples = ['{"model_route":"fal-ai/flux/schnell","params":{"prompt":"...","image_size":"square_hd"}}']
related = ["fal.job.status", "fal.job.result", "fal.job.cancel", "fal.job.wait_until_complete"]

[provides.operations."fal.job.status"]
description = "Poll Fal queue status using model_route/request_id or a provider status_url."
capability = "fal.jobs"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"
input_schema = { type = "object", properties = { model_route = { type = "string" }, request_id = { type = "string" }, status_url = { type = "string" }, logs = { type = "boolean", default = false } } }
output_schema = { type = "object" }
network_constraints = { host_allow = ["queue.fal.run"], port_allow = [443], ip_allow = [], cidr_deny = [], require_sni = true, spki_pins = [], deny_localhost = true, deny_private_ranges = true, deny_tailnet_ranges = true, deny_ip_literals = true, require_host_canonicalization = true, dns_max_ips = 16, max_redirects = 0, connect_timeout_ms = 10000, total_timeout_ms = 30000, max_response_bytes = 1048576 }

[provides.operations."fal.job.status".ai_hints]
when_to_use = "Use after fal.media.submit to inspect IN_QUEUE, IN_PROGRESS, or COMPLETED state."
common_mistakes = ["Do not expose runner logs to general-purpose audit logs; they may contain prompt fragments.", "Only accept queue URLs from the configured queue_base_url origin."]
examples = ['{"model_route":"fal-ai/flux/schnell","request_id":"...","logs":false}']
related = ["fal.media.submit", "fal.job.result"]

[provides.operations."fal.job.result"]
description = "Fetch a completed Fal queue result JSON and return redacted media metadata alongside provider payload."
capability = "fal.jobs"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"
input_schema = { type = "object", properties = { model_route = { type = "string" }, request_id = { type = "string" }, response_url = { type = "string" } } }
output_schema = { type = "object" }
network_constraints = { host_allow = ["queue.fal.run"], port_allow = [443], ip_allow = [], cidr_deny = [], require_sni = true, spki_pins = [], deny_localhost = true, deny_private_ranges = true, deny_tailnet_ranges = true, deny_ip_literals = true, require_host_canonicalization = true, dns_max_ips = 16, max_redirects = 0, connect_timeout_ms = 10000, total_timeout_ms = 60000, max_response_bytes = 33554432 }

[provides.operations."fal.job.result".ai_hints]
when_to_use = "Use once status is COMPLETED. The connector returns provider JSON and output_summary; it never downloads media bytes."
common_mistakes = ["Do not log payload.prompt or payload images/video URLs.", "Use output_summary.url_hashes and output_summary.url_hosts for evidence logs."]
examples = ['{"model_route":"fal-ai/flux/schnell","request_id":"..."}']
related = ["fal.job.status"]

[provides.operations."fal.job.cancel"]
description = "Request cancellation of a queued or running Fal job."
capability = "fal.jobs"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "none"
input_schema = { type = "object", properties = { model_route = { type = "string" }, request_id = { type = "string" }, cancel_url = { type = "string" } } }
output_schema = { type = "object" }
network_constraints = { host_allow = ["queue.fal.run"], port_allow = [443], ip_allow = [], cidr_deny = [], require_sni = true, spki_pins = [], deny_localhost = true, deny_private_ranges = true, deny_tailnet_ranges = true, deny_ip_literals = true, require_host_canonicalization = true, dns_max_ips = 16, max_redirects = 0, connect_timeout_ms = 10000, total_timeout_ms = 30000, max_response_bytes = 1048576 }

[provides.operations."fal.job.cancel".ai_hints]
when_to_use = "Use when the caller wants to stop a queued or running job."
common_mistakes = ["Cancellation may return CANCELLATION_REQUESTED or ALREADY_COMPLETED; handle both as provider state, not local transport failure."]
examples = ['{"model_route":"fal-ai/flux/schnell","request_id":"..."}']
related = ["fal.job.status"]

[provides.operations."fal.job.wait_until_complete"]
description = "Poll Fal status until completion, then fetch result JSON without proxying binary output."
capability = "fal.jobs"
risk_level = "medium"
safety_tier = "safe"
requires_approval = "none"
idempotency = "none"
input_schema = { type = "object", properties = { model_route = { type = "string" }, request_id = { type = "string" }, status_url = { type = "string" }, response_url = { type = "string" }, timeout_ms = { type = "integer", minimum = 1, maximum = 600000 }, poll_interval_ms = { type = "integer", minimum = 1, maximum = 30000 } } }
output_schema = { type = "object" }
network_constraints = { host_allow = ["queue.fal.run"], port_allow = [443], ip_allow = [], cidr_deny = [], require_sni = true, spki_pins = [], deny_localhost = true, deny_private_ranges = true, deny_tailnet_ranges = true, deny_ip_literals = true, require_host_canonicalization = true, dns_max_ips = 16, max_redirects = 0, connect_timeout_ms = 10000, total_timeout_ms = 300000, max_response_bytes = 33554432 }

[provides.operations."fal.job.wait_until_complete".ai_hints]
when_to_use = "Use for operator-approved convenience polling when the caller can tolerate a bounded wait."
common_mistakes = ["Do not set unbounded waits.", "Prefer explicit submit/status/result for long-running workflows."]
examples = ['{"model_route":"fal-ai/flux/schnell","request_id":"...","timeout_ms":120000}']
related = ["fal.media.submit", "fal.job.status", "fal.job.result"]

[provides.operations."fal.health"]
description = "Return connector readiness metadata without submitting a paid live generation job."
capability = "fal.health.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"
input_schema = { type = "object", properties = {} }
output_schema = { type = "object" }
network_constraints = { host_allow = ["queue.fal.run"], port_allow = [443], ip_allow = [], cidr_deny = [], require_sni = true, spki_pins = [], deny_localhost = true, deny_private_ranges = true, deny_tailnet_ranges = true, deny_ip_literals = true, require_host_canonicalization = true, dns_max_ips = 16, max_redirects = 0, connect_timeout_ms = 5000, total_timeout_ms = 5000, max_response_bytes = 1048576 }

[provides.operations."fal.health".ai_hints]
when_to_use = "Use for local readiness before explicit paid generation operations."
common_mistakes = ["Do not treat health as live Fal account proof; use the gated e2e script for live smoke evidence."]
examples = ["{}"]
related = ["fal.media.submit"]
