[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = []
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:ae0157b5814918fac9c9622c7c0a72110f86c3c1c307c5e8257711be40900bcd"

[connector]
id = "fcp.feishu"
name = "Feishu/Lark"
version = "0.1.0"
description = "Tenant-scoped Feishu/Lark connector for first-slice bot messaging, chat discovery, directory reads, known docs and sheets reads, calendar reads, host-forwarded webhook ingestion, and connectivity verification"
archetypes = ["operational"]
format = "native"

[connector.state]
model = "singleton_writer"
state_schema_version = "2"
migration_hint = "One connector instance binds to one installed Feishu/Lark tenant app via runtime-injected app_id, app_secret, base_url, retry, request_timeout_ms, and optional webhook_state.dedupe_state_path settings."

# Auth and scope model:
# - One connector instance is bound to one installed Feishu/Lark tenant app.
# - Authentication is app_id + app_secret exchanged against
#   /open-apis/auth/v3/tenant_access_token/internal.
# - The connector acts only as that installed app inside one tenant; it does not
#   impersonate arbitrary users or cross tenant boundaries.
# - Mainland China traffic uses https://open.feishu.cn; global traffic uses
#   https://open.larksuite.com.
# - Localhost and 127.0.0.1 are allowed only for deterministic verification harnesses.
# - Host-forwarded webhook request ingestion validates Feishu challenge/token/signature,
#   claims connector-owned dedupe state, and normalizes plaintext events without opening
#   a listener socket.
# - User-delegated OAuth, cross-tenant brokering, embedded listener lifecycle,
#   websocket event delivery, encrypted webhook payload decryption, Drive
#   search/export/write, and calendar mutations are explicit non-goals for this
#   first slice.

[zones]
home = "z:work"
allowed_sources = ["z:owner", "z:private", "z:work"]
allowed_targets = ["z:work"]
forbidden = ["z:community", "z:public"]

[capabilities]
required = ["network.dns", "network.egress", "network.tls.sni"]
optional = [
    "feishu.messages.write",
    "feishu.messages.read",
    "feishu.chats.read",
    "feishu.users.read",
    "feishu.docs.read",
    "feishu.calendar.read",
    "feishu.webhook.ingest",
]
forbidden = ["system.exec", "system.privileged", "network.listen"]

[event_caps]
streaming = false
replay = true
min_buffer_events = 0

[sandbox]
profile = "strict"
memory_mb = 256
cpu_percent = 50
wall_clock_timeout_ms = 30000
deny_exec = true
deny_ptrace = true

[provides.operations."feishu.messages.send"]
description = "Send a bot-authored message through the installed tenant app to one visible user or chat."
capability = "feishu.messages.write"
risk_level = "medium"
safety_tier = "risky"
requires_approval = "none"
idempotency = "none"
input_schema = { type = "object", required = ["receive_id", "msg_type", "content"] }
output_schema = { type = "object", required = ["message_id"] }
network_constraints = { host_allow = ["open.feishu.cn", "open.larksuite.com", "localhost", "127.0.0.1"], port_allow = [443, 80], ip_allow = [], cidr_deny = [], require_sni = true, spki_pins = [], deny_localhost = false, deny_private_ranges = false, deny_tailnet_ranges = true, deny_ip_literals = false, require_host_canonicalization = true, dns_max_ips = 16, max_redirects = 0, connect_timeout_ms = 10000, total_timeout_ms = 30000, max_response_bytes = 1048576 }

[provides.operations."feishu.messages.send".ai_hints]
when_to_use = "Use when you need the installed tenant app to send a message to one known user or chat."
common_mistakes = ["Content must be a JSON-encoded string matching msg_type.", "receive_id_type defaults to open_id if omitted.", "This connector is bound to one tenant app and cannot impersonate arbitrary users."]
examples = []
related = ["feishu.messages.reply"]

