[format]
type = "fcp-connector-manifest"
schema_version = "2.1"

[connector]
id = "fcp.feishu"
name = "Feishu/Lark"
version = "0.1.0"
description = "Tenant-scoped Feishu/Lark connector for first-slice bot messaging, chat discovery, directory reads, docx and sheets reads, calendar reads, and connectivity verification"
archetype = "operational"
homepage = "https://open.feishu.cn/document/"

# Auth and scope model:
# - One connector instance is bound to one installed Feishu/Lark tenant app.
# - Authentication is `app_id` + `app_secret`, exchanged against
#   `/open-apis/auth/v3/tenant_access_token/internal`.
# - The connector acts only as that installed app inside one tenant; it does not
#   impersonate arbitrary users or cross tenant boundaries.
# - Mainland China traffic uses `https://open.feishu.cn`; global traffic uses
#   `https://open.larksuite.com`.
# - User-delegated OAuth, cross-tenant brokering, webhook ingestion, websocket
#   event delivery, Drive search/export/write, and calendar mutations are
#   explicit non-goals for this first slice.

[zones]
home = "z:private"
allowed_sources = ["z:private"]
allowed_targets = ["z:private"]
tailscale_tag = "tag:fcp-private"

[capabilities]
required = ["network.dns", "network.outbound"]
optional = []
forbidden = ["system.exec", "system.privileged"]

[provides.operations.messages_send]
summary = "Send a message"
capability = "feishu.messages.write"
risk = "medium"
safety_tier = "risky"
idempotency = "none"

[provides.operations.messages_send.network_constraints]
host_allow = ["open.feishu.cn", "open.larksuite.com"]
port_allow = [443]
require_tls = true
require_sni = true
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
deny_ip_literals = true
max_redirects = 0

[provides.operations.messages_reply]
summary = "Reply to a message"
capability = "feishu.messages.write"
risk = "medium"
safety_tier = "risky"
idempotency = "none"

[provides.operations.messages_reply.network_constraints]
