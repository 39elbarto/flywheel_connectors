# ---------------------------------------------------------------------------
# Streaming / Event Capabilities
# ---------------------------------------------------------------------------

[event_caps]
streaming = true
replay = false
min_buffer_events = 25

# ---------------------------------------------------------------------------
# Sandbox
# ---------------------------------------------------------------------------

[sandbox]
profile = "strict"
memory_mb = 256
cpu_percent = 50
wall_clock_timeout_ms = 120000
fs_readonly_paths = [
    "/usr",
    "/lib",
]
fs_writable_paths = ["$CONNECTOR_STATE"]
deny_exec = true
deny_ptrace = true

# ---------------------------------------------------------------------------
# Rate Limit Pools
# ---------------------------------------------------------------------------

[[rate_limits.pools]]
id = "figma.read"
description = "Read operations against Figma REST API"
requests = 30
window_ms = 60000
burst = 10
scope = "instance"

[[rate_limits.pools]]
id = "figma.write"
description = "Write operations (comments, webhooks)"
requests = 30
window_ms = 60000
burst = 5
scope = "instance"

[[rate_limits.pools]]
id = "figma.delete"
description = "Delete operations"
requests = 20
window_ms = 60000
burst = 5
scope = "instance"

[[rate_limits.pools]]
id = "figma.export"
description = "Image export operations (resource-intensive)"
requests = 20
window_ms = 60000
burst = 5
scope = "instance"

[[rate_limits.pools]]
id = "figma.webhook"
description = "Webhook management operations"
requests = 10
window_ms = 60000
burst = 2
scope = "instance"

[rate_limits.operation_pools]
"figma.list_team_projects" = ["figma.read"]
"figma.list_project_files" = ["figma.read"]
"figma.get_file_meta" = ["figma.read"]
"figma.get_file" = ["figma.read"]
"figma.get_file_nodes" = ["figma.read"]
"figma.get_file_components" = ["figma.read"]
"figma.get_file_styles" = ["figma.read"]
"figma.styles.list" = ["figma.read"]
"figma.tokens.export" = ["figma.read"]
"figma.export_images" = ["figma.export"]
"figma.list_file_versions" = ["figma.read"]
"figma.list_comments" = ["figma.read"]
"figma.post_comment" = ["figma.write"]
"figma.delete_comment" = ["figma.delete"]
"figma.create_webhook" = ["figma.webhook"]
"figma.list_webhooks" = ["figma.read"]
"figma.delete_webhook" = ["figma.delete"]
"figma.macro.export_component_bundle" = ["figma.read"]
"figma.macro.design_audit" = ["figma.read"]
