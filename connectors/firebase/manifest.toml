[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = []
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:10b73978440ef2be5f0c4e9420953dc10db64d939ed7e761d963a8d52bd784da"

[connector]
id = "fcp.firebase"
name = "Firebase Connector"
version = "0.1.0"
description = "FCP connector for Firebase Firestore and Realtime Database"
archetypes = [
    "storage",
    "operational",
]
format = "wasi"

[connector.state]
model = "singleton_writer"
state_schema_version = "1"
migration_hint = "Stores Firebase project identity, Google auth mode, and session context."

[zones]
home = "z:work"
allowed_sources = [
    "z:owner",
    "z:private",
    "z:work",
]
allowed_targets = ["z:work"]
forbidden = [
    "z:public",
    "z:community",
]

[capabilities]
required = [
    "network.dns",
    "network.egress",
    "network.tls.sni",
    "storage.state",
]
optional = []
forbidden = [
    "system.exec",
    "network.listen",
]

[provides.operations."firebase.firestore.batch_write"]
description = "Execute a Firestore batch write"
capability = "firebase.write"
risk_level = "medium"
safety_tier = "risky"
requires_approval = "policy"
idempotency = "strict"

[provides.operations."firebase.firestore.batch_write".input_schema]
required = ["writes"]
type = "object"

[provides.operations."firebase.firestore.batch_write".input_schema.properties.labels]
type = "object"

[provides.operations."firebase.firestore.batch_write".input_schema.properties.writes]
type = "array"

[provides.operations."firebase.firestore.batch_write".output_schema]
type = "object"

[provides.operations."firebase.firestore.batch_write".network_constraints]
host_allow = ["firestore.googleapis.com"]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 3
connect_timeout_ms = 10000
total_timeout_ms = 120000
max_response_bytes = 33554432

[provides.operations."firebase.firestore.batch_write".ai_hints]
when_to_use = "Use this to apply multiple Firestore writes when per-write status visibility matters or a caller already has raw Firestore write objects."
common_mistakes = [
    "Including more than one write for the same document in a batch, which Firestore rejects.",
    "Using batch_write for simple single-document edits instead of create, update, or delete, which are easier to audit.",
    "Retrying after a partial status response without reconciling which writes already succeeded.",
]
examples = ['{"writes":[{"delete":"projects/demo/databases/(default)/documents/users/alice"}]}']
related = ["firebase.firestore.update", "firebase.firestore.delete"]

