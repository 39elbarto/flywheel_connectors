[provides.operations."firebase.firestore.batch_write".input_schema.properties.writes]
type = "array"

[provides.operations."firebase.firestore.batch_write".output_schema]
type = "object"

[provides.operations."firebase.firestore.batch_write".network_constraints]
host_allow = ["firestore.googleapis.com"]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 3
connect_timeout_ms = 10000
total_timeout_ms = 120000
