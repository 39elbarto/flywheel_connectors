[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = ["streaming"]
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:812c340d3f2efe05d5e8af7c6818387d9cbef02e22d9f47ce58a5e6062111e5a"

[connector]
id = "fcp.fireworks"
name = "Fireworks AI"
version = "0.1.0"
description = "Fireworks AI OpenAI-compatible text and embedding inference connector using chat, streaming, embeddings, model listing, and legacy completions APIs"
archetypes = ["operational", "streaming"]
format = "native"

[connector.state]
model = "stateless"
state_schema_version = "1"
migration_hint = "Stores no durable state. Configuration is limited to api_key or credential_id, optional base_url, default models, timeout, and rate-limit retry policy."

[zones]
home = "z:work"
allowed_sources = ["z:owner", "z:private", "z:work"]
allowed_targets = ["z:work"]
forbidden = ["z:public"]

[capabilities]
required = ["network.dns", "network.egress", "network.tls.sni"]
optional = ["fireworks.chat", "fireworks.embeddings", "fireworks.models.read", "fireworks.health.read"]
forbidden = ["system.exec", "network.listen"]

[sandbox]
profile = "strict"
memory_mb = 128
cpu_percent = 25
wall_clock_timeout_ms = 180000
deny_exec = true
deny_ptrace = true

[provides.operations."fireworks.chat.completions"]
description = "Create a bounded non-streaming Fireworks chat completion through POST /inference/v1/chat/completions."
capability = "fireworks.chat"
risk_level = "medium"
safety_tier = "safe"
requires_approval = "none"
idempotency = "none"
input_schema = { type = "object", required = ["messages"], properties = { model = { type = "string", default = "accounts/fireworks/models/llama-v3p1-8b-instruct", pattern = ".+/.+" }, messages = { type = "array", minItems = 1 }, max_tokens = { type = "integer", minimum = 1 }, temperature = { type = "number", minimum = 0, maximum = 2 }, top_p = { type = "number", minimum = 0, maximum = 1 }, stop = {}, response_format = { type = "object" }, tools = { type = "array" }, tool_choice = {}, reasoning_effort = { type = "string", enum = ["none", "low", "medium", "high", "max"] }, context_length_exceeded_behavior = { type = "string", enum = ["truncate", "error"] }, provider_extensions = { type = "object" } } }
output_schema = { type = "object" }
network_constraints = { host_allow = ["api.fireworks.ai"], port_allow = [443], ip_allow = [], cidr_deny = [], require_sni = true, spki_pins = [], deny_localhost = true, deny_private_ranges = true, deny_tailnet_ranges = true, deny_ip_literals = true, require_host_canonicalization = true, dns_max_ips = 16, max_redirects = 3, connect_timeout_ms = 10000, total_timeout_ms = 60000, max_response_bytes = 10485760 }

[provides.operations."fireworks.chat.completions".ai_hints]
when_to_use = "Use for direct Fireworks open-source model chat completions when provider-specific Fireworks serving, model catalog, or latency matters."
common_mistakes = ["Do not log prompts, completions, tool-call arguments, or API keys.", "Fireworks hosted model IDs often use accounts/<account>/models/<model>, for example accounts/fireworks/models/llama-v3p1-8b-instruct.", "Do not add workflow image generation to this text-focused connector."]
examples = ['{"model":"accounts/fireworks/models/llama-v3p1-8b-instruct","messages":[{"role":"user","content":"Summarize FCP in 3 bullets."}]}']
related = ["fireworks.chat.completions_stream", "fireworks.models.list"]

[provides.operations."fireworks.chat.completions_stream"]
description = "Open a Fireworks SSE chat-completions stream and return redaction-safe chunk metadata plus assembled text."
capability = "fireworks.chat"
risk_level = "medium"
safety_tier = "safe"
requires_approval = "none"
idempotency = "none"
input_schema = { type = "object", required = ["messages"], properties = { model = { type = "string", default = "accounts/fireworks/models/llama-v3p1-8b-instruct", pattern = ".+/.+" }, messages = { type = "array", minItems = 1 }, max_tokens = { type = "integer", minimum = 1 }, temperature = { type = "number", minimum = 0, maximum = 2 }, top_p = { type = "number", minimum = 0, maximum = 1 }, stop = {}, response_format = { type = "object" }, tools = { type = "array" }, tool_choice = {}, reasoning_effort = { type = "string", enum = ["none", "low", "medium", "high", "max"] }, context_length_exceeded_behavior = { type = "string", enum = ["truncate", "error"] }, provider_extensions = { type = "object" } } }
output_schema = { type = "object" }
network_constraints = { host_allow = ["api.fireworks.ai"], port_allow = [443], ip_allow = [], cidr_deny = [], require_sni = true, spki_pins = [], deny_localhost = true, deny_private_ranges = true, deny_tailnet_ranges = true, deny_ip_literals = true, require_host_canonicalization = true, dns_max_ips = 16, max_redirects = 3, connect_timeout_ms = 10000, total_timeout_ms = 300000, max_response_bytes = 10485760 }

[provides.operations."fireworks.chat.completions_stream".ai_hints]
when_to_use = "Use when lower first-token latency matters and the caller can consume incremental chunk metadata."
common_mistakes = ["Do not expect image generation from this connector.", "Handle finish_reason and tool_call deltas from the returned chunks."]
examples = ['{"model":"accounts/fireworks/models/llama-v3p1-8b-instruct","messages":[{"role":"user","content":"Stream a one sentence answer."}],"max_tokens":64}']
related = ["fireworks.chat.completions"]

[provides.operations."fireworks.embeddings.create"]
description = "Create Fireworks text embeddings through POST /inference/v1/embeddings."
capability = "fireworks.embeddings"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"
input_schema = { type = "object", required = ["input"], properties = { model = { type = "string", default = "nomic-ai/nomic-embed-text-v1.5", pattern = ".+/.+" }, input = {}, encoding_format = { type = "string" }, dimensions = { type = "integer", minimum = 1 }, provider_extensions = { type = "object" } } }
output_schema = { type = "object" }
network_constraints = { host_allow = ["api.fireworks.ai"], port_allow = [443], ip_allow = [], cidr_deny = [], require_sni = true, spki_pins = [], deny_localhost = true, deny_private_ranges = true, deny_tailnet_ranges = true, deny_ip_literals = true, require_host_canonicalization = true, dns_max_ips = 16, max_redirects = 3, connect_timeout_ms = 10000, total_timeout_ms = 60000, max_response_bytes = 10485760 }

[provides.operations."fireworks.embeddings.create".ai_hints]
when_to_use = "Use for Fireworks-hosted embedding models such as nomic-ai/nomic-embed-text-v1.5."
common_mistakes = ["Do not log input text or embedding vectors.", "Do not assume chat models support embeddings."]
examples = ['{"model":"nomic-ai/nomic-embed-text-v1.5","input":"hello"}']
related = ["fireworks.models.list"]

[provides.operations."fireworks.models.list"]
description = "List Fireworks models from GET /inference/v1/models using the connector's Fireworks-aware model-cache path."
capability = "fireworks.models.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"
input_schema = { type = "object", properties = { refresh = { type = "boolean", default = false } } }
output_schema = { type = "object" }
network_constraints = { host_allow = ["api.fireworks.ai"], port_allow = [443], ip_allow = [], cidr_deny = [], require_sni = true, spki_pins = [], deny_localhost = true, deny_private_ranges = true, deny_tailnet_ranges = true, deny_ip_literals = true, require_host_canonicalization = true, dns_max_ips = 16, max_redirects = 3, connect_timeout_ms = 10000, total_timeout_ms = 30000, max_response_bytes = 10485760 }

[provides.operations."fireworks.models.list".ai_hints]
when_to_use = "Use to discover currently active Fireworks model IDs before sending chat, streaming, embeddings, or legacy completion requests."
common_mistakes = ["Do not assume every listed model supports every operation."]
examples = ["{}"]
related = ["fireworks.chat.completions", "fireworks.embeddings.create"]

[provides.operations."fireworks.health"]
description = "Probe Fireworks model listing with a short timeout and return connector health metadata."
capability = "fireworks.health.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"
input_schema = { type = "object", properties = {} }
output_schema = { type = "object" }
network_constraints = { host_allow = ["api.fireworks.ai"], port_allow = [443], ip_allow = [], cidr_deny = [], require_sni = true, spki_pins = [], deny_localhost = true, deny_private_ranges = true, deny_tailnet_ranges = true, deny_ip_literals = true, require_host_canonicalization = true, dns_max_ips = 16, max_redirects = 3, connect_timeout_ms = 5000, total_timeout_ms = 5000, max_response_bytes = 10485760 }

[provides.operations."fireworks.health".ai_hints]
when_to_use = "Use for a bounded readiness check before dispatching user-visible Fireworks operations."
common_mistakes = ["Do not treat degraded credential_id mode as a failed connector; host egress injection may be required."]
examples = ["{}"]
related = ["fireworks.models.list"]

[provides.operations."fireworks.completions.legacy"]
description = "Minimal deprecated legacy /v1/completions support for older OpenAI-compatible clients."
capability = "fireworks.chat"
risk_level = "medium"
safety_tier = "safe"
requires_approval = "none"
idempotency = "none"
input_schema = { type = "object", required = ["prompt"], properties = { model = { type = "string", default = "accounts/fireworks/models/llama-v3p1-8b-instruct", pattern = ".+/.+" }, prompt = {}, max_tokens = { type = "integer", minimum = 1 }, temperature = { type = "number", minimum = 0, maximum = 2 }, context_length_exceeded_behavior = { type = "string", enum = ["truncate", "error"] }, provider_extensions = { type = "object" } } }
output_schema = { type = "object" }
network_constraints = { host_allow = ["api.fireworks.ai"], port_allow = [443], ip_allow = [], cidr_deny = [], require_sni = true, spki_pins = [], deny_localhost = true, deny_private_ranges = true, deny_tailnet_ranges = true, deny_ip_literals = true, require_host_canonicalization = true, dns_max_ips = 16, max_redirects = 3, connect_timeout_ms = 10000, total_timeout_ms = 60000, max_response_bytes = 10485760 }

[provides.operations."fireworks.completions.legacy".ai_hints]
when_to_use = "Use only for older callers that cannot send chat messages."
common_mistakes = ["Prefer fireworks.chat.completions for all new work."]
examples = ['{"model":"accounts/fireworks/models/llama-v3p1-8b-instruct","prompt":"One sentence about FCP."}']
related = ["fireworks.chat.completions"]
