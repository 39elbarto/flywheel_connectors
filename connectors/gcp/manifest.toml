deny_localhost = true
deny_private_ranges = true
max_redirects = 0

[provides.operations.storage_get_object.ai_hints]
when_to_use = "When you need metadata for a specific object in a bucket"

[provides.operations.storage_upload_object]
summary = "Upload an object to Cloud Storage"
capability = "gcp.storage.write"
risk = "medium"
safety_tier = "risky"
idempotency = "strict"

[provides.operations.storage_upload_object.network_constraints]
host_allow = ["storage.googleapis.com"]
port_allow = [443]
require_tls = true
deny_localhost = true
deny_private_ranges = true
max_redirects = 0

[provides.operations.storage_upload_object.ai_hints]
when_to_use = "When you need to upload a file to a Cloud Storage bucket"

[provides.operations.storage_delete_object]
summary = "Delete a Cloud Storage object"
capability = "gcp.storage.write"
risk = "high"
safety_tier = "dangerous"
idempotency = "strict"

[provides.operations.storage_delete_object.network_constraints]
host_allow = ["storage.googleapis.com"]
port_allow = [443]
require_tls = true
deny_localhost = true
deny_private_ranges = true
