[format]
type = "fcp-connector-manifest"
schema_version = "2.1"

[connector]
id = "fcp.gcp"
name = "Google Cloud Platform"
version = "0.1.0"
description = "GCP connector for Compute Engine, Cloud Storage, Cloud Run, and Projects"
archetype = "cloud-control-plane"
homepage = "https://cloud.google.com/apis"

[zones]
home = "z:work"
allowed_sources = ["z:work", "z:private"]
allowed_targets = ["z:work"]
tailscale_tag = "tag:fcp-work"

[capabilities]
required = ["network.outbound"]
optional = []
forbidden = ["system.exec", "system.privileged"]

[provides.operations.compute_list_instances]
summary = "List Compute Engine instances in a zone"
capability = "gcp.compute.read"
risk = "low"
safety_tier = "safe"
idempotency = "none"

[provides.operations.compute_list_instances.network_constraints]
host_allow = ["compute.googleapis.com"]
port_allow = [443]
require_tls = true
deny_localhost = true
deny_private_ranges = true
max_redirects = 0

[provides.operations.compute_list_instances.ai_hints]
when_to_use = "When you need to list VMs in a specific zone"

[provides.operations.compute_get_instance]
summary = "Get a Compute Engine instance"
capability = "gcp.compute.read"
risk = "low"
safety_tier = "safe"
idempotency = "none"

[provides.operations.compute_get_instance.network_constraints]
host_allow = ["compute.googleapis.com"]
port_allow = [443]
require_tls = true
deny_localhost = true
deny_private_ranges = true
max_redirects = 0

[provides.operations.compute_get_instance.ai_hints]
when_to_use = "When you need details of a specific VM instance"

[provides.operations.compute_start_instance]
summary = "Start a Compute Engine instance"
capability = "gcp.compute.write"
risk = "medium"
safety_tier = "risky"
idempotency = "strict"

[provides.operations.compute_start_instance.network_constraints]
host_allow = ["compute.googleapis.com"]
port_allow = [443]
require_tls = true
deny_localhost = true
deny_private_ranges = true
max_redirects = 0

[provides.operations.compute_start_instance.ai_hints]
when_to_use = "When you need to start a stopped VM"

[provides.operations.compute_stop_instance]
summary = "Stop a Compute Engine instance"
capability = "gcp.compute.write"
risk = "medium"
safety_tier = "risky"
idempotency = "strict"

[provides.operations.compute_stop_instance.network_constraints]
host_allow = ["compute.googleapis.com"]
port_allow = [443]
require_tls = true
deny_localhost = true
deny_private_ranges = true
max_redirects = 0

[provides.operations.compute_stop_instance.ai_hints]
when_to_use = "When you need to stop a running VM"

[provides.operations.compute_delete_instance]
summary = "Delete a Compute Engine instance"
capability = "gcp.compute.write"
risk = "critical"
safety_tier = "dangerous"
idempotency = "strict"

[provides.operations.compute_delete_instance.network_constraints]
host_allow = ["compute.googleapis.com"]
port_allow = [443]
require_tls = true
deny_localhost = true
deny_private_ranges = true
max_redirects = 0

[provides.operations.compute_delete_instance.ai_hints]
when_to_use = "When you need to permanently delete a VM — irreversible"

[provides.operations.storage_list_objects]
summary = "List objects in a Cloud Storage bucket"
capability = "gcp.storage.read"
risk = "low"
safety_tier = "safe"
idempotency = "none"

[provides.operations.storage_list_objects.network_constraints]
