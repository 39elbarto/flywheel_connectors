[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = []
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:e9993ca5946bb15a9a8abeac3f65a2bc4adca7834686a2a494f901074bd47e7d"

[connector]
id = "fcp.gcp"
name = "Google Cloud Platform"
version = "0.1.0"
description = "GCP connector for Compute Engine, Cloud Storage, Cloud Run, and Projects"
archetypes = ["operational", "storage"]
format = "native"

[connector.state]
model = "stateless"
state_schema_version = "1"
migration_hint = "No durable connector state; configuration and HTTP runtime live only inside the current connector instance."

[zones]
home = "z:work"
allowed_sources = ["z:work", "z:private"]
allowed_targets = ["z:work"]
forbidden = ["z:public", "z:community"]

[capabilities]
required = ["network.dns", "network.egress", "network.tls.sni"]
optional = [
    "gcp.compute.read",
    "gcp.compute.write",
    "gcp.storage.read",
    "gcp.storage.write",
    "gcp.run.read",
    "gcp.run.write",
    "gcp.iam.read",
]
forbidden = ["system.exec", "network.listen", "system.privileged"]

[provides.operations."gcp.compute.list_instances"]
description = "List Compute Engine instances in a zone"
capability = "gcp.compute.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "none"
input_schema = { type = "object", required = ["zone"] }
output_schema = { type = "array" }

[provides.operations."gcp.compute.list_instances".network_constraints]
host_allow = ["compute.googleapis.com"]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 0
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 10485760

