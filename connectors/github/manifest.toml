# ── Events ──────────────────────────────────────────────────────

[event_caps]
streaming = true
replay = false
min_buffer_events = 100

# ── Sandbox ─────────────────────────────────────────────────────

[sandbox]
profile = "strict"
memory_mb = 256
cpu_percent = 50
wall_clock_timeout_ms = 120000
fs_readonly_paths = ["/usr", "/lib"]
fs_writable_paths = ["$CONNECTOR_STATE"]
deny_exec = true
deny_ptrace = true

# ── Rate Limits ─────────────────────────────────────────────────

[[rate_limits.pools]]
id = "github.read"
requests = 900
window_ms = 3600000
burst = 30
scope = "instance"

[[rate_limits.pools]]
id = "github.write"
requests = 300
window_ms = 3600000
burst = 20
scope = "instance"

[[rate_limits.pools]]
id = "github.admin"
requests = 60
window_ms = 3600000
burst = 10
scope = "instance"

[[rate_limits.pools]]
id = "github.search"
requests = 30
window_ms = 60000
burst = 10
scope = "instance"

[rate_limits.operation_pools]
"github.create_issue" = ["github.write"]
"github.get_issue" = ["github.read"]
"github.search_issues" = ["github.search"]
"github.create_pull_request" = ["github.write"]
"github.get_pull_request" = ["github.read"]
"github.merge_pull_request" = ["github.admin"]
"github.get_repo" = ["github.read"]
"github.search_repos" = ["github.search"]
"github.list_workflows" = ["github.read"]
"github.trigger_workflow" = ["github.admin"]
"github.get_file_content" = ["github.read"]
"github.search_code" = ["github.search"]
