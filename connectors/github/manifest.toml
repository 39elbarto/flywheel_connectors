[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = []
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:2bc4eddddcd12d6a78b4df4a7346ce770ec9e695b0d31051ed2f362b6c932e10"

[connector]
id = "fcp.github"
name = "GitHub Connector"
version = "0.1.0"
description = "FCP connector for GitHub (repos, issues, PRs, actions, releases)"
archetypes = ["operational", "streaming", "knowledge"]
format = "wasi"

[connector.state]
model = "singleton_writer"
state_schema_version = "1"
migration_hint = "init"

[zones]
home = "z:work"
allowed_sources = ["z:owner", "z:private", "z:work"]
allowed_targets = ["z:work"]
forbidden = ["z:public"]

[capabilities]
required = ["network.dns", "network.egress", "network.tls.sni", "storage.state"]
optional = ["media.download"]
forbidden = ["system.exec", "network.listen"]

# ── Operations ──────────────────────────────────────────────────

[provides.operations."github.create_issue"]
description = "Create an issue in a repository"
capability = "github.write"
risk_level = "medium"
safety_tier = "risky"
requires_approval = "policy"
idempotency = "none"

[provides.operations."github.create_issue".input_schema]
required = ["owner", "repo", "title"]
type = "object"
[provides.operations."github.create_issue".input_schema.properties.owner]
type = "string"
[provides.operations."github.create_issue".input_schema.properties.repo]
type = "string"
[provides.operations."github.create_issue".input_schema.properties.title]
type = "string"
[provides.operations."github.create_issue".input_schema.properties.body]
type = "string"

[provides.operations."github.create_issue".output_schema]
required = ["issue"]
type = "object"
[provides.operations."github.create_issue".output_schema.properties.issue]
type = "object"

[provides.operations."github.create_issue".network_constraints]
host_allow = ["api.github.com"]
port_allow = [443]
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 5
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 1048576

[provides.operations."github.create_issue".ai_hints]
when_to_use = "Create a new issue in a GitHub repository."
common_mistakes = ["Forgetting to specify both owner and repo"]
examples = ['{"owner": "octocat", "repo": "hello-world", "title": "Bug report"}']
related = ["github.get_issue", "github.search_issues"]

