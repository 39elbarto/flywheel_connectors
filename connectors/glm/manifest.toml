[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = ["streaming"]
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:glm-oai-compat"

[connector]
id = "fcp.glm"
name = "GLM"
version = "0.1.0"
description = "Zhipu AI GLM connector using BigModel chat, streaming, embeddings, and JWT-capable auth"
archetypes = ["request-response", "streaming"]
format = "native"

[connector.state]
model = "stateless"
state_schema_version = "1"
migration_hint = "Stores no durable state. Configuration is limited to api_key, jwt_api_key or api_key_id/api_key_secret, credential_id, optional base_url, default models, timeout, and rate-limit retry policy."

[zones]
home = "z:work"
allowed_sources = ["z:owner", "z:private", "z:work", "z:project:*"]
allowed_targets = ["z:work"]
forbidden = ["z:public"]

[capabilities]
required = ["network.dns", "network.egress", "network.tls.sni"]
optional = ["glm.chat", "glm.embeddings", "glm.models.read", "glm.health.read"]
forbidden = ["system.exec", "network.listen"]

[sandbox]
profile = "strict"
memory_mb = 128
cpu_percent = 25
wall_clock_timeout_ms = 180000
deny_exec = true
deny_ptrace = true

[provides.operations."glm.chat.completions"]
description = "Create a bounded non-streaming GLM chat completion through POST /api/paas/v4/chat/completions."
capability = "glm.chat"
risk_level = "medium"
safety_tier = "safe"
requires_approval = "none"
idempotency = "none"
input_schema = { type = "object", required = ["messages"], properties = { model = { type = "string", default = "glm-5.1" }, messages = { type = "array", minItems = 1 }, max_tokens = { type = "integer", minimum = 1 }, max_completion_tokens = { type = "integer", minimum = 1 }, temperature = { type = "number", minimum = 0, maximum = 2 }, top_p = { type = "number", minimum = 0, maximum = 1 }, stop = {}, response_format = { type = "object" }, tools = { type = "array" }, tool_choice = {}, provider_extensions = { type = "object" } } }
output_schema = { type = "object" }
network_constraints = { host_allow = ["open.bigmodel.cn"], port_allow = [443], ip_allow = [], cidr_deny = [], require_sni = true, spki_pins = [], deny_localhost = true, deny_private_ranges = true, deny_tailnet_ranges = true, deny_ip_literals = true, require_host_canonicalization = true, dns_max_ips = 16, max_redirects = 3, connect_timeout_ms = 10000, total_timeout_ms = 180000, max_response_bytes = 10485760 }

[provides.operations."glm.chat.completions".ai_hints]
when_to_use = "Use for direct first-party Zhipu GLM chat completions without aggregator fallback."
common_mistakes = ["Do not log prompts, completions, API keys, JWTs, or JWT signatures.", "Use jwt_api_key or api_key_id/api_key_secret when an operator requires short-lived JWT auth."]
examples = ['{"model":"glm-5.1","messages":[{"role":"user","content":"Summarize FCP in 3 bullets."}]}']
related = ["glm.chat.completions_stream", "glm.models.list"]

[provides.operations."glm.chat.completions_stream"]
description = "Open a GLM SSE chat-completions stream and return redaction-safe chunk metadata plus assembled text."
capability = "glm.chat"
risk_level = "medium"
safety_tier = "safe"
requires_approval = "none"
idempotency = "none"
input_schema = { type = "object", required = ["messages"], properties = { model = { type = "string", default = "glm-5.1" }, messages = { type = "array", minItems = 1 }, max_tokens = { type = "integer", minimum = 1 }, max_completion_tokens = { type = "integer", minimum = 1 }, temperature = { type = "number", minimum = 0, maximum = 2 }, top_p = { type = "number", minimum = 0, maximum = 1 }, stop = {}, response_format = { type = "object" }, tools = { type = "array" }, tool_choice = {}, provider_extensions = { type = "object" } } }
output_schema = { type = "object" }
network_constraints = { host_allow = ["open.bigmodel.cn"], port_allow = [443], ip_allow = [], cidr_deny = [], require_sni = true, spki_pins = [], deny_localhost = true, deny_private_ranges = true, deny_tailnet_ranges = true, deny_ip_literals = true, require_host_canonicalization = true, dns_max_ips = 16, max_redirects = 3, connect_timeout_ms = 10000, total_timeout_ms = 180000, max_response_bytes = 10485760 }

[provides.operations."glm.chat.completions_stream".ai_hints]
when_to_use = "Use when the caller can consume incremental GLM stream chunks."
common_mistakes = ["Handle finish_reason and tool_call deltas from the returned chunks."]
examples = ['{"model":"glm-5.1","messages":[{"role":"user","content":"Stream a one sentence answer."}],"max_tokens":64}']
related = ["glm.chat.completions"]

[provides.operations."glm.embeddings.create"]
description = "Create GLM text embeddings through POST /api/paas/v4/embeddings."
capability = "glm.embeddings"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"
input_schema = { type = "object", required = ["input"], properties = { model = { type = "string", default = "embedding-3" }, input = {}, encoding_format = { type = "string" }, dimensions = { type = "integer", minimum = 1 }, provider_extensions = { type = "object" } } }
output_schema = { type = "object" }
network_constraints = { host_allow = ["open.bigmodel.cn"], port_allow = [443], ip_allow = [], cidr_deny = [], require_sni = true, spki_pins = [], deny_localhost = true, deny_private_ranges = true, deny_tailnet_ranges = true, deny_ip_literals = true, require_host_canonicalization = true, dns_max_ips = 16, max_redirects = 3, connect_timeout_ms = 10000, total_timeout_ms = 180000, max_response_bytes = 10485760 }

[provides.operations."glm.embeddings.create".ai_hints]
when_to_use = "Use for first-party GLM embedding vectors."
common_mistakes = ["Do not log source text used for embeddings."]
examples = ['{"model":"embedding-3","input":"hello"}']
related = ["glm.models.list"]

[provides.operations."glm.models.list"]
description = "List a conservative documented GLM model catalog. Current public docs do not advertise a /models endpoint."
capability = "glm.models.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"
input_schema = { type = "object", properties = { refresh = { type = "boolean", default = false } } }
output_schema = { type = "object" }
network_constraints = { host_allow = ["open.bigmodel.cn"], port_allow = [443], ip_allow = [], cidr_deny = [], require_sni = true, spki_pins = [], deny_localhost = true, deny_private_ranges = true, deny_tailnet_ranges = true, deny_ip_literals = true, require_host_canonicalization = true, dns_max_ips = 16, max_redirects = 3, connect_timeout_ms = 10000, total_timeout_ms = 30000, max_response_bytes = 10485760 }

[provides.operations."glm.models.list".ai_hints]
when_to_use = "Use to discover documented GLM model IDs before sending chat or embedding requests."
common_mistakes = ["Do not assume preview model availability is stable."]
examples = ["{}"]
related = ["glm.chat.completions", "glm.embeddings.create"]

[provides.operations."glm.health"]
description = "Return connector readiness metadata and documented GLM model catalog count."
capability = "glm.health.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"
input_schema = { type = "object", properties = {} }
output_schema = { type = "object" }
network_constraints = { host_allow = ["open.bigmodel.cn"], port_allow = [443], ip_allow = [], cidr_deny = [], require_sni = true, spki_pins = [], deny_localhost = true, deny_private_ranges = true, deny_tailnet_ranges = true, deny_ip_literals = true, require_host_canonicalization = true, dns_max_ips = 16, max_redirects = 3, connect_timeout_ms = 5000, total_timeout_ms = 5000, max_response_bytes = 10485760 }

[provides.operations."glm.health".ai_hints]
when_to_use = "Use for a bounded readiness check before dispatching user-visible GLM operations."
common_mistakes = ["Do not treat degraded credential_id mode as a failed connector; host egress injection may be required."]
examples = ["{}"]
related = ["glm.models.list"]
