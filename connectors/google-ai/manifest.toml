common_mistakes = [
    "Not handling partial chunks — each SSE chunk is a partial GenerateContentResponse.",
    "Sending very large multi-turn contents arrays without checking token count first — use count_tokens operation to verify input fits within model limits.",
    "Not handling streaming response chunks incrementally — each chunk contains partial candidates, not the complete generation.",
]
examples = ['{"model": "gemini-2.0-flash", "contents": [{"role": "user", "parts": [{"text": "Write a story"}]}]}']
related = ["google-ai.generate_content"]

