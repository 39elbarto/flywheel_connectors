[event_caps]
streaming = true
replay = false
min_buffer_events = 10

[sandbox]
profile = "strict"
memory_mb = 256
cpu_percent = 50
wall_clock_timeout_ms = 300000
fs_readonly_paths = [
    "/usr",
    "/lib",
]
fs_writable_paths = ["$CONNECTOR_STATE"]
deny_exec = true
deny_ptrace = true

[[rate_limits.pools]]
id = "google-ai.generate"
requests = 60
window_ms = 60000
burst = 10
scope = "instance"

[[rate_limits.pools]]
id = "google-ai.embed"
requests = 300
window_ms = 60000
burst = 30
scope = "instance"

[[rate_limits.pools]]
id = "google-ai.models"
requests = 60
window_ms = 60000
burst = 10
scope = "instance"

[rate_limits.operation_pools]
"google-ai.list_models" = ["google-ai.models"]
"google-ai.count_tokens" = ["google-ai.models"]
"google-ai.get_model" = ["google-ai.models"]
"google-ai.generate_content_stream" = ["google-ai.generate"]
"google-ai.embed_content" = ["google-ai.embed"]
"google-ai.get_usage" = ["google-ai.models"]
"google-ai.generate_content" = ["google-ai.generate"]
"google-ai.batch_embed_contents" = ["google-ai.embed"]
