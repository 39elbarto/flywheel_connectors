[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = []
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:1edd303f353f9673b0699cdbd302bd70cf9ecd838768ea9e7d7de5712e8dce37"

[connector]
id = "fcp.google-ai"
name = "Google AI Connector"
version = "0.1.0"
description = "FCP connector for Google AI (Gemini) generative models — text generation, streaming, tool use, embeddings, token counting, and tuned model control-plane operations"
archetypes = [
    "operational",
    "streaming",
]
format = "wasi"

[connector.state]
model = "stateless"
state_schema_version = "1"
migration_hint = "init"

[zones]
home = "z:work"
allowed_sources = [
    "z:owner",
    "z:private",
    "z:work",
]
allowed_targets = ["z:work"]
forbidden = [
    "z:public",
    "z:community",
]

[capabilities]
required = [
    "network.dns",
    "network.egress",
    "network.tls.sni",
]
optional = [
    "google-ai.embed",
    "google-ai.models",
    "google-ai.generate",
    "google-ai.live_voice",
    "google-ai.usage",
    "google-ai.tuning",
]
forbidden = [
    "system.exec",
    "network.listen",
    "storage.state",
    "media.upload",
]

[provides.operations."google-ai.batch_embed_contents"]
