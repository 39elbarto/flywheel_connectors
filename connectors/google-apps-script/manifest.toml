capability = "script.execute"
risk_level = "high"
safety_tier = "dangerous"
requires_approval = "policy"
idempotency = "none"
input_schema = { type = "object", required = ["script_id", "deployment_id", "function", "parameters", "confirm_execute"], properties = { script_id = { type = "string", minLength = 1, maxLength = 512 }, deployment_id = { type = "string", minLength = 1, maxLength = 512 }, function = { type = "string", minLength = 1, maxLength = 256 }, parameters = { type = "array", maxItems = 100 }, confirm_execute = { type = "boolean" }, expected_parameters_sha256 = { type = "string", pattern = "^[0-9a-f]{64}$" }, expected_oauth_scopes_sha256 = { type = "string", pattern = "^[0-9a-f]{64}$" } }, additionalProperties = false }
output_schema = { type = "object" }
network_constraints = { host_allow = ["script.googleapis.com"], port_allow = [443], deny_localhost = true, deny_private_ranges = true, deny_tailnet_ranges = true, require_sni = true, deny_ip_literals = true, require_host_canonicalization = true, dns_max_ips = 16, max_redirects = 0, connect_timeout_ms = 10000, total_timeout_ms = 30000, max_response_bytes = 60000 }

[sandbox]
profile = "strict"
memory_mb = 128
cpu_percent = 25
wall_clock_timeout_ms = 30000
fs_readonly_paths = ["/etc/ssl/certs", "/usr/share/zoneinfo", "/usr", "/lib"]
fs_writable_paths = ["$CONNECTOR_STATE"]
deny_exec = true
deny_ptrace = true

[[rate_limits.pools]]
id = "script.read"
requests = 120
window_ms = 60000
burst = 20
scope = "instance"

[[rate_limits.pools]]
id = "script.write"
requests = 30
window_ms = 60000
burst = 5
scope = "instance"

[rate_limits.operation_pools]
"script.projects.get" = ["script.read"]
"script.projects.get_content" = ["script.read"]
"script.projects.create" = ["script.write"]
"script.projects.update_content" = ["script.write"]
"script.projects.get_metrics" = ["script.read"]
"script.versions.create" = ["script.write"]
"script.versions.get" = ["script.read"]
"script.versions.list" = ["script.read"]
"script.deployments.get" = ["script.read"]
"script.deployments.list" = ["script.read"]
"script.deployments.create" = ["script.write"]
"script.deployments.update" = ["script.write"]
"script.processes.list" = ["script.read"]
"script.processes.list_for_project" = ["script.read"]
"script.scripts.run" = ["script.write"]
