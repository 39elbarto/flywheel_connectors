input_schema = { type = "object", required = ["script_id", "deployment_id", "deployment_config", "confirm_deployment_change"], properties = { script_id = { type = "string", minLength = 1, maxLength = 512 }, deployment_id = { type = "string", minLength = 1, maxLength = 512 }, deployment_config = { type = "object", required = ["script_id", "version_number", "manifest_file_name"], properties = { script_id = { type = "string", minLength = 1, maxLength = 512 }, version_number = { type = "integer", minimum = 1 }, manifest_file_name = { type = "string", minLength = 1, maxLength = 128 }, description = { type = "string", maxLength = 512 } }, additionalProperties = false }, confirm_deployment_change = { const = true } }, additionalProperties = false }
