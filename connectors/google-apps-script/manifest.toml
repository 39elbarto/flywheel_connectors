[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = []
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:bdb4b276a83d15f99b5e3146153ca37373d2673c5cf1195eb65b31c38ff101c5"

[connector]
id = "google-apps-script"
name = "Google Apps Script Connector"
version = "0.1.0"
description = "Bounded project, source, version, deployment, metrics, and process operations for Apps Script v1"
archetypes = ["operational", "knowledge"]
format = "wasi"
status = "incubating"

[connector.state]
model = "singleton_writer"
state_schema_version = "1"
migration_hint = "init"

[zones]
home = "z:private"
allowed_sources = ["z:owner", "z:private"]
allowed_targets = ["z:private"]
forbidden = ["z:public"]

[capabilities]
required = ["network.dns", "network.egress", "network.tls.sni", "storage.state"]
optional = ["script.read", "script.source.write", "script.deployment.write", "script.execute"]
forbidden = ["system.exec", "network.listen"]

[provides.operations."script.projects.get"]
description = "Get Apps Script project metadata"
capability = "script.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"
input_schema = { type = "object", required = ["script_id"], properties = { script_id = { type = "string", minLength = 1, maxLength = 512 } }, additionalProperties = false }
output_schema = { type = "object" }
network_constraints = { host_allow = ["script.googleapis.com"], port_allow = [443], deny_localhost = true, deny_private_ranges = true, deny_tailnet_ranges = true, require_sni = true, deny_ip_literals = true, require_host_canonicalization = true, dns_max_ips = 16, max_redirects = 0, connect_timeout_ms = 10000, total_timeout_ms = 30000, max_response_bytes = 60000 }

[provides.operations."script.projects.get_content"]
description = "Get a bounded source inventory or one source file"
capability = "script.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"
input_schema = { type = "object", required = ["script_id"], properties = { script_id = { type = "string", minLength = 1, maxLength = 512 }, version_number = { type = "integer", minimum = 1 }, file_name = { type = "string", minLength = 1, maxLength = 512 }, source_offset = { type = "integer", minimum = 0 }, source_limit = { type = "integer", minimum = 1, maximum = 48000 } }, additionalProperties = false }
output_schema = { type = "object" }
network_constraints = { host_allow = ["script.googleapis.com"], port_allow = [443], deny_localhost = true, deny_private_ranges = true, deny_tailnet_ranges = true, require_sni = true, deny_ip_literals = true, require_host_canonicalization = true, dns_max_ips = 16, max_redirects = 0, connect_timeout_ms = 10000, total_timeout_ms = 30000, max_response_bytes = 5242880 }

[provides.operations."script.projects.create"]
description = "Create an Apps Script project"
capability = "script.source.write"
risk_level = "medium"
safety_tier = "risky"
requires_approval = "policy"
idempotency = "none"
input_schema = { type = "object", required = ["title"], properties = { title = { type = "string", minLength = 1, maxLength = 256 }, parent_id = { type = "string", minLength = 1, maxLength = 512 } }, additionalProperties = false }
output_schema = { type = "object" }
network_constraints = { host_allow = ["script.googleapis.com"], port_allow = [443], deny_localhost = true, deny_private_ranges = true, deny_tailnet_ranges = true, require_sni = true, deny_ip_literals = true, require_host_canonicalization = true, dns_max_ips = 16, max_redirects = 0, connect_timeout_ms = 10000, total_timeout_ms = 30000, max_response_bytes = 1048576 }

[provides.operations."script.projects.update_content"]
description = "Replace complete Apps Script project source after inventory confirmation"
capability = "script.source.write"
risk_level = "high"
safety_tier = "dangerous"
requires_approval = "policy"
idempotency = "none"
input_schema = { type = "object", required = ["script_id", "files", "expected_current_inventory_sha256", "expected_removed_files", "confirm_replace_all_files"], properties = { script_id = { type = "string", minLength = 1, maxLength = 512 }, files = { type = "array", minItems = 1, maxItems = 200, items = { type = "object", required = ["name", "type", "source"], properties = { name = { type = "string", minLength = 1, maxLength = 128 }, type = { type = "string", enum = ["SERVER_JS", "HTML", "JSON"] }, source = { type = "string" } }, additionalProperties = false } }, expected_current_inventory_sha256 = { type = "string", pattern = "^[0-9a-f]{64}$" }, expected_removed_files = { type = "array", items = { type = "string", minLength = 1, maxLength = 128 }, uniqueItems = true }, confirm_replace_all_files = { const = true } }, additionalProperties = false }
output_schema = { type = "object" }
network_constraints = { host_allow = ["script.googleapis.com"], port_allow = [443], deny_localhost = true, deny_private_ranges = true, deny_tailnet_ranges = true, require_sni = true, deny_ip_literals = true, require_host_canonicalization = true, dns_max_ips = 16, max_redirects = 0, connect_timeout_ms = 10000, total_timeout_ms = 30000, max_response_bytes = 5242880 }

[provides.operations."script.projects.get_metrics"]
description = "Read Apps Script project metrics"
capability = "script.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"
input_schema = { type = "object", required = ["script_id", "granularity"], properties = { script_id = { type = "string", minLength = 1, maxLength = 512 }, granularity = { type = "string", enum = ["DAILY", "WEEKLY"] }, deployment_id = { type = "string", minLength = 1, maxLength = 512 } }, additionalProperties = false }
output_schema = { type = "object" }
network_constraints = { host_allow = ["script.googleapis.com"], port_allow = [443], deny_localhost = true, deny_private_ranges = true, deny_tailnet_ranges = true, require_sni = true, deny_ip_literals = true, require_host_canonicalization = true, dns_max_ips = 16, max_redirects = 0, connect_timeout_ms = 10000, total_timeout_ms = 30000, max_response_bytes = 1048576 }

