[provides.operations."chat.list_members".network_constraints]
host_allow = ["chat.googleapis.com"]
port_allow = [443]
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 0
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 5242880

[provides.operations."chat.list_members".ai_hints]
when_to_use = "List all members of a Google Chat space."
common_mistakes = []
examples = ['{"space_name": "spaces/AAAA"}']
related = ["chat.list_spaces"]

# -- Events -------------------------------------------------------------------

[event_caps]
streaming = false
replay = false
min_buffer_events = 50

# -- Sandbox ------------------------------------------------------------------

[sandbox]
profile = "strict"
memory_mb = 128
cpu_percent = 25
wall_clock_timeout_ms = 30000
fs_readonly_paths = ["/usr", "/lib"]
fs_writable_paths = ["$CONNECTOR_STATE"]
deny_exec = true
deny_ptrace = true

# -- Rate Limits --------------------------------------------------------------

[[rate_limits.pools]]
id = "chat.read"
requests = 300
window_ms = 60000
burst = 30
scope = "instance"

[[rate_limits.pools]]
id = "chat.write"
requests = 60
window_ms = 60000
burst = 10
scope = "instance"

[rate_limits.operation_pools]
"chat.list_spaces" = ["chat.read"]
"chat.get_space" = ["chat.read"]
"chat.send_message" = ["chat.write"]
"chat.list_messages" = ["chat.read"]
"chat.get_message" = ["chat.read"]
"chat.list_members" = ["chat.read"]
