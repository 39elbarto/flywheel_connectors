[provides.operations."gmeet.attendance.list".input_schema.properties.early_before_minutes]
type = "integer"
[provides.operations."gmeet.attendance.list".input_schema.properties.page_size]
type = "integer"
[provides.operations."gmeet.attendance.list".input_schema.properties.max_items]
type = "integer"

[provides.operations."gmeet.attendance.list".output_schema]
required = ["conference_records", "attendance", "participant_evidence"]
type = "object"
[provides.operations."gmeet.attendance.list".output_schema.properties.conference_records]
type = "array"
[provides.operations."gmeet.attendance.list".output_schema.properties.attendance]
type = "array"
[provides.operations."gmeet.attendance.list".output_schema.properties.participant_evidence]
type = "array"

[provides.operations."gmeet.attendance.list".network_constraints]
host_allow = ["meet.googleapis.com", "www.googleapis.com"]
port_allow = [443]
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
deny_ip_literals = true
