type = "object"
[provides.operations."gmeet.participant_sessions.list".input_schema.properties.participant]
type = "string"
[provides.operations."gmeet.participant_sessions.list".input_schema.properties.page_size]
type = "integer"
[provides.operations."gmeet.participant_sessions.list".input_schema.properties.max_items]
