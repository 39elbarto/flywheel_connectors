[provides.operations."gmeet.attendance.list"]
description = "Build attendance rows from Google Meet conference records, participants, and participant sessions"
capability = "meet.conference.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"

[provides.operations."gmeet.attendance.list".input_schema]
type = "object"
[provides.operations."gmeet.attendance.list".input_schema.properties.meeting]
type = "string"
description = "Google Meet URL, meeting code, or spaces/* resource; required unless conference_record is provided"
[provides.operations."gmeet.attendance.list".input_schema.properties.conference_record]
type = "string"
description = "conferenceRecords/* resource name or bare conference record id; skips meeting lookup when provided"
[provides.operations."gmeet.attendance.list".input_schema.properties.all_conference_records]
type = "boolean"
[provides.operations."gmeet.attendance.list".input_schema.properties.merge_duplicate_participants]
type = "boolean"
[provides.operations."gmeet.attendance.list".input_schema.properties.late_after_minutes]
