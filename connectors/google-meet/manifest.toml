max_redirects = 0
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 1048576

[provides.operations."gmeet.attendance.list".ai_hints]
when_to_use = "Produce auditable attendance rows for completed Google Meet conferences with raw participant evidence."
common_mistakes = ["Using this for live-meeting monitoring", "Dropping participant_evidence when reconciling attendance disputes", "Treating duplicate participant joins as distinct people when merge_duplicate_participants is true"]
examples = ['{"meeting":"https://meet.google.com/abc-defg-hij","merge_duplicate_participants":true}', '{"conference_record":"conferenceRecords/abc","late_after_minutes":5,"early_before_minutes":5}']
related = []

[event_caps]
streaming = false
replay = false
min_buffer_events = 0

[sandbox]
profile = "strict"
memory_mb = 128
cpu_percent = 25
wall_clock_timeout_ms = 120000
fs_readonly_paths = ["/usr", "/lib"]
fs_writable_paths = ["$CONNECTOR_STATE"]
deny_exec = true
deny_ptrace = true

[[rate_limits.pools]]
id = "meet.space.read"
requests = 300
window_ms = 60000
burst = 30
scope = "instance"

[[rate_limits.pools]]
id = "meet.conference.read"
requests = 300
window_ms = 60000
burst = 30
scope = "instance"

[rate_limits.operation_pools]
"gmeet.normalize_space_name" = ["meet.space.read"]
"gmeet.conference_record.get" = ["meet.conference.read"]
"gmeet.conference_records.list" = ["meet.conference.read"]
"gmeet.conference_record.latest" = ["meet.conference.read"]
"gmeet.participants.list" = ["meet.conference.read"]
"gmeet.participant_sessions.list" = ["meet.conference.read"]
"gmeet.attendance.list" = ["meet.conference.read"]
