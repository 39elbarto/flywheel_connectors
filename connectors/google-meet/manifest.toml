[provides.operations."gmeet.participant_sessions.list".output_schema]
required = ["participant_sessions", "count", "max_items"]
type = "object"
[provides.operations."gmeet.participant_sessions.list".output_schema.properties.participant_sessions]
type = "array"
[provides.operations."gmeet.participant_sessions.list".output_schema.properties.count]
type = "integer"
[provides.operations."gmeet.participant_sessions.list".output_schema.properties.max_items]
type = "integer"

[provides.operations."gmeet.participant_sessions.list".network_constraints]
host_allow = ["meet.googleapis.com", "www.googleapis.com"]
port_allow = [443]
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 0
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 1048576

[provides.operations."gmeet.participant_sessions.list".ai_hints]
