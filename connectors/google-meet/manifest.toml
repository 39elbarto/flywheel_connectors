[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = []
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:e715a1b037536a2b2372914de8e4d8a83b0a6060f793a8bca0fa7e9df54bc45d"

[connector]
id = "fcp.google-meet"
name = "Google Meet Connector"
version = "0.1.0"
description = "FCP connector for Google Meet spaces, conference records, participants, sessions, and attendance"
archetypes = ["operational", "knowledge"]
format = "wasi"

[connector.state]
model = "singleton_writer"
state_schema_version = "1"
migration_hint = "init"

[zones]
home = "z:work"
allowed_sources = ["z:owner", "z:private", "z:work"]
allowed_targets = ["z:work"]
forbidden = ["z:public"]

[capabilities]
required = ["network.dns", "network.egress", "network.tls.sni", "storage.state"]
optional = [
    "meet.space.read",
    "meet.space.create",
    "meet.space.end",
    "meet.conference.read",
    "meet.artifact.read",
    "meet.drive_artifact.read",
]
forbidden = ["system.exec", "network.listen", "browser.control", "meeting.live_join", "meeting.live_speak"]

[provides.operations."gmeet.normalize_space_name"]
description = "Normalize a Google Meet URL, meeting code, or spaces/* name into a Meet API spaces/* resource name"
capability = "meet.space.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"

[provides.operations."gmeet.normalize_space_name".input_schema]
required = ["input"]
type = "object"
[provides.operations."gmeet.normalize_space_name".input_schema.properties.input]
type = "string"
description = "Google Meet URL, meeting code, or spaces/* resource name"

[provides.operations."gmeet.normalize_space_name".output_schema]
required = ["space_name", "input_kind", "live_session"]
type = "object"
[provides.operations."gmeet.normalize_space_name".output_schema.properties.space_name]
type = "string"
[provides.operations."gmeet.normalize_space_name".output_schema.properties.meeting_code]
type = "string"
[provides.operations."gmeet.normalize_space_name".output_schema.properties.meeting_uri]
type = "string"
[provides.operations."gmeet.normalize_space_name".output_schema.properties.input_kind]
type = "string"
[provides.operations."gmeet.normalize_space_name".output_schema.properties.live_session]
type = "boolean"

[provides.operations."gmeet.normalize_space_name".network_constraints]
host_allow = ["meet.googleapis.com", "www.googleapis.com"]
port_allow = [443]
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 0
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 1048576

[provides.operations."gmeet.normalize_space_name".ai_hints]
when_to_use = "Validate and normalize a Google Meet identifier before calling Meet API operations."
common_mistakes = ["Passing a Calendar event link instead of a meet.google.com link", "Assuming this joins or controls a live meeting; it only normalizes the API space name"]
examples = ['{"input":"https://meet.google.com/abc-defg-hij"}', '{"input":"spaces/abc-defg-hij"}']
related = []

[provides.operations."gmeet.conference_record.get"]
description = "Fetch one Google Meet conference record by resource name or id"
capability = "meet.conference.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"

[provides.operations."gmeet.conference_record.get".input_schema]
required = ["conference_record"]
type = "object"
[provides.operations."gmeet.conference_record.get".input_schema.properties.conference_record]
type = "string"
description = "conferenceRecords/* resource name or bare conference record id"

[provides.operations."gmeet.conference_record.get".output_schema]
required = ["conference_record"]
type = "object"
[provides.operations."gmeet.conference_record.get".output_schema.properties.conference_record]
type = "object"

[provides.operations."gmeet.conference_record.get".network_constraints]
host_allow = ["meet.googleapis.com", "www.googleapis.com"]
port_allow = [443]
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 0
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 1048576

[provides.operations."gmeet.conference_record.get".ai_hints]
when_to_use = "Fetch raw Google Meet conference metadata before participant or attendance reads."
common_mistakes = ["Passing a spaces/* resource instead of conferenceRecords/*", "Assuming this returns transcripts, recordings, or live media controls"]
examples = ['{"conference_record":"conferenceRecords/abc"}']
related = []

[provides.operations."gmeet.conference_records.list"]
description = "List Google Meet conference records, optionally filtered by meeting space"
capability = "meet.conference.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"

[provides.operations."gmeet.conference_records.list".input_schema]
type = "object"
[provides.operations."gmeet.conference_records.list".input_schema.properties.meeting]
type = "string"
description = "Google Meet URL, meeting code, or spaces/* resource used to filter conference records"
[provides.operations."gmeet.conference_records.list".input_schema.properties.page_size]
type = "integer"
[provides.operations."gmeet.conference_records.list".input_schema.properties.max_items]
type = "integer"

[provides.operations."gmeet.conference_records.list".output_schema]
required = ["conference_records", "count", "max_items"]
type = "object"
[provides.operations."gmeet.conference_records.list".output_schema.properties.conference_records]
type = "array"
[provides.operations."gmeet.conference_records.list".output_schema.properties.count]
type = "integer"
[provides.operations."gmeet.conference_records.list".output_schema.properties.max_items]
type = "integer"

[provides.operations."gmeet.conference_records.list".network_constraints]
host_allow = ["meet.googleapis.com", "www.googleapis.com"]
port_allow = [443]
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 0
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 1048576

[provides.operations."gmeet.conference_records.list".ai_hints]
when_to_use = "Find conferenceRecords/* ids for a Meet space before participant, session, or attendance reads."
common_mistakes = ["Forgetting max_items on broad workspace scans", "Treating read-only conference records as live meeting control"]
examples = ['{"meeting":"https://meet.google.com/abc-defg-hij","max_items":10}']
related = []

[provides.operations."gmeet.conference_record.latest"]
description = "Fetch the latest Google Meet conference record for a meeting space"
capability = "meet.conference.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"

[provides.operations."gmeet.conference_record.latest".input_schema]
required = ["meeting"]
type = "object"
[provides.operations."gmeet.conference_record.latest".input_schema.properties.meeting]
type = "string"
description = "Google Meet URL, meeting code, or spaces/* resource"

[provides.operations."gmeet.conference_record.latest".output_schema]
required = ["input", "space_name", "conference_record"]
type = "object"
[provides.operations."gmeet.conference_record.latest".output_schema.properties.input]
type = "string"
[provides.operations."gmeet.conference_record.latest".output_schema.properties.space_name]
type = "string"
[provides.operations."gmeet.conference_record.latest".output_schema.properties.conference_record]
type = "object"

[provides.operations."gmeet.conference_record.latest".network_constraints]
host_allow = ["meet.googleapis.com", "www.googleapis.com"]
port_allow = [443]
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 0
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 1048576

[provides.operations."gmeet.conference_record.latest".ai_hints]
when_to_use = "Select the most recent conference record for a recurring Meet URL before attendance reads."
common_mistakes = ["Using this when all historical conference records are required", "Assuming absence of a conference record means the meeting space does not exist"]
examples = ['{"meeting":"spaces/abc-defg-hij"}']
related = []

[provides.operations."gmeet.participants.list"]
description = "List participants for a Google Meet conference record"
capability = "meet.conference.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"

[provides.operations."gmeet.participants.list".input_schema]
required = ["conference_record"]
type = "object"
[provides.operations."gmeet.participants.list".input_schema.properties.conference_record]
type = "string"
[provides.operations."gmeet.participants.list".input_schema.properties.page_size]
type = "integer"
[provides.operations."gmeet.participants.list".input_schema.properties.max_items]
type = "integer"

[provides.operations."gmeet.participants.list".output_schema]
required = ["participants", "count", "max_items"]
type = "object"
[provides.operations."gmeet.participants.list".output_schema.properties.participants]
type = "array"
[provides.operations."gmeet.participants.list".output_schema.properties.count]
type = "integer"
[provides.operations."gmeet.participants.list".output_schema.properties.max_items]
type = "integer"

[provides.operations."gmeet.participants.list".network_constraints]
host_allow = ["meet.googleapis.com", "www.googleapis.com"]
port_allow = [443]
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 0
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 1048576

[provides.operations."gmeet.participants.list".ai_hints]
when_to_use = "Read participant identities and participant resources from a completed Meet conference record."
common_mistakes = ["Passing a spaces/* resource instead of conferenceRecords/*", "Assuming participant rows are already merged across duplicate joins"]
examples = ['{"conference_record":"conferenceRecords/abc","max_items":100}']
related = []

[provides.operations."gmeet.participant_sessions.list"]
