[package]
name = "fcp-google-places"
description = "Google Places API (New) connector for the Flywheel Connector Protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "fcp_google_places"
path = "src/lib.rs"

[[bin]]
name = "fcp-google-places"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
fcp-core = { path = "../../crates/fcp-core" }
fcp-async-core = { path = "../../crates/fcp-async-core" }
fcp-sdk = { path = "../../crates/fcp-sdk" }

anyhow.workspace = true
async-trait.workspace = true
reqwest = { workspace = true, features = ["json"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
url.workspace = true
uuid.workspace = true
hex.workspace = true

[dev-dependencies]
ciborium.workspace = true
chrono.workspace = true
fcp-crypto = { path = "../../crates/fcp-crypto" }
wiremock.workspace = true
