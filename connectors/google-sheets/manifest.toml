[provides.operations."sheets.update_values"]
description = "Write cell values to a range"
capability = "sheets.values.write"
risk_level = "medium"
safety_tier = "risky"
requires_approval = "policy"
idempotency = "best_effort"

[provides.operations."sheets.update_values".input_schema]
required = ["spreadsheet_id", "range", "values"]
type = "object"
[provides.operations."sheets.update_values".input_schema.properties.spreadsheet_id]
type = "string"
[provides.operations."sheets.update_values".input_schema.properties.range]
type = "string"
[provides.operations."sheets.update_values".input_schema.properties.values]
type = "array"

[provides.operations."sheets.update_values".output_schema]
required = ["updated_cells"]
type = "object"
[provides.operations."sheets.update_values".output_schema.properties.updated_cells]
type = "integer"

[provides.operations."sheets.update_values".network_constraints]
host_allow = ["sheets.googleapis.com"]
port_allow = [443]
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 0
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 1048576

[provides.operations."sheets.update_values".ai_hints]
when_to_use = "Update cell values in a spreadsheet range."
common_mistakes = ["Values must be a 2D array (rows of cells)", "Overwrites existing data in the range without warning"]
examples = ['{"spreadsheet_id": "abc123", "range": "Sheet1!A1:B2", "values": [["a","b"],["c","d"]]}']
related = ["sheets.get_values", "sheets.append_values"]

# -----------------------------------------------------------------------

[provides.operations."sheets.append_values"]
description = "Append rows to a sheet"
capability = "sheets.values.write"
risk_level = "medium"
safety_tier = "risky"
requires_approval = "policy"
idempotency = "best_effort"

[provides.operations."sheets.append_values".input_schema]
required = ["spreadsheet_id", "range", "values", "idempotency_key"]
type = "object"
[provides.operations."sheets.append_values".input_schema.properties.spreadsheet_id]
type = "string"
[provides.operations."sheets.append_values".input_schema.properties.range]
type = "string"
[provides.operations."sheets.append_values".input_schema.properties.values]
type = "array"
[provides.operations."sheets.append_values".input_schema.properties.idempotency_key]
type = "string"
minLength = 8
maxLength = 128

[provides.operations."sheets.append_values".output_schema]
required = ["table_range"]
type = "object"
[provides.operations."sheets.append_values".output_schema.properties.table_range]
type = "string"

[provides.operations."sheets.append_values".network_constraints]
host_allow = ["sheets.googleapis.com"]
port_allow = [443]
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 0
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 1048576

[provides.operations."sheets.append_values".ai_hints]
when_to_use = "Append new rows to the end of a sheet."
common_mistakes = ["Each call appends -- do not call repeatedly for the same data", "Range determines where the table detection starts, not the exact insertion row"]
examples = ['{"spreadsheet_id": "abc123", "range": "Sheet1", "values": [["new","row"]]}']
related = ["sheets.update_values", "sheets.get_values"]

