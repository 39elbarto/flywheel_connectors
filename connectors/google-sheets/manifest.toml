# -- Events ------------------------------------------------------------

[event_caps]
streaming = false
replay = false
min_buffer_events = 100

# -- Sandbox -----------------------------------------------------------

[sandbox]
profile = "strict"
memory_mb = 128
cpu_percent = 25
wall_clock_timeout_ms = 30000
fs_readonly_paths = ["/usr", "/lib"]
fs_writable_paths = ["$CONNECTOR_STATE"]
deny_exec = true
deny_ptrace = true

# -- Rate Limits -------------------------------------------------------

[[rate_limits.pools]]
id = "sheets.read"
requests = 300
window_ms = 60000
burst = 30
scope = "instance"

[[rate_limits.pools]]
id = "sheets.values.write"
requests = 300
window_ms = 60000
burst = 30
scope = "instance"

[[rate_limits.pools]]
id = "sheets.structure.write"
requests = 120
window_ms = 60000
burst = 10
scope = "instance"

[rate_limits.operation_pools]
"sheets.get_spreadsheet" = ["sheets.read"]
"sheets.get_values" = ["sheets.read"]
"sheets.batch_get_values" = ["sheets.read"]
"sheets.update_values" = ["sheets.values.write"]
"sheets.batch_update_values" = ["sheets.values.write"]
"sheets.append_values" = ["sheets.values.write"]
"sheets.clear_values" = ["sheets.values.write"]
"sheets.create_spreadsheet" = ["sheets.structure.write"]
"sheets.copy_sheet" = ["sheets.structure.write"]
"sheets.batch_update_spreadsheet" = ["sheets.structure.write"]
