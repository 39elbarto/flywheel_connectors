[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = []
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:4992dd4f611efcb6a0349d3c73237237262df8456b77f1ae26df579ef98b5aca"

[connector]
id = "fcp.google_sheets"
name = "Google Sheets Connector"
version = "0.1.0"
description = "FCP connector for Google Sheets (spreadsheets, cell values, ranges)"
archetypes = ["operational", "knowledge"]
format = "wasi"
status = "proven"

[connector.state]
model = "singleton_writer"
state_schema_version = "1"
migration_hint = "init"

[zones]
home = "z:private"
allowed_sources = ["z:owner", "z:private"]
allowed_targets = ["z:private"]
forbidden = ["z:public", "z:work"]

[capabilities]
required = ["network.dns", "network.egress", "network.tls.sni", "storage.state"]
optional = [
    "sheets.read",
    "sheets.values.write",
    "sheets.structure.write",
]
forbidden = ["system.exec", "network.listen"]

# -- Operations --------------------------------------------------------

[provides.operations."sheets.get_spreadsheet"]
description = "Get spreadsheet metadata and sheets list"
capability = "sheets.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"

[provides.operations."sheets.get_spreadsheet".input_schema]
required = ["spreadsheet_id"]
type = "object"
[provides.operations."sheets.get_spreadsheet".input_schema.properties.spreadsheet_id]
type = "string"

[provides.operations."sheets.get_spreadsheet".output_schema]
required = ["spreadsheet"]
type = "object"
[provides.operations."sheets.get_spreadsheet".output_schema.properties.spreadsheet]
type = "object"

[provides.operations."sheets.get_spreadsheet".network_constraints]
host_allow = ["sheets.googleapis.com"]
port_allow = [443]
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 0
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 5242880

[provides.operations."sheets.get_spreadsheet".ai_hints]
when_to_use = "Get spreadsheet metadata including sheets list and properties."
common_mistakes = ["Using a sheet ID instead of a spreadsheet ID -- they are different identifiers"]
examples = ['{"spreadsheet_id": "1BxiMVs0XRA5nFMdKvBdBZjgmUUqptlbs74OgVE2upms"}']
related = ["sheets.get_values"]

# -----------------------------------------------------------------------

[provides.operations."sheets.get_values"]
description = "Read cell values from a range"
capability = "sheets.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"

[provides.operations."sheets.get_values".input_schema]
required = ["spreadsheet_id", "range"]
type = "object"
[provides.operations."sheets.get_values".input_schema.properties.spreadsheet_id]
type = "string"
[provides.operations."sheets.get_values".input_schema.properties.range]
type = "string"

[provides.operations."sheets.get_values".output_schema]
required = ["values"]
type = "object"
[provides.operations."sheets.get_values".output_schema.properties.values]
type = "array"

[provides.operations."sheets.get_values".network_constraints]
host_allow = ["sheets.googleapis.com"]
port_allow = [443]
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 0
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 10485760

[provides.operations."sheets.get_values".ai_hints]
when_to_use = "Read data from a spreadsheet range like 'Sheet1!A1:C10'."
common_mistakes = ["Range must use A1 notation (e.g. 'Sheet1!A1:B5')", "Not handling empty cells which may be omitted from the response"]
examples = ['{"spreadsheet_id": "abc123", "range": "Sheet1!A1:C10"}']
related = ["sheets.update_values", "sheets.get_spreadsheet"]

