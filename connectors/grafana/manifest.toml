[sandbox]
profile = "strict"
memory_mb = 256
cpu_percent = 50
wall_clock_timeout_ms = 300000
fs_readonly_paths = [
    "/usr",
    "/lib",
]
fs_writable_paths = ["$CONNECTOR_STATE"]
deny_exec = true
deny_ptrace = true

[[rate_limits.pools]]
id = "grafana.dashboards.read"
requests = 300
window_ms = 60000
burst = 30
scope = "instance"

[[rate_limits.pools]]
id = "grafana.dashboards.write"
requests = 50
window_ms = 60000
burst = 10
scope = "instance"

[[rate_limits.pools]]
id = "grafana.datasources.read"
requests = 200
window_ms = 60000
burst = 20
scope = "instance"

[[rate_limits.pools]]
id = "grafana.alerts.read"
requests = 200
window_ms = 60000
burst = 20
scope = "instance"

[[rate_limits.pools]]
id = "grafana.alerts.write"
requests = 50
window_ms = 60000
burst = 10
scope = "instance"

[[rate_limits.pools]]
id = "grafana.annotations.write"
requests = 100
window_ms = 60000
burst = 20
scope = "instance"

[rate_limits.operation_pools]
"grafana.dashboards.get" = ["grafana.dashboards.read"]
"grafana.alerts.list" = ["grafana.alerts.read"]
"grafana.alerts.create" = ["grafana.alerts.write"]
"grafana.datasources.list" = ["grafana.datasources.read"]
"grafana.datasources.query" = ["grafana.datasources.read"]
"grafana.annotations.create" = ["grafana.annotations.write"]
"grafana.dashboards.delete" = ["grafana.dashboards.write"]
"grafana.dashboards.create" = ["grafana.dashboards.write"]
"grafana.dashboards.list" = ["grafana.dashboards.read"]
