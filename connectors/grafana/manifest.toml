[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = []
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:8f26ba8e8072008e1766d18b464e1fd0c30c4ab96fa9fce0de1b347725e930fa"

[connector]
id = "fcp.grafana"
name = "Grafana Connector"
version = "0.1.0"
description = "FCP connector for Grafana observability platform (dashboards, panels, datasources, alerts, annotations)"
archetypes = [
    "knowledge",
    "operational",
]
format = "wasi"

[connector.state]
model = "singleton_writer"
state_schema_version = "1"
migration_hint = "Stores API key, org ID, and last-sync timestamps for dashboards and alerts."

[zones]
home = "z:work"
allowed_sources = [
    "z:owner",
    "z:private",
    "z:work",
]
allowed_targets = ["z:work"]
forbidden = [
    "z:public",
    "z:community",
]

[capabilities]
required = [
    "network.dns",
    "network.egress",
    "network.tls.sni",
    "storage.state",
]
optional = []
forbidden = [
    "system.exec",
    "network.listen",
    "media.upload",
    "media.download",
]

[provides.operations."grafana.alerts.create"]
description = "Create an alert rule"
capability = "grafana.alerts.write"
risk_level = "medium"
safety_tier = "risky"
requires_approval = "policy"
idempotency = "none"

[provides.operations."grafana.alerts.create".input_schema]
required = ["rule"]
type = "object"

[provides.operations."grafana.alerts.create".input_schema.properties.rule]
description = "Alert rule definition"
type = "object"

[provides.operations."grafana.alerts.create".output_schema]
required = ["uid"]
type = "object"

[provides.operations."grafana.alerts.create".output_schema.properties.uid]
type = "string"

[provides.operations."grafana.alerts.create".network_constraints]
host_allow = [
    "*.grafana.net",
    "*.grafana.com",
]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 3
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 1048576

[provides.operations."grafana.alerts.create".ai_hints]
when_to_use = "Create a new alert rule."
common_mistakes = ["Not specifying notification channels for the alert."]
examples = ['{"rule": {"title": "High Error Rate", "condition": "A", "data": []}}']
related = ["grafana.alerts.list"]

