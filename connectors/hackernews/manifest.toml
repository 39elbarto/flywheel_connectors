minimum = 0
type = "integer"

[provides.operations."hackernews.best_stories".output_schema]
type = "array"

[provides.operations."hackernews.best_stories".output_schema.items]
minimum = 0
type = "integer"

[provides.operations."hackernews.best_stories".network_constraints]
host_allow = ["hacker-news.firebaseio.com"]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 2
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 1048576

[provides.operations."hackernews.best_stories".ai_hints]
when_to_use = "Use when you need the highest-ranked stories over time."
common_mistakes = [
    "Returns only numeric IDs; use hackernews.item.get for full story details.",
    "This is not an Algolia relevance-search endpoint.",
]
examples = []
related = ["hackernews.top_stories"]

[provides.operations."hackernews.health"]
description = "Verifies the public Firebase Hacker News API is reachable. This does not validate search, writes, or any authenticated surface because those are not in scope."
capability = "hackernews.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"
revocation_freshness = "safe"

[provides.operations."hackernews.health".input_schema]
additionalProperties = false
type = "object"

[provides.operations."hackernews.health".output_schema]
additionalProperties = false
required = ["status"]
type = "object"

[provides.operations."hackernews.health".output_schema.properties.status]
enum = ["ok"]
type = "string"

[provides.operations."hackernews.health".network_constraints]
host_allow = ["hacker-news.firebaseio.com"]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 2
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 1048576

[provides.operations."hackernews.health".ai_hints]
when_to_use = "Use when you need a lightweight reachability and rate-limit probe for the public Hacker News Firebase API."
common_mistakes = ["Health only validates the public Firebase API surface; search, writes, and authenticated workflows remain out of scope."]
examples = []
related = ["hackernews.top_stories"]

