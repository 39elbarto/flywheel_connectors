[format]
type = "fcp-connector-manifest"
schema_version = "2.1"

[connector]
id = "fcp.hackernews"
name = "Hacker News"
version = "0.1.0"
description = "Public read-only Hacker News Firebase connector for item lookup, user lookup, feed snapshots, and health probing"
archetype = "read-only"
homepage = "https://github.com/HackerNews/API"

# Auth and scope model:
# - The first slice is a public Firebase API reader with no external auth flow.
# - All operations are gated only by the `hackernews.read` capability plus the
#   public-zone network policy.
# - `item_get` is the expansion primitive for stories, comments, jobs, polls,
#   and poll options.
# - Feed operations return numeric item IDs only; they do not auto-expand items.
# - Algolia search, HTML scraping, authenticated account actions, moderation,
#   recursive thread expansion, and streaming delivery are explicit non-goals.

[zones]
home = "z:public"
allowed_sources = ["z:public", "z:work"]
allowed_targets = ["z:public"]
tailscale_tag = "tag:fcp-public"

[capabilities]
required = ["network.dns", "network.outbound"]
optional = []
forbidden = ["system.exec", "system.privileged"]

[provides.operations.item_get]
summary = "Get an item by ID"
capability = "hackernews.read"
risk = "low"
safety_tier = "safe"
idempotency = "strict"

[provides.operations.item_get.network_constraints]
host_allow = ["hacker-news.firebaseio.com"]
port_allow = [443]
require_tls = true
require_sni = true
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
deny_ip_literals = true
max_redirects = 2

[provides.operations.user_get]
summary = "Get a user by username"
capability = "hackernews.read"
risk = "low"
safety_tier = "safe"
idempotency = "strict"

[provides.operations.user_get.network_constraints]
