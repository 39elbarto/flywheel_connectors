[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = []
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:d96e63cd4dfb17a9db8720e0facd4bc34592a108867bd9fb0b0587368a308407"

[connector]
id = "fcp.hackernews"
name = "Hacker News"
version = "0.1.0"
description = "Public read-only Hacker News Firebase connector for item lookup, user lookup, feed snapshots, and health probing"
archetypes = ["knowledge"]
format = "native"
status = "ready"

[connector.state]
model = "stateless"
state_schema_version = "1"
migration_hint = "The connector keeps no durable local state. Configuration is limited to an optional base_url override, retry policy, and request_timeout_ms for the public Firebase API surface."

[zones]
home = "z:public"
allowed_sources = [
    "z:public",
    "z:work",
]
allowed_targets = ["z:public"]
forbidden = []

[capabilities]
required = [
    "network.dns",
    "network.egress",
    "network.tls.sni",
]
optional = ["hackernews.read"]
forbidden = [
    "system.exec",
    "system.privileged",
    "network.listen",
]

[provides.operations."hackernews.ask_stories"]
description = "Returns an Ask HN feed snapshot as numeric item IDs only. There is no thread expansion or reply/write surface."
capability = "hackernews.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "none"
revocation_freshness = "safe"

[provides.operations."hackernews.ask_stories".input_schema]
additionalProperties = false
type = "object"

[provides.operations."hackernews.ask_stories".input_schema.properties.limit]
description = "Optional maximum number of item IDs to return"
minimum = 0
type = "integer"

[provides.operations."hackernews.ask_stories".output_schema]
type = "array"

[provides.operations."hackernews.ask_stories".output_schema.items]
minimum = 0
type = "integer"

[provides.operations."hackernews.ask_stories".network_constraints]
host_allow = ["hacker-news.firebaseio.com"]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 2
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 1048576

[provides.operations."hackernews.ask_stories".ai_hints]
when_to_use = "Use when you need Ask HN discussion threads."
common_mistakes = [
    "Returns only numeric IDs; use hackernews.item.get for full story details.",
    "The connector does not recursively expand Ask HN comment trees.",
]
examples = []
related = ["hackernews.show_stories"]

[provides.operations."hackernews.best_stories"]
description = "Returns a best-stories snapshot as numeric item IDs only. Upstream ranking semantics come from Hacker News; the connector does not re-rank or search."
capability = "hackernews.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "none"
revocation_freshness = "safe"

