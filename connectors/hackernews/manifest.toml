[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = []
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:48f691d44e3f40a8149c73fa3ed94d6c7307b3723618718535de11b06be38129"

[connector]
id = "fcp.hackernews"
name = "Hacker News"
version = "0.1.0"
description = "Public read-only Hacker News Firebase connector for item lookup, user lookup, feed snapshots, and health probing"
archetypes = ["knowledge"]
format = "native"

[connector.state]
model = "stateless"
state_schema_version = "1"
migration_hint = "The connector keeps no durable local state. Configuration is limited to an optional base_url override, retry policy, and request_timeout_ms for the public Firebase API surface."

# Auth and scope model:
# - The first slice is a public Firebase API reader with no external auth flow.
# - All operations are gated only by the `hackernews.read` capability plus the
#   public-zone network policy.
# - `hackernews.item.get` is the expansion primitive for stories, comments, jobs,
#   polls, and poll options.
# - Feed operations return numeric item IDs only; they do not auto-expand items.
# - Algolia search, HTML scraping, authenticated account actions, moderation,
#   recursive thread expansion, and streaming delivery are explicit non-goals.

[zones]
home = "z:public"
allowed_sources = ["z:public", "z:work"]
allowed_targets = ["z:public"]

[capabilities]
required = ["network.dns", "network.egress", "network.tls.sni"]
optional = []
forbidden = ["system.exec", "system.privileged", "network.listen"]

[sandbox]
profile = "strict"
memory_mb = 64
cpu_percent = 25
wall_clock_timeout_ms = 30000
deny_exec = true
deny_ptrace = true

[provides.operations."hackernews.item.get"]
description = "Retrieves one public Firebase item by numeric ID. Covers stories, comments, jobs, polls, and poll options, but does not recursively expand comment trees or enrich feed snapshots."
capability = "hackernews.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"
input_schema = { type = "object", required = ["id"], properties = { id = { type = "integer", description = "Item ID" } } }
output_schema = { type = "object" }
network_constraints = { host_allow = ["hacker-news.firebaseio.com"], port_allow = [443], ip_allow = [], cidr_deny = [], require_sni = true, spki_pins = [], deny_localhost = true, deny_private_ranges = true, deny_tailnet_ranges = true, deny_ip_literals = true, require_host_canonicalization = true, dns_max_ips = 16, max_redirects = 2, connect_timeout_ms = 10000, total_timeout_ms = 30000, max_response_bytes = 1048576 }

[provides.operations."hackernews.item.get".ai_hints]
when_to_use = "Use when you need a specific public Hacker News story, comment, job, or poll by numeric ID."
common_mistakes = ["Item IDs are numeric, not usernames.", "Deleted or dead items may return partial data.", "Search, batching, and recursive thread expansion are explicit non-goals for this first slice."]
examples = []
related = ["hackernews.user.get"]

[provides.operations."hackernews.user.get"]
description = "Retrieves one public Hacker News user profile by case-sensitive username. No login, private account state, or authenticated actor context is exposed."
capability = "hackernews.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"
input_schema = { type = "object", required = ["username"], properties = { username = { type = "string", description = "HN username (case-sensitive)" } } }
output_schema = { type = "object", properties = { id = { type = "string" }, created = { type = "integer" }, karma = { type = "integer" }, about = { type = "string" }, submitted = { type = "array", items = { type = "integer" } } } }
network_constraints = { host_allow = ["hacker-news.firebaseio.com"], port_allow = [443], ip_allow = [], cidr_deny = [], require_sni = true, spki_pins = [], deny_localhost = true, deny_private_ranges = true, deny_tailnet_ranges = true, deny_ip_literals = true, require_host_canonicalization = true, dns_max_ips = 16, max_redirects = 2, connect_timeout_ms = 10000, total_timeout_ms = 30000, max_response_bytes = 1048576 }

[provides.operations."hackernews.user.get".ai_hints]
when_to_use = "Use when you need a public Hacker News user profile by username."
common_mistakes = ["Usernames are case-sensitive.", "This connector does not expose authenticated user actions or private profile data."]
examples = []
related = ["hackernews.item.get"]

[provides.operations."hackernews.top_stories"]
description = "Returns a top-stories snapshot as numeric item IDs only. Use item.get to expand stories; there is no automatic hydration or search surface."
