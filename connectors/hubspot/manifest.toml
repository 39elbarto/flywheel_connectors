[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = []
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:26062a6a9f4757a0f0f72b96e17e13cf7449c9cae936211ba7f882d2fe9910e6"

[connector]
id = "fcp.hubspot"
name = "HubSpot Connector"
version = "0.1.0"
description = "FCP connector for HubSpot CRM and marketing platform (contacts, companies, deals, tickets, pipelines, analytics, webhooks)"
archetypes = [
    "knowledge",
    "operational",
    "streaming",
]
format = "wasi"

[connector.state]
model = "singleton_writer"
state_schema_version = "1"
migration_hint = "Stores webhook subscription IDs with idempotency keys, pagination cursors for incremental CRM sync, and last-seen event timestamps per object type."

[zones]
home = "z:work"
allowed_sources = [
    "z:owner",
    "z:private",
    "z:work",
]
allowed_targets = ["z:work"]
forbidden = [
    "z:public",
    "z:community",
]

[capabilities]
required = [
    "network.dns",
    "network.egress",
    "network.tls.sni",
    "storage.state",
]
optional = [
    "media.download",
    "hubspot.analytics.read",
    "hubspot.companies.read",
    "hubspot.companies.write",
    "hubspot.contacts.read",
    "hubspot.associations.read",
    "hubspot.contacts.write",
    "hubspot.contacts.delete",
    "hubspot.deals.write",
    "hubspot.deals.read",
    "hubspot.associations.write",
    "hubspot.events.read",
    "hubspot.pipelines.read",
]
forbidden = [
    "system.exec",
    "network.listen",
    "media.upload",
]

[provides.operations."hubspot.analytics.report"]
description = "Get pipeline analytics and reporting data"
capability = "hubspot.analytics.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"

[provides.operations."hubspot.analytics.report".input_schema]
