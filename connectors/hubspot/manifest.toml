type = "object"

[provides.operations."hubspot.analytics.report".input_schema.properties.date_range]
description = "Date range for the report"
type = "object"

[provides.operations."hubspot.analytics.report".input_schema.properties.pipeline_id]
description = "Restrict to a specific pipeline"
type = "string"

[provides.operations."hubspot.analytics.report".input_schema.properties.report_type]
description = "Report type: deal_forecast, conversion_funnel, activity_summary"
type = "string"

[provides.operations."hubspot.analytics.report".output_schema]
required = ["report"]
type = "object"

[provides.operations."hubspot.analytics.report".output_schema.properties.report]
type = "object"

[provides.operations."hubspot.analytics.report".network_constraints]
host_allow = [
    "api.hubapi.com",
    "api.hubspot.com",
]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 3
connect_timeout_ms = 10000
total_timeout_ms = 60000
