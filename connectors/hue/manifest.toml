[format]
type = "fcp-connector-manifest"
schema_version = "2.1"

[connector]
id = "fcp.hue"
name = "Philips Hue"
version = "0.1.0"
description = "Local Philips Hue bridge connector for light inventory, light-state control, scene inventory, and scene recall"
archetype = "operational"
homepage = "https://developers.meethue.com"

[zones]
home = "z:owner"
allowed_sources = ["z:owner", "z:private", "z:home", "z:infra"]
allowed_targets = ["z:owner", "z:home", "z:infra"]
tailscale_tag = "tag:fcp-home"

[capabilities]
required = ["network.dns", "network.outbound"]
optional = []
forbidden = ["system.exec", "system.privileged", "network.listen"]

# Hue bridges are local-network resources chosen at configuration time, so the
# exact host allowlist is intentionally deferred to runtime configuration.
# Production bridge access is expected to use HTTPS; plain HTTP is only used
# for loopback test harnesses.

[provides.operations.health]
summary = "Report Hue bridge health and configuration"
capability = "hue.read"
risk = "low"
safety_tier = "safe"
idempotency = "strict"
input_schema = { type = "object", additionalProperties = false }
output_schema = { type = "object", required = ["status", "bridge_url", "manifest_hash", "transport", "allow_insecure_ssl", "app_key_configured"], additionalProperties = false, properties = { status = { type = "string", enum = ["ok"] }, bridge_url = { type = "string", format = "uri" }, manifest_hash = { type = "string", pattern = "^sha256:[0-9a-f]{64}$" }, transport = { type = "string", enum = ["http-loopback", "https"] }, allow_insecure_ssl = { type = "boolean" }, app_key_configured = { type = "boolean" } } }

[provides.operations.health.ai_hints]
when_to_use = "When you need to confirm the Hue bridge connector is configured"

[provides.operations.list_lights]
summary = "List Hue light resources"
capability = "hue.read"
risk = "low"
safety_tier = "safe"
idempotency = "strict"
input_schema = { type = "object", additionalProperties = false }
output_schema = { type = "object", additionalProperties = true, properties = { data = { type = "array", items = { type = "object", additionalProperties = true } }, errors = { type = "array", items = { type = "object", additionalProperties = true } }, body = { type = "string" } } }

[provides.operations.list_lights.ai_hints]
when_to_use = "When you need the current bridge light inventory before issuing control operations"

[provides.operations.list_scenes]
summary = "List Hue scenes"
capability = "hue.read"
risk = "low"
safety_tier = "safe"
idempotency = "strict"
input_schema = { type = "object", additionalProperties = false }
output_schema = { type = "object", additionalProperties = true, properties = { data = { type = "array", items = { type = "object", additionalProperties = true } }, errors = { type = "array", items = { type = "object", additionalProperties = true } }, body = { type = "string" } } }

[provides.operations.list_scenes.ai_hints]
when_to_use = "When you want to inspect available scenes before recall"

[provides.operations.set_light_state]
summary = "Set a Hue light's on/off and optional brightness state"
capability = "hue.write"
risk = "medium"
safety_tier = "risky"
idempotency = "best_effort"
input_schema = { type = "object", required = ["light_id", "on"], additionalProperties = false, properties = { light_id = { type = "string", minLength = 1, pattern = "\\S" }, on = { type = "boolean" }, brightness = { type = "number", minimum = 0, maximum = 100 } } }
output_schema = { type = "object", additionalProperties = true, properties = { data = { type = "array", items = { type = "object", additionalProperties = true } }, errors = { type = "array", items = { type = "object", additionalProperties = true } }, body = { type = "string" } } }

[provides.operations.set_light_state.ai_hints]
when_to_use = "When you want to change a specific Hue light's power state or brightness"

[provides.operations.recall_scene]
summary = "Recall a Hue scene"
capability = "hue.write"
risk = "medium"
safety_tier = "risky"
idempotency = "best_effort"
input_schema = { type = "object", required = ["scene_id"], additionalProperties = false, properties = { scene_id = { type = "string", minLength = 1, pattern = "\\S" } } }
output_schema = { type = "object", additionalProperties = true, properties = { data = { type = "array", items = { type = "object", additionalProperties = true } }, errors = { type = "array", items = { type = "object", additionalProperties = true } }, body = { type = "string" } } }

[provides.operations.recall_scene.ai_hints]
when_to_use = "When you want the Hue bridge to activate a scene"

[sandbox]
profile = "strict"
memory_mb = 64
cpu_percent = 25
wall_clock_timeout_ms = 30000
deny_exec = true
deny_ptrace = true
