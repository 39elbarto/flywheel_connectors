[package]
name = "fcp-irc"
description = "IRC connector for the Flywheel Connector Protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "fcp_irc"
path = "src/lib.rs"

[[bin]]
name = "fcp-irc"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
fcp-core.workspace = true
fcp-prelude.workspace = true
fcp-async-core.workspace = true
fcp-sdk.workspace = true

anyhow.workspace = true
async-trait.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
url.workspace = true
hex.workspace = true

[dev-dependencies]
chrono.workspace = true
ciborium.workspace = true
fcp-crypto.workspace = true
fcp-testkit.workspace = true
toml.workspace = true
wiremock.workspace = true
