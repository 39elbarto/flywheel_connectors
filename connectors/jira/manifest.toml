"jira.list_transitions" = ["jira.read"]
"jira.transition_issue" = ["jira.write"]
"jira.list_sprints" = ["jira.read"]
"jira.move_to_sprint" = ["jira.write"]
"jira.add_comment" = ["jira.write"]
"jira.list_comments" = ["jira.read"]
"jira.worklog.list" = ["jira.read"]
"jira.worklog.add" = ["jira.write"]
"jira.worklog.update" = ["jira.write"]
"jira.worklog.delete" = ["jira.delete"]
"jira.add_attachment" = ["jira.attachment"]
"jira.automation.rule.list" = ["jira.read"]
"jira.automation.rule.get" = ["jira.read"]
"jira.automation.rule.create" = ["jira.write"]
"jira.automation.rule.update" = ["jira.write"]
"jira.automation.rule.enable" = ["jira.write"]
