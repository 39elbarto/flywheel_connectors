# ---------------------------------------------------------------------------
# Streaming / Event Capabilities
# ---------------------------------------------------------------------------

[event_caps]
streaming = true
replay = false
min_buffer_events = 50

# ---------------------------------------------------------------------------
# Sandbox
# ---------------------------------------------------------------------------

[sandbox]
profile = "strict"
memory_mb = 256
cpu_percent = 50
wall_clock_timeout_ms = 120000
fs_readonly_paths = [
    "/usr",
    "/lib",
]
fs_writable_paths = ["$CONNECTOR_STATE"]
deny_exec = true
deny_ptrace = true

# ---------------------------------------------------------------------------
# Rate Limit Pools
# ---------------------------------------------------------------------------

[[rate_limits.pools]]
id = "jira.read"
description = "Read operations against Jira REST API"
requests = 100
window_ms = 60000
burst = 20
scope = "instance"

[[rate_limits.pools]]
id = "jira.write"
description = "Write/mutation operations against Jira REST API"
requests = 60
window_ms = 60000
burst = 10
scope = "instance"

[[rate_limits.pools]]
id = "jira.delete"
description = "Destructive operations against Jira REST API"
requests = 20
window_ms = 60000
burst = 5
scope = "instance"

[[rate_limits.pools]]
id = "jira.attachment"
description = "Attachment upload operations"
requests = 30
window_ms = 60000
burst = 5
scope = "instance"

[rate_limits.operation_pools]
"jira.create_issue" = ["jira.write"]
"jira.get_issue" = ["jira.read"]
"jira.update_issue" = ["jira.write"]
"jira.delete_issue" = ["jira.delete"]
"jira.search_jql" = ["jira.read"]
"jira.list_transitions" = ["jira.read"]
"jira.transition_issue" = ["jira.write"]
"jira.list_sprints" = ["jira.read"]
"jira.move_to_sprint" = ["jira.write"]
"jira.add_comment" = ["jira.write"]
"jira.list_comments" = ["jira.read"]
"jira.add_attachment" = ["jira.attachment"]
