[provides.operations."jira.create_issue"]
description = "Create a new Jira issue with fields, project key, and issue type"
capability = "jira.write"
risk_level = "medium"
safety_tier = "risky"
requires_approval = "policy"
idempotency = "none"

[provides.operations."jira.create_issue".rate_limit]
max = 60
per_ms = 60000

[provides.operations."jira.create_issue".input_schema]
required = [
    "project_key",
    "issue_type",
    "summary",
]
type = "object"

[provides.operations."jira.create_issue".input_schema.properties.project_key]
description = "Jira project key (e.g., 'PROJ')"
pattern = "^[A-Z][A-Z0-9_]+$"
type = "string"

[provides.operations."jira.create_issue".input_schema.properties.issue_type]
description = "Issue type name (e.g., 'Story', 'Bug', 'Task', 'Epic')"
type = "string"

[provides.operations."jira.create_issue".input_schema.properties.summary]
description = "Issue summary/title"
minLength = 1
maxLength = 255
type = "string"

[provides.operations."jira.create_issue".input_schema.properties.description]
description = "Issue description in Atlassian Document Format (ADF) or plain text"
type = "string"

[provides.operations."jira.create_issue".input_schema.properties.priority]
description = "Priority name (e.g., 'Highest', 'High', 'Medium', 'Low', 'Lowest')"
type = "string"

[provides.operations."jira.create_issue".input_schema.properties.assignee]
description = "Assignee account ID"
type = "string"

[provides.operations."jira.create_issue".input_schema.properties.labels]
description = "Labels to apply"
type = "array"
[provides.operations."jira.create_issue".input_schema.properties.labels.items]
type = "string"

[provides.operations."jira.create_issue".input_schema.properties.components]
description = "Component names to assign"
type = "array"
[provides.operations."jira.create_issue".input_schema.properties.components.items]
type = "string"

[provides.operations."jira.create_issue".input_schema.properties.custom_fields]
description = "Map of custom field IDs to values (e.g., {\"customfield_10001\": \"value\"})"
type = "object"

[provides.operations."jira.create_issue".output_schema]
required = [
    "id",
    "key",
    "self",
]
type = "object"

[provides.operations."jira.create_issue".output_schema.properties.id]
description = "Issue internal ID"
type = "string"

[provides.operations."jira.create_issue".output_schema.properties.key]
description = "Issue key (e.g., 'PROJ-123')"
type = "string"

[provides.operations."jira.create_issue".output_schema.properties.self]
description = "API URL for the created issue"
type = "string"

[provides.operations."jira.create_issue".network_constraints]
host_allow = ["*.atlassian.net"]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 5
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 1048576

[provides.operations."jira.create_issue".ai_hints]
when_to_use = "Create a new issue in a Jira project. Requires project_key and issue_type at minimum."
common_mistakes = [
    "Using project name instead of project key.",
    "Not matching custom field IDs to the project's field configuration.",
    "Passing ADF JSON as a plain string instead of structured ADF.",
]
examples = ['{"project_key": "PROJ", "issue_type": "Story", "summary": "Implement login flow", "priority": "High"}']
related = [
    "jira.get_issue",
    "jira.update_issue",
    "jira.search_jql",
]

