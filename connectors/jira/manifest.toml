[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = []
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:96fe436b2257a10bf0c5c25d234f9da9b62bfd17cd38818302a4882802897837"

[connector]
id = "fcp.jira"
name = "Jira Connector"
version = "0.1.0"
description = "FCP connector for Atlassian Jira issue tracking (Cloud and Data Center)"
archetypes = [
    "operational",
    "streaming",
]
format = "wasi"

[connector.state]
model = "singleton_writer"
state_schema_version = "1"
migration_hint = "init"

[zones]
home = "z:work"
allowed_sources = [
    "z:owner",
    "z:private",
    "z:work",
]
allowed_targets = ["z:work"]
forbidden = ["z:public"]

[capabilities]
required = [
    "network.dns",
    "network.egress",
    "network.tls.sni",
    "storage.state",
]
optional = ["media.download"]
forbidden = [
    "system.exec",
    "network.listen",
]

