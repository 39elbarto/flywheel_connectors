# ────────────────────────────────────────────────────────────────

[provides.operations."linear.plan_sync"]
description = "Plan a deterministic Beads ↔ Linear sync action without side effects"
capability = "linear.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"

[provides.operations."linear.plan_sync".input_schema]
required = ["planned_at"]
type = "object"
[provides.operations."linear.plan_sync".input_schema.properties.bead]
type = "object"
[provides.operations."linear.plan_sync".input_schema.properties.linear]
type = "object"
[provides.operations."linear.plan_sync".input_schema.properties.policy]
type = "string"
enum = ["prefer_freshest", "prefer_bead", "prefer_linear", "manual"]
[provides.operations."linear.plan_sync".input_schema.properties.planned_at]
type = "string"

[provides.operations."linear.plan_sync".output_schema]
required = ["intent"]
type = "object"
[provides.operations."linear.plan_sync".output_schema.properties.intent]
type = "object"

[provides.operations."linear.plan_sync".network_constraints]
host_allow = ["api.linear.app"]
port_allow = [443]
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 0
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 65536

[provides.operations."linear.plan_sync".ai_hints]
when_to_use = "Preview the exact Beads ↔ Linear sync action before any write."
common_mistakes = ["planned_at is required so the audit artifact stays explicit", "Provide at least one of bead or linear; both missing is not a meaningful sync plan"]
examples = ['{"planned_at":"2026-03-15T00:00:00Z","policy":"prefer_freshest","bead":{"bead_id":"br-123","title":"New title","description":"Body","status":"open","priority":1,"updated_at":"2026-03-15T00:00:00Z"},"linear":{"issue_id":"lin-1","identifier":"LIN-123","title":"Old title","description":"Body","status":"open","priority":1,"updated_at":"2026-03-14T23:00:00Z"}}']
related = ["linear.get_issue", "linear.update_issue"]

# ────────────────────────────────────────────────────────────────

[provides.operations."linear.process_webhook"]
description = "Process a pre-verified Linear webhook payload forwarded by fcp-host"
capability = "linear.process_webhook"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"

[provides.operations."linear.process_webhook".input_schema]
required = ["payload", "delivery_id", "signature_validated"]
type = "object"
[provides.operations."linear.process_webhook".input_schema.properties.payload]
type = "object"
[provides.operations."linear.process_webhook".input_schema.properties.delivery_id]
type = "string"
[provides.operations."linear.process_webhook".input_schema.properties.signature_validated]
type = "boolean"

[provides.operations."linear.process_webhook".output_schema]
required = ["event"]
type = "object"
[provides.operations."linear.process_webhook".output_schema.properties.event]
type = "object"

[provides.operations."linear.process_webhook".ai_hints]
when_to_use = "Process a pre-verified Linear webhook payload forwarded by fcp-host."
common_mistakes = ["Forwarding parsed JSON before fcp-host verifies the Linear-Signature header.", "Dropping the Linear-Delivery header, which prevents stable downstream idempotency receipts."]
examples = ['{"delivery_id":"234d1a4e-b617-4388-90fe-adc3633d6b72","signature_validated":true,"payload":{"action":"create","type":"Issue","createdAt":"2026-03-07T00:00:00Z","webhookTimestamp":1762459200000,"data":{"id":"i1"}}}']
related = ["linear.get_issue", "linear.plan_sync"]

# ── Events ──────────────────────────────────────────────────────

[event_caps]
streaming = true
replay = false
min_buffer_events = 100

# ── Sandbox ─────────────────────────────────────────────────────

[sandbox]
profile = "strict"
memory_mb = 256
cpu_percent = 50
wall_clock_timeout_ms = 120000
fs_readonly_paths = ["/usr", "/lib"]
fs_writable_paths = ["$CONNECTOR_STATE"]
deny_exec = true
deny_ptrace = true

# ── Rate Limits ─────────────────────────────────────────────────

[[rate_limits.pools]]
id = "linear.read"
requests = 250
window_ms = 60000
burst = 50
scope = "instance"

[[rate_limits.pools]]
id = "linear.write"
requests = 150
window_ms = 60000
burst = 30
scope = "instance"

[rate_limits.operation_pools]
"linear.create_issue" = ["linear.write"]
"linear.get_issue" = ["linear.read"]
"linear.update_issue" = ["linear.write"]
"linear.search_issues" = ["linear.read"]
"linear.list_teams" = ["linear.read"]
"linear.list_cycles" = ["linear.read"]
"linear.add_comment" = ["linear.write"]
"linear.list_projects" = ["linear.read"]
"linear.plan_sync" = ["linear.read"]
"linear.process_webhook" = ["linear.read"]
