[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = []
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:3afcdebfb498b635c056407f598f5abf7795f301f35ecc1d57de7c310761901d"

[connector]
id = "fcp.linear"
name = "Linear Connector"
version = "0.1.0"
description = "FCP connector for Linear (issues, projects, cycles, teams, comments)"
archetypes = ["operational", "streaming"]
format = "wasi"

[connector.state]
model = "singleton_writer"
state_schema_version = "1"
migration_hint = "init"

[zones]
home = "z:work"
allowed_sources = ["z:owner", "z:private", "z:work"]
allowed_targets = ["z:work"]
forbidden = ["z:public"]

[capabilities]
required = ["network.dns", "network.egress", "network.tls.sni", "storage.state"]
optional = ["linear.read", "linear.write", "linear.process_webhook"]
forbidden = ["system.exec", "network.listen"]

# ── Operations ──────────────────────────────────────────────────

[provides.operations."linear.create_issue"]
description = "Create an issue in Linear"
capability = "linear.write"
risk_level = "medium"
safety_tier = "risky"
requires_approval = "policy"
idempotency = "none"

[provides.operations."linear.create_issue".input_schema]
required = ["title", "team_id"]
type = "object"
[provides.operations."linear.create_issue".input_schema.properties.title]
type = "string"
[provides.operations."linear.create_issue".input_schema.properties.team_id]
type = "string"
[provides.operations."linear.create_issue".input_schema.properties.description]
type = "string"

[provides.operations."linear.create_issue".output_schema]
required = ["issue"]
type = "object"
[provides.operations."linear.create_issue".output_schema.properties.issue]
type = "object"

[provides.operations."linear.create_issue".network_constraints]
host_allow = ["api.linear.app"]
port_allow = [443]
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 0
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 1048576

[provides.operations."linear.create_issue".ai_hints]
when_to_use = "Create a new issue in Linear."
common_mistakes = ["Not specifying the team ID"]
examples = ['{"title": "Fix login bug", "team_id": "TEAM-123"}']
related = ["linear.get_issue", "linear.search_issues"]

# ────────────────────────────────────────────────────────────────

[provides.operations."linear.get_issue"]
description = "Get a Linear issue by ID"
capability = "linear.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"

[provides.operations."linear.get_issue".input_schema]
required = ["issue_id"]
type = "object"
[provides.operations."linear.get_issue".input_schema.properties.issue_id]
type = "string"

[provides.operations."linear.get_issue".output_schema]
required = ["issue"]
type = "object"
[provides.operations."linear.get_issue".output_schema.properties.issue]
type = "object"

[provides.operations."linear.get_issue".network_constraints]
host_allow = ["api.linear.app"]
port_allow = [443]
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 0
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 1048576

[provides.operations."linear.get_issue".ai_hints]
when_to_use = "Look up a specific issue by ID."
common_mistakes = ["Use the issue's UUID, not the human-readable identifier like 'ENG-123' — pass the UUID returned from create_issue or search_issues", "Archived issues are still retrievable but their state may show as cancelled or completed"]
examples = ['{"issue_id": "LIN-123"}']
related = ["linear.create_issue", "linear.update_issue"]

