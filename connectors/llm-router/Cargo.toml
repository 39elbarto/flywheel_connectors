[package]
name = "fcp-llm-router"
description = "LLM Router meta-connector for intelligent multi-provider model selection"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "fcp_llm_router"
path = "src/lib.rs"

[[bin]]
name = "fcp-llm-router"
path = "src/main.rs"

[lints]
workspace = true

[features]
testing = []

[dependencies]
fcp-core = { path = "../../crates/fcp-core" }
fcp-prelude = { path = "../../crates/fcp-prelude" }
fcp-async-core = { path = "../../crates/fcp-async-core" }
fcp-sdk = { path = "../../crates/fcp-sdk" }

anyhow.workspace = true
async-trait.workspace = true
blake3.workspace = true
chrono.workspace = true
reqwest = { workspace = true, features = ["stream"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true

[dev-dependencies]
wiremock.workspace = true
ciborium.workspace = true
fcp-crypto = { path = "../../crates/fcp-crypto" }
fcp-manifest = { path = "../../crates/fcp-manifest" }
fcp-testkit = { path = "../../crates/fcp-testkit" }
