[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = []
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:4b8012552728ac10f036f777bffb125894957efb6a4d7f0bc1a251beefe106fd"

[connector]
id = "fcp.logseq"
name = "Logseq Connector"
version = "0.1.0"
description = "FCP connector for Logseq personal knowledge management (pages, blocks, graph)"
archetypes = ["knowledge"]
format = "wasi"

[connector.state]
model = "singleton_writer"
state_schema_version = "1"
migration_hint = "Stores local API server endpoint and auth token."

[zones]
home = "z:private"
allowed_sources = [
    "z:owner",
    "z:private",
]
allowed_targets = ["z:private"]
forbidden = [
    "z:public",
    "z:community",
    "z:work",
]

[capabilities]
required = [
    "network.dns",
    "storage.state",
]
optional = ["network.egress"]
forbidden = [
    "system.exec",
    "network.listen",
    "media.upload",
    "media.download",
]

[provides.operations."logseq.blocks.create"]
description = "Create a block on a page"
capability = "logseq.blocks.write"
risk_level = "medium"
safety_tier = "risky"
requires_approval = "policy"
idempotency = "none"

[provides.operations."logseq.blocks.create".input_schema]
required = [
    "page",
    "content",
]
type = "object"

[provides.operations."logseq.blocks.create".input_schema.properties.content]
type = "string"

[provides.operations."logseq.blocks.create".input_schema.properties.page]
type = "string"

[provides.operations."logseq.blocks.create".output_schema]
required = ["uuid"]
type = "object"

[provides.operations."logseq.blocks.create".output_schema.properties.uuid]
type = "string"

[provides.operations."logseq.blocks.create".network_constraints]
host_allow = ["localhost.localdomain"]
port_allow = [12315]
ip_allow = []
cidr_deny = []
deny_localhost = false
deny_private_ranges = false
deny_tailnet_ranges = true
require_sni = false
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 4
max_redirects = 0
connect_timeout_ms = 5000
total_timeout_ms = 15000
max_response_bytes = 1048576

[provides.operations."logseq.blocks.create".ai_hints]
when_to_use = "Create a new block on a page."
common_mistakes = ["Content must use Logseq Markdown syntax; raw HTML or Org-mode formatting will not render correctly unless the graph is in Org mode."]
examples = ['{"page": "Project Notes", "content": "TODO: Review architecture"}']
related = ["logseq.blocks.list"]

[provides.operations."logseq.blocks.list"]
description = "List blocks on a page"
capability = "logseq.blocks.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"

[provides.operations."logseq.blocks.list".input_schema]
required = ["page"]
type = "object"

[provides.operations."logseq.blocks.list".input_schema.properties.page]
description = "Page name or UUID"
type = "string"

[provides.operations."logseq.blocks.list".output_schema]
required = ["blocks"]
type = "object"

[provides.operations."logseq.blocks.list".output_schema.properties.blocks]
type = "array"

[provides.operations."logseq.blocks.list".network_constraints]
host_allow = ["localhost.localdomain"]
port_allow = [12315]
ip_allow = []
cidr_deny = []
deny_localhost = false
deny_private_ranges = false
deny_tailnet_ranges = true
require_sni = false
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 4
max_redirects = 0
connect_timeout_ms = 5000
total_timeout_ms = 15000
max_response_bytes = 10485760

[provides.operations."logseq.blocks.list".ai_hints]
when_to_use = "List blocks on a Logseq page."
common_mistakes = ["Page names are case-sensitive in Logseq; 'project notes' and 'Project Notes' refer to different pages."]
examples = ['{"page": "Project Notes"}']
related = [
    "logseq.pages.get",
    "logseq.blocks.create",
]

[provides.operations."logseq.pages.get"]
description = "Get a page by name"
capability = "logseq.pages.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"

[provides.operations."logseq.pages.get".input_schema]
required = ["name"]
type = "object"

[provides.operations."logseq.pages.get".input_schema.properties.name]
description = "Page name"
type = "string"

[provides.operations."logseq.pages.get".output_schema]
required = [
    "name",
    "uuid",
]
type = "object"

[provides.operations."logseq.pages.get".output_schema.properties.name]
type = "string"

[provides.operations."logseq.pages.get".output_schema.properties.uuid]
type = "string"

[provides.operations."logseq.pages.get".network_constraints]
host_allow = ["localhost.localdomain"]
port_allow = [12315]
ip_allow = []
cidr_deny = []
deny_localhost = false
deny_private_ranges = false
deny_tailnet_ranges = true
require_sni = false
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 4
max_redirects = 0
connect_timeout_ms = 5000
total_timeout_ms = 15000
max_response_bytes = 1048576

[provides.operations."logseq.pages.get".ai_hints]
when_to_use = "Get a specific page by name."
common_mistakes = ["Journal pages use date-formatted names (e.g. 'Mar 7th, 2026'); passing ISO dates like '2026-03-07' will not match."]
examples = ['{"name": "Project Notes"}']
related = [
    "logseq.pages.list",
    "logseq.blocks.list",
]

[provides.operations."logseq.pages.list"]
description = "List all pages in the graph"
capability = "logseq.pages.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"

[provides.operations."logseq.pages.list".input_schema]
required = []
type = "object"

[provides.operations."logseq.pages.list".output_schema]
required = ["pages"]
type = "object"

[provides.operations."logseq.pages.list".output_schema.properties.pages]
type = "array"

[provides.operations."logseq.pages.list".network_constraints]
host_allow = ["localhost.localdomain"]
port_allow = [12315]
ip_allow = []
cidr_deny = []
deny_localhost = false
deny_private_ranges = false
deny_tailnet_ranges = true
require_sni = false
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 4
max_redirects = 0
connect_timeout_ms = 5000
total_timeout_ms = 15000
max_response_bytes = 10485760

[provides.operations."logseq.pages.list".ai_hints]
when_to_use = "List all pages in the Logseq graph."
common_mistakes = ["Results include journal pages alongside regular pages; filter by the journal property if you only want non-journal pages."]
examples = ["{}"]
related = [
    "logseq.pages.get",
    "logseq.blocks.list",
]

[sandbox]
profile = "strict"
memory_mb = 256
cpu_percent = 50
wall_clock_timeout_ms = 300000
fs_readonly_paths = [
    "/usr",
    "/lib",
]
fs_writable_paths = ["$CONNECTOR_STATE"]
deny_exec = true
deny_ptrace = true

[[rate_limits.pools]]
id = "logseq.pages.read"
requests = 200
window_ms = 60000
burst = 20
scope = "instance"

[[rate_limits.pools]]
id = "logseq.blocks.read"
requests = 200
window_ms = 60000
burst = 20
scope = "instance"

[[rate_limits.pools]]
id = "logseq.blocks.write"
requests = 50
window_ms = 60000
burst = 10
scope = "instance"

[rate_limits.operation_pools]
"logseq.pages.list" = ["logseq.pages.read"]
"logseq.blocks.create" = ["logseq.blocks.write"]
"logseq.pages.get" = ["logseq.pages.read"]
"logseq.blocks.list" = ["logseq.blocks.read"]
