[format]
type = "fcp-connector-manifest"
schema_version = "2.1"

[connector]
id = "fcp.mastodon"
name = "Mastodon"
version = "0.1.0"
description = "Mastodon social network connector for timelines, statuses, accounts, notifications, and search"
archetype = "operational"
homepage = "https://docs.joinmastodon.org/api/"

[zones]
home = "z:social"
allowed_sources = ["z:social", "z:private"]
allowed_targets = ["z:social"]
tailscale_tag = "tag:fcp-social"

[capabilities]
required = ["network.dns", "network.outbound"]
optional = []
forbidden = ["system.exec", "system.privileged"]

[provides.operations.timeline_home]
summary = "Get home timeline"
capability = "mastodon.read"
risk = "low"
safety_tier = "safe"
idempotency = "none"

[provides.operations.timeline_home.network_constraints]
host_allow = ["${mastodon_instance_host}"]
port_allow = [80, 443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 0
connect_timeout_ms = 10000
total_timeout_ms = 60000
max_response_bytes = 1048576

[provides.operations.timeline_home.input_schema]
type = "object"
additionalProperties = false

[provides.operations.timeline_home.input_schema.properties.limit]
type = "integer"
minimum = 1
maximum = 40

[provides.operations.timeline_home.output_schema]
type = "array"

[provides.operations.timeline_home.output_schema.items]
type = "object"
required = ["id", "content", "account"]
additionalProperties = true

[provides.operations.timeline_home.output_schema.items.properties.id]
type = "string"

[provides.operations.timeline_home.output_schema.items.properties.content]
type = "string"

[provides.operations.timeline_home.output_schema.items.properties.account]
type = "object"
required = ["id", "username"]
additionalProperties = true

[provides.operations.timeline_home.output_schema.items.properties.account.properties.id]
type = "string"

[provides.operations.timeline_home.output_schema.items.properties.account.properties.username]
type = "string"

