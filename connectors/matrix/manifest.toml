[connector]
name = "fcp.matrix"
version = "0.1.0"
description = "Matrix federated messaging connector (Client-Server API)"
archetype = "bidirectional"

[zones]
home = "z:community"
allowed_sources = ["z:community", "z:work", "z:project:*"]
allowed_targets = ["z:community", "z:work", "z:project:*"]
tailscale_tag = "tag:fcp-community"

[capabilities]
required = ["network.dns", "network.outbound"]
optional = ["matrix.read", "matrix.write", "matrix.manage"]
forbidden = ["system.exec", "system.privileged"]

[sandbox]
profile = "strict"
memory_limit_mb = 64
cpu_limit_percent = 25
wall_clock_timeout_s = 30
deny_exec = true
deny_ptrace = true

# Matrix homeservers are operator-configured, so operation egress is declared
# against a config-derived homeserver host placeholder rather than a public
# wildcard. Runtime enforcement must resolve it from homeserver_url before
# invoking EgressGuard; see flywheel_connectors-4kw5f.9.6.
[[operations]]
id = "matrix.joined_rooms"

[[operations]]
id = "matrix.create_room"

[[operations]]
id = "matrix.join_room"

[[operations]]
id = "matrix.leave_room"

[[operations]]
id = "matrix.send_message"

[[operations]]
id = "matrix.get_messages"

[[operations]]
id = "matrix.sync"

[[operations]]
id = "matrix.get_room_state"

[[operations]]
id = "matrix.list_members"

[[operations]]
id = "matrix.upload_media"

[[operations]]
id = "matrix.download_media"

[provides.operations."matrix.joined_rooms"]
description = "Lists all rooms the authenticated Matrix user has joined"
capability = "matrix.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"
revocation_freshness = "safe"
network_constraints = { host_allow = ["${matrix_homeserver_host}"], port_allow = [443], ip_allow = [], cidr_deny = [], require_sni = true, spki_pins = [], deny_localhost = true, deny_private_ranges = true, deny_tailnet_ranges = true, deny_ip_literals = true, require_host_canonicalization = true, dns_max_ips = 16, max_redirects = 0, connect_timeout_ms = 10000, total_timeout_ms = 30000, max_response_bytes = 10485760 }

[provides.operations."matrix.joined_rooms".input_schema]
type = "object"
additionalProperties = true

[provides.operations."matrix.joined_rooms".output_schema]
type = "object"

[provides.operations."matrix.joined_rooms".output_schema.properties.rooms]
type = "array"

[provides.operations."matrix.joined_rooms".output_schema.properties.rooms.items]
type = "string"

[provides.operations."matrix.joined_rooms".ai_hints]
when_to_use = "When you need to discover which Matrix rooms the configured account has joined on the configured homeserver."
common_mistakes = ["Do not assume this lists invited or left rooms; use matrix.sync for membership deltas.", "The homeserver host is runtime-configured and must pass the connector transport policy."]
examples = ['{}']
related = ["matrix.join_room"]

