[connector]
name = "fcp.matrix"
version = "0.1.0"
description = "Matrix federated messaging connector (Client-Server API)"
archetype = "bidirectional"

[zones]
home = "z:community"
allowed_sources = ["z:community", "z:work", "z:project:*"]
allowed_targets = ["z:community", "z:work", "z:project:*"]
tailscale_tag = "tag:fcp-community"

[capabilities]
required = ["network.dns", "network.outbound"]
forbidden = ["system.exec", "system.privileged"]

[sandbox]
profile = "strict"
memory_limit_mb = 64
cpu_limit_percent = 25
wall_clock_timeout_s = 30
deny_exec = true
deny_ptrace = true

# Note: Matrix homeservers can be at any domain, so we cannot restrict
# host_allow to a single domain. The operator must configure the homeserver
# URL and the connector will only connect to that URL.
[[operations]]
id = "matrix.joined_rooms"

[[operations]]
id = "matrix.create_room"

[[operations]]
id = "matrix.join_room"

[[operations]]
id = "matrix.leave_room"

[[operations]]
id = "matrix.send_message"

[[operations]]
id = "matrix.get_messages"

[[operations]]
id = "matrix.sync"

[[operations]]
id = "matrix.get_room_state"

[[operations]]
id = "matrix.list_members"

[[operations]]
id = "matrix.upload_media"

[[operations]]
id = "matrix.download_media"

[events]
topics = [
  "matrix.message.authorized",
  "matrix.event.dropped",
  "matrix.reaction",
  "matrix.encrypted",
]
delivery_model = "manual_or_supervised_sync_persisted_events"
replay = false
requires_ack = false
buffer_capacity = 200

[provisioning]
note = "Requires a non-production Matrix homeserver account plus either a bearer access token or a credential_id that the host/egress proxy will inject at runtime. Use disposable rooms for verification, prefer HTTPS for live homeservers, configure inbound_policy before using sync projections as agent input, including direct_message_rooms and thread_participation_roots when unmentioned DM/thread replies should be delivered after sender allowlist checks. For richer workflow routing, dynamic_direct_message_detection can derive small DM rooms from membership state when bot_user_id is configured, strip_bot_mentions exposes a clean delivery body, approval_reaction_keys classify allowed approval reactions, and media_max_bytes drops oversized inbound media while logging redacted metadata. Subscribe to Matrix event topics when stream delivery is needed. Manual matrix.sync remains the fallback; supervised_sync.enabled is disabled by default and starts a bounded background worker only after a validated subscription. Persisted manual or supervised sync cycles fan out policy-projected events with connector-side duplicate suppression; persist=false is preview-only. Reconfigure resets in-memory sync state unless state_persistence.enabled=true with backend=host_managed_snapshot restores a host-persisted cursor, dynamic DM room set, and participated thread roots scoped to zone/account/device metadata; the connector still performs no local durable state writes. Encrypted events fail closed by default until verified E2EE/device verification is implemented. The connector now exposes a secretless matrix-sdk-crypto adapter boundary, optional matrix-sdk-crypto-backend compile gate, typed device-key query/import shapes, explicit outgoing crypto maintenance transport methods, redacted mark-sent/retry/backup-mismatch/stale-key/key-share decisions, recovery guidance, and redacted trust-state reporting for account identity, stable device ID, own-device trust, device keys, device-list freshness, cross-signing, tracked users/rooms, room-key backup, and recovery state. e2ee.verified_decryption_requested is still denied until these readiness gates plus the later decrypt delivery slice are mechanically verified."
