[connector]
name = "fcp.matrix"
version = "0.1.0"
description = "Matrix federated messaging connector (Client-Server API)"
archetype = "bidirectional"

[zones]
home = "z:community"
allowed_sources = ["z:community", "z:work", "z:project:*"]
allowed_targets = ["z:community", "z:work", "z:project:*"]
tailscale_tag = "tag:fcp-community"

[capabilities]
required = ["network.dns", "network.outbound"]
forbidden = ["system.exec", "system.privileged"]

[sandbox]
profile = "strict"
memory_limit_mb = 64
cpu_limit_percent = 25
wall_clock_timeout_s = 30
deny_exec = true
deny_ptrace = true

# Note: Matrix homeservers can be at any domain, so we cannot restrict
# host_allow to a single domain. The operator must configure the homeserver
# URL and the connector will only connect to that URL.
[[operations]]
id = "matrix.joined_rooms"

[[operations]]
id = "matrix.create_room"

[[operations]]
id = "matrix.join_room"

[[operations]]
id = "matrix.leave_room"

[[operations]]
id = "matrix.send_message"

[[operations]]
id = "matrix.get_messages"

[[operations]]
id = "matrix.sync"

[[operations]]
id = "matrix.get_room_state"

[[operations]]
id = "matrix.list_members"

[[operations]]
id = "matrix.upload_media"

[[operations]]
id = "matrix.download_media"

[provisioning]
note = "Requires a non-production Matrix homeserver account plus either a bearer access token or a credential_id that the host/egress proxy will inject at runtime. Use disposable rooms for verification, prefer HTTPS for live homeservers, configure inbound_policy before using sync projections as agent input, and invoke matrix.sync explicitly because the connector does not run a background receive loop. Encrypted events fail closed by default until verified E2EE/device verification is implemented."
