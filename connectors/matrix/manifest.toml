[events]
topics = [
  "matrix.message.authorized",
  "matrix.message.decrypted",
  "matrix.event.dropped",
  "matrix.reaction",
  "matrix.encrypted",
]
delivery_model = "manual_or_supervised_sync_persisted_events"
replay = false
requires_ack = false
buffer_capacity = 200

[provisioning]
note = "Requires a non-production Matrix homeserver account plus either a bearer access token or a credential_id that the host/egress proxy will inject at runtime. Use disposable rooms for verification, prefer HTTPS for live homeservers, configure inbound_policy before using sync projections as agent input, including direct_message_rooms and thread_participation_roots when unmentioned DM/thread replies should be delivered after sender allowlist checks. For richer workflow routing, dynamic_direct_message_detection can derive small DM rooms from membership state when bot_user_id is configured, strip_bot_mentions exposes a clean delivery body, approval_reaction_keys classify allowed approval reactions, and media_max_bytes drops oversized inbound media while logging redacted metadata. Subscribe to Matrix event topics when stream delivery is needed. Manual matrix.sync remains the fallback; supervised_sync.enabled is disabled by default and starts a bounded background worker only after a validated subscription. Persisted manual or supervised sync cycles fan out policy-projected events with connector-side duplicate suppression; persist=false is preview-only. Reconfigure resets in-memory sync state unless state_persistence.enabled=true with backend=host_managed_snapshot restores a host-persisted cursor, dynamic DM room set, and participated thread roots scoped to zone/account/device metadata; the connector still performs no local durable state writes. Encrypted events fail closed by default. The connector exposes a secretless matrix-sdk-crypto adapter boundary, optional matrix-sdk-crypto-backend compile gate, typed device-key query/import shapes, explicit outgoing crypto maintenance transport methods, redacted mark-sent/retry/backup-mismatch/stale-key/key-share decisions, recovery guidance, redacted trust-state reporting for account identity, stable device ID, own-device trust, device keys, device-list freshness, cross-signing, tracked users/rooms, room-key backup, and recovery state, plus trust-gated decrypted text and encrypted-media projection boundaries. matrix.message.decrypted is emitted only from a verified crypto result after account/device/sender-device/cross-signing/room-session/event/backup/recovery/redaction/replay checks pass. Verified encrypted media additionally requires valid encrypted-file metadata, MXC URI binding, content-hash match, MIME/size validation, and a handle-only resource policy; no media bytes are exposed before all checks pass. Raw homeserver JSON, ciphertext, encrypted media metadata, keys, IVs, hashes, and resource handles are never treated as plaintext or logged as secrets. Live sync paths continue to surface encrypted metadata and precise denial reasons until the audited Matrix crypto decrypt result is wired in."
