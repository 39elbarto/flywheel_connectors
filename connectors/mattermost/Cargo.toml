[package]
name = "fcp-mattermost"
description = "Mattermost self-hosted collaboration connector for the Flywheel Connector Protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "fcp_mattermost"
path = "src/lib.rs"

[[bin]]
name = "fcp-mattermost"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
fcp-core = { path = "../../crates/fcp-core" }
fcp-prelude = { path = "../../crates/fcp-prelude" }
fcp-async-core = { path = "../../crates/fcp-async-core" }
fcp-sdk = { path = "../../crates/fcp-sdk" }
fcp-streaming = { path = "../../crates/fcp-streaming" }

anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
chrono.workspace = true
percent-encoding.workspace = true
reqwest = { workspace = true, features = ["json", "multipart"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
hex.workspace = true

[dev-dependencies]
wiremock.workspace = true
fcp-crypto = { path = "../../crates/fcp-crypto" }
ciborium.workspace = true
sha1 = "0.10"
