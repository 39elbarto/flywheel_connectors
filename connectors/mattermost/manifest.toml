[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = []
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:5c56140fff96821173c29e1ffdbafded142cd3441ebf64459443814e61f6bbe2"

[connector]
id = "fcp.mattermost"
name = "Mattermost Connector"
version = "0.1.0"
description = "Self-hosted collaboration connector for Mattermost team/channel/post/file workflows with policy-gated WebSocket monitor events; first slice excludes System Console, SCIM/LDAP, plugin, and workspace-admin APIs"
archetypes = ["operational", "bidirectional"]
format = "native"

[connector.state]
model = "singleton_writer"
state_schema_version = "1"
migration_hint = "monitor policy defaults to bot-mention gating for public channel messages"

[zones]
home = "z:work"
allowed_sources = ["z:owner", "z:private", "z:work"]
allowed_targets = ["z:work"]
forbidden = ["z:public"]

[capabilities]
required = ["network.dns", "network.egress", "network.tls.sni"]
optional = []
forbidden = ["system.exec", "network.listen", "system.privileged"]

[sandbox]
profile = "strict"
memory_mb = 128
cpu_percent = 25
wall_clock_timeout_ms = 120000
deny_exec = true
deny_ptrace = true

