[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = []
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:b0549f2b22d46077c0d3743e657d7bc0429d3fbee3141e19011619c92da3ae1a"

[connector]
id = "fcp.mcp-bridge"
name = "MCP Bridge Connector"
version = "0.1.0"
description = "FCP connector bridging to Model Context Protocol servers (tools, resources, prompts)"
archetypes = [
    "knowledge",
    "operational",
]
format = "wasi"
status = "ready"

[connector.state]
model = "singleton_writer"
state_schema_version = "1"
migration_hint = "Stores MCP server endpoint and transport config."

[zones]
home = "z:work"
allowed_sources = [
    "z:owner",
    "z:private",
    "z:work",
]
allowed_targets = ["z:work"]
forbidden = [
    "z:public",
    "z:community",
]

[capabilities]
required = [
    "network.dns",
    "network.egress",
    "storage.state",
]
optional = [
    "network.tls.sni",
    "mcp.prompts.read",
    "mcp.resources.read",
    "mcp.tools.write",
    "mcp.tools.read",
    "mcp.sampling.handle",
    "mcp.server.metrics",
]
forbidden = [
    "system.exec",
    "media.upload",
    "media.download",
]

[provides.operations."mcp.prompts.list"]
description = "List available MCP prompts"
capability = "mcp.prompts.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"
revocation_freshness = "safe"

[provides.operations."mcp.prompts.list".input_schema]
required = []
type = "object"

[provides.operations."mcp.prompts.list".output_schema]
required = ["prompts"]
type = "object"

[provides.operations."mcp.prompts.list".output_schema.properties.prompts]
type = "array"

[provides.operations."mcp.prompts.list".network_constraints]
host_allow = ["operator-configured"]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 4
max_redirects = 0
connect_timeout_ms = 5000
total_timeout_ms = 15000
max_response_bytes = 10485760

[provides.operations."mcp.prompts.list".ai_hints]
when_to_use = "List prompts exposed by an MCP server."
common_mistakes = ["Assuming prompt names are stable across server restarts — always re-list prompts before referencing them by name"]
examples = ["{}"]
related = [
    "mcp.tools.list",
    "mcp.resources.list",
]

[provides.operations."mcp.resources.list"]
description = "List available MCP resources"
capability = "mcp.resources.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"
revocation_freshness = "safe"

[provides.operations."mcp.resources.list".input_schema]
required = []
type = "object"

[provides.operations."mcp.resources.list".output_schema]
required = ["resources"]
type = "object"

[provides.operations."mcp.resources.list".output_schema.properties.resources]
type = "array"

[provides.operations."mcp.resources.list".network_constraints]
host_allow = ["operator-configured"]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 4
max_redirects = 0
connect_timeout_ms = 5000
total_timeout_ms = 15000
max_response_bytes = 10485760

[provides.operations."mcp.resources.list".ai_hints]
when_to_use = "List resources exposed by an MCP server."
common_mistakes = ["Not accounting for paginated results — some MCP servers return partial resource lists and require a cursor for subsequent pages"]
examples = ["{}"]
related = [
    "mcp.resources.read",
    "mcp.tools.list",
]

[provides.operations."mcp.resources.read"]
description = "Read an MCP resource"
capability = "mcp.resources.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"
revocation_freshness = "safe"

[provides.operations."mcp.resources.read".input_schema]
required = ["uri"]
type = "object"

[provides.operations."mcp.resources.read".input_schema.properties.uri]
description = "Resource URI"
type = "string"

[provides.operations."mcp.resources.read".output_schema]
required = ["contents"]
type = "object"

[provides.operations."mcp.resources.read".output_schema.properties.contents]
type = "array"

[provides.operations."mcp.resources.read".network_constraints]
host_allow = ["operator-configured"]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 4
max_redirects = 0
connect_timeout_ms = 5000
total_timeout_ms = 30000
max_response_bytes = 52428800

[provides.operations."mcp.resources.read".ai_hints]
when_to_use = "Read content from an MCP resource by URI."
common_mistakes = ["Assuming all resources return text content — some resources return binary data or structured JSON depending on the MCP server implementation"]
examples = ['{"uri": "file:///tmp/data.txt"}']
related = ["mcp.resources.list"]

[provides.operations."mcp.sampling.handle"]
description = "Handle an approval-gated local sampling/createMessage fallback; no provider dispatch occurs in this packet"
capability = "mcp.sampling.handle"
risk_level = "high"
safety_tier = "risky"
requires_approval = "policy"
idempotency = "none"
revocation_freshness = "safe"

[provides.operations."mcp.sampling.handle".input_schema]
required = []
type = "object"

[provides.operations."mcp.sampling.handle".input_schema.properties.params]
description = "MCP sampling/createMessage params when no request envelope is supplied"
type = "object"

[provides.operations."mcp.sampling.handle".input_schema.properties.request]
description = "Full MCP sampling/createMessage JSON-RPC request"
type = "object"

[provides.operations."mcp.sampling.handle".output_schema]
required = [
    "event",
    "dispatch",
    "request",
]
type = "object"

[provides.operations."mcp.sampling.handle".output_schema.properties.dispatch]
type = "string"

[provides.operations."mcp.sampling.handle".output_schema.properties.event]
type = "string"

[provides.operations."mcp.sampling.handle".output_schema.properties.request]
type = "object"

[provides.operations."mcp.sampling.handle".network_constraints]
host_allow = ["operator-configured"]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 4
max_redirects = 0
connect_timeout_ms = 5000
total_timeout_ms = 30000
max_response_bytes = 1048576

[provides.operations."mcp.sampling.handle".ai_hints]
when_to_use = "Use only after exact capability and execution-approval gates when sampling.enabled is explicitly configured; this packet returns redacted local metadata and does not dispatch to a provider."
common_mistakes = [
    "Do not treat this as direct connector-to-connector or provider dispatch; it returns a redacted local event fallback.",
    "Never log prompt, response, or metadata content from sampling requests.",
]
examples = ['{"request": {"method": "sampling/createMessage", "params": {"messages": [], "maxTokens": 128}}}']
related = ["mcp.server.metrics"]

[provides.operations."mcp.server.metrics"]
description = "Expose MCP bridge security, sampling, auth-retry, and session counters"
capability = "mcp.server.metrics"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"
revocation_freshness = "safe"

[provides.operations."mcp.server.metrics".input_schema]
required = []
type = "object"

[provides.operations."mcp.server.metrics".output_schema]
required = [
    "requests",
    "errors",
    "injection_scans",
    "injection_findings",
    "sampling_requests",
    "auth_retries",
    "session_expired_retries",
]
type = "object"

[provides.operations."mcp.server.metrics".output_schema.properties.auth_retries]
type = "integer"

[provides.operations."mcp.server.metrics".output_schema.properties.errors]
type = "integer"

[provides.operations."mcp.server.metrics".output_schema.properties.injection_findings]
type = "integer"

[provides.operations."mcp.server.metrics".output_schema.properties.injection_scans]
type = "integer"

[provides.operations."mcp.server.metrics".output_schema.properties.requests]
type = "integer"

[provides.operations."mcp.server.metrics".output_schema.properties.sampling_requests]
type = "integer"

[provides.operations."mcp.server.metrics".output_schema.properties.session_expired_retries]
type = "integer"

[provides.operations."mcp.server.metrics".network_constraints]
host_allow = ["operator-configured"]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 4
max_redirects = 0
connect_timeout_ms = 5000
total_timeout_ms = 15000
max_response_bytes = 1048576

[provides.operations."mcp.server.metrics".ai_hints]
when_to_use = "Use to inspect prompt-injection scan, sampling, auth retry, and session-expiry counters."
common_mistakes = []
examples = ["{}"]
related = [
    "mcp.tools.list",
    "mcp.sampling.handle",
]

[provides.operations."mcp.tools.call"]
description = "Call an MCP tool after fresh capability discovery, exact snapshot approval, capability-token, and execution-approval gates"
capability = "mcp.tools.write"
risk_level = "high"
safety_tier = "risky"
requires_approval = "policy"
idempotency = "none"
revocation_freshness = "safe"

[provides.operations."mcp.tools.call".input_schema]
required = [
    "name",
    "arguments",
]
type = "object"

[provides.operations."mcp.tools.call".input_schema.properties.arguments]
description = "Tool arguments"
type = "object"

[provides.operations."mcp.tools.call".input_schema.properties.name]
description = "Tool name"
type = "string"

[provides.operations."mcp.tools.call".output_schema]
required = ["content"]
type = "object"

[provides.operations."mcp.tools.call".output_schema.properties.content]
type = "array"

[provides.operations."mcp.tools.call".network_constraints]
host_allow = ["operator-configured"]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 4
max_redirects = 0
connect_timeout_ms = 5000
total_timeout_ms = 15000
max_response_bytes = 10485760

[provides.operations."mcp.tools.call".ai_hints]
when_to_use = "Use only when fresh capability discovery and exact capability/execution approvals permit the requested MCP tool call."
common_mistakes = [
    "Passing arguments as a string instead of an object.",
    "Assuming discovery approval is durable; every call performs a fresh tools/list and never retries or replays the side-effecting call.",
]
examples = ['{"name": "read_file", "arguments": {"path": "/tmp/data.txt"}}']
related = ["mcp.tools.list"]

[provides.operations."mcp.tools.list"]
description = "List available MCP tools"
capability = "mcp.tools.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"
revocation_freshness = "safe"

[provides.operations."mcp.tools.list".input_schema]
required = []
type = "object"

[provides.operations."mcp.tools.list".output_schema]
required = ["tools"]
type = "object"

[provides.operations."mcp.tools.list".output_schema.properties.tools]
type = "array"

[provides.operations."mcp.tools.list".output_schema.properties.capability_snapshot]
