[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = []
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:a10cca8613953301d27c908ca2a697cf16741393d0d792a286a9ffd4f14585cc"

[connector]
id = "fcp.metabase"
name = "Metabase Connector"
version = "0.1.0"
description = "FCP connector for Metabase BI (questions, dashboards, databases)"
archetypes = ["knowledge"]
format = "wasi"

[connector.state]
model = "singleton_writer"
state_schema_version = "1"
migration_hint = "Stores session token and instance URL."

[zones]
home = "z:work"
allowed_sources = [
    "z:owner",
    "z:private",
    "z:work",
]
allowed_targets = ["z:work"]
forbidden = [
    "z:public",
    "z:community",
]

[capabilities]
required = [
    "network.dns",
    "network.egress",
    "storage.state",
]
optional = ["network.tls.sni"]
forbidden = [
    "system.exec",
    "network.listen",
    "media.upload",
    "media.download",
]

[provides.operations."metabase.dashboards.list"]
description = "List dashboards"
capability = "metabase.dashboards.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"

[provides.operations."metabase.dashboards.list".input_schema]
required = []
type = "object"

[provides.operations."metabase.dashboards.list".output_schema]
required = ["dashboards"]
type = "object"

[provides.operations."metabase.dashboards.list".output_schema.properties.dashboards]
type = "array"

[provides.operations."metabase.dashboards.list".network_constraints]
host_allow = [
    "*.metabase.com",
    "localhost.localdomain",
]
port_allow = [
    443,
    3000,
]
ip_allow = []
cidr_deny = []
deny_localhost = false
deny_private_ranges = false
deny_tailnet_ranges = true
require_sni = false
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 3
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 10485760

[provides.operations."metabase.dashboards.list".ai_hints]
when_to_use = "List all dashboards in Metabase."
common_mistakes = []
examples = ["{}"]
related = ["metabase.questions.list"]

[provides.operations."metabase.questions.list"]
description = "List saved questions (cards)"
capability = "metabase.questions.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"

[provides.operations."metabase.questions.list".input_schema]
required = []
type = "object"

[provides.operations."metabase.questions.list".output_schema]
required = ["questions"]
type = "object"

[provides.operations."metabase.questions.list".output_schema.properties.questions]
type = "array"

[provides.operations."metabase.questions.list".network_constraints]
host_allow = [
    "*.metabase.com",
    "localhost.localdomain",
]
port_allow = [
    443,
    3000,
]
ip_allow = []
cidr_deny = []
deny_localhost = false
deny_private_ranges = false
deny_tailnet_ranges = true
require_sni = false
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 3
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 10485760

[provides.operations."metabase.questions.list".ai_hints]
when_to_use = "List saved questions (cards) in Metabase."
common_mistakes = []
examples = ["{}"]
related = [
    "metabase.questions.run",
    "metabase.dashboards.list",
]

[provides.operations."metabase.questions.run"]
description = "Run a saved question and get results"
capability = "metabase.questions.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"

[provides.operations."metabase.questions.run".input_schema]
required = ["card_id"]
type = "object"

[provides.operations."metabase.questions.run".input_schema.properties.card_id]
description = "Card (question) ID to run"
type = "string"

[provides.operations."metabase.questions.run".output_schema]
required = ["data"]
type = "object"

[provides.operations."metabase.questions.run".output_schema.properties.data]
type = "object"

[provides.operations."metabase.questions.run".network_constraints]
host_allow = [
    "*.metabase.com",
    "localhost.localdomain",
]
port_allow = [
    443,
    3000,
]
ip_allow = []
cidr_deny = []
deny_localhost = false
deny_private_ranges = false
deny_tailnet_ranges = true
require_sni = false
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 3
connect_timeout_ms = 10000
total_timeout_ms = 120000
max_response_bytes = 52428800

[provides.operations."metabase.questions.run".ai_hints]
when_to_use = "Run a saved Metabase question and get results."
common_mistakes = []
examples = ['{"card_id": "42"}']
related = [
    "metabase.questions.list",
    "metabase.dashboards.list",
]

[sandbox]
profile = "strict"
memory_mb = 512
cpu_percent = 50
wall_clock_timeout_ms = 300000
fs_readonly_paths = [
    "/usr",
    "/lib",
]
fs_writable_paths = ["$CONNECTOR_STATE"]
deny_exec = true
deny_ptrace = true

[[rate_limits.pools]]
id = "metabase.questions.read"
requests = 200
window_ms = 60000
burst = 20
scope = "instance"

[[rate_limits.pools]]
id = "metabase.dashboards.read"
requests = 100
window_ms = 60000
burst = 10
scope = "instance"

[rate_limits.operation_pools]
"metabase.questions.run" = ["metabase.questions.read"]
"metabase.dashboards.list" = ["metabase.dashboards.read"]
"metabase.questions.list" = ["metabase.questions.read"]
