[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = []
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:4972246c3015ec04a6e020b0f0e7c8426c3159bb4523c8121dbabdec10257332"

[connector]
id = "fcp.microsoft365"
name = "Microsoft 365 Connector"
version = "0.1.0"
description = "FCP connector for Microsoft 365 via Microsoft Graph API (Outlook mail, OneDrive files, Calendar events, To Do tasks, OneNote notes, Excel/Word Online)"
archetypes = [
    "knowledge",
    "operational",
    "streaming",
    "storage",
]
format = "wasi"

[connector.state]
model = "singleton_writer"
state_schema_version = "1"
migration_hint = "Stores Graph API delta tokens for incremental sync, webhook subscription IDs with expiry timestamps, and per-resource change cursors."

[zones]
home = "z:work"
allowed_sources = [
    "z:owner",
    "z:private",
    "z:work",
]
allowed_targets = [
    "z:work",
    "z:private",
]
forbidden = [
    "z:public",
    "z:community",
]

[capabilities]
required = [
    "network.dns",
    "network.egress",
    "network.tls.sni",
    "storage.state",
    "media.download",
    "media.upload",
]
optional = ["network.tls.mtls"]
forbidden = [
    "system.exec",
    "network.listen",
]

