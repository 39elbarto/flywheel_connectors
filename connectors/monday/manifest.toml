[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = []
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:77eb7ba7fcdc04e28b3d5d016ef71aa5c2e3f4392514750645a3d4e1902766ca"

[connector]
id = "fcp.monday"
name = "Monday.com Connector"
version = "0.1.0"
description = "FCP connector for Monday.com work management (boards, items, updates)"
archetypes = [
    "knowledge",
    "operational",
]
format = "wasi"

[connector.state]
model = "singleton_writer"
state_schema_version = "1"
migration_hint = "Stores API token and board ID cache."

[zones]
home = "z:work"
allowed_sources = [
    "z:owner",
    "z:private",
    "z:work",
]
allowed_targets = ["z:work"]
forbidden = [
    "z:public",
    "z:community",
]

[capabilities]
required = [
    "network.dns",
    "network.egress",
    "network.tls.sni",
    "storage.state",
]
optional = []
forbidden = [
    "system.exec",
    "network.listen",
    "media.upload",
    "media.download",
]

[provides.operations."monday.boards.list"]
description = "List boards"
capability = "monday.boards.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"

[provides.operations."monday.boards.list".input_schema]
required = []
type = "object"

[provides.operations."monday.boards.list".input_schema.properties.limit]
maximum = 100
type = "integer"

[provides.operations."monday.boards.list".output_schema]
required = ["boards"]
type = "object"

[provides.operations."monday.boards.list".output_schema.properties.boards]
type = "array"

[provides.operations."monday.boards.list".network_constraints]
host_allow = ["api.monday.com"]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 3
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 10485760

[provides.operations."monday.boards.list".ai_hints]
when_to_use = "List Monday.com boards."
common_mistakes = []
examples = ["{}"]
related = [
    "monday.items.list",
    "monday.items.create",
]

[provides.operations."monday.items.create"]
description = "Create a new item on a board"
capability = "monday.items.write"
risk_level = "medium"
safety_tier = "risky"
requires_approval = "policy"
idempotency = "none"

[provides.operations."monday.items.create".input_schema]
required = [
    "board_id",
    "item_name",
]
type = "object"

[provides.operations."monday.items.create".input_schema.properties.board_id]
type = "string"

[provides.operations."monday.items.create".input_schema.properties.column_values]
description = "Column values as JSON"
type = "object"

[provides.operations."monday.items.create".input_schema.properties.item_name]
type = "string"

[provides.operations."monday.items.create".output_schema]
required = ["id"]
type = "object"

[provides.operations."monday.items.create".output_schema.properties.id]
type = "string"

[provides.operations."monday.items.create".network_constraints]
host_allow = ["api.monday.com"]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 3
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 1048576

[provides.operations."monday.items.create".ai_hints]
when_to_use = "Create a new item on a board."
common_mistakes = []
examples = ['{"board_id": "123456789", "item_name": "Fix login bug"}']
related = [
    "monday.items.list",
    "monday.items.delete",
]

[provides.operations."monday.items.delete"]
description = "Delete an item"
capability = "monday.items.write"
risk_level = "high"
safety_tier = "dangerous"
requires_approval = "interactive"
idempotency = "strict"

[provides.operations."monday.items.delete".input_schema]
required = ["item_id"]
type = "object"

[provides.operations."monday.items.delete".input_schema.properties.item_id]
type = "string"

[provides.operations."monday.items.delete".output_schema]
type = "object"

[provides.operations."monday.items.delete".network_constraints]
host_allow = ["api.monday.com"]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 3
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 1048576

[provides.operations."monday.items.delete".ai_hints]
when_to_use = "Delete an item. Cannot be undone."
common_mistakes = []
examples = ['{"item_id": "987654321"}']
related = ["monday.items.list"]

[provides.operations."monday.items.list"]
description = "List items on a board"
capability = "monday.items.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"

[provides.operations."monday.items.list".input_schema]
required = ["board_id"]
type = "object"

[provides.operations."monday.items.list".input_schema.properties.board_id]
type = "string"

[provides.operations."monday.items.list".output_schema]
required = ["items"]
type = "object"

[provides.operations."monday.items.list".output_schema.properties.items]
type = "array"

[provides.operations."monday.items.list".network_constraints]
host_allow = ["api.monday.com"]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 3
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 10485760

[provides.operations."monday.items.list".ai_hints]
when_to_use = "List items on a Monday.com board."
common_mistakes = []
examples = ['{"board_id": "123456789"}']
related = [
    "monday.boards.list",
    "monday.items.create",
]

[sandbox]
profile = "strict"
memory_mb = 256
cpu_percent = 50
wall_clock_timeout_ms = 300000
fs_readonly_paths = [
    "/usr",
    "/lib",
]
fs_writable_paths = ["$CONNECTOR_STATE"]
deny_exec = true
deny_ptrace = true

[[rate_limits.pools]]
id = "monday.boards.read"
requests = 200
window_ms = 60000
burst = 20
scope = "instance"

[[rate_limits.pools]]
id = "monday.items.read"
requests = 200
window_ms = 60000
burst = 20
scope = "instance"

[[rate_limits.pools]]
id = "monday.items.write"
requests = 50
window_ms = 60000
burst = 10
scope = "instance"

[rate_limits.operation_pools]
"monday.items.create" = ["monday.items.write"]
"monday.items.delete" = ["monday.items.write"]
"monday.boards.list" = ["monday.boards.read"]
"monday.items.list" = ["monday.items.read"]
