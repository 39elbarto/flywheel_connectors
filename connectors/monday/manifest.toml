[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = []
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:f0594a2469c855f955781153d7eb0472df25ec30269a3a19c1f48821827d5c8d"

[connector]
id = "fcp.monday"
name = "Monday.com Connector"
version = "0.1.0"
description = "FCP connector for Monday.com work management (boards, items, updates)"
archetypes = [
    "knowledge",
    "operational",
]
format = "wasi"

[connector.state]
model = "singleton_writer"
state_schema_version = "1"
migration_hint = "Stores API token and board ID cache."

[zones]
home = "z:work"
allowed_sources = [
    "z:owner",
    "z:private",
    "z:work",
]
allowed_targets = ["z:work"]
forbidden = [
    "z:public",
    "z:community",
]

[capabilities]
required = [
    "network.dns",
    "network.egress",
    "network.tls.sni",
    "storage.state",
]
optional = [
    "monday.boards.read",
    "monday.items.write",
    "monday.items.read",
    "monday.updates.read",
    "monday.updates.write",
]
forbidden = [
    "system.exec",
    "network.listen",
    "media.upload",
    "media.download",
]

[provides.operations."monday.boards.list"]
description = "List boards"
capability = "monday.boards.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"

[provides.operations."monday.boards.list".input_schema]
required = []
type = "object"

[provides.operations."monday.boards.list".input_schema.properties.limit]
maximum = 100
type = "integer"

[provides.operations."monday.boards.list".output_schema]
required = ["boards"]
type = "object"

[provides.operations."monday.boards.list".output_schema.properties.boards]
type = "array"

[provides.operations."monday.boards.list".network_constraints]
host_allow = ["api.monday.com"]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 3
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 10485760

[provides.operations."monday.boards.list".ai_hints]
when_to_use = "List Monday.com boards."
common_mistakes = ["Not specifying a limit parameter, which defaults to 25 boards; set limit explicitly when you need to retrieve more boards."]
examples = ["{}"]
related = [
    "monday.items.list",
    "monday.items.create",
]

[provides.operations."monday.boards.get"]
description = "Get a board by ID"
capability = "monday.boards.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"

[provides.operations."monday.boards.get".input_schema]
required = ["board_id"]
type = "object"

[provides.operations."monday.boards.get".input_schema.properties.board_id]
type = "string"

[provides.operations."monday.boards.get".output_schema]
required = ["board"]
type = "object"

[provides.operations."monday.boards.get".output_schema.properties.board]
type = [
    "object",
    "null",
]

[provides.operations."monday.boards.get".network_constraints]
host_allow = ["api.monday.com"]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 3
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 10485760

[provides.operations."monday.boards.get".ai_hints]
when_to_use = "Retrieve a single Monday.com board by its ID."
common_mistakes = ["Using the board name instead of its numeric ID."]
examples = ['{"board_id": "123456789"}']
related = [
    "monday.boards.list",
    "monday.items.list",
]

[provides.operations."monday.items.create"]
description = "Create a new item on a board"
capability = "monday.items.write"
risk_level = "medium"
safety_tier = "risky"
requires_approval = "policy"
idempotency = "none"

[provides.operations."monday.items.create".input_schema]
required = [
    "board_id",
    "item_name",
]
type = "object"

[provides.operations."monday.items.create".input_schema.properties.board_id]
type = "string"

[provides.operations."monday.items.create".input_schema.properties.column_values]
description = "Column values as JSON"
type = "object"

[provides.operations."monday.items.create".input_schema.properties.item_name]
type = "string"

[provides.operations."monday.items.create".output_schema]
required = ["id"]
type = "object"

[provides.operations."monday.items.create".output_schema.properties.id]
type = "string"

[provides.operations."monday.items.create".network_constraints]
host_allow = ["api.monday.com"]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
