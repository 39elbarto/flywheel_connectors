[sandbox]
profile = "strict"
memory_mb = 256
cpu_percent = 50
wall_clock_timeout_ms = 300000
fs_readonly_paths = [
    "/usr",
    "/lib",
]
fs_writable_paths = ["$CONNECTOR_STATE"]
deny_exec = true
deny_ptrace = true

[[rate_limits.pools]]
id = "monday.boards.read"
requests = 200
window_ms = 60000
burst = 20
scope = "instance"

[[rate_limits.pools]]
id = "monday.items.read"
requests = 200
window_ms = 60000
burst = 20
scope = "instance"

[[rate_limits.pools]]
id = "monday.items.write"
requests = 50
window_ms = 60000
burst = 10
scope = "instance"

[[rate_limits.pools]]
id = "monday.updates.read"
requests = 200
window_ms = 60000
burst = 20
scope = "instance"

[[rate_limits.pools]]
id = "monday.updates.write"
requests = 50
window_ms = 60000
burst = 10
scope = "instance"

[rate_limits.operation_pools]
"monday.items.create" = ["monday.items.write"]
"monday.items.delete" = ["monday.items.write"]
"monday.updates.create" = ["monday.updates.write"]
"monday.boards.list" = ["monday.boards.read"]
"monday.boards.get" = ["monday.boards.read"]
"monday.items.list" = ["monday.items.read"]
"monday.updates.list" = ["monday.updates.read"]
