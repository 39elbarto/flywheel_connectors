[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = []
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:f6b6c4c4eac726ab4e036726f16d02270eb209c0d0e38556c18807b093036f8c"

[connector]
id = "fcp.mongodb"
name = "MongoDB Connector"
version = "0.1.0"
description = "FCP connector for MongoDB Atlas (databases, collections, documents, aggregation)"
archetypes = [
    "knowledge",
    "storage",
]
format = "wasi"
status = "ready"

[connector.state]
model = "singleton_writer"
state_schema_version = "1"
migration_hint = "Stores Atlas Data API endpoint context in process memory; host credential material is injected by reference."

[zones]
home = "z:work"
allowed_sources = [
    "z:owner",
    "z:private",
    "z:work",
]
allowed_targets = ["z:work"]
forbidden = [
    "z:public",
    "z:community",
]

[capabilities]
required = [
    "network.dns",
    "network.egress",
    "network.tls.sni",
    "storage.state",
]
optional = [
    "mongodb.read",
    "mongodb.write",
]
forbidden = [
    "system.exec",
    "network.listen",
    "media.upload",
    "media.download",
]

[provides.operations."mongodb.aggregate"]
description = "Run an aggregation pipeline on a collection"
capability = "mongodb.read"
risk_level = "medium"
safety_tier = "risky"
requires_approval = "policy"
idempotency = "strict"
revocation_freshness = "safe"

[provides.operations."mongodb.aggregate".input_schema]
required = [
    "database",
    "collection",
    "pipeline",
]
type = "object"

[provides.operations."mongodb.aggregate".input_schema.properties.collection]
type = "string"

[provides.operations."mongodb.aggregate".input_schema.properties.database]
type = "string"

[provides.operations."mongodb.aggregate".input_schema.properties.pipeline]
description = "MongoDB aggregation pipeline stages"
type = "array"

[provides.operations."mongodb.aggregate".output_schema]
required = ["results"]
type = "object"

[provides.operations."mongodb.aggregate".output_schema.properties.results]
type = "array"

[provides.operations."mongodb.aggregate".network_constraints]
host_allow = [
    "data.mongodb-api.com",
    "*.mongodb.net",
    "*.mongodb.com",
]
port_allow = [
    443,
    27017,
]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 3
connect_timeout_ms = 10000
total_timeout_ms = 120000
max_response_bytes = 52428800

[provides.operations."mongodb.aggregate".ai_hints]
when_to_use = "Run a MongoDB aggregation pipeline."
common_mistakes = ["Unbounded pipelines without a $limit stage can be expensive."]
examples = ['{"database": "mydb", "collection": "orders", "pipeline": [{"$match": {"status": "completed"}}, {"$group": {"_id": "$product", "total": {"$sum": "$amount"}}}]}']
related = ["mongodb.find"]

[provides.operations."mongodb.delete_many"]
