[sandbox]
profile = "strict"
memory_mb = 512
cpu_percent = 75
wall_clock_timeout_ms = 300000
fs_readonly_paths = [
    "/usr",
    "/lib",
]
fs_writable_paths = ["$CONNECTOR_STATE"]
deny_exec = true
deny_ptrace = true

[[rate_limits.pools]]
id = "mongodb.read"
requests = 200
window_ms = 60000
burst = 20
scope = "instance"

[[rate_limits.pools]]
id = "mongodb.write"
requests = 50
window_ms = 60000
burst = 10
scope = "instance"

[rate_limits.operation_pools]
"mongodb.delete_many" = ["mongodb.write"]
"mongodb.update_many" = ["mongodb.write"]
"mongodb.find_one" = ["mongodb.read"]
"mongodb.insert_one" = ["mongodb.write"]
"mongodb.find" = ["mongodb.read"]
"mongodb.delete_one" = ["mongodb.write"]
"mongodb.update_one" = ["mongodb.write"]
"mongodb.aggregate" = ["mongodb.read"]
"mongodb.insert_many" = ["mongodb.write"]
