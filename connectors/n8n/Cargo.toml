[package]
name = "fcp-n8n"
autobins = false
description = "n8n workflow automation connector for the Flywheel Connector Protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "fcp_n8n"
path = "src/lib.rs"

[features]
owner-signing = []

[[bin]]
name = "fcp-n8n"
path = "src/main.rs"

[[bin]]
name = "fwc-n8n"
path = "src/bin/fwc-n8n.rs"

[[bin]]
name = "fwc-n8n-owner-sign"
path = "src/bin/fwc_n8n_owner_sign.rs"
required-features = ["owner-signing"]

[lints]
workspace = true

[dependencies]
fcp-core = { path = "../../crates/fcp-core" }
fcp-prelude = { path = "../../crates/fcp-prelude" }
fcp-async-core = { path = "../../crates/fcp-async-core" }
fcp-manifest = { path = "../../crates/fcp-manifest" }
fcp-sdk = { path = "../../crates/fcp-sdk", features = ["connector-http"] }
fcp-sandbox = { path = "../../crates/fcp-sandbox" }
fcp-crypto = { path = "../../crates/fcp-crypto" }
fcp-n8n-broker-protocol = { path = "../../crates/fcp-n8n-broker-protocol" }
fcp-host = { path = "../../crates/fcp-host" }

anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
blake3.workspace = true
clap = { workspace = true, features = ["derive"] }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
hex.workspace = true
percent-encoding.workspace = true
uuid.workspace = true
rustix = { version = "1.1", features = ["fs", "process"] }
zeroize.workspace = true

[dev-dependencies]
ciborium.workspace = true
chrono.workspace = true
wiremock.workspace = true
tempfile = "=3.27.0"
