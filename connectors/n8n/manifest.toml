[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = []
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:319cc96ce904787c91a3aa52fedc5a3c880e80ff91ac2389a5be20c3f6e71777"

[connector]
id = "fcp.n8n"
name = "n8n Connector"
version = "0.1.0"
description = "FCP connector for n8n workflow automation (workflows, executions, projects, credential metadata, tags, folders)"
archetypes = ["operational"]
format = "wasi"
status = "ready"

[connector.state]
model = "singleton_writer"
state_schema_version = "1"
migration_hint = "Stores a host-managed n8n credential reference and instance URL; provider secret material remains outside the connector."

[zones]
home = "z:work"
allowed_sources = [
    "z:owner",
    "z:private",
    "z:work",
]
allowed_targets = ["z:work"]
forbidden = [
    "z:public",
    "z:community",
]

[capabilities]
required = [
    "network.dns",
    "network.egress",
    "network.tls.sni",
    "storage.state",
]
optional = [
    "n8n.credentials.metadata.read",
    "n8n.executions.read",
    "n8n.folders.read",
    "n8n.mcp_access.write",
    "n8n.projects.read",
    "n8n.tags.read",
    "n8n.workflows.lifecycle",
    "n8n.workflows.write",
    "n8n.workflows.read",
]
forbidden = [
    "system.exec",
    "network.listen",
    "media.upload",
    "media.download",
]

