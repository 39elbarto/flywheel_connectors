[format]
type = "fcp-connector-manifest"
schema_version = "2.1"

[connector]
id = "fcp.netlify"
name = "Netlify"
version = "0.1.0"
description = "Netlify connector for Sites, Deploys, DNS, and Environment Variables"
archetypes = ["operational"]
homepage = "https://docs.netlify.com/api/get-started/"

[zones]
home = "z:work"
allowed_sources = ["z:work", "z:private"]
allowed_targets = ["z:work"]
tailscale_tag = "tag:fcp-work"

[capabilities]
required = ["network.dns", "network.outbound"]
optional = []
forbidden = ["system.exec", "system.privileged"]

[provides.operations.sites_list]
summary = "List Netlify sites"
capability = "netlify.sites.read"
risk = "low"
safety_tier = "safe"
idempotency = "none"
input_schema = { type = "object", additionalProperties = false, properties = {} }
output_schema = { type = "array", items = { type = "object" } }

[provides.operations.sites_list.network_constraints]
host_allow = ["api.netlify.com"]
port_allow = [443]
require_tls = true
deny_localhost = true
deny_private_ranges = true
max_redirects = 0

[provides.operations.sites_list.ai_hints]
when_to_use = "When you need to list all Netlify sites"

[provides.operations.sites_get]
summary = "Get site details"
capability = "netlify.sites.read"
risk = "low"
safety_tier = "safe"
idempotency = "none"
input_schema = { type = "object", required = ["site_id"], additionalProperties = false, properties = { site_id = { type = "string", description = "Netlify site ID" } } }
output_schema = { type = "object" }

[provides.operations.sites_get.network_constraints]
host_allow = ["api.netlify.com"]
port_allow = [443]
require_tls = true
deny_localhost = true
deny_private_ranges = true
max_redirects = 0

[provides.operations.sites_get.ai_hints]
when_to_use = "When you need info about a specific Netlify site"

[provides.operations.sites_create]
summary = "Create a new site"
capability = "netlify.sites.write"
risk = "medium"
safety_tier = "risky"
idempotency = "strict"
input_schema = { type = "object", required = ["name"], additionalProperties = false, properties = { name = { type = "string", description = "New Netlify site name" }, custom_domain = { type = "string", description = "Optional custom domain to attach" } } }
output_schema = { type = "object" }

[provides.operations.sites_create.network_constraints]
host_allow = ["api.netlify.com"]
port_allow = [443]
require_tls = true
deny_localhost = true
deny_private_ranges = true
max_redirects = 0

[provides.operations.sites_create.ai_hints]
when_to_use = "When you need to create a new Netlify site"

[provides.operations.sites_delete]
summary = "Delete a site"
capability = "netlify.sites.write"
risk = "critical"
safety_tier = "dangerous"
idempotency = "strict"
input_schema = { type = "object", required = ["site_id"], additionalProperties = false, properties = { site_id = { type = "string", description = "Netlify site ID to delete" } } }
output_schema = { type = "object", required = ["deleted", "site_id"], additionalProperties = false, properties = { deleted = { type = "boolean", const = true }, site_id = { type = "string", description = "Deleted Netlify site ID" } } }

[provides.operations.sites_delete.network_constraints]
host_allow = ["api.netlify.com"]
port_allow = [443]
require_tls = true
deny_localhost = true
deny_private_ranges = true
max_redirects = 0

[provides.operations.sites_delete.ai_hints]
when_to_use = "When you need to permanently delete a Netlify site"

[provides.operations.deploys_list]
summary = "List deploys for a site"
capability = "netlify.deploys.read"
risk = "low"
safety_tier = "safe"
idempotency = "none"
input_schema = { type = "object", required = ["site_id"], additionalProperties = false, properties = { site_id = { type = "string", description = "Netlify site ID" } } }
output_schema = { type = "array", items = { type = "object" } }

[provides.operations.deploys_list.network_constraints]
host_allow = ["api.netlify.com"]
port_allow = [443]
require_tls = true
deny_localhost = true
deny_private_ranges = true
max_redirects = 0

[provides.operations.deploys_list.ai_hints]
when_to_use = "When you need to see deploy history for a site"

[provides.operations.deploys_get]
summary = "Get deploy details"
capability = "netlify.deploys.read"
risk = "low"
safety_tier = "safe"
idempotency = "none"
input_schema = { type = "object", required = ["site_id", "deploy_id"], additionalProperties = false, properties = { site_id = { type = "string", description = "Netlify site ID" }, deploy_id = { type = "string", description = "Netlify deploy ID" } } }
output_schema = { type = "object" }

[provides.operations.deploys_get.network_constraints]
host_allow = ["api.netlify.com"]
port_allow = [443]
require_tls = true
deny_localhost = true
deny_private_ranges = true
max_redirects = 0

[provides.operations.deploys_get.ai_hints]
when_to_use = "When you need to check the status of a specific deploy"

[provides.operations.deploys_create]
summary = "Create a deploy"
capability = "netlify.deploys.write"
risk = "high"
safety_tier = "risky"
idempotency = "strict"
input_schema = { type = "object", required = ["site_id"], additionalProperties = false, properties = { site_id = { type = "string", description = "Netlify site ID" }, branch = { type = "string", description = "Optional Git branch for the deploy" }, title = { type = "string", description = "Optional deploy title" } } }
output_schema = { type = "object" }

[provides.operations.deploys_create.network_constraints]
host_allow = ["api.netlify.com"]
port_allow = [443]
require_tls = true
deny_localhost = true
deny_private_ranges = true
max_redirects = 0

[provides.operations.deploys_create.ai_hints]
when_to_use = "When you need to trigger a new deploy"

[provides.operations.deploys_rollback]
summary = "Rollback to a deploy"
capability = "netlify.deploys.write"
risk = "high"
safety_tier = "risky"
idempotency = "strict"
input_schema = { type = "object", required = ["site_id", "deploy_id"], additionalProperties = false, properties = { site_id = { type = "string", description = "Netlify site ID" }, deploy_id = { type = "string", description = "Deploy ID to roll back to" } } }
output_schema = { type = "object" }

[provides.operations.deploys_rollback.network_constraints]
host_allow = ["api.netlify.com"]
port_allow = [443]
require_tls = true
deny_localhost = true
deny_private_ranges = true
max_redirects = 0

[provides.operations.deploys_rollback.ai_hints]
when_to_use = "When you need to rollback a site to a previous deploy"

[provides.operations.dns_list_zones]
summary = "List DNS zones"
capability = "netlify.dns.read"
risk = "low"
safety_tier = "safe"
idempotency = "none"
input_schema = { type = "object", additionalProperties = false, properties = {} }
output_schema = { type = "array", items = { type = "object" } }

[provides.operations.dns_list_zones.network_constraints]
host_allow = ["api.netlify.com"]
port_allow = [443]
require_tls = true
deny_localhost = true
deny_private_ranges = true
max_redirects = 0

[provides.operations.dns_list_zones.ai_hints]
when_to_use = "When you need to list Netlify DNS zones"

[provides.operations.env_list]
summary = "List environment variables"
capability = "netlify.env.read"
risk = "low"
safety_tier = "safe"
idempotency = "none"
input_schema = { type = "object", required = ["site_id", "account_slug"], additionalProperties = false, properties = { site_id = { type = "string", description = "Netlify site ID" }, account_slug = { type = "string", description = "Netlify account slug" } } }
output_schema = { type = "array", items = { type = "object" } }

[provides.operations.env_list.network_constraints]
host_allow = ["api.netlify.com"]
port_allow = [443]
require_tls = true
deny_localhost = true
deny_private_ranges = true
max_redirects = 0

[provides.operations.env_list.ai_hints]
when_to_use = "When you need to list environment variables for a site"

[provides.operations.env_set]
summary = "Set environment variable"
capability = "netlify.env.write"
risk = "medium"
safety_tier = "risky"
idempotency = "strict"
input_schema = { type = "object", required = ["site_id", "account_slug", "key", "value"], additionalProperties = false, properties = { site_id = { type = "string", description = "Netlify site ID" }, account_slug = { type = "string", description = "Netlify account slug" }, key = { type = "string", description = "Environment variable key" }, value = { type = "string", description = "Environment variable value" }, context = { type = "string", description = "Optional Netlify environment context" }, is_secret = { type = "boolean", description = "Whether Netlify should treat the value as secret" } } }
output_schema = { type = "array", items = { type = "object" } }

[provides.operations.env_set.network_constraints]
host_allow = ["api.netlify.com"]
port_allow = [443]
require_tls = true
deny_localhost = true
deny_private_ranges = true
max_redirects = 0

[provides.operations.env_set.ai_hints]
when_to_use = "When you need to set or update an environment variable"

[provides.operations.env_delete]
summary = "Delete environment variable"
capability = "netlify.env.write"
risk = "high"
safety_tier = "dangerous"
idempotency = "strict"
input_schema = { type = "object", required = ["site_id", "account_slug", "key"], additionalProperties = false, properties = { site_id = { type = "string", description = "Netlify site ID" }, account_slug = { type = "string", description = "Netlify account slug" }, key = { type = "string", description = "Environment variable key to delete" } } }
output_schema = { type = "object", required = ["deleted", "key"], additionalProperties = false, properties = { deleted = { type = "boolean", const = true }, key = { type = "string", description = "Deleted environment variable key" } } }

[provides.operations.env_delete.network_constraints]
host_allow = ["api.netlify.com"]
port_allow = [443]
require_tls = true
deny_localhost = true
deny_private_ranges = true
max_redirects = 0

[provides.operations.env_delete.ai_hints]
when_to_use = "When you need to remove an environment variable — may break builds"

[provides.operations.health]
summary = "Verify API token"
capability = "netlify.sites.read"
risk = "low"
safety_tier = "safe"
idempotency = "strict"
input_schema = { type = "object", additionalProperties = false, properties = {} }
output_schema = { type = "object", required = ["healthy", "user_id", "email"], additionalProperties = false, properties = { healthy = { type = "boolean", const = true }, user_id = { type = "string", description = "Netlify user ID" }, email = { type = ["string", "null"], description = "Netlify user email when available" } } }

[provides.operations.health.network_constraints]
host_allow = ["api.netlify.com"]
port_allow = [443]
require_tls = true
deny_localhost = true
deny_private_ranges = true
max_redirects = 0

[provides.operations.health.ai_hints]
when_to_use = "When you need to verify Netlify API credentials"

[sandbox]
profile = "strict"
memory_mb = 128
cpu_percent = 25
wall_clock_timeout_ms = 30000
deny_exec = true
deny_ptrace = true
