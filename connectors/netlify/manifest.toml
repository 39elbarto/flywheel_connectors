safety_tier = "risky"
idempotency = "strict"

[provides.operations.env_set.network_constraints]
host_allow = ["api.netlify.com"]
port_allow = [443]
require_tls = true
deny_localhost = true
deny_private_ranges = true
max_redirects = 0

[provides.operations.env_set.ai_hints]
