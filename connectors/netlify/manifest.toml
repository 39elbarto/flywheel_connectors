capability = "netlify.env.read"
risk = "low"
safety_tier = "safe"
idempotency = "none"

[provides.operations.env_list.network_constraints]
host_allow = ["api.netlify.com"]
port_allow = [443]
require_tls = true
deny_localhost = true
deny_private_ranges = true
