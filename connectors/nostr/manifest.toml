[format]
type = "fcp-connector-manifest"
schema_version = "2.1"

[connector]
id = "fcp.nostr"
name = "Nostr Relay"
version = "0.1.0"
description = "Nostr relay connector for first-slice public-note publishing, bounded public-event queries, relay inspection, and health verification"
archetype = "operational"
homepage = "https://github.com/nostr-protocol/nips"

# Auth and scope model:
# - One connector instance is bound to one raw secp256k1 signing key and one static relay list.
# - Authentication is not OAuth or delegated user auth; the connector signs locally with
#   `secret_key_hex` and derives the matching x-only public key in-process.
# - This first slice publishes public kind-1 notes and reads public relay history.
# - Bech32 `nsec` input, encrypted DMs (NIP-04/NIP-17), profile metadata publication, long-lived
#   subscriptions, relay scoring, relay discovery, and relay policy mutation are explicit
#   non-goals for this initial connector.
# - Relay URLs must use `ws://` or `wss://`; the configured relay list is the effective network
#   boundary for this first slice.

[zones]
home = "z:community"
allowed_sources = ["z:owner", "z:private", "z:work", "z:community", "z:project:*"]
allowed_targets = ["z:community", "z:project:*", "z:public"]
tailscale_tag = "tag:fcp-community"

[capabilities]
required = ["network.dns", "network.outbound", "network.tls.sni"]
optional = []
forbidden = ["system.exec", "system.privileged", "network.listen"]

[provides.operations.notes_publish]
summary = "Publish a signed public Nostr note to configured relays"
capability = "nostr.notes.write"
risk = "medium"
safety_tier = "risky"
idempotency = "none"

[provides.operations.events_query]
summary = "Query bounded public Nostr events from configured relays"
capability = "nostr.events.read"
risk = "low"
safety_tier = "safe"
idempotency = "strict"

[provides.operations.relays_list]
summary = "List configured Nostr relays"
capability = "nostr.relays.read"
risk = "low"
safety_tier = "safe"
idempotency = "strict"

[provides.operations.health]
summary = "Verify relay connectivity and local signing identity"
capability = "nostr.health.read"
risk = "low"
safety_tier = "safe"
idempotency = "strict"

[sandbox]
profile = "strict"
memory_mb = 96
cpu_percent = 30
wall_clock_timeout_ms = 30000
deny_exec = true
deny_ptrace = true
