# Top-level event_caps is intentionally omitted here because the current
# manifest schema requires min_buffer_events > 0 whenever streaming = true.
# Runtime handshake/introspection truthfully advertise streaming=true,
# replay=false, min_buffer_events=0 for the connector-owned inbound DM stream.
[provides.events.inbound_dm]
description = "Inbound NIP-04 direct message accepted after signature, target, replay, rate-limit, decrypt, and configured sender-policy checks"
streaming = true
replay = false
topic = "nostr.dm.inbound"
requires_ack = false

