[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = []
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:4a511bf9fc7b177b53764645a7b0095c15ecc91edb0ff0d2d6ef3ed47eaeb1e4"

[connector]
id = "fcp.notion"
name = "Notion Connector"
version = "0.1.0"
description = "FCP connector for Notion (pages, databases, blocks, search, comments)"
archetypes = ["operational", "knowledge", "streaming"]
format = "wasi"

[connector.state]
model = "singleton_writer"
state_schema_version = "1"
migration_hint = "init"

[zones]
home = "z:work"
allowed_sources = ["z:owner", "z:private", "z:work"]
allowed_targets = ["z:work"]
forbidden = ["z:public"]

[capabilities]
required = ["network.dns", "network.egress", "network.tls.sni", "storage.state"]
optional = ["media.download"]
forbidden = ["system.exec", "network.listen"]

# ── Operations ──────────────────────────────────────────────────

[provides.operations."notion.create_page"]
description = "Create a new page in a Notion database or as a child page"
capability = "notion.write"
risk_level = "medium"
safety_tier = "risky"
requires_approval = "policy"
idempotency = "none"

[provides.operations."notion.create_page".input_schema]
required = ["parent", "properties"]
type = "object"
[provides.operations."notion.create_page".input_schema.properties.parent]
type = "object"
[provides.operations."notion.create_page".input_schema.properties.properties]
type = "object"

[provides.operations."notion.create_page".output_schema]
required = ["page"]
type = "object"
[provides.operations."notion.create_page".output_schema.properties.page]
type = "object"

[provides.operations."notion.create_page".network_constraints]
host_allow = ["api.notion.com"]
port_allow = [443]
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 0
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 1048576

[provides.operations."notion.create_page".ai_hints]
