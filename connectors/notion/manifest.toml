[provides.operations."notion.add_comment".network_constraints]
host_allow = ["api.notion.com"]
port_allow = [443]
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 0
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 1048576

[provides.operations."notion.add_comment".ai_hints]
when_to_use = "Add a comment to a Notion page."
common_mistakes = ["Comments cannot be edited or deleted once posted via the API", "The parent must use page_id for top-level comments or discussion_id to reply to an existing thread — using block_id is not supported"]
examples = ['{"parent": {"page_id": "abc123"}, "rich_text": [{"text": {"content": "Looks good!"}}]}']
related = ["notion.list_comments"]

# ────────────────────────────────────────────────────────────────

[provides.operations."notion.list_comments"]
description = "List comments on a page or block"
capability = "notion.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"

[provides.operations."notion.list_comments".input_schema]
required = ["block_id"]
type = "object"
[provides.operations."notion.list_comments".input_schema.properties.block_id]
type = "string"

[provides.operations."notion.list_comments".output_schema]
required = ["results", "has_more"]
type = "object"
[provides.operations."notion.list_comments".output_schema.properties.results]
type = "array"
[provides.operations."notion.list_comments".output_schema.properties.has_more]
type = "boolean"

[provides.operations."notion.list_comments".network_constraints]
host_allow = ["api.notion.com"]
port_allow = [443]
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 0
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 5242880

[provides.operations."notion.list_comments".ai_hints]
when_to_use = "Read comments on a page."
common_mistakes = ["The block_id parameter must be a page ID to list page-level comments — using a non-page block ID returns an empty list", "Results are paginated; check has_more and use start_cursor to retrieve all comments on pages with many discussions"]
examples = ['{"block_id": "abc123"}']
related = ["notion.add_comment"]

# ── Events ──────────────────────────────────────────────────────

[event_caps]
streaming = true
replay = false
min_buffer_events = 50

# ── Sandbox ─────────────────────────────────────────────────────

[sandbox]
profile = "strict"
memory_mb = 256
cpu_percent = 50
wall_clock_timeout_ms = 120000
fs_readonly_paths = ["/usr", "/lib"]
fs_writable_paths = ["$CONNECTOR_STATE"]
deny_exec = true
deny_ptrace = true

# ── Rate Limits ─────────────────────────────────────────────────

[[rate_limits.pools]]
id = "notion.read"
requests = 3
window_ms = 1000
burst = 3
scope = "instance"

[[rate_limits.pools]]
id = "notion.write"
requests = 3
window_ms = 1000
burst = 3
scope = "instance"

[[rate_limits.pools]]
id = "notion.delete"
requests = 3
window_ms = 1000
burst = 3
scope = "instance"

[[rate_limits.pools]]
id = "notion.search"
requests = 3
window_ms = 1000
burst = 3
scope = "instance"

[rate_limits.operation_pools]
"notion.create_page" = ["notion.write"]
"notion.get_page" = ["notion.read"]
"notion.update_page" = ["notion.write"]
"notion.delete_page" = ["notion.delete"]
"notion.get_database" = ["notion.read"]
"notion.create_database" = ["notion.write"]
"notion.update_database" = ["notion.write"]
"notion.query_database" = ["notion.read"]
"notion.search" = ["notion.search"]
"notion.get_block" = ["notion.read"]
"notion.update_block" = ["notion.write"]
"notion.delete_block" = ["notion.delete"]
"notion.get_block_children" = ["notion.read"]
"notion.append_blocks" = ["notion.write"]
"notion.add_comment" = ["notion.write"]
"notion.list_comments" = ["notion.read"]
