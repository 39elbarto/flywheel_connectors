[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = []
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:409b6569f080220cf2256e828e562bf1a697e7e0daf27b096fa39df478a69d99"

[connector]
id = "fcp.notion"
name = "Notion Connector"
version = "0.1.0"
description = "FCP connector for Notion (pages, databases, blocks, search, comments)"
archetypes = ["operational", "knowledge", "streaming"]
format = "wasi"

[connector.state]
model = "singleton_writer"
state_schema_version = "1"
migration_hint = "init"

[zones]
home = "z:work"
allowed_sources = ["z:owner", "z:private", "z:work"]
allowed_targets = ["z:work"]
forbidden = ["z:public"]

[capabilities]
required = ["network.dns", "network.egress", "network.tls.sni", "storage.state"]
optional = ["media.download"]
forbidden = ["system.exec", "network.listen"]

