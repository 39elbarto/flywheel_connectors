[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = []
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:openrouter-video-slice"

[connector]
id = "fcp.openrouter"
name = "OpenRouter"
version = "0.1.0"
description = "OpenRouter request-response connector for non-streaming chat completions, model discovery, and bounded video generation"
archetypes = ["request-response"]
format = "native"

[connector.state]
model = "stateless"
state_schema_version = "1"
migration_hint = "Stores no durable state. Configuration is limited to api_key or credential_id, optional HTTP-Referer/X-Title metadata, base_url, and request_timeout_ms."

[zones]
home = "z:work"
allowed_sources = ["z:owner", "z:private", "z:work"]
allowed_targets = ["z:work"]
forbidden = ["z:public"]

[capabilities]
required = ["network.dns", "network.egress", "network.tls.sni"]
optional = []
forbidden = ["system.exec", "network.listen"]

[sandbox]
profile = "strict"
memory_mb = 96
cpu_percent = 25
wall_clock_timeout_ms = 60000
deny_exec = true
deny_ptrace = true

[provides.operations."openrouter.chat.completions"]
description = "Create a non-streaming OpenRouter chat completion using the OpenAI-compatible chat completions API."
capability = "openrouter.chat"
risk_level = "medium"
safety_tier = "safe"
requires_approval = "none"
idempotency = "none"
input_schema = { type = "object", required = ["messages"], additionalProperties = false, properties = { model = { type = "string", minLength = 1, default = "openai/gpt-4.1-mini" }, messages = { type = "array", minItems = 1, items = { type = "object", required = ["role", "content"], additionalProperties = true, properties = { role = { type = "string", enum = ["system", "user", "assistant", "tool", "developer"] }, content = { oneOf = [{ type = "string" }, { type = "array" }, { type = "null" }] }, name = { type = "string" }, tool_call_id = { type = "string" }, tool_calls = { type = "array" } } } }, max_tokens = { type = "integer", minimum = 1 }, temperature = { type = "number", minimum = 0, maximum = 2 }, top_p = { type = "number", minimum = 0, maximum = 1 }, response_format = { type = "object" }, tools = { type = "array", items = { type = "object" } }, tool_choice = { oneOf = [{ type = "string" }, { type = "object" }, { type = "null" }] } } }
output_schema = { type = "object", required = ["id", "model", "content", "finish_reason", "usage", "raw"], additionalProperties = false, properties = { id = { type = ["string", "null"] }, model = { type = ["string", "null"] }, content = { oneOf = [{ type = "string" }, { type = "array" }, { type = "null" }] }, finish_reason = { type = ["string", "null"] }, usage = { oneOf = [{ type = "object" }, { type = "null" }] }, raw = { type = "object" } } }
network_constraints = { host_allow = ["openrouter.ai"], port_allow = [443], ip_allow = [], cidr_deny = [], require_sni = true, spki_pins = [], deny_localhost = true, deny_private_ranges = true, deny_tailnet_ranges = true, deny_ip_literals = true, require_host_canonicalization = true, dns_max_ips = 16, max_redirects = 3, connect_timeout_ms = 10000, total_timeout_ms = 60000, max_response_bytes = 10485760 }

[provides.operations."openrouter.chat.completions".ai_hints]
when_to_use = "Use for routed model access through OpenRouter when you need one OpenAI-compatible chat request surface."
common_mistakes = ["Expecting server-sent streaming in this first slice. The connector only exposes bounded non-streaming completions right now.", "Forgetting to pass a provider-qualified model such as openai/gpt-4.1-mini or anthropic/claude-sonnet-4."]
examples = ['{"model":"openai/gpt-4.1-mini","messages":[{"role":"user","content":"Summarize the FCP security model in 3 bullets."}]}']
related = ["openrouter.models.list"]

[provides.operations."openrouter.models.list"]
description = "List currently available OpenRouter models."
capability = "openrouter.models"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"
input_schema = { type = "object", properties = {}, additionalProperties = false }
output_schema = { type = "object", required = ["data"], additionalProperties = true, properties = { data = { type = "array", items = { type = "object", required = ["id"], additionalProperties = true, properties = { id = { type = "string" }, name = { type = "string" }, created = { type = "integer" }, description = { type = "string" }, context_length = { type = "integer" }, pricing = { type = "object" }, architecture = { type = "object" }, top_provider = { type = "object" }, per_request_limits = { oneOf = [{ type = "object" }, { type = "null" }] } } } } } }
network_constraints = { host_allow = ["openrouter.ai"], port_allow = [443], ip_allow = [], cidr_deny = [], require_sni = true, spki_pins = [], deny_localhost = true, deny_private_ranges = true, deny_tailnet_ranges = true, deny_ip_literals = true, require_host_canonicalization = true, dns_max_ips = 16, max_redirects = 3, connect_timeout_ms = 10000, total_timeout_ms = 30000, max_response_bytes = 10485760 }

[provides.operations."openrouter.models.list".ai_hints]
when_to_use = "Use to discover provider-qualified model IDs before sending a routed completion."
common_mistakes = ["Assuming OpenRouter model IDs are the same as first-party provider IDs without the provider prefix."]
examples = ["{}"]
related = ["openrouter.chat.completions"]

[provides.operations."openrouter.videos.generate"]
description = "Submit an OpenRouter video generation job, poll it to completion, and download the generated video asset."
capability = "openrouter.video"
risk_level = "medium"
safety_tier = "safe"
requires_approval = "none"
idempotency = "none"
input_schema = { type = "object", required = ["prompt"], additionalProperties = false, properties = { model = { type = "string", minLength = 1, default = "google/veo-3.1-fast" }, prompt = { type = "string", minLength = 1 }, duration_seconds = { type = "integer", minimum = 1 }, resolution = { type = "string" }, aspect_ratio = { type = "string" }, size = { type = "string" }, audio = { type = "boolean" }, input_images = { type = "array", maxItems = 4, items = { type = "object", additionalProperties = false, anyOf = [{ required = ["url"] }, { required = ["data_url"] }, { required = ["base64"] }], properties = { role = { type = "string", enum = ["first_frame", "last_frame", "reference_image"] }, url = { type = "string", format = "uri" }, data_url = { type = "string", pattern = "^data:image/[^;]+;base64," }, base64 = { type = "string", minLength = 1 }, mime_type = { type = "string", pattern = "^image/" } } } }, input_videos = { type = "array", maxItems = 0 }, callback_url = { type = "string", format = "uri" }, seed = { type = "integer" }, provider_options = { type = "object", additionalProperties = false, properties = { callback_url = { type = "string", format = "uri" }, seed = { type = "integer" } } }, poll_interval_ms = { type = "integer", minimum = 0, maximum = 60000 }, max_poll_attempts = { type = "integer", minimum = 1, maximum = 120 }, max_download_bytes = { type = "integer", minimum = 1 } } }
output_schema = { type = "object", required = ["job_id", "status", "generation_id", "model", "usage", "video", "raw"], additionalProperties = false, properties = { job_id = { type = "string", minLength = 1 }, status = { type = "string", minLength = 1 }, generation_id = { type = ["string", "null"] }, model = { type = "string", minLength = 1 }, usage = { oneOf = [{ type = "object" }, { type = "null" }] }, video = { type = "object", required = ["mime_type", "base64", "byte_len", "file_name"], additionalProperties = false, properties = { mime_type = { type = "string", pattern = "^video/" }, base64 = { type = "string", minLength = 1 }, byte_len = { type = "integer", minimum = 0 }, file_name = { type = "string", enum = ["video-1.mp4", "video-1.webm"] } } }, raw = { type = "object" } } }
network_constraints = { host_allow = ["openrouter.ai"], port_allow = [443], ip_allow = [], cidr_deny = [], require_sni = true, spki_pins = [], deny_localhost = true, deny_private_ranges = true, deny_tailnet_ranges = true, deny_ip_literals = true, require_host_canonicalization = true, dns_max_ips = 16, max_redirects = 3, connect_timeout_ms = 10000, total_timeout_ms = 600000, max_response_bytes = 134217728 }

[provides.operations."openrouter.videos.generate".ai_hints]
when_to_use = "Use for bounded OpenRouter text-to-video or image-to-video jobs when a base64 returned asset is acceptable."
common_mistakes = ["Passing video reference inputs; OpenRouter video-to-video is intentionally rejected.", "Assuming provider credentials are sent to cross-origin polling or unsigned download URLs. They are stripped."]
examples = ['{"prompt":"A chrome sphere glides across a quiet moonlit beach","model":"google/veo-3.1-fast","duration_seconds":6,"aspect_ratio":"16:9","resolution":"720P"}']
related = ["openrouter.models.list"]
