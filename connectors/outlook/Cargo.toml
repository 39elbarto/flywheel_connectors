[package]
name = "fcp-outlook"
description = "Microsoft Outlook/Exchange connector for the Flywheel Connector Protocol via Microsoft Graph API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "fcp_outlook"
path = "src/lib.rs"

[[bin]]
name = "fcp-outlook"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
fcp-core = { path = "../../crates/fcp-core" }
fcp-prelude = { path = "../../crates/fcp-prelude" }
fcp-async-core = { path = "../../crates/fcp-async-core" }
fcp-manifest = { path = "../../crates/fcp-manifest" }
fcp-sdk = { path = "../../crates/fcp-sdk" }

anyhow.workspace = true
async-trait.workspace = true
reqwest = { workspace = true, features = ["json"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
percent-encoding.workspace = true
url.workspace = true
uuid.workspace = true
hex.workspace = true

[dev-dependencies]
chrono.workspace = true
fcp-crypto = { path = "../../crates/fcp-crypto" }
jsonschema.workspace = true
wiremock.workspace = true
