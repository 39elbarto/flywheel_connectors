description = "Optional cc recipient email addresses."

[provides.operations."outlook.send_message".input_schema.properties.cc.items]
type = "string"
minLength = 1

[provides.operations."outlook.send_message".input_schema.properties.subject]
type = "string"
description = "Message subject. Do not include secrets unless explicitly requested by the user."

[provides.operations."outlook.send_message".input_schema.properties.body]
type = "string"
description = "Plain text message body."

[provides.operations."outlook.send_message".output_schema]
type = "object"
required = ["status"]
additionalProperties = true

[provides.operations."outlook.send_message".output_schema.properties.status]
