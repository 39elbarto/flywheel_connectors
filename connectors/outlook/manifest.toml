[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = []
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:e9f6e3180477d76f81a6335b5cf9fb4fff31eb2f6f6aa611fc9f6fa9e5e482ef"

[connector]
id = "fcp.outlook"
name = "Microsoft Outlook Connector"
version = "0.1.0"
status = "ready"
description = "Microsoft Outlook and Exchange connector over Microsoft Graph for mail reading, mail sending, calendar events, and folder discovery."
archetypes = ["operational"]
format = "native"

[connector.state]
model = "singleton_writer"
state_schema_version = "1"
migration_hint = "Legacy Outlook stays request-response only; Microsoft Graph subscriptions, notification ingress, and delta handoff are owned by fcp.microsoft365."

[zones]
home = "z:work"
allowed_sources = ["z:owner", "z:private", "z:work"]
allowed_targets = ["z:owner", "z:private", "z:work"]
forbidden = ["z:public"]

[capabilities]
required = ["network.dns", "network.egress", "network.tls.sni"]
optional = ["outlook.read", "outlook.send", "outlook.calendar"]
forbidden = ["system.exec", "network.listen", "system.privileged"]

[sandbox]
profile = "strict"
memory_mb = 128
cpu_percent = 25
wall_clock_timeout_ms = 30000
deny_exec = true
deny_ptrace = true

# Production manifest egress is intentionally limited to Microsoft Graph's
# public and sovereign API hosts. The Rust connector still allows loopback graph
# hosts in tests; those are deterministic test fixtures, not production network
# allowances.
[provides.operations."outlook.list_messages"]
description = "List recent email messages from the inbox or a specified mail folder through Microsoft Graph."
capability = "outlook.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
rate_limit = "100/min"
idempotency = "strict"
revocation_freshness = "safe"

[provides.operations."outlook.list_messages".input_schema]
type = "object"
additionalProperties = true

[provides.operations."outlook.list_messages".input_schema.properties.folder_id]
type = "string"
minLength = 1
description = "Microsoft Graph mail folder id or well-known folder name. Defaults to inbox when omitted."

[provides.operations."outlook.list_messages".input_schema.properties.top]
type = "integer"
minimum = 1
maximum = 100
description = "Maximum number of messages to request. Runtime defaults to 25 and caps Graph requests at 100."

[provides.operations."outlook.list_messages".output_schema]
type = "object"
required = ["value"]
additionalProperties = true

[provides.operations."outlook.list_messages".output_schema.properties.value]
type = "array"

[provides.operations."outlook.list_messages".output_schema.properties.value.items]
type = "object"
additionalProperties = true

[provides.operations."outlook.list_messages".network_constraints]
host_allow = ["graph.microsoft.com", "graph.microsoft.us"]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 0
connect_timeout_ms = 10000
total_timeout_ms = 15000
max_response_bytes = 10485760

[provides.operations."outlook.list_messages".ai_hints]
when_to_use = "Use to list recent emails in the user's inbox or a specific folder."
common_mistakes = ["Omitting folder_id intentionally defaults to inbox.", "Use outlook.get_message when the caller needs full message body content.", "Do not log message subjects, sender names, body previews, or provider error bodies."]
examples = ['{}', '{"folder_id":"Drafts","top":10}']
related = ["outlook.get_message", "outlook.search_messages"]

