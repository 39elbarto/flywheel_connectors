cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 0
connect_timeout_ms = 10000
total_timeout_ms = 15000
max_response_bytes = 10485760

[provides.operations."outlook.send_message".ai_hints]
when_to_use = "Use to send an email from the configured Outlook account."
common_mistakes = ["At least one to recipient is required.", "This operation is not idempotent; retries can send duplicate email.", "Never log API tokens, recipient lists, subjects, bodies, or provider error bodies."]
examples = ['{"to":["recipient@example.com"],"subject":"Hello","body":"World"}']
