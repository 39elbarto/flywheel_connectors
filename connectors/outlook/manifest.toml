[provides.operations."outlook.send_message"]
description = "Send a new email from the configured Outlook account through Microsoft Graph sendMail."
capability = "outlook.send"
risk_level = "medium"
safety_tier = "risky"
requires_approval = "none"
rate_limit = "30/min"
idempotency = "none"
revocation_freshness = "risky"

[provides.operations."outlook.send_message".input_schema]
type = "object"
required = ["to", "subject", "body"]
additionalProperties = true

[provides.operations."outlook.send_message".input_schema.properties.to]
type = "array"
minItems = 1
description = "Recipient email addresses. Runtime trims entries and rejects empty or non-string recipients."

[provides.operations."outlook.send_message".input_schema.properties.to.items]
type = "string"
minLength = 1

[provides.operations."outlook.send_message".input_schema.properties.cc]
