[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = []
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:c21df258ce24502e59023ecb09be4bff6b4990bf5f9c4dbfc35fae44d14da908"

[connector]
id = "fcp.package-registry"
name = "Package Registry"
version = "0.1.0"
description = "Provider-bound package registry metadata connector for npm, PyPI, and crates.io"
archetypes = ["operational"]
format = "native"

[connector.state]
model = "stateless"
state_schema_version = "1"
migration_hint = "One configured provider, optional read credential, and retry/timeout settings per connector instance. The first slice does not manage publish, yank, owner mutation, or token lifecycle workflows."

[zones]
home = "z:work"
allowed_sources = [
    "z:work",
    "z:private",
]
allowed_targets = ["z:work"]
forbidden = [
    "z:community",
    "z:public",
]

[capabilities]
required = [
    "network.dns",
    "network.egress",
    "network.tls.sni",
]
optional = []
forbidden = [
    "system.exec",
    "network.listen",
    "system.privileged",
]

[provides.operations."registry.artifacts.list"]
description = "List release files or artifact metadata without downloading artifact bodies."
capability = "registry.artifacts.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"

[provides.operations."registry.artifacts.list".input_schema]
required = ["name"]
type = "object"

[provides.operations."registry.artifacts.list".input_schema.properties.name]
type = "string"

[provides.operations."registry.artifacts.list".input_schema.properties.version]
type = "string"

[provides.operations."registry.artifacts.list".output_schema]
required = [
    "provider",
    "name",
    "version",
    "artifacts",
]
type = "object"

[provides.operations."registry.artifacts.list".output_schema.properties.artifacts]
type = "array"

[provides.operations."registry.artifacts.list".output_schema.properties.name]
type = "string"

[provides.operations."registry.artifacts.list".output_schema.properties.provider]
type = "string"

[provides.operations."registry.artifacts.list".output_schema.properties.version]
type = "string"

[provides.operations."registry.artifacts.list".network_constraints]
host_allow = [
    "registry.npmjs.org",
    "pypi.org",
    "crates.io",
]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 0
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 1048576

[provides.operations."registry.artifacts.list".ai_hints]
when_to_use = "Use when you need tarball, wheel, sdist, or crate metadata without downloading the file bodies."
common_mistakes = ["Artifact metadata does not fetch the artifact body."]
examples = ['{"name":"sampleproject","version":"4.0.0"}']
related = ["registry.dependencies.get"]

[provides.operations."registry.dependencies.get"]
description = "Read dependency metadata for a selected package version or release."
capability = "registry.dependencies.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"

[provides.operations."registry.dependencies.get".input_schema]
required = ["name"]
type = "object"

[provides.operations."registry.dependencies.get".input_schema.properties.name]
type = "string"

[provides.operations."registry.dependencies.get".input_schema.properties.version]
type = "string"

[provides.operations."registry.dependencies.get".output_schema]
required = [
    "provider",
    "name",
    "version",
    "dependencies",
]
type = "object"

[provides.operations."registry.dependencies.get".output_schema.properties.dependencies]
type = "array"

[provides.operations."registry.dependencies.get".output_schema.properties.name]
type = "string"

[provides.operations."registry.dependencies.get".output_schema.properties.provider]
type = "string"

[provides.operations."registry.dependencies.get".output_schema.properties.version]
type = "string"

[provides.operations."registry.dependencies.get".network_constraints]
host_allow = [
    "registry.npmjs.org",
    "pypi.org",
    "crates.io",
]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 0
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 1048576

[provides.operations."registry.dependencies.get".ai_hints]
when_to_use = "Use when you need dependency declarations for a selected package version."
common_mistakes = ["If version is omitted, the connector falls back to the provider's latest or max version."]
examples = ['{"name":"requests","version":"2.32.0"}']
related = [
    "registry.versions.list",
    "registry.artifacts.list",
]

[provides.operations."registry.downloads.get"]
