[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = []
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:410403678d785fa7cb55326fa577324c27b33d3d469ce7032f9b056182683f98"

[connector]
id = "fcp.pandadoc"
name = "PandaDoc Connector"
version = "0.1.0"
description = "FCP connector for PandaDoc document automation (documents, templates, sending)"
archetypes = [
    "knowledge",
    "operational",
]
format = "wasi"

[connector.state]
model = "singleton_writer"
state_schema_version = "1"
migration_hint = "Stores API key and pagination cursors."

[zones]
home = "z:work"
allowed_sources = [
    "z:owner",
    "z:private",
    "z:work",
]
allowed_targets = ["z:work"]
forbidden = [
    "z:public",
    "z:community",
]

[capabilities]
required = [
    "network.dns",
    "network.egress",
    "network.tls.sni",
    "storage.state",
]
optional = []
forbidden = [
    "system.exec",
    "network.listen",
    "media.upload",
    "media.download",
]

[provides.operations."pandadoc.documents.create"]
description = "Create a document from a template"
capability = "pandadoc.documents.write"
risk_level = "medium"
safety_tier = "risky"
requires_approval = "policy"
idempotency = "none"

[provides.operations."pandadoc.documents.create".input_schema]
required = [
    "name",
    "template_uuid",
    "recipients",
]
type = "object"

[provides.operations."pandadoc.documents.create".input_schema.properties.name]
type = "string"

[provides.operations."pandadoc.documents.create".input_schema.properties.recipients]
description = "List of recipient objects with email and role"
type = "array"

[provides.operations."pandadoc.documents.create".input_schema.properties.template_uuid]
type = "string"

[provides.operations."pandadoc.documents.create".output_schema]
required = [
    "id",
    "status",
]
type = "object"

[provides.operations."pandadoc.documents.create".output_schema.properties.id]
type = "string"

[provides.operations."pandadoc.documents.create".output_schema.properties.status]
type = "string"

[provides.operations."pandadoc.documents.create".network_constraints]
host_allow = ["api.pandadoc.com"]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 3
connect_timeout_ms = 10000
total_timeout_ms = 60000
max_response_bytes = 1048576

[provides.operations."pandadoc.documents.create".ai_hints]
when_to_use = "Create a new document from a template."
common_mistakes = ["Forgetting to specify recipients."]
examples = ['{"name": "NDA for Acme", "template_uuid": "tpl_abc123", "recipients": [{"email": "bob@acme.com", "role": "signer"}]}']
related = [
    "pandadoc.templates.list",
    "pandadoc.documents.send",
]

[provides.operations."pandadoc.documents.delete"]
description = "Delete a document"
capability = "pandadoc.documents.write"
risk_level = "high"
safety_tier = "dangerous"
requires_approval = "interactive"
idempotency = "strict"

[provides.operations."pandadoc.documents.delete".input_schema]
required = ["document_id"]
type = "object"

[provides.operations."pandadoc.documents.delete".input_schema.properties.document_id]
type = "string"

[provides.operations."pandadoc.documents.delete".output_schema]
type = "object"

[provides.operations."pandadoc.documents.delete".network_constraints]
host_allow = ["api.pandadoc.com"]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 3
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 1048576

[provides.operations."pandadoc.documents.delete".ai_hints]
when_to_use = "Delete a document. Cannot be undone."
common_mistakes = ["Deleting a document that has already been sent or completed will also revoke signer access; verify the document status with pandadoc.documents.get first."]
examples = ['{"document_id": "doc_abc123"}']
related = ["pandadoc.documents.list"]

[provides.operations."pandadoc.documents.get"]
description = "Get document details"
capability = "pandadoc.documents.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"

[provides.operations."pandadoc.documents.get".input_schema]
required = ["document_id"]
type = "object"

[provides.operations."pandadoc.documents.get".input_schema.properties.document_id]
type = "string"

[provides.operations."pandadoc.documents.get".output_schema]
required = [
    "id",
    "name",
    "status",
]
type = "object"

[provides.operations."pandadoc.documents.get".output_schema.properties.id]
type = "string"

[provides.operations."pandadoc.documents.get".output_schema.properties.name]
type = "string"

[provides.operations."pandadoc.documents.get".output_schema.properties.status]
type = "string"

[provides.operations."pandadoc.documents.get".network_constraints]
host_allow = ["api.pandadoc.com"]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 3
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 1048576

[provides.operations."pandadoc.documents.get".ai_hints]
when_to_use = "Get details for a specific document."
common_mistakes = ["The document_id is a PandaDoc UUID, not the document name; use pandadoc.documents.list to look up the ID."]
examples = ['{"document_id": "doc_abc123"}']
related = ["pandadoc.documents.list"]

[provides.operations."pandadoc.documents.list"]
description = "List documents"
capability = "pandadoc.documents.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"

[provides.operations."pandadoc.documents.list".input_schema]
required = []
type = "object"

[provides.operations."pandadoc.documents.list".input_schema.properties.count]
maximum = 100
type = "integer"

[provides.operations."pandadoc.documents.list".input_schema.properties.status]
description = "Filter by status (draft, sent, completed, etc.)"
type = "string"

[provides.operations."pandadoc.documents.list".output_schema]
required = ["results"]
type = "object"

[provides.operations."pandadoc.documents.list".output_schema.properties.results]
type = "array"

[provides.operations."pandadoc.documents.list".network_constraints]
host_allow = ["api.pandadoc.com"]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 3
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 10485760

[provides.operations."pandadoc.documents.list".ai_hints]
when_to_use = "List PandaDoc documents, optionally filtered by status."
common_mistakes = ["The status filter values are specific strings (draft, sent, completed, viewed, waiting_approval); using arbitrary values returns empty results."]
examples = ['{"status": "draft", "count": 20}']
related = [
    "pandadoc.documents.get",
    "pandadoc.documents.create",
]

[provides.operations."pandadoc.documents.send"]
description = "Send a document for signing"
capability = "pandadoc.documents.write"
risk_level = "high"
safety_tier = "risky"
requires_approval = "policy"
idempotency = "strict"

[provides.operations."pandadoc.documents.send".input_schema]
required = ["document_id"]
type = "object"

[provides.operations."pandadoc.documents.send".input_schema.properties.document_id]
type = "string"

[provides.operations."pandadoc.documents.send".input_schema.properties.message]
description = "Optional message to include in the email"
type = "string"

[provides.operations."pandadoc.documents.send".output_schema]
required = [
    "id",
    "status",
]
type = "object"

[provides.operations."pandadoc.documents.send".output_schema.properties.id]
type = "string"

[provides.operations."pandadoc.documents.send".output_schema.properties.status]
type = "string"

[provides.operations."pandadoc.documents.send".network_constraints]
host_allow = ["api.pandadoc.com"]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 3
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 1048576

[provides.operations."pandadoc.documents.send".ai_hints]
when_to_use = "Send a document to recipients for signing."
common_mistakes = ["Sending a document that is not in draft status."]
examples = ['{"document_id": "doc_abc123", "message": "Please sign this NDA."}']
related = [
    "pandadoc.documents.create",
    "pandadoc.documents.get",
]

[provides.operations."pandadoc.templates.list"]
description = "List available templates"
capability = "pandadoc.templates.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"

[provides.operations."pandadoc.templates.list".input_schema]
required = []
type = "object"

[provides.operations."pandadoc.templates.list".output_schema]
required = ["results"]
type = "object"

[provides.operations."pandadoc.templates.list".output_schema.properties.results]
type = "array"

[provides.operations."pandadoc.templates.list".network_constraints]
host_allow = ["api.pandadoc.com"]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 3
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 10485760

[provides.operations."pandadoc.templates.list".ai_hints]
when_to_use = "List available document templates."
common_mistakes = ["Only active templates are returned; archived or deleted templates will not appear in the list."]
examples = ["{}"]
related = ["pandadoc.documents.create"]

[sandbox]
profile = "strict"
memory_mb = 256
cpu_percent = 50
wall_clock_timeout_ms = 300000
fs_readonly_paths = [
    "/usr",
    "/lib",
]
fs_writable_paths = ["$CONNECTOR_STATE"]
deny_exec = true
deny_ptrace = true

[[rate_limits.pools]]
id = "pandadoc.documents.read"
requests = 200
window_ms = 60000
burst = 20
scope = "instance"

[[rate_limits.pools]]
id = "pandadoc.documents.write"
requests = 50
window_ms = 60000
burst = 5
scope = "instance"

[[rate_limits.pools]]
id = "pandadoc.templates.read"
requests = 100
window_ms = 60000
burst = 10
scope = "instance"

[rate_limits.operation_pools]
"pandadoc.documents.delete" = ["pandadoc.documents.write"]
"pandadoc.documents.send" = ["pandadoc.documents.write"]
"pandadoc.templates.list" = ["pandadoc.templates.read"]
"pandadoc.documents.list" = ["pandadoc.documents.read"]
"pandadoc.documents.get" = ["pandadoc.documents.read"]
"pandadoc.documents.create" = ["pandadoc.documents.write"]
