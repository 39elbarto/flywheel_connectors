[sandbox]
profile = "strict"
memory_mb = 128
cpu_percent = 25
wall_clock_timeout_ms = 30000
deny_exec = true
deny_ptrace = true

[[rate_limits.pools]]
id = "paypal.read"
description = "Conservative connector-side PayPal read budget"
requests = 60
window_ms = 60000
burst = 10
scope = "instance"

[[rate_limits.pools]]
id = "paypal.write"
description = "Conservative connector-side PayPal write budget"
requests = 12
window_ms = 60000
burst = 3
scope = "instance"

[[rate_limits.pools]]
id = "paypal.money_movement"
description = "Extra guardrail for money-moving PayPal mutations"
requests = 6
window_ms = 60000
burst = 2
scope = "instance"

[rate_limits.operation_pools]
"paypal.health" = ["paypal.read"]
"paypal.orders.create" = ["paypal.write"]
"paypal.orders.get" = ["paypal.read"]
"paypal.orders.capture" = ["paypal.write", "paypal.money_movement"]
"paypal.payments.list" = ["paypal.read"]
"paypal.payments.get" = ["paypal.read"]
"paypal.payments.refund" = ["paypal.write", "paypal.money_movement"]
"paypal.invoices.create" = ["paypal.write"]
"paypal.invoices.list" = ["paypal.read"]
"paypal.invoices.send" = ["paypal.write"]
