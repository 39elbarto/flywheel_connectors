[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = []
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:perplexity-search-native-search-v1"

[connector]
id = "fcp.perplexity-search"
name = "Perplexity Search"
version = "0.1.0"
status = "active"
description = "Perplexity grounded research connector with chat-completions and native structured search"
archetypes = ["request-response"]
format = "native"

[connector.state]
model = "stateless"
state_schema_version = "1"
migration_hint = "Provides answer synthesis via chat completions plus structured native Search API results."

[zones]
home = "z:work"
allowed_sources = ["z:owner", "z:private", "z:work"]
allowed_targets = ["z:work"]

[capabilities]
required = ["network.dns", "network.egress", "network.tls.sni"]
optional = []
forbidden = ["network.listen", "system.exec"]

[sandbox]
profile = "strict"
memory_mb = 96
cpu_percent = 25
wall_clock_timeout_ms = 30000
deny_exec = true
deny_ptrace = true
