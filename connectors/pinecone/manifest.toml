related = ["pinecone.describe_index"]

[provides.operations."pinecone.query"]
description = "Query vectors by similarity"
capability = "pinecone.vectors.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"

[provides.operations."pinecone.query".input_schema]
required = [
    "index_name",
    "top_k",
]
type = "object"

[provides.operations."pinecone.query".input_schema.properties.filter]
description = "Metadata filter"
type = "object"

[provides.operations."pinecone.query".input_schema.properties.id]
description = "Query by vector ID instead of vector values"
type = "string"

[provides.operations."pinecone.query".input_schema.properties.include_metadata]
default = true
type = "boolean"

[provides.operations."pinecone.query".input_schema.properties.include_values]
default = false
type = "boolean"

[provides.operations."pinecone.query".input_schema.properties.index_name]
type = "string"

[provides.operations."pinecone.query".input_schema.properties.namespace]
type = "string"

[provides.operations."pinecone.query".input_schema.properties.top_k]
description = "Number of results"
type = "integer"

[provides.operations."pinecone.query".input_schema.properties.vector]
description = "Query vector"
type = "array"

[provides.operations."pinecone.query".output_schema]
required = ["matches"]
type = "object"

[provides.operations."pinecone.query".output_schema.properties.matches]
type = "array"

[provides.operations."pinecone.query".output_schema.properties.namespace]
type = "string"

[provides.operations."pinecone.query".network_constraints]
host_allow = ["*.pinecone.io"]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 3
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 10485760

[provides.operations."pinecone.query".ai_hints]
when_to_use = "Find similar vectors by similarity search. Provide either 'vector' or 'id'."
common_mistakes = [
    "Not specifying namespace when index has multiple namespaces.",
    "Setting include_values=true when only metadata is needed (increases response size).",
]
examples = ['{"index_name": "my-index", "vector": [0.1, 0.2, 0.3], "top_k": 10, "include_metadata": true}']
related = [
    "pinecone.fetch",
    "pinecone.upsert",
]

[provides.operations."pinecone.upsert"]
description = "Upsert vectors (insert or update)"
capability = "pinecone.vectors.write"
risk_level = "medium"
safety_tier = "risky"
requires_approval = "policy"
idempotency = "strict"

[provides.operations."pinecone.upsert".input_schema]
required = [
    "index_name",
    "vectors",
]
type = "object"

[provides.operations."pinecone.upsert".input_schema.properties.index_name]
type = "string"

[provides.operations."pinecone.upsert".input_schema.properties.namespace]
type = "string"

[provides.operations."pinecone.upsert".input_schema.properties.vectors]
description = "Array of {id, values, metadata} objects"
type = "array"

[provides.operations."pinecone.upsert".output_schema]
required = ["upserted_count"]
type = "object"

[provides.operations."pinecone.upsert".output_schema.properties.upserted_count]
type = "integer"

[provides.operations."pinecone.upsert".network_constraints]
host_allow = ["*.pinecone.io"]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 3
connect_timeout_ms = 10000
total_timeout_ms = 60000
max_response_bytes = 1048576

[provides.operations."pinecone.upsert".ai_hints]
when_to_use = "Insert new vectors or update existing ones. Batch up to 100 vectors per request."
common_mistakes = ["Exceeding max batch size (100 vectors) or max request size (2MB)."]
examples = ['{"index_name": "my-index", "vectors": [{"id": "vec-1", "values": [0.1, 0.2, 0.3], "metadata": {"text": "hello"}}]}']
related = [
    "pinecone.query",
    "pinecone.delete",
]

[sandbox]
profile = "strict"
memory_mb = 256
cpu_percent = 50
wall_clock_timeout_ms = 300000
fs_readonly_paths = [
    "/usr",
    "/lib",
]
fs_writable_paths = ["$CONNECTOR_STATE"]
deny_exec = true
deny_ptrace = true

[[rate_limits.pools]]
id = "pinecone.indexes.read"
requests = 60
window_ms = 60000
burst = 10
scope = "instance"

[[rate_limits.pools]]
id = "pinecone.indexes.write"
requests = 10
window_ms = 60000
burst = 3
scope = "instance"

[[rate_limits.pools]]
id = "pinecone.vectors.read"
requests = 300
window_ms = 60000
burst = 50
scope = "instance"

[[rate_limits.pools]]
id = "pinecone.vectors.write"
requests = 100
window_ms = 60000
burst = 20
scope = "instance"

[rate_limits.operation_pools]
"pinecone.delete_index" = ["pinecone.indexes.write"]
"pinecone.create_index" = ["pinecone.indexes.write"]
"pinecone.query" = ["pinecone.vectors.read"]
"pinecone.list_indexes" = ["pinecone.indexes.read"]
"pinecone.describe_index" = ["pinecone.indexes.read"]
"pinecone.fetch" = ["pinecone.vectors.read"]
"pinecone.delete" = ["pinecone.vectors.write"]
"pinecone.describe_index_stats" = ["pinecone.indexes.read"]
"pinecone.upsert" = ["pinecone.vectors.write"]
