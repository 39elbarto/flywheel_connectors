[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = []
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:db5c33dffc2f762d82bfadcc2272cb1b6ff26543e40f93c738331b084df7b1df"

[connector]
id = "fcp.pinecone"
name = "Pinecone Connector"
version = "0.1.0"
description = "FCP connector for Pinecone vector database — index management, vector CRUD, similarity search"
archetypes = [
    "knowledge",
    "operational",
]
format = "wasi"

[connector.state]
model = "stateless"
state_schema_version = "1"
migration_hint = "init"

[zones]
home = "z:work"
allowed_sources = [
    "z:owner",
    "z:private",
    "z:work",
]
allowed_targets = ["z:work"]
forbidden = [
    "z:public",
    "z:community",
]

[capabilities]
required = [
    "network.dns",
    "network.egress",
    "network.tls.sni",
]
optional = []
forbidden = [
    "system.exec",
    "network.listen",
    "media.upload",
    "media.download",
]

[provides.operations."pinecone.create_index"]
description = "Create a new index"
capability = "pinecone.indexes.write"
risk_level = "medium"
safety_tier = "risky"
requires_approval = "policy"
idempotency = "best_effort"

[provides.operations."pinecone.create_index".input_schema]
required = [
    "name",
    "dimension",
]
type = "object"

[provides.operations."pinecone.create_index".input_schema.properties.dimension]
type = "integer"

[provides.operations."pinecone.create_index".input_schema.properties.metric]
default = "cosine"
type = "string"

[provides.operations."pinecone.create_index".input_schema.properties.name]
type = "string"

[provides.operations."pinecone.create_index".input_schema.properties.spec]
description = "Index spec (serverless or pod configuration)"
type = "object"

[provides.operations."pinecone.create_index".output_schema]
required = [
    "name",
    "dimension",
    "metric",
]
type = "object"

[provides.operations."pinecone.create_index".output_schema.properties.dimension]
type = "integer"

[provides.operations."pinecone.create_index".output_schema.properties.host]
type = "string"

[provides.operations."pinecone.create_index".output_schema.properties.metric]
type = "string"

[provides.operations."pinecone.create_index".output_schema.properties.name]
type = "string"

[provides.operations."pinecone.create_index".output_schema.properties.status]
type = "object"

[provides.operations."pinecone.create_index".network_constraints]
host_allow = ["*.pinecone.io"]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 3
connect_timeout_ms = 10000
total_timeout_ms = 60000
max_response_bytes = 1048576

[provides.operations."pinecone.create_index".ai_hints]
when_to_use = "Create a new Pinecone index. Choose dimension and metric carefully."
common_mistakes = ["Wrong dimension for your embedding model."]
examples = ['{"name": "my-index", "dimension": 1536, "metric": "cosine", "spec": {"serverless": {"cloud": "aws", "region": "us-east-1"}}}']
related = [
    "pinecone.list_indexes",
    "pinecone.delete_index",
]

[provides.operations."pinecone.delete"]
description = "Delete vectors by ID, filter, or delete all in namespace"
capability = "pinecone.vectors.write"
risk_level = "high"
safety_tier = "dangerous"
requires_approval = "interactive"
idempotency = "strict"

[provides.operations."pinecone.delete".input_schema]
required = ["index_name"]
type = "object"

[provides.operations."pinecone.delete".input_schema.properties.delete_all]
default = false
type = "boolean"

[provides.operations."pinecone.delete".input_schema.properties.filter]
type = "object"

[provides.operations."pinecone.delete".input_schema.properties.ids]
type = "array"

[provides.operations."pinecone.delete".input_schema.properties.index_name]
type = "string"

[provides.operations."pinecone.delete".input_schema.properties.namespace]
type = "string"

[provides.operations."pinecone.delete".output_schema]
type = "object"

[provides.operations."pinecone.delete".network_constraints]
host_allow = ["*.pinecone.io"]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 3
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 1048576

[provides.operations."pinecone.delete".ai_hints]
when_to_use = "Delete vectors by ID, metadata filter, or clear an entire namespace. Irreversible."
common_mistakes = ["Setting delete_all=true without specifying namespace — deletes everything."]
examples = ['{"index_name": "my-index", "ids": ["vec-1", "vec-2"]}']
related = ["pinecone.upsert"]

[provides.operations."pinecone.delete_index"]
description = "Delete an index and all its data"
capability = "pinecone.indexes.write"
risk_level = "high"
safety_tier = "dangerous"
requires_approval = "interactive"
idempotency = "strict"

[provides.operations."pinecone.delete_index".input_schema]
required = ["index_name"]
type = "object"

[provides.operations."pinecone.delete_index".input_schema.properties.index_name]
type = "string"

[provides.operations."pinecone.delete_index".output_schema]
required = [
    "deleted",
    "index_name",
]
type = "object"

[provides.operations."pinecone.delete_index".output_schema.properties.deleted]
type = "boolean"

[provides.operations."pinecone.delete_index".output_schema.properties.index_name]
type = "string"

[provides.operations."pinecone.delete_index".network_constraints]
host_allow = ["*.pinecone.io"]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 3
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 1048576

[provides.operations."pinecone.delete_index".ai_hints]
when_to_use = "Delete a Pinecone index. This is irreversible and deletes all data."
common_mistakes = ["Deleting production indexes without backup."]
examples = ['{"index_name": "my-index"}']
related = [
    "pinecone.create_index",
    "pinecone.list_indexes",
]

[provides.operations."pinecone.describe_index"]
description = "Get index configuration and statistics"
capability = "pinecone.indexes.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"

[provides.operations."pinecone.describe_index".input_schema]
required = ["index_name"]
type = "object"

[provides.operations."pinecone.describe_index".input_schema.properties.index_name]
type = "string"

[provides.operations."pinecone.describe_index".output_schema]
required = [
    "name",
    "dimension",
    "metric",
    "status",
]
type = "object"

[provides.operations."pinecone.describe_index".output_schema.properties.dimension]
type = "integer"

[provides.operations."pinecone.describe_index".output_schema.properties.metric]
type = "string"

[provides.operations."pinecone.describe_index".output_schema.properties.name]
type = "string"

[provides.operations."pinecone.describe_index".output_schema.properties.status]
type = "object"

[provides.operations."pinecone.describe_index".network_constraints]
host_allow = ["*.pinecone.io"]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 3
connect_timeout_ms = 10000
total_timeout_ms = 15000
max_response_bytes = 1048576

[provides.operations."pinecone.describe_index".ai_hints]
when_to_use = "Get details about a specific index: dimension, metric, pod type, replicas."
common_mistakes = ["Querying an index that is still initializing and not yet ready for operations."]
examples = ['{"index_name": "my-index"}']
related = [
    "pinecone.list_indexes",
    "pinecone.describe_index_stats",
]

[provides.operations."pinecone.describe_index_stats"]
description = "Get per-namespace vector counts and index fullness"
capability = "pinecone.indexes.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"

[provides.operations."pinecone.describe_index_stats".input_schema]
required = ["index_name"]
type = "object"

[provides.operations."pinecone.describe_index_stats".input_schema.properties.filter]
description = "Metadata filter to count matching vectors only"
type = "object"

[provides.operations."pinecone.describe_index_stats".input_schema.properties.index_name]
type = "string"

[provides.operations."pinecone.describe_index_stats".output_schema]
required = [
    "namespaces",
    "dimension",
    "index_fullness",
    "total_vector_count",
]
type = "object"

[provides.operations."pinecone.describe_index_stats".output_schema.properties.dimension]
type = "integer"

[provides.operations."pinecone.describe_index_stats".output_schema.properties.index_fullness]
type = "number"

[provides.operations."pinecone.describe_index_stats".output_schema.properties.namespaces]
type = "object"

[provides.operations."pinecone.describe_index_stats".output_schema.properties.total_vector_count]
type = "integer"

[provides.operations."pinecone.describe_index_stats".network_constraints]
host_allow = ["*.pinecone.io"]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 3
connect_timeout_ms = 10000
total_timeout_ms = 15000
max_response_bytes = 1048576

[provides.operations."pinecone.describe_index_stats".ai_hints]
when_to_use = "Get vector counts per namespace and overall index utilization."
common_mistakes = ["Expecting real-time counts immediately after upsert — stats may lag behind recent writes."]
examples = ['{"index_name": "my-index"}']
related = ["pinecone.describe_index"]

[provides.operations."pinecone.fetch"]
description = "Fetch vectors by ID"
capability = "pinecone.vectors.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"

[provides.operations."pinecone.fetch".input_schema]
required = [
    "index_name",
    "ids",
]
type = "object"

[provides.operations."pinecone.fetch".input_schema.properties.ids]
type = "array"

[provides.operations."pinecone.fetch".input_schema.properties.index_name]
type = "string"

[provides.operations."pinecone.fetch".input_schema.properties.namespace]
type = "string"

[provides.operations."pinecone.fetch".output_schema]
required = ["vectors"]
type = "object"

[provides.operations."pinecone.fetch".output_schema.properties.vectors]
type = "object"

[provides.operations."pinecone.fetch".network_constraints]
host_allow = ["*.pinecone.io"]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 3
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 10485760

[provides.operations."pinecone.fetch".ai_hints]
when_to_use = "Retrieve specific vectors by their IDs."
common_mistakes = ["Fetching too many IDs at once (max 1000 per request)."]
examples = ['{"index_name": "my-index", "ids": ["vec-1", "vec-2"]}']
related = ["pinecone.query"]

[provides.operations."pinecone.list_indexes"]
description = "List all indexes in the project"
capability = "pinecone.indexes.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"

[provides.operations."pinecone.list_indexes".input_schema]
required = []
type = "object"

[provides.operations."pinecone.list_indexes".output_schema]
required = ["indexes"]
type = "object"

[provides.operations."pinecone.list_indexes".output_schema.properties.indexes]
type = "array"

[provides.operations."pinecone.list_indexes".network_constraints]
host_allow = ["*.pinecone.io"]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
