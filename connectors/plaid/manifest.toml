[event_caps]
streaming = true
replay = false
min_buffer_events = 100

[sandbox]
profile = "strict"
memory_mb = 256
cpu_percent = 50
wall_clock_timeout_ms = 300000
fs_readonly_paths = [
    "/usr",
    "/lib",
]
fs_writable_paths = ["$CONNECTOR_STATE"]
deny_exec = true
deny_ptrace = true

[[rate_limits.pools]]
id = "plaid.link"
requests = 30
window_ms = 60000
burst = 5
scope = "instance"

[[rate_limits.pools]]
id = "plaid.accounts.read"
requests = 120
window_ms = 60000
burst = 20
scope = "instance"

[[rate_limits.pools]]
id = "plaid.transactions.read"
requests = 60
window_ms = 60000
burst = 10
scope = "instance"

[[rate_limits.pools]]
id = "plaid.identity.read"
requests = 30
window_ms = 60000
burst = 5
scope = "instance"

[[rate_limits.pools]]
id = "plaid.auth.read"
requests = 30
window_ms = 60000
burst = 5
scope = "instance"

[[rate_limits.pools]]
