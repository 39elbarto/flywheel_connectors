[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = []
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:bf9cd2662e3662db6246b80e1afa458e65f8e912fc7849acbcd4b8a42f9890c3"

[connector]
id = "fcp.plaid"
name = "Plaid Connector"
version = "0.1.0"
description = "FCP connector for Plaid financial data — accounts, transactions, balances, identity, auth, investments, liabilities"
archetypes = [
    "knowledge",
    "operational",
    "streaming",
]
format = "wasi"

[connector.state]
model = "singleton_writer"
state_schema_version = "1"
migration_hint = "Stores transactions_sync cursor, access tokens, and item metadata per linked institution."

[zones]
home = "z:private"
allowed_sources = [
    "z:owner",
    "z:private",
]
allowed_targets = ["z:private"]
forbidden = [
    "z:public",
    "z:community",
    "z:work",
]

[capabilities]
required = [
    "network.dns",
    "network.egress",
    "network.tls.sni",
    "storage.state",
]
optional = []
forbidden = [
    "system.exec",
    "network.listen",
    "media.upload",
    "media.download",
]

