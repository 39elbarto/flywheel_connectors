window_ms = 60000
burst = 10
scope = "instance"

[[rate_limits.pools]]
id = "plaid.liabilities.read"
requests = 60
window_ms = 60000
burst = 10
scope = "instance"

[rate_limits.operation_pools]
"plaid.link_token_create" = ["plaid.link"]
"plaid.identity_get" = ["plaid.identity.read"]
"plaid.accounts_get" = ["plaid.accounts.read"]
"plaid.auth_get" = ["plaid.auth.read"]
"plaid.accounts_balance_get" = ["plaid.accounts.read"]
"plaid.token_exchange" = ["plaid.link"]
"plaid.investments_holdings_get" = ["plaid.investments.read"]
"plaid.transactions_get" = ["plaid.transactions.read"]
"plaid.liabilities_get" = ["plaid.liabilities.read"]
"plaid.transactions_sync" = ["plaid.transactions.read"]
