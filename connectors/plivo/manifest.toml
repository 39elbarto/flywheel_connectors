[provides.operations."plivo.webhook.ingest_request".ai_hints]
when_to_use = "Use this for a Plivo webhook forwarded by the FCP host so the connector can verify signature/replay, parse the event, and apply inbound policy."
common_mistakes = [
    "Letting the connector open a network listener; webhooks must be forwarded through the host boundary.",
    "Parsing or emitting events before signature and replay checks pass.",
    "Forgetting to include the exact URL and headers Plivo signed.",
]
examples = ['{"url":"https://voice.example.com/plivo/webhook","headers":{"X-Plivo-Signature-V3":"signature","X-Plivo-Signature-V3-Nonce":"nonce"},"body":{"CallUUID":"call-uuid-123","From":"+15551234567"},"inbound_policy":"allowlist","allowed_from":["+15551234567"]}']
related = [
    "plivo.webhook.validate_signature",
    "plivo.webhook.evaluate_inbound_policy",
    "plivo.webhook.parse_event",
]

