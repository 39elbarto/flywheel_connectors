[provides.operations."plivo.webhook.evaluate_inbound_policy".ai_hints]
when_to_use = "Use this after signature validation to decide whether an inbound Plivo webhook caller should be accepted by the configured policy."
common_mistakes = [
    "Applying caller allowlists before plivo.webhook.validate_signature passes.",
    "Using partial phone-number matching instead of exact E.164 allowlist entries.",
    "Treating missing From values as allowed callers.",
]
examples = ['{"body":{"From":"+15551234567","To":"+15559876543","CallUUID":"call-uuid-123"},"inbound_policy":"allowlist","allowed_from":["+15551234567"]}']
related = [
    "plivo.webhook.validate_signature",
    "plivo.webhook.ingest_request",
    "plivo.webhook.parse_event",
]

