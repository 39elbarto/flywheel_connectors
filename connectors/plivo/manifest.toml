[provides.operations."plivo.webhook.parse_event".ai_hints]
when_to_use = "Use this local parser only after a Plivo webhook has been authenticated and replay-checked."
common_mistakes = [
    "Parsing unauthenticated webhook bodies and trusting caller-supplied fields.",
    "Logging full From, To, or CallUUID fields instead of masked or hashed fields from the parsed output.",
    "Expecting parse_event to verify signatures; plivo.webhook.validate_signature does that.",
]
examples = ['{"body":{"CallUUID":"call-uuid-123","CallStatus":"answer","From":"+15551234567","To":"+15559876543"}}']
