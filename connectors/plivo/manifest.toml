capability = "plivo.voice"
risk_level = "high"
safety_tier = "dangerous"
requires_approval = "policy"
idempotency = "none"

[provides.operations."plivo.call.transfer".input_schema]
required = [
    "call_uuid",
    "legs",
]
type = "object"

[provides.operations."plivo.call.transfer".output_schema]
type = "object"

[provides.operations."plivo.call.transfer".network_constraints]
host_allow = ["api.plivo.com"]
port_allow = [443]
ip_allow = []
cidr_deny = []
