[provides.operations."plivo.webhook.validate_signature".ai_hints]
when_to_use = "Use this before trusting any Plivo webhook body to verify V3/V2 HMAC headers, replay state, and signed URL material."
common_mistakes = [
    "Reconstructing the URL differently from the public URL Plivo signed, including scheme or query changes.",
    "Using Twilio-style signature logic; Plivo V3 uses Plivo HMAC header and nonce material.",
    "Dropping repeated body parameters before signature verification.",
]
examples = ['{"url":"https://voice.example.com/plivo/webhook","headers":{"X-Plivo-Signature-V3":"signature","X-Plivo-Signature-V3-Nonce":"nonce"},"body":{"CallUUID":"call-uuid-123"}}']
related = [
    "plivo.webhook.ingest_request",
    "plivo.webhook.parse_event",
    "plivo.webhook.evaluate_inbound_policy",
]

[sandbox]
profile = "strict"
memory_mb = 64
cpu_percent = 20
wall_clock_timeout_ms = 30000
fs_readonly_paths = ["/usr"]
fs_writable_paths = ["$CONNECTOR_STATE"]
deny_exec = true
deny_ptrace = true
