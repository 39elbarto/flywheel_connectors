deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 0
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 1048576

[provides.operations."plivo.call.transfer".ai_hints]
when_to_use = "Use this only after approval to redirect one or both live call legs to a new Plivo XML URL."
common_mistakes = [
    "Setting legs to aleg, bleg, or both without providing the matching transfer URL field.",
    "Confusing transfer with continue; continue moves call control, transfer redirects call legs.",
    "Using an untrusted XML URL that can take over live call behavior.",
]
examples = ['{"call_uuid":"call-uuid-123","legs":"aleg","aleg_url":"https://voice.example.com/plivo/agent.xml"}']
related = [
    "plivo.call.status",
    "plivo.call.continue",
    "plivo.call.end",
]

[provides.operations."plivo.webhook.evaluate_inbound_policy"]
