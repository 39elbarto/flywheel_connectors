[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = []
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:a00e6f61de31909f3a359510923b7c77303aab4b3031f55ed951fa96b83fe550"

[connector]
id = "fcp.plivo"
name = "Plivo Connector"
version = "0.1.0"
description = "FCP voice-call connector for Plivo Voice"
archetypes = [
    "operational",
    "streaming",
    "bidirectional",
]
format = "wasi"

[connector.state]
model = "singleton_writer"
state_schema_version = "1"
migration_hint = "init"

[zones]
home = "z:work"
allowed_sources = [
    "z:owner",
    "z:private",
    "z:work",
]
allowed_targets = ["z:work"]
forbidden = ["z:public"]

[capabilities]
required = [
    "network.dns",
    "network.egress",
    "network.tls.sni",
    "storage.state",
]
optional = [
    "plivo.voice",
    "plivo.read",
    "plivo.webhook",
]
forbidden = [
    "system.exec",
    "network.listen",
]

[provides.operations."plivo.call.continue"]
description = "Continue a Plivo call by transferring one or both legs to new XML"
capability = "plivo.voice"
risk_level = "medium"
safety_tier = "risky"
requires_approval = "policy"
idempotency = "best_effort"

[provides.operations."plivo.call.continue".input_schema]
required = [
    "call_uuid",
    "xml_url",
]
type = "object"

[provides.operations."plivo.call.continue".output_schema]
type = "object"

[provides.operations."plivo.call.continue".network_constraints]
host_allow = ["api.plivo.com"]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 0
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 1048576

[provides.operations."plivo.call.continue".ai_hints]
when_to_use = "Use this to move an active Plivo call to fresh XML control after the call UUID and next control URL are known."
common_mistakes = [
    "Using a phone number instead of the Plivo call_uuid; provider control APIs require the call UUID.",
    "Passing a non-HTTPS or untrusted xml_url; Plivo will fetch this URL to control the live call.",
    "Using continue to start a new call; plivo.call.initiate creates outbound calls.",
]
examples = ['{"call_uuid":"call-uuid-123","xml_url":"https://voice.example.com/plivo/next.xml"}']
related = [
    "plivo.call.status",
    "plivo.call.speak",
    "plivo.call.transfer",
]

[provides.operations."plivo.call.end"]
description = "Hang up a Plivo call"
capability = "plivo.voice"
risk_level = "high"
safety_tier = "dangerous"
requires_approval = "policy"
idempotency = "best_effort"

[provides.operations."plivo.call.end".input_schema]
required = ["call_uuid"]
type = "object"

[provides.operations."plivo.call.end".output_schema]
type = "object"

[provides.operations."plivo.call.end".network_constraints]
host_allow = ["api.plivo.com"]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 0
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 1048576

[provides.operations."plivo.call.end".ai_hints]
when_to_use = "Use this after policy approval to hang up a known active Plivo call by call_uuid."
common_mistakes = [
    "Treating retries as harmless; a successful first attempt may already have disconnected the call.",
    "Supplying a phone number or session id instead of the Plivo call_uuid.",
    "Ending a call before checking whether transfer, speak, or gather work is still pending.",
]
examples = ['{"call_uuid":"call-uuid-123"}']
related = [
    "plivo.call.status",
    "plivo.call.initiate",
]

[provides.operations."plivo.call.gather"]
description = "Generate Plivo GetDigits XML for DTMF collection"
capability = "plivo.voice"
risk_level = "medium"
safety_tier = "risky"
requires_approval = "policy"
idempotency = "strict"

[provides.operations."plivo.call.gather".input_schema]
required = [
    "prompt",
    "action_url",
]
type = "object"

[provides.operations."plivo.call.gather".output_schema]
type = "object"

[provides.operations."plivo.call.gather".network_constraints]
host_allow = ["none.invalid"]
port_allow = [0]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = false
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 0
max_redirects = 0
connect_timeout_ms = 1000
total_timeout_ms = 30000
max_response_bytes = 1048576

[provides.operations."plivo.call.gather".ai_hints]
when_to_use = "Use this to generate GetDigits XML for an IVR prompt that Plivo will fetch during call flow control."
common_mistakes = [
    "Expecting this local XML generator to collect digits itself; Plivo collects digits after the XML is hosted and fetched.",
    "Using an action_url that Plivo cannot reach or that lacks call-auth/session validation.",
    "Putting secrets or full caller data in prompt text that can appear in call logs.",
]
examples = ['{"prompt":"Press 1 for support or 2 for billing.","action_url":"https://voice.example.com/plivo/digits"}']
related = [
    "plivo.call.continue",
    "plivo.call.initiate",
]

[provides.operations."plivo.call.initiate"]
description = "Initiate an outbound Plivo voice call with FCP callback/session binding"
capability = "plivo.voice"
risk_level = "high"
safety_tier = "dangerous"
requires_approval = "policy"
idempotency = "none"

[provides.operations."plivo.call.initiate".input_schema]
required = [
    "to",
    "from",
    "answer_url",
]
type = "object"

[provides.operations."plivo.call.initiate".output_schema]
type = "object"

[provides.operations."plivo.call.initiate".network_constraints]
host_allow = ["api.plivo.com"]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 0
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 1048576

[provides.operations."plivo.call.initiate".ai_hints]
when_to_use = "Use this only when a task is approved to place an outbound Plivo call from an authorized sender to a destination."
common_mistakes = [
    "Retrying after a timeout without an idempotency guard; this operation can place duplicate calls.",
    "Using an answer_url that is not public HTTPS or does not include the expected FCP callback binding.",
    "Initiating calls without confirming the from number is provisioned on the Plivo account.",
]
examples = ['{"to":"+15551234567","from":"+15559876543","answer_url":"https://voice.example.com/plivo/answer.xml"}']
related = [
    "plivo.call.status",
    "plivo.call.end",
    "plivo.call.gather",
]

[provides.operations."plivo.call.speak"]
description = "Speak text into a Plivo call"
capability = "plivo.voice"
risk_level = "medium"
safety_tier = "risky"
requires_approval = "policy"
idempotency = "none"

[provides.operations."plivo.call.speak".input_schema]
required = [
    "call_uuid",
    "text",
]
type = "object"

[provides.operations."plivo.call.speak".output_schema]
type = "object"

[provides.operations."plivo.call.speak".network_constraints]
host_allow = ["api.plivo.com"]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 0
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 1048576

[provides.operations."plivo.call.speak".ai_hints]
when_to_use = "Use this to inject a short spoken prompt into an active Plivo call after the target call_uuid is known."
common_mistakes = [
    "Sending long or sensitive text that will be spoken to a real person and may be logged.",
    "Using speak as a replacement for full call-flow XML; use gather or continue for branching IVR flows.",
    "Retrying blindly; repeated speaks may replay audio to the caller.",
]
examples = ['{"call_uuid":"call-uuid-123","text":"Please hold while I connect you."}']
related = [
    "plivo.call.status",
    "plivo.call.gather",
    "plivo.call.end",
]

[provides.operations."plivo.call.status"]
description = "Retrieve Plivo call status"
capability = "plivo.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"

[provides.operations."plivo.call.status".input_schema]
required = ["call_uuid"]
type = "object"

[provides.operations."plivo.call.status".output_schema]
type = "object"

[provides.operations."plivo.call.status".network_constraints]
host_allow = ["api.plivo.com"]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 0
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 1048576

[provides.operations."plivo.call.status".ai_hints]
when_to_use = "Use this to read provider status and metadata for a known Plivo call_uuid before deciding whether to speak, transfer, or end it."
common_mistakes = [
    "Polling too aggressively and exhausting account rate limits.",
    "Using status to validate a webhook; plivo.webhook.validate_signature covers webhook authenticity.",
    "Assuming a missing call is safe to retry as a new call without checking prior initiate results.",
]
examples = ['{"call_uuid":"call-uuid-123"}']
related = [
    "plivo.call.initiate",
    "plivo.call.end",
    "plivo.call.transfer",
]

[provides.operations."plivo.call.transfer"]
