[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = []
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:fe9c3f6d70ea0fb8bcd9fac51590eab027c108ea6cdecfffc82df077b509e647"

[connector]
id = "fcp.plivo"
name = "Plivo Connector"
version = "0.1.0"
description = "FCP voice-call connector for Plivo Voice"
archetypes = [
    "operational",
    "streaming",
    "bidirectional",
]
format = "wasi"

[connector.state]
model = "singleton_writer"
state_schema_version = "1"
migration_hint = "init"

[zones]
home = "z:work"
allowed_sources = [
    "z:owner",
    "z:private",
    "z:work",
]
allowed_targets = ["z:work"]
forbidden = ["z:public"]

[capabilities]
required = [
    "network.dns",
    "network.egress",
    "network.tls.sni",
    "storage.state",
]
optional = [
    "plivo.voice",
    "plivo.read",
    "plivo.webhook",
]
forbidden = [
    "system.exec",
    "network.listen",
]

[provides.operations."plivo.call.continue"]
description = "Continue a Plivo call by transferring one or both legs to new XML"
capability = "plivo.voice"
risk_level = "medium"
safety_tier = "risky"
requires_approval = "policy"
idempotency = "best_effort"

[provides.operations."plivo.call.continue".input_schema]
required = [
    "call_uuid",
    "xml_url",
]
type = "object"

[provides.operations."plivo.call.continue".output_schema]
type = "object"

[provides.operations."plivo.call.continue".network_constraints]
host_allow = ["api.plivo.com"]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 0
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 1048576

[provides.operations."plivo.call.continue".ai_hints]
when_to_use = ""
common_mistakes = []
examples = []
related = []

