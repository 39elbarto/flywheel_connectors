[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = []
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:059c1c1fc95d1bf4849e5fbba0c14064fdef8fcc5f4891dd589242e628ae3754"

[connector]
id = "fcp.posthog"
name = "PostHog Connector"
version = "0.1.0"
description = "FCP connector for PostHog product analytics (events, insights, feature flags)"
archetypes = ["knowledge"]
format = "wasi"

[connector.state]
model = "singleton_writer"
state_schema_version = "1"
migration_hint = "Stores personal API key and project ID."

[zones]
home = "z:work"
allowed_sources = [
    "z:owner",
    "z:private",
    "z:work",
]
allowed_targets = ["z:work"]
forbidden = [
    "z:public",
    "z:community",
]

[capabilities]
required = [
    "network.dns",
    "network.egress",
    "network.tls.sni",
    "storage.state",
]
optional = []
forbidden = [
    "system.exec",
    "network.listen",
    "media.upload",
    "media.download",
]

[provides.operations."posthog.events.query"]
description = "Query events with HogQL"
capability = "posthog.events.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"

[provides.operations."posthog.events.query".input_schema]
required = ["query"]
type = "object"

[provides.operations."posthog.events.query".input_schema.properties.query]
description = "HogQL query string"
type = "string"

[provides.operations."posthog.events.query".output_schema]
required = ["results"]
type = "object"

[provides.operations."posthog.events.query".output_schema.properties.results]
type = "array"

[provides.operations."posthog.events.query".network_constraints]
host_allow = [
    "app.posthog.com",
    "us.posthog.com",
    "eu.posthog.com",
]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 3
connect_timeout_ms = 10000
total_timeout_ms = 60000
max_response_bytes = 52428800

[provides.operations."posthog.events.query".ai_hints]
when_to_use = "Query PostHog events using HogQL."
common_mistakes = ["Writing standard SQL instead of HogQL — use PostHog-specific table names like 'events' and 'persons', and HogQL functions for property access."]
examples = ['{"query": "SELECT event, count() FROM events GROUP BY event ORDER BY count() DESC LIMIT 10"}']
related = [
    "posthog.insights.list",
    "posthog.feature_flags.list",
]

[provides.operations."posthog.feature_flags.list"]
description = "List feature flags"
capability = "posthog.feature_flags.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"

[provides.operations."posthog.feature_flags.list".input_schema]
required = []
type = "object"

[provides.operations."posthog.feature_flags.list".output_schema]
required = ["results"]
type = "object"

[provides.operations."posthog.feature_flags.list".output_schema.properties.results]
type = "array"

[provides.operations."posthog.feature_flags.list".network_constraints]
host_allow = [
    "app.posthog.com",
    "us.posthog.com",
    "eu.posthog.com",
]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 3
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 10485760

[provides.operations."posthog.feature_flags.list".ai_hints]
when_to_use = "List feature flags in PostHog."
common_mistakes = ["Assuming all returned flags are active — check the 'active' field since archived or disabled flags are included in the list."]
examples = ["{}"]
related = [
    "posthog.events.query",
    "posthog.insights.list",
]

[provides.operations."posthog.insights.list"]
description = "List saved insights"
capability = "posthog.insights.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"

[provides.operations."posthog.insights.list".input_schema]
required = []
type = "object"

[provides.operations."posthog.insights.list".output_schema]
required = ["results"]
type = "object"

[provides.operations."posthog.insights.list".output_schema.properties.results]
type = "array"

[provides.operations."posthog.insights.list".network_constraints]
host_allow = [
    "app.posthog.com",
    "us.posthog.com",
    "eu.posthog.com",
]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 3
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 10485760

[provides.operations."posthog.insights.list".ai_hints]
when_to_use = "List saved insights in PostHog."
common_mistakes = ["Expecting full result data in the list response — this returns insight metadata and definitions; run each insight separately for actual analytics data."]
examples = ["{}"]
related = [
    "posthog.events.query",
    "posthog.feature_flags.list",
]

[sandbox]
profile = "strict"
memory_mb = 256
cpu_percent = 50
wall_clock_timeout_ms = 300000
fs_readonly_paths = [
    "/usr",
    "/lib",
]
fs_writable_paths = ["$CONNECTOR_STATE"]
deny_exec = true
deny_ptrace = true

[[rate_limits.pools]]
id = "posthog.events.read"
requests = 100
window_ms = 60000
burst = 10
scope = "instance"

[[rate_limits.pools]]
id = "posthog.insights.read"
requests = 200
window_ms = 60000
burst = 20
scope = "instance"

[[rate_limits.pools]]
id = "posthog.feature_flags.read"
requests = 200
window_ms = 60000
burst = 20
scope = "instance"

[rate_limits.operation_pools]
"posthog.events.query" = ["posthog.events.read"]
"posthog.feature_flags.list" = ["posthog.feature_flags.read"]
"posthog.insights.list" = ["posthog.insights.read"]
