[sandbox]
profile = "strict"
memory_mb = 256
cpu_percent = 50
wall_clock_timeout_ms = 300000
fs_readonly_paths = [
    "/usr",
    "/lib",
]
fs_writable_paths = ["$CONNECTOR_STATE"]
deny_exec = true
deny_ptrace = true

[[rate_limits.pools]]
id = "pulumi.stacks.read"
requests = 200
window_ms = 60000
burst = 20
scope = "instance"

[[rate_limits.pools]]
id = "pulumi.stacks.write"
requests = 30
window_ms = 60000
burst = 5
scope = "instance"

[[rate_limits.pools]]
id = "pulumi.deployments.read"
requests = 100
window_ms = 60000
burst = 10
scope = "instance"

[rate_limits.operation_pools]
"pulumi.stacks.create" = ["pulumi.stacks.write"]
"pulumi.stacks.export" = ["pulumi.stacks.read"]
"pulumi.deployments.list" = ["pulumi.deployments.read"]
"pulumi.stacks.get" = ["pulumi.stacks.read"]
