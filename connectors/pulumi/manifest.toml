[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = []
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:698dd53117767bc20f12a5a9de048e6a09bac794791ec3b5abd45385117ba0f5"

[connector]
id = "fcp.pulumi"
name = "Pulumi Connector"
version = "0.1.0"
description = "FCP connector for Pulumi infrastructure-as-code (stacks, deployments, previews)"
archetypes = ["operational"]
format = "wasi"

[connector.state]
model = "singleton_writer"
state_schema_version = "1"
migration_hint = "Stores Pulumi access token and org/project context."

[zones]
home = "z:work"
allowed_sources = [
    "z:owner",
    "z:private",
    "z:work",
]
allowed_targets = ["z:work"]
forbidden = [
    "z:public",
    "z:community",
]

[capabilities]
required = [
    "network.dns",
    "network.egress",
    "network.tls.sni",
    "storage.state",
]
optional = []
forbidden = [
    "system.exec",
    "network.listen",
    "media.upload",
    "media.download",
]

[provides.operations."pulumi.deployments.list"]
description = "List recent deployments for a stack"
capability = "pulumi.deployments.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"

[provides.operations."pulumi.deployments.list".input_schema]
required = [
    "organization",
    "project",
    "stack",
]
type = "object"

[provides.operations."pulumi.deployments.list".input_schema.properties.organization]
type = "string"

[provides.operations."pulumi.deployments.list".input_schema.properties.project]
type = "string"

[provides.operations."pulumi.deployments.list".input_schema.properties.stack]
type = "string"

[provides.operations."pulumi.deployments.list".output_schema]
required = ["updates"]
type = "object"

[provides.operations."pulumi.deployments.list".output_schema.properties.updates]
type = "array"

[provides.operations."pulumi.deployments.list".network_constraints]
host_allow = ["api.pulumi.com"]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 3
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 10485760

[provides.operations."pulumi.deployments.list".ai_hints]
when_to_use = "List recent deployments/updates for a stack."
common_mistakes = []
examples = ['{"organization": "myorg", "project": "myproject", "stack": "production"}']
related = ["pulumi.stacks.get"]

