[package]
name = "fcp-qdrant"
description = "Qdrant vector database connector for the Flywheel Connector Protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "fcp_qdrant"
path = "src/lib.rs"

[[bin]]
name = "fcp-qdrant"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
fcp-core = { path = "../../crates/fcp-core" }
fcp-async-core = { path = "../../crates/fcp-async-core" }
fcp-sdk = { path = "../../crates/fcp-sdk" }

anyhow.workspace = true
async-trait.workspace = true
bytes.workspace = true
chrono.workspace = true
futures-util.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

# Integration-testcontainer deps — only pulled in when the
# `integration-testcontainer` feature is enabled. Kept in
# `[dependencies]` (not `[dev-dependencies]`) because Cargo disallows
# `optional = true` on dev-dependencies; they are feature-gated so
# default builds stay offline-friendly and docker-less.
testcontainers = { version = "0.23", optional = true }

[dev-dependencies]
ciborium.workspace = true
wiremock.workspace = true
futures-util.workspace = true
fcp-crypto = { path = "../../crates/fcp-crypto" }
fcp-manifest = { path = "../../crates/fcp-manifest" }
fcp-testkit = { path = "../../crates/fcp-testkit" }

[features]
default = []
# Enable real-Qdrant testcontainer integration tests. Requires a
# running Docker daemon. See tests/lifecycle_integration.rs.
integration-testcontainer = ["dep:testcontainers"]
