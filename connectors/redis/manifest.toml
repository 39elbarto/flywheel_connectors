# redis.smembers — Get all members of a set
# ──────────────────────────────────────────────

[provides.operations."redis.smembers"]
description = "Get all members of a set"
capability = "redis.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"

[provides.operations."redis.smembers".input_schema]
type = "object"
required = ["key"]

[provides.operations."redis.smembers".input_schema.properties.key]
type = "string"
description = "The set key"

[provides.operations."redis.smembers".output_schema]
type = "object"

[provides.operations."redis.smembers".output_schema.properties.members]
type = "array"
description = "All members of the set"

[provides.operations."redis.smembers".network_constraints]
host_allow = ["*.upstash.io"]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 3
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 10485760

[provides.operations."redis.smembers".ai_hints]
when_to_use = "Retrieve all members of a set."
common_mistakes = ["Using SMEMBERS on very large sets — consider SSCAN for sets with thousands of members."]
examples = ['{"key": "tags:article:42"}']
related = ["redis.sadd"]

# ──────────────────────────────────────────────
# Auth
# ──────────────────────────────────────────────

[auth]
method = "bearer"
credential_type = "api_token"
secretless = true
secretless_header = "X-FCP-Credential-Id"

# ──────────────────────────────────────────────
# Config
# ──────────────────────────────────────────────

[config]
required = []
optional = ["base_url"]

[config.fields.api_token]
type = "string"
description = "Upstash Redis REST API token (Bearer auth)"
secret = true

[config.fields.credential_id]
type = "string"
description = "FCP credential ID for secretless auth (mutually exclusive with api_token)"
secret = false

[config.fields.base_url]
type = "string"
description = "Redis REST API base URL (defaults to https://redis.example.com)"
secret = false

# ──────────────────────────────────────────────
# Sandbox
# ──────────────────────────────────────────────

[sandbox]
profile = "strict"
memory_mb = 256
cpu_percent = 50
wall_clock_timeout_ms = 300000
fs_readonly_paths = [
    "/usr",
    "/lib",
]
fs_writable_paths = ["$CONNECTOR_STATE"]
deny_exec = true
deny_ptrace = true

# ──────────────────────────────────────────────
# Rate limits
# ──────────────────────────────────────────────

[[rate_limits.pools]]
id = "redis.read"
requests = 1000
window_ms = 60000
burst = 100
scope = "instance"

[[rate_limits.pools]]
id = "redis.write"
requests = 500
window_ms = 60000
burst = 50
scope = "instance"

[rate_limits.operation_pools]
"redis.get" = ["redis.read"]
"redis.set" = ["redis.write"]
"redis.del" = ["redis.write"]
"redis.exists" = ["redis.read"]
"redis.expire" = ["redis.write"]
"redis.ttl" = ["redis.read"]
"redis.incr" = ["redis.write"]
"redis.hget" = ["redis.read"]
"redis.hset" = ["redis.write"]
"redis.hgetall" = ["redis.read"]
"redis.lpush" = ["redis.write"]
"redis.lrange" = ["redis.read"]
"redis.sadd" = ["redis.write"]
"redis.smembers" = ["redis.read"]
