[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = []
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:PLACEHOLDER_HASH"

[connector]
id = "fcp.redis"
name = "Redis Connector"
version = "0.1.0"
description = "FCP connector for Redis via Upstash-compatible REST API (strings, hashes, lists, sets, TTL management)"
archetypes = [
    "knowledge",
    "operational",
]
format = "wasi"

[connector.state]
model = "singleton_writer"
state_schema_version = "1"
migration_hint = "Stores REST endpoint URL and API token for Upstash-compatible Redis."

[zones]
home = "z:work"
allowed_sources = [
    "z:owner",
    "z:private",
    "z:work",
]
allowed_targets = ["z:work"]
forbidden = [
    "z:public",
    "z:community",
]

[capabilities]
required = [
    "network.dns",
    "network.egress",
    "network.tls.sni",
    "storage.state",
]
optional = []
forbidden = [
    "system.exec",
    "network.listen",
    "media.upload",
    "media.download",
]

# ──────────────────────────────────────────────
# redis.get — Get the value of a key
# ──────────────────────────────────────────────

[provides.operations."redis.get"]
description = "Get the value of a key"
capability = "redis.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"

[provides.operations."redis.get".input_schema]
type = "object"
required = ["key"]

[provides.operations."redis.get".input_schema.properties.key]
type = "string"
description = "The key to get"

[provides.operations."redis.get".output_schema]
type = "object"

[provides.operations."redis.get".output_schema.properties.value]
description = "The value stored at the key, or null if not found"

[provides.operations."redis.get".network_constraints]
host_allow = ["*.upstash.io"]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 3
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 1048576

[provides.operations."redis.get".ai_hints]
when_to_use = "Retrieve the value of a single key from Redis."
common_mistakes = ["Assuming the key exists without checking — value is null when the key is missing."]
examples = ['{"key": "user:1234:name"}']
related = ["redis.set", "redis.exists"]

# ──────────────────────────────────────────────
# redis.set — Set the value of a key
# ──────────────────────────────────────────────

[provides.operations."redis.set"]
description = "Set the value of a key with optional TTL and NX/XX flags"
capability = "redis.write"
risk_level = "medium"
safety_tier = "moderate"
requires_approval = "policy"
idempotency = "best_effort"

[provides.operations."redis.set".input_schema]
type = "object"
required = ["key", "value"]

[provides.operations."redis.set".input_schema.properties.key]
type = "string"
description = "The key to set"

[provides.operations."redis.set".input_schema.properties.value]
type = "string"
description = "The value to set"

[provides.operations."redis.set".input_schema.properties.ttl_seconds]
type = "integer"
description = "Time-to-live in seconds"

[provides.operations."redis.set".input_schema.properties.nx]
type = "boolean"
description = "Only set if key does not exist"

[provides.operations."redis.set".input_schema.properties.xx]
type = "boolean"
description = "Only set if key already exists"

[provides.operations."redis.set".output_schema]
type = "object"

[provides.operations."redis.set".output_schema.properties.result]
description = "OK on success, null if NX/XX condition not met"

[provides.operations."redis.set".network_constraints]
host_allow = ["*.upstash.io"]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 3
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 1048576

[provides.operations."redis.set".ai_hints]
when_to_use = "Store a string value at a key, optionally with a TTL or conditional NX/XX flags."
common_mistakes = [
    "Using both NX and XX together — they are mutually exclusive.",
    "Forgetting to set a TTL for cache entries, leading to unbounded growth.",
]
examples = [
    '{"key": "session:abc", "value": "active", "ttl_seconds": 3600}',
    '{"key": "lock:job:42", "value": "1", "nx": true, "ttl_seconds": 60}',
]
related = ["redis.get", "redis.expire"]

