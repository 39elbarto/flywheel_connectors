[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = []
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:d73bed7487b979fedcc27da5caf883e489bb039a5ee13718662caff72193ac5b"

[connector]
id = "fcp.runway"
name = "Runway"
version = "0.1.0"
description = "Runway async video and image generation connector for Gen-4/Gen-4.5 task workflows"
archetypes = ["operational"]
format = "native"
status = "ready"

[connector.state]
model = "stateless"
state_schema_version = "1"
migration_hint = "Stores no durable state. Operators provide api_key/runway_api_key or credential_id, optional base_url, request timeout, poll interval, and retry bounds."

[zones]
home = "z:work"
allowed_sources = [
    "z:owner",
    "z:private",
    "z:work",
]
allowed_targets = ["z:work"]
forbidden = ["z:public"]

[capabilities]
required = [
    "network.dns",
    "network.egress",
    "network.tls.sni",
]
optional = [
    "runway.video.generate",
    "runway.image.generate",
    "runway.jobs",
    "runway.health.read",
]
forbidden = [
    "system.exec",
    "network.listen",
]

[provides.operations."runway.health"]
description = "Probe Runway organization metadata without submitting a paid generation task."
capability = "runway.health.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"
revocation_freshness = "safe"

[provides.operations."runway.health".input_schema]
type = "object"

[provides.operations."runway.health".input_schema.properties]

[provides.operations."runway.health".output_schema]
type = "object"

[provides.operations."runway.health".network_constraints]
host_allow = ["api.dev.runwayml.com"]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 0
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 1048576

[provides.operations."runway.health".ai_hints]
when_to_use = "Use for a low-cost account/readiness probe through GET /v1/organization."
common_mistakes = ["Do not treat health as generation proof; use the gated e2e script for live task evidence."]
examples = ["{}"]
related = [
    "runway.video.image_to_video",
    "runway.job.status",
]

[provides.operations."runway.image.text_to_image"]
description = "Submit a Runway text/image-to-image generation task through POST /v1/text_to_image."
capability = "runway.image.generate"
risk_level = "medium"
safety_tier = "safe"
requires_approval = "none"
idempotency = "none"
revocation_freshness = "safe"

[provides.operations."runway.image.text_to_image".input_schema]
required = [
    "model",
    "promptText",
]
type = "object"

[provides.operations."runway.image.text_to_image".input_schema.properties.body]
type = "object"

[provides.operations."runway.image.text_to_image".input_schema.properties.model]
examples = ["gen4_image"]
type = "string"

[provides.operations."runway.image.text_to_image".input_schema.properties.params]
type = "object"

[provides.operations."runway.image.text_to_image".input_schema.properties.promptText]
maxLength = 1000
minLength = 1
type = "string"

[provides.operations."runway.image.text_to_image".input_schema.properties.ratio]
examples = ["1360:768"]
type = "string"

[provides.operations."runway.image.text_to_image".input_schema.properties.referenceImages]
type = "array"

[provides.operations."runway.image.text_to_image".output_schema]
type = "object"

[provides.operations."runway.image.text_to_image".network_constraints]
host_allow = ["api.dev.runwayml.com"]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 0
connect_timeout_ms = 10000
total_timeout_ms = 60000
max_response_bytes = 1048576

[provides.operations."runway.image.text_to_image".ai_hints]
when_to_use = "Use for Runway image generation tasks. The connector returns only task metadata and signed output URL metadata."
common_mistakes = [
    "Do not log promptText, reference image URLs, or signed output URLs.",
    "Do not fetch generated image bytes through the connector.",
]
examples = ['{"model":"gen4_image","promptText":"...","ratio":"1360:768"}']
related = ["runway.job.status"]

[provides.operations."runway.job.cancel"]
description = "Cancel or delete a Runway task through DELETE /v1/tasks/{id}; 404 is treated as idempotently safe."
capability = "runway.jobs"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "none"
revocation_freshness = "safe"

[provides.operations."runway.job.cancel".input_schema]
required = ["task_id"]
type = "object"

[provides.operations."runway.job.cancel".input_schema.properties.id]
type = "string"

[provides.operations."runway.job.cancel".input_schema.properties.task_id]
type = "string"

[provides.operations."runway.job.cancel".output_schema]
type = "object"

[provides.operations."runway.job.cancel".network_constraints]
host_allow = ["api.dev.runwayml.com"]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 0
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 1048576

[provides.operations."runway.job.cancel".ai_hints]
when_to_use = "Use to explicitly cancel a queued or running task. Wait timeouts do not cancel tasks automatically."
common_mistakes = [
    "Do not assume local timeout canceled a provider task.",
    "Do not retry canceled tasks automatically.",
]
examples = ['{"task_id":"17f20503-6c24-4c16-946b-35dbbce2af2f"}']
related = ["runway.job.status"]

[provides.operations."runway.job.status"]
description = "Fetch Runway task status and redaction-safe output metadata through GET /v1/tasks/{id}."
capability = "runway.jobs"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"
revocation_freshness = "safe"

[provides.operations."runway.job.status".input_schema]
required = ["task_id"]
type = "object"

[provides.operations."runway.job.status".input_schema.properties.id]
type = "string"

[provides.operations."runway.job.status".input_schema.properties.task_id]
type = "string"

[provides.operations."runway.job.status".output_schema]
type = "object"

[provides.operations."runway.job.status".network_constraints]
host_allow = ["api.dev.runwayml.com"]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 0
