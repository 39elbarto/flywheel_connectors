[provides.operations."runway.job.wait_until_complete".input_schema.properties.id]
type = "string"

[provides.operations."runway.job.wait_until_complete".input_schema.properties.poll_interval_ms]
maximum = 60000
minimum = 1
type = "integer"

[provides.operations."runway.job.wait_until_complete".input_schema.properties.task_id]
type = "string"

[provides.operations."runway.job.wait_until_complete".input_schema.properties.timeout_ms]
maximum = 1800000
minimum = 1
type = "integer"

[provides.operations."runway.job.wait_until_complete".output_schema]
type = "object"

[provides.operations."runway.job.wait_until_complete".network_constraints]
