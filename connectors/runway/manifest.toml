spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 0
connect_timeout_ms = 10000
total_timeout_ms = 300000
max_response_bytes = 1048576

[provides.operations."runway.job.wait_until_complete".ai_hints]
when_to_use = "Use only when the caller explicitly wants bounded connector-side polling. Default timeout is 10 minutes; maximum is 30 minutes."
common_mistakes = [
    "Timeout does not cancel the task; call runway.job.cancel explicitly.",
    "Do not use unbounded waits.",
]
examples = ['{"task_id":"17f20503-6c24-4c16-946b-35dbbce2af2f","timeout_ms":300000,"poll_interval_ms":5000}']
related = [
    "runway.job.status",
    "runway.job.cancel",
]

