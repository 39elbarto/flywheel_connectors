[provides.operations."runway.job.status".ai_hints]
when_to_use = "Use after any submit operation. Terminal statuses include SUCCEEDED, FAILED, and CANCELED."
common_mistakes = [
    "Do not log output URLs from the payload; use output_summary.url_hashes and output_summary.url_hosts for evidence logs.",
    "Poll no faster than a few seconds and prefer jitter/backoff for live systems.",
]
examples = ['{"task_id":"17f20503-6c24-4c16-946b-35dbbce2af2f"}']
related = ["runway.job.wait_until_complete"]

[provides.operations."runway.job.wait_until_complete"]
