[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = []
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:b578f99f4d2d24667101988b8da519aafae234e262f88b001b270a4d6bb5799e"

[connector]
id = "fcp.s3"
name = "S3 Connector"
version = "0.1.0"
description = "FCP connector for AWS S3 compatible object storage (buckets, objects, presigned URLs)"
archetypes = ["storage", "operational"]
format = "wasi"

[connector.state]
model = "singleton_writer"
state_schema_version = "1"
migration_hint = "init"

[zones]
home = "z:private"
allowed_sources = ["z:owner", "z:private", "z:work"]
allowed_targets = ["z:private", "z:work"]
forbidden = ["z:public"]

[capabilities]
required = ["network.dns", "network.egress", "network.tls.sni", "storage.state"]
optional = ["media.download", "media.upload"]
forbidden = ["system.exec", "network.listen"]

# ── Operations ──────────────────────────────────────────────────

[provides.operations."s3.put_object"]
description = "Upload an object to an S3 bucket"
capability = "s3.write"
risk_level = "medium"
safety_tier = "risky"
requires_approval = "policy"
idempotency = "strict"

[provides.operations."s3.put_object".input_schema]
required = ["bucket", "key", "body"]
type = "object"
[provides.operations."s3.put_object".input_schema.properties.bucket]
type = "string"
[provides.operations."s3.put_object".input_schema.properties.key]
type = "string"
[provides.operations."s3.put_object".input_schema.properties.body]
type = "string"

[provides.operations."s3.put_object".output_schema]
required = ["etag"]
type = "object"
[provides.operations."s3.put_object".output_schema.properties.etag]
type = "string"

[provides.operations."s3.put_object".network_constraints]
host_allow = ["*.s3.amazonaws.com", "s3.amazonaws.com", "*.amazonaws.com"]
port_allow = [443]
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 5
connect_timeout_ms = 10000
total_timeout_ms = 300000
max_response_bytes = 1048576

[provides.operations."s3.put_object".ai_hints]
when_to_use = "Upload a file or data to an S3 bucket."
common_mistakes = ["Not specifying Content-Type", "Key names with leading slashes"]
examples = ['{"bucket": "my-bucket", "key": "data/file.json", "body": "{}"}']
related = ["s3.get_object", "s3.delete_object"]

