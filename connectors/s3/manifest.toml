# ── Sandbox ─────────────────────────────────────────────────────

[sandbox]
profile = "strict"
memory_mb = 512
cpu_percent = 50
wall_clock_timeout_ms = 600000
fs_readonly_paths = ["/usr", "/lib"]
fs_writable_paths = ["$CONNECTOR_STATE"]
deny_exec = true
deny_ptrace = true

# ── Rate Limits ─────────────────────────────────────────────────

[[rate_limits.pools]]
id = "s3.read"
requests = 5500
window_ms = 1000
burst = 5500
scope = "instance"

[[rate_limits.pools]]
id = "s3.write"
requests = 3500
window_ms = 1000
burst = 3500
scope = "instance"

[[rate_limits.pools]]
id = "s3.delete"
requests = 3500
window_ms = 1000
burst = 3500
scope = "instance"

[rate_limits.operation_pools]
"s3.put_object" = ["s3.write"]
"s3.get_object" = ["s3.read"]
"s3.delete_object" = ["s3.delete"]
"s3.create_bucket" = ["s3.write"]
"s3.delete_bucket" = ["s3.delete"]
"s3.list_objects" = ["s3.read"]
"s3.head_object" = ["s3.read"]
"s3.copy_object" = ["s3.write"]
"s3.list_buckets" = ["s3.read"]
"s3.generate_presigned_url" = ["s3.read"]
