[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = []
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:437010b963c720e1545cb17363fab90c2e408aa579266e81200ac3737b848cb7"

[connector]
id = "fcp.salesforce"
name = "Salesforce Connector"
version = "0.1.0"
description = "FCP connector for Salesforce CRM platform (accounts, contacts, opportunities, leads, cases, tasks, SOQL, reports)"
archetypes = [
    "knowledge",
    "operational",
]
format = "wasi"

[connector.state]
model = "singleton_writer"
state_schema_version = "1"
migration_hint = "Stores OAuth refresh token, instance URL, last-sync timestamps per sObject type, and pagination cursors."

[zones]
home = "z:work"
allowed_sources = [
    "z:owner",
    "z:private",
    "z:work",
]
allowed_targets = ["z:work"]
forbidden = [
    "z:public",
    "z:community",
]

[capabilities]
required = [
    "network.dns",
    "network.egress",
    "network.tls.sni",
    "storage.state",
]
optional = []
forbidden = [
    "system.exec",
    "network.listen",
    "media.upload",
    "media.download",
]

