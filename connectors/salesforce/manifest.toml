max_response_bytes = 52428800

[provides.operations."salesforce.soql.query".ai_hints]
when_to_use = "Run a SOQL query for complex or cross-object queries."
common_mistakes = [
    "Unbounded queries without LIMIT — can return huge result sets.",
    "Not handling pagination via nextRecordsUrl when done=false.",
]
examples = ["""{"query": "SELECT Id, Name, Amount FROM Opportunity WHERE StageName = 'Closed Won' LIMIT 100"}"""]
related = [
    "salesforce.accounts.list",
    "salesforce.contacts.list",
    "salesforce.reports.get",
]

[sandbox]
profile = "strict"
memory_mb = 256
cpu_percent = 50
wall_clock_timeout_ms = 300000
fs_readonly_paths = [
    "/usr",
    "/lib",
]
fs_writable_paths = ["$CONNECTOR_STATE"]
deny_exec = true
deny_ptrace = true

[[rate_limits.pools]]
id = "salesforce.accounts.read"
requests = 500
window_ms = 60000
burst = 50
scope = "instance"

