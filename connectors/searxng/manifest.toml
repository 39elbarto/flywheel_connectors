common_mistakes = ["Do not fetch image URLs directly through this connector; it only returns SearXNG result metadata.", "Do not log query text, full result URLs, or thumbnails outside redaction-safe evidence."]
examples = ['{"query":"rust logo","safe_search":"strict","max_results":5}']
related = ["searxng.search.query", "searxng.search.news"]

