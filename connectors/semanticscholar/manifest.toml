type = "integer"

[provides.operations."semanticscholar.paper.citations".input_schema.properties.paper_id]
type = "string"

[provides.operations."semanticscholar.paper.citations".output_schema]
required = ["data"]
type = "object"

[provides.operations."semanticscholar.paper.citations".output_schema.properties.data]
