max_response_bytes = 10485760

[provides.operations."semanticscholar.paper.citations".ai_hints]
when_to_use = "Get papers that cite a given paper."
common_mistakes = ["Confusing citations (papers that cite this paper) with references (papers this paper cites) — use paper.references for the bibliography."]
examples = ['{"paper_id": "649def34f8be52c8b66281af98ae884c09aef38b", "limit": 50}']
related = [
    "semanticscholar.paper.get",
    "semanticscholar.paper.references",
]

[provides.operations."semanticscholar.paper.get"]
description = "Get paper details by ID (S2 paper ID, DOI, ArXiv ID, etc.)"
capability = "semanticscholar.papers.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
