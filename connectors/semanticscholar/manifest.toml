[sandbox]
profile = "strict"
memory_mb = 128
cpu_percent = 25
wall_clock_timeout_ms = 120000
fs_readonly_paths = [
    "/usr",
    "/lib",
]
fs_writable_paths = ["$CONNECTOR_STATE"]
deny_exec = true
deny_ptrace = true

[[rate_limits.pools]]
id = "semanticscholar.papers.read"
requests = 100
window_ms = 60000
burst = 10
scope = "instance"

[[rate_limits.pools]]
id = "semanticscholar.authors.read"
requests = 100
window_ms = 60000
burst = 10
scope = "instance"

[rate_limits.operation_pools]
"semanticscholar.author.papers" = ["semanticscholar.authors.read"]
"semanticscholar.paper.recommendations" = ["semanticscholar.papers.read"]
"semanticscholar.paper.references" = ["semanticscholar.papers.read"]
"semanticscholar.author.get" = ["semanticscholar.authors.read"]
"semanticscholar.paper.get" = ["semanticscholar.papers.read"]
"semanticscholar.paper.search" = ["semanticscholar.papers.read"]
"semanticscholar.paper.citations" = ["semanticscholar.papers.read"]
