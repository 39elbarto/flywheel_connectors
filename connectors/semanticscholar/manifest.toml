[provides.operations."semanticscholar.paper.get".input_schema]
required = ["paper_id"]
type = "object"

[provides.operations."semanticscholar.paper.get".input_schema.properties.fields]
type = "string"

[provides.operations."semanticscholar.paper.get".input_schema.properties.paper_id]
description = "S2 paper ID, DOI, ArXiv ID, etc."
type = "string"

[provides.operations."semanticscholar.paper.get".output_schema]
required = [
    "paperId",
    "title",
]
type = "object"

[provides.operations."semanticscholar.paper.get".output_schema.properties.paperId]
type = "string"

[provides.operations."semanticscholar.paper.get".output_schema.properties.title]
