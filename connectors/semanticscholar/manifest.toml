[provides.operations."semanticscholar.paper.get".ai_hints]
when_to_use = "Get details for a specific paper by ID."
common_mistakes = ["Passing a bare arXiv ID without the 'ARXIV:' prefix — use 'ARXIV:2301.08745' or the S2 corpus ID or DOI format."]
examples = ['{"paper_id": "649def34f8be52c8b66281af98ae884c09aef38b", "fields": "title,abstract,authors,year,citationCount"}']
related = [
    "semanticscholar.paper.search",
    "semanticscholar.paper.citations",
]

