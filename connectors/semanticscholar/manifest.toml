[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = []
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:41ca4a7335120b027bb854512fe92aa0ff723a1d18f487771afb406300040086"

[connector]
id = "fcp.semanticscholar"
name = "Semantic Scholar Connector"
version = "0.1.0"
description = "FCP connector for Semantic Scholar academic paper search and citation graph"
archetypes = ["knowledge"]
format = "wasi"

[connector.state]
model = "stateless"
state_schema_version = "1"
migration_hint = "init"

[zones]
home = "z:work"
allowed_sources = [
    "z:owner",
    "z:private",
    "z:work",
]
allowed_targets = ["z:work"]
forbidden = [
    "z:public",
    "z:community",
]

[capabilities]
required = [
    "network.dns",
    "network.egress",
    "network.tls.sni",
]
optional = [
    "semanticscholar.authors.read",
    "semanticscholar.papers.read",
]
forbidden = [
    "system.exec",
    "network.listen",
    "media.upload",
    "media.download",
]

[provides.operations."semanticscholar.author.get"]
description = "Get author details"
capability = "semanticscholar.authors.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"

[provides.operations."semanticscholar.author.get".input_schema]
required = ["author_id"]
type = "object"

[provides.operations."semanticscholar.author.get".input_schema.properties.author_id]
type = "string"

[provides.operations."semanticscholar.author.get".input_schema.properties.fields]
type = "string"

[provides.operations."semanticscholar.author.get".output_schema]
required = [
    "authorId",
    "name",
]
type = "object"

[provides.operations."semanticscholar.author.get".output_schema.properties.authorId]
type = "string"

[provides.operations."semanticscholar.author.get".output_schema.properties.name]
type = "string"

[provides.operations."semanticscholar.author.get".network_constraints]
host_allow = ["api.semanticscholar.org"]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 3
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 1048576

[provides.operations."semanticscholar.author.get".ai_hints]
when_to_use = "Get details for a specific author."
common_mistakes = ["Not specifying the fields parameter — only authorId and name are returned by default; request hIndex, paperCount, etc. explicitly."]
examples = ['{"author_id": "1741101", "fields": "name,hIndex,paperCount,citationCount"}']
related = ["semanticscholar.author.papers"]

[provides.operations."semanticscholar.author.papers"]
description = "Get papers by an author"
capability = "semanticscholar.authors.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"

[provides.operations."semanticscholar.author.papers".input_schema]
required = ["author_id"]
type = "object"

[provides.operations."semanticscholar.author.papers".input_schema.properties.author_id]
type = "string"

[provides.operations."semanticscholar.author.papers".input_schema.properties.fields]
type = "string"

[provides.operations."semanticscholar.author.papers".input_schema.properties.limit]
maximum = 1000
type = "integer"

[provides.operations."semanticscholar.author.papers".output_schema]
required = ["data"]
type = "object"

[provides.operations."semanticscholar.author.papers".output_schema.properties.data]
type = "array"

[provides.operations."semanticscholar.author.papers".network_constraints]
host_allow = ["api.semanticscholar.org"]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 3
connect_timeout_ms = 10000
total_timeout_ms = 60000
max_response_bytes = 10485760

[provides.operations."semanticscholar.author.papers".ai_hints]
when_to_use = "Get all papers by a specific author."
common_mistakes = ["Setting limit too high without pagination — the API caps at 1000 results per request, use offset for prolific authors."]
examples = ['{"author_id": "1741101", "limit": 50, "fields": "title,year,citationCount"}']
related = ["semanticscholar.author.get"]

[provides.operations."semanticscholar.paper.citations"]
description = "Get citations of a paper"
capability = "semanticscholar.papers.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
