common_mistakes = ["Expecting deterministic results — recommendations are model-based and may vary between calls for the same seed paper."]
examples = ['{"paper_id": "649def34f8be52c8b66281af98ae884c09aef38b", "limit": 10}']
related = ["semanticscholar.paper.search"]

