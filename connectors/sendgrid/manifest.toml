[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = []
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:ef7c899e275bc60969e8228d003285294eee1dfd21628a119b59d25122ef9f19"

[connector]
id = "fcp.sendgrid"
name = "SendGrid Connector"
version = "0.1.0"
description = "FCP connector for SendGrid email delivery (send, contacts, templates, stats)"
archetypes = ["operational"]
format = "wasi"

[connector.state]
model = "singleton_writer"
state_schema_version = "1"
migration_hint = "Stores API key and sender identity."

[zones]
home = "z:work"
allowed_sources = [
    "z:owner",
    "z:private",
    "z:work",
]
allowed_targets = ["z:work"]
forbidden = [
    "z:public",
    "z:community",
]

[capabilities]
required = [
    "network.dns",
    "network.egress",
    "network.tls.sni",
    "storage.state",
]
optional = [
    "sendgrid.contacts.write",
    "sendgrid.contacts.read",
    "sendgrid.lists.read",
    "sendgrid.lists.write",
    "sendgrid.lists.delete",
    "sendgrid.mail.write",
    "sendgrid.stats.read",
    "sendgrid.templates.read",
]
forbidden = [
    "system.exec",
    "network.listen",
    "media.upload",
    "media.download",
]

[provides.operations."sendgrid.lists.delete"]
description = "Delete a marketing list"
capability = "sendgrid.lists.delete"
risk_level = "high"
safety_tier = "dangerous"
requires_approval = "interactive"
idempotency = "none"

[provides.operations."sendgrid.lists.delete".input_schema]
required = ["list_id"]
type = "object"

[provides.operations."sendgrid.lists.delete".input_schema.properties.list_id]
description = "List UUID to delete"
type = "string"

[provides.operations."sendgrid.lists.delete".output_schema]
type = "object"

[provides.operations."sendgrid.lists.delete".network_constraints]
host_allow = ["api.sendgrid.com"]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 3
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 1048576

[provides.operations."sendgrid.lists.delete".ai_hints]
when_to_use = "Delete a marketing list. Cannot be undone."
common_mistakes = [
    "Deleting a list does not delete the contacts in it.",
    "Using a list name instead of the SendGrid list UUID.",
]
examples = ['{"list_id": "list_abc123"}']
related = ["sendgrid.contacts.list"]

[provides.operations."sendgrid.contacts.list"]
description = "List marketing contacts"
