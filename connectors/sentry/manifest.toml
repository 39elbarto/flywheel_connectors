[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = []
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:20a160f7c148f3d8dee704e7580d8366141ed18fd1bdc6c3ecd930d20c4a06fa"

[connector]
id = "fcp.sentry"
name = "Sentry Connector"
version = "0.1.0"
description = "FCP connector for Sentry error tracking (issues, events, performance, alerts, releases, webhooks)"
archetypes = [
    "knowledge",
    "operational",
    "streaming",
]
format = "wasi"

[connector.state]
model = "singleton_writer"
state_schema_version = "1"
migration_hint = "Stores webhook cursor timestamps, event idempotency keys, and auto-create-beads mapping state."

[zones]
home = "z:work"
allowed_sources = [
    "z:owner",
    "z:private",
    "z:work",
    "z:infra",
]
allowed_targets = [
    "z:work",
    "z:infra",
]
forbidden = [
    "z:public",
    "z:community",
]

[capabilities]
required = [
    "network.dns",
    "network.egress",
    "network.tls.sni",
    "storage.state",
]
optional = [
    "media.download",
    "sentry.alerts",
    "sentry.admin",
    "sentry.read",
    "sentry.write",
]
forbidden = [
    "system.exec",
    "network.listen",
]

[provides.operations."sentry.create_alert_rule"]
description = "Create an issue or metric alert rule for a project"
capability = "sentry.alerts"
risk_level = "medium"
safety_tier = "risky"
requires_approval = "policy"
idempotency = "none"

[provides.operations."sentry.create_alert_rule".input_schema]
required = [
    "organization_slug",
    "project_slug",
    "name",
    "conditions",
    "actions",
]
type = "object"

[provides.operations."sentry.create_alert_rule".input_schema.properties.action_match]
description = "Match behavior for conditions"
enum = [
    "all",
    "any",
    "none",
]
type = "string"

[provides.operations."sentry.create_alert_rule".input_schema.properties.actions]
description = "Actions to execute (e.g., notify email, Slack, PagerDuty)"
type = "array"

[provides.operations."sentry.create_alert_rule".input_schema.properties.actions.items]
type = "object"

[provides.operations."sentry.create_alert_rule".input_schema.properties.conditions]
description = "Trigger conditions (e.g., first seen, regression, frequency threshold)"
type = "array"

[provides.operations."sentry.create_alert_rule".input_schema.properties.conditions.items]
type = "object"

[provides.operations."sentry.create_alert_rule".input_schema.properties.filters]
description = "Optional filters to narrow which events trigger the rule"
type = "array"

[provides.operations."sentry.create_alert_rule".input_schema.properties.filters.items]
type = "object"

[provides.operations."sentry.create_alert_rule".input_schema.properties.frequency]
description = "Rate limit in minutes (don't re-trigger within this window)"
minimum = 5
type = "integer"

[provides.operations."sentry.create_alert_rule".input_schema.properties.name]
description = "Alert rule name"
type = "string"

[provides.operations."sentry.create_alert_rule".input_schema.properties.organization_slug]
description = "Sentry organization slug"
type = "string"

[provides.operations."sentry.create_alert_rule".input_schema.properties.project_slug]
description = "Sentry project slug"
type = "string"

[provides.operations."sentry.create_alert_rule".output_schema]
required = ["rule"]
type = "object"

[provides.operations."sentry.create_alert_rule".output_schema.properties.rule]
type = "object"

[provides.operations."sentry.create_alert_rule".network_constraints]
host_allow = [
    "sentry.io",
    "*.sentry.io",
    "$sentry_host",
]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 3
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 1048576

[provides.operations."sentry.create_alert_rule".ai_hints]
when_to_use = "Create a new alert rule to be notified about specific error conditions."
common_mistakes = [
    "Mixing up issue alert conditions with metric alert trigger syntax.",
    "Not specifying frequency, resulting in alert storms.",
    "Using incorrect condition IDs (they differ between SaaS and self-hosted).",
]
examples = ['{"organization_slug": "my-org", "project_slug": "backend", "name": "High error rate", "conditions": [{"id": "sentry.rules.conditions.first_seen_event.FirstSeenEventCondition"}], "actions": [{"id": "sentry.mail.actions.NotifyEmailAction", "targetType": "IssueOwners"}], "action_match": "any", "frequency": 30}']
related = [
    "sentry.list_alert_rules",
    "sentry.update_alert_rule",
    "sentry.delete_alert_rule",
]

