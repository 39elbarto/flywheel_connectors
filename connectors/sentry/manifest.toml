[event_caps]
streaming = true
replay = false
min_buffer_events = 100

[sandbox]
profile = "strict"
memory_mb = 256
cpu_percent = 50
wall_clock_timeout_ms = 120000
fs_readonly_paths = [
    "/usr",
    "/lib",
]
fs_writable_paths = ["$CONNECTOR_STATE"]
deny_exec = true
deny_ptrace = true

[[rate_limits.pools]]
id = "sentry.read"
description = "Read operations against Sentry API"
requests = 100
window_ms = 60000
burst = 20
scope = "instance"

[[rate_limits.pools]]
id = "sentry.write"
description = "Write/mutation operations against Sentry API"
requests = 60
window_ms = 60000
burst = 10
scope = "instance"

[[rate_limits.pools]]
id = "sentry.alerts"
description = "Alert rule management operations"
requests = 30
window_ms = 60000
burst = 5
scope = "instance"

[[rate_limits.pools]]
id = "sentry.admin"
description = "Destructive/administrative operations"
requests = 20
window_ms = 60000
burst = 5
scope = "instance"

[rate_limits.operation_pools]
"sentry.discover_query" = ["sentry.read"]
"sentry.get_release" = ["sentry.read"]
"sentry.update_alert_rule" = ["sentry.alerts"]
"sentry.get_event" = ["sentry.read"]
"sentry.update_issue" = ["sentry.write"]
"sentry.issue.assign" = ["sentry.write"]
"sentry.issue.set_status" = ["sentry.write"]
"sentry.issue.set_priority" = ["sentry.write"]
"sentry.create_alert_rule" = ["sentry.alerts"]
"sentry.list_projects" = ["sentry.read"]
"sentry.list_releases" = ["sentry.read"]
"sentry.list_issue_events" = ["sentry.read"]
"sentry.delete_issue" = ["sentry.admin"]
"sentry.get_issue" = ["sentry.read"]
"sentry.issue.get_summary" = ["sentry.read"]
