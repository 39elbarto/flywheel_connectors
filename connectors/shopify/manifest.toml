[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = []
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:47d4629d880f7b2e488bd78618afae950a388554eab0f283ecdc087f8c88369d"

[connector]
id = "fcp.shopify"
name = "Shopify Connector"
version = "0.1.0"
description = "Single-shop Shopify Admin REST connector for products, orders, customers, inventory levels, and shop-health verification"
archetypes = ["operational"]
format = "native"

[connector.state]
model = "stateless"
state_schema_version = "1"
migration_hint = "No durable connector state; one shop domain plus either one pre-provisioned Admin API access token or one credential_id are injected at runtime."

[zones]
home = "z:work"
allowed_sources = [
    "z:owner",
    "z:private",
    "z:work",
]
allowed_targets = ["z:work"]
forbidden = [
    "z:public",
    "z:community",
]

[capabilities]
required = [
    "network.dns",
    "network.egress",
    "network.tls.sni",
]
optional = [
    "shopify.products.read",
    "shopify.products.write",
    "shopify.orders.read",
    "shopify.orders.write",
    "shopify.customers.read",
    "shopify.inventory.read",
]
forbidden = [
    "system.exec",
    "network.listen",
    "system.privileged",
]

[provides.operations."shopify.customers.get"]
description = "Fetch one customer by numeric Shopify customer ID from the configured shop."
capability = "shopify.customers.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"

