[provides.events."signal.message.received"]
description = "Authorized Signal message or attachment event accepted after direct/group policy, mention gating, self-echo suppression, and quote-context filtering."
streaming = true
replay = false
topic = "signal.message.received"
requires_ack = false
schema = { type = "object", required = ["kind", "sender"], properties = { kind = { const = "message" }, sender = { type = "string" }, sender_name = { type = "string" }, timestamp = { type = "integer" }, group_id = { type = "string" }, group_name = { type = "string" }, body = { type = "string" }, quote_text = { type = "string" }, quote_author = { type = "string" } } }

[provides.events."signal.reaction.received"]
description = "Authorized reaction-only Signal event accepted after the same sender/group policy checks as message events."
streaming = true
replay = false
topic = "signal.reaction.received"
requires_ack = false
schema = { type = "object", required = ["kind", "sender", "reaction"], properties = { kind = { const = "reaction" }, sender = { type = "string" }, group_id = { type = "string" }, reaction = { type = "object" } } }

[provides.events."signal.receipt.read"]
description = "Authorized Signal read/delivery receipt surfaced by signal-cli."
streaming = true
replay = false
topic = "signal.receipt.read"
requires_ack = false
schema = { type = "object", required = ["kind", "sender", "receipt"], properties = { kind = { const = "read_receipt" }, sender = { type = "string" }, timestamp = { type = "integer" }, receipt = { type = "object" } } }

[provides.events."signal.typing.received"]
description = "Authorized Signal typing indicator surfaced by signal-cli."
streaming = true
replay = false
topic = "signal.typing.received"
requires_ack = false
schema = { type = "object", required = ["kind", "sender", "typing"], properties = { kind = { const = "typing" }, sender = { type = "string" }, group_id = { type = "string" }, typing = { type = "object" } } }

[provides.events."signal.policy.denied"]
description = "Structured Signal policy-denial event for audit logs without message body content."
streaming = true
replay = false
topic = "signal.policy.denied"
requires_ack = false
schema = { type = "object", required = ["reason"], properties = { reason = { type = "string" }, sender = { type = "string" }, group_id = { type = "string" }, kind = { type = "string" } } }

