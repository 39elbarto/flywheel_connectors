[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = ["signal.sse"]
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:ceaba3bd0866ba41ebab7be25020b14b0a9aa3221dbb1c1d92e079827e461545"

[connector]
id = "fcp.signal"
name = "Signal Messenger"
version = "0.1.0"
description = "FCP connector for a local signal-cli REST daemon for sending, polling, SSE streaming, inbound policy filtering, group inspection, and identity trust"
archetypes = [
    "operational",
    "streaming",
    "bidirectional",
]
format = "native"

[connector.state]
model = "stateless"
state_schema_version = "1"
migration_hint = "No durable connector state; receive cursors, group cache, bridge health, and SSE resume hints live only in process memory."

[zones]
home = "z:private"
allowed_sources = [
    "z:owner",
    "z:private",
]
allowed_targets = ["z:private"]
forbidden = [
    "z:public",
    "z:community",
]

[capabilities]
required = [
    "network.dns",
    "network.egress",
]
optional = [
    "signal.send",
    "signal.read",
    "signal.admin",
]
forbidden = [
    "system.exec",
    "network.listen",
    "system.privileged",
]

# Operator setup:
# - Run signal-cli REST API locally with its SSE endpoint enabled, for example
#   `signal-cli-rest-api` exposing `/api/v1/events?account=<number>`.
# - Keep daemon_url on loopback unless an explicit external trust boundary is
#   configured outside this connector.
# - Direct messages default to open for parity with polling receive.
# - Groups default to deny; set inbound_policy.group_allow_from to raw group IDs,
#   `group:<id>`, or `signal:group:<id>` before subscribing to group events.

[event_caps]
streaming = true
replay = false
min_buffer_events = 100

[provides.operations."signal.get_group"]
description = "Get detailed information about a specific Signal group"
capability = "signal.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"

[provides.operations."signal.get_group".input_schema]
required = ["group_id"]
type = "object"

[provides.operations."signal.get_group".input_schema.properties.group_id]
description = "Base64-encoded Signal group identifier"
type = "string"

[provides.operations."signal.get_group".output_schema]
type = "object"

[provides.operations."signal.get_group".output_schema.properties.admins]
type = "array"

[provides.operations."signal.get_group".output_schema.properties.admins.items]
type = "string"

[provides.operations."signal.get_group".output_schema.properties.id]
