# ── Events ──────────────────────────────────────────────────────

[event_caps]
streaming = true
replay = false
min_buffer_events = 200

# ── Sandbox ─────────────────────────────────────────────────────

[sandbox]
profile = "strict"
memory_mb = 256
cpu_percent = 50
wall_clock_timeout_ms = 120000
fs_readonly_paths = ["/usr", "/lib"]
fs_writable_paths = ["$CONNECTOR_STATE"]
deny_exec = true
deny_ptrace = true

# ── Rate Limits ─────────────────────────────────────────────────

[[rate_limits.pools]]
id = "slack.read"
requests = 100
window_ms = 60000
burst = 20
scope = "instance"

[[rate_limits.pools]]
id = "slack.write"
requests = 50
window_ms = 60000
burst = 10
scope = "instance"

[[rate_limits.pools]]
id = "slack.search"
requests = 20
window_ms = 60000
burst = 5
scope = "instance"

[[rate_limits.pools]]
id = "slack.file"
requests = 20
window_ms = 60000
burst = 5
scope = "instance"

[rate_limits.operation_pools]
"slack.post_message" = ["slack.write"]
"slack.reply_thread" = ["slack.write"]
"slack.get_channel_history" = ["slack.read"]
"slack.search_messages" = ["slack.search"]
"slack.list_channels" = ["slack.read"]
"slack.get_user_info" = ["slack.read"]
"slack.upload_file" = ["slack.file"]
"slack.add_reaction" = ["slack.write"]
"slack.set_channel_topic" = ["slack.write"]
"slack.download_file" = ["slack.file"]
