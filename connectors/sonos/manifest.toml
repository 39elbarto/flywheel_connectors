[format]
type = "fcp-connector-manifest"
schema_version = "2.1"

[connector]
id = "fcp.sonos"
name = "Sonos"
version = "0.1.0"
description = "Local Sonos speaker connector for transport status, transport controls, and volume control"
archetype = "operational"
homepage = "https://sonos.com"

[zones]
home = "z:owner"
allowed_sources = ["z:owner", "z:private", "z:home", "z:infra"]
allowed_targets = ["z:owner", "z:home", "z:infra"]
tailscale_tag = "tag:fcp-home"

[capabilities]
required = ["network.dns", "network.outbound"]
optional = []
forbidden = ["system.exec", "system.privileged", "network.listen"]

# Sonos devices are local-network resources selected at configuration time.
# Per-operation constraints use the runtime-resolved device host and keep
# local/LAN/tailnet/IP-literal targets available for real speakers and loopback
# proof fixtures.

[provides.operations.health]
summary = "Report Sonos device health and identity"
capability = "sonos.read"
risk = "low"
safety_tier = "safe"
idempotency = "strict"
input_schema = { type = "object", additionalProperties = false }
output_schema = { type = "object", required = ["status", "device_url", "manifest_hash"], additionalProperties = false, properties = { status = { type = "string", enum = ["ok"] }, device_url = { type = "string", format = "uri" }, manifest_hash = { type = "string", pattern = "^sha256:[0-9a-f]{64}$" } } }
network_constraints = { host_allow = ["${sonos_device_host}"], port_allow = [80, 443, 1400], ip_allow = [], cidr_deny = [], require_sni = false, spki_pins = [], deny_localhost = false, deny_private_ranges = false, deny_tailnet_ranges = false, deny_ip_literals = false, require_host_canonicalization = true, dns_max_ips = 16, max_redirects = 0, connect_timeout_ms = 10000, total_timeout_ms = 30000, max_response_bytes = 1048576 }

[provides.operations.health.ai_hints]
when_to_use = "Use this before playback control when you need to confirm the configured Sonos device endpoint is reachable and identifies as the expected speaker."
common_mistakes = ["Treating a successful manifest load as proof that the local speaker is reachable; health performs the device-description probe.", "Running playback controls before checking the configured room or speaker identity, which can affect the wrong local device."]
examples = ['{"device_url": "http://living-room-speaker.local:1400", "expected": {"status": "ok", "friendly_name": "Living Room"}}']
related = ["sonos.get_status"]

[provides.operations.get_status]
summary = "Get current Sonos transport and volume state"
capability = "sonos.read"
risk = "low"
safety_tier = "safe"
idempotency = "strict"
input_schema = { type = "object", additionalProperties = false }
output_schema = { type = "object", required = ["transport_state", "transport_status", "volume"], additionalProperties = false, properties = { transport_state = { type = ["string", "null"] }, transport_status = { type = ["string", "null"] }, volume = { type = ["integer", "null"], minimum = 0, maximum = 100 } } }
network_constraints = { host_allow = ["${sonos_device_host}"], port_allow = [80, 443, 1400], ip_allow = [], cidr_deny = [], require_sni = false, spki_pins = [], deny_localhost = false, deny_private_ranges = false, deny_tailnet_ranges = false, deny_ip_literals = false, require_host_canonicalization = true, dns_max_ips = 16, max_redirects = 0, connect_timeout_ms = 10000, total_timeout_ms = 30000, max_response_bytes = 1048576 }

[provides.operations.get_status.ai_hints]
when_to_use = "Use this when you need the current transport state and volume before deciding whether to play, pause, skip, or change loudness."
common_mistakes = ["Assuming the speaker is already playing; inspect transport_state before sending pause or next.", "Using stale volume from a prior run; Sonos volume may have changed outside FCP."]
examples = ['{"request": {}, "expected": {"transport_state": "PLAYING", "transport_status": "OK", "volume": 18}}']
related = ["sonos.health", "sonos.set_volume"]

[provides.operations.play]
summary = "Start or resume playback"
capability = "sonos.write"
risk = "medium"
safety_tier = "risky"
idempotency = "best_effort"
input_schema = { type = "object", additionalProperties = false }
output_schema = { type = "object", required = ["status", "action"], additionalProperties = false, properties = { status = { type = "string", enum = ["ok"] }, action = { type = "string", enum = ["play"] } } }
network_constraints = { host_allow = ["${sonos_device_host}"], port_allow = [80, 443, 1400], ip_allow = [], cidr_deny = [], require_sni = false, spki_pins = [], deny_localhost = false, deny_private_ranges = false, deny_tailnet_ranges = false, deny_ip_literals = false, require_host_canonicalization = true, dns_max_ips = 16, max_redirects = 0, connect_timeout_ms = 10000, total_timeout_ms = 30000, max_response_bytes = 1048576 }

[provides.operations.play.ai_hints]
when_to_use = "Use this to resume playback on the configured Sonos device after confirming the target room and queue state."
common_mistakes = ["Calling play on the wrong configured local endpoint; run health when speaker identity matters.", "Expecting play to choose media; this only resumes or starts the current Sonos queue."]
examples = ['{"request": {}, "expected": {"status": "ok", "action": "play"}}']
related = ["sonos.get_status", "sonos.pause"]

[provides.operations.pause]
summary = "Pause playback"
capability = "sonos.write"
risk = "medium"
safety_tier = "risky"
idempotency = "best_effort"
input_schema = { type = "object", additionalProperties = false }
output_schema = { type = "object", required = ["status", "action"], additionalProperties = false, properties = { status = { type = "string", enum = ["ok"] }, action = { type = "string", enum = ["pause"] } } }
network_constraints = { host_allow = ["${sonos_device_host}"], port_allow = [80, 443, 1400], ip_allow = [], cidr_deny = [], require_sni = false, spki_pins = [], deny_localhost = false, deny_private_ranges = false, deny_tailnet_ranges = false, deny_ip_literals = false, require_host_canonicalization = true, dns_max_ips = 16, max_redirects = 0, connect_timeout_ms = 10000, total_timeout_ms = 30000, max_response_bytes = 1048576 }

[provides.operations.pause.ai_hints]
when_to_use = "Use this to pause the currently configured Sonos device after verifying playback is active or the user explicitly asked to stop audio."
common_mistakes = ["Using pause as a mute operation; it stops transport rather than preserving playback with zero volume.", "Assuming pause is harmless in shared rooms; it interrupts all listeners on that speaker or group."]
examples = ['{"request": {}, "expected": {"status": "ok", "action": "pause"}}']
related = ["sonos.get_status", "sonos.play"]

[provides.operations.next]
summary = "Skip to the next track"
capability = "sonos.write"
risk = "medium"
safety_tier = "risky"
idempotency = "best_effort"
input_schema = { type = "object", additionalProperties = false }
output_schema = { type = "object", required = ["status", "action"], additionalProperties = false, properties = { status = { type = "string", enum = ["ok"] }, action = { type = "string", enum = ["next"] } } }
network_constraints = { host_allow = ["${sonos_device_host}"], port_allow = [80, 443, 1400], ip_allow = [], cidr_deny = [], require_sni = false, spki_pins = [], deny_localhost = false, deny_private_ranges = false, deny_tailnet_ranges = false, deny_ip_literals = false, require_host_canonicalization = true, dns_max_ips = 16, max_redirects = 0, connect_timeout_ms = 10000, total_timeout_ms = 30000, max_response_bytes = 1048576 }

[provides.operations.next.ai_hints]
when_to_use = "Use this when the user asks to skip forward in the active Sonos queue on the configured device."
common_mistakes = ["Assuming every stream supports next; some live radio or external sources may reject queue navigation.", "Sending repeated skips without reading status, which can advance farther than the user intended."]
examples = ['{"request": {}, "expected": {"status": "ok", "action": "next"}}']
related = ["sonos.get_status", "sonos.previous"]

[provides.operations.previous]
summary = "Go to the previous track"
capability = "sonos.write"
risk = "medium"
safety_tier = "risky"
idempotency = "best_effort"
input_schema = { type = "object", additionalProperties = false }
output_schema = { type = "object", required = ["status", "action"], additionalProperties = false, properties = { status = { type = "string", enum = ["ok"] }, action = { type = "string", enum = ["previous"] } } }
network_constraints = { host_allow = ["${sonos_device_host}"], port_allow = [80, 443, 1400], ip_allow = [], cidr_deny = [], require_sni = false, spki_pins = [], deny_localhost = false, deny_private_ranges = false, deny_tailnet_ranges = false, deny_ip_literals = false, require_host_canonicalization = true, dns_max_ips = 16, max_redirects = 0, connect_timeout_ms = 10000, total_timeout_ms = 30000, max_response_bytes = 1048576 }

[provides.operations.previous.ai_hints]
when_to_use = "Use this when the user asks to return to the previous item in the active Sonos queue."
common_mistakes = ["Expecting previous to rewind within the current track; Sonos may restart or move to the previous queue item depending on source behavior.", "Calling previous on a live stream or single-item queue without handling provider rejection."]
examples = ['{"request": {}, "expected": {"status": "ok", "action": "previous"}}']
related = ["sonos.get_status", "sonos.next"]

[provides.operations.set_volume]
summary = "Set Sonos volume"
capability = "sonos.write"
risk = "medium"
safety_tier = "risky"
idempotency = "best_effort"
input_schema = { type = "object", required = ["volume"], additionalProperties = false, properties = { volume = { type = "integer", minimum = 0, maximum = 100 } } }
output_schema = { type = "object", required = ["status", "volume"], additionalProperties = false, properties = { status = { type = "string", enum = ["ok"] }, volume = { type = "integer", minimum = 0, maximum = 100 } } }
network_constraints = { host_allow = ["${sonos_device_host}"], port_allow = [80, 443, 1400], ip_allow = [], cidr_deny = [], require_sni = false, spki_pins = [], deny_localhost = false, deny_private_ranges = false, deny_tailnet_ranges = false, deny_ip_literals = false, require_host_canonicalization = true, dns_max_ips = 16, max_redirects = 0, connect_timeout_ms = 10000, total_timeout_ms = 30000, max_response_bytes = 1048576 }

[provides.operations.set_volume.ai_hints]
when_to_use = "Use this to set an explicit 0-100 volume level on the configured Sonos device when the user gives a target loudness."
common_mistakes = ["Passing a relative adjustment such as +5; this operation expects an absolute integer volume.", "Sending values outside 0-100; the connector rejects them before making the SOAP call.", "Changing volume without confirming the target speaker in shared spaces."]
examples = ['{"volume": 18, "expected": {"status": "ok", "volume": 18}}']
related = ["sonos.get_status"]

[sandbox]
profile = "strict"
memory_mb = 64
cpu_percent = 25
wall_clock_timeout_ms = 30000
deny_exec = true
deny_ptrace = true
