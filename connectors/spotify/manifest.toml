[event_caps]
streaming = true
replay = false
min_buffer_events = 256

[sandbox]
profile = "strict"
memory_mb = 192
cpu_percent = 40
wall_clock_timeout_ms = 120000
fs_readonly_paths = ["/usr", "/lib"]
fs_writable_paths = ["$CONNECTOR_STATE"]
deny_exec = true
deny_ptrace = true

[[rate_limits.pools]]
id = "spotify.read"
requests = 1200
window_ms = 3600000
burst = 60
scope = "instance"

[[rate_limits.pools]]
id = "spotify.library"
requests = 600
window_ms = 3600000
burst = 30
scope = "instance"

[[rate_limits.pools]]
id = "spotify.playback"
requests = 300
window_ms = 3600000
burst = 20
scope = "instance"

[[rate_limits.pools]]
id = "spotify.stream"
requests = 3600
window_ms = 3600000
burst = 120
scope = "instance"

[[rate_limits.pools]]
id = "spotify.media"
requests = 300
window_ms = 3600000
burst = 20
scope = "instance"

[rate_limits.operation_pools]
"spotify.search" = ["spotify.read"]
"spotify.track.get" = ["spotify.read"]
"spotify.album.get" = ["spotify.read"]
"spotify.artist.get" = ["spotify.read"]
"spotify.playlist.get" = ["spotify.read"]
"spotify.library.list_saved_tracks" = ["spotify.library"]
"spotify.library.save_track" = ["spotify.library"]
"spotify.library.remove_track" = ["spotify.library"]
"spotify.playback.get_state" = ["spotify.playback"]
"spotify.playback.play" = ["spotify.playback"]
"spotify.playback.pause" = ["spotify.playback"]
"spotify.player.stream" = ["spotify.stream"]
"spotify.media.download_cover" = ["spotify.media"]
