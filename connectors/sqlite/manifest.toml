[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = []
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:sqlite-first-slice-placeholder"

[connector]
id = "fcp.sqlite"
name = "SQLite Connector"
version = "0.1.0"
description = "FCP connector for local SQLite databases with safe query, schema, and transaction operations"
archetypes = ["storage", "operational"]
format = "wasi"

[connector.state]
model = "singleton_writer"
state_schema_version = "1"
migration_hint = "Stores the configured SQLite database path and transaction state."

[zones]
home = "z:private"
allowed_sources = ["z:owner", "z:private"]
allowed_targets = ["z:private"]
forbidden = ["z:public", "z:community", "z:work"]

[capabilities]
required = ["storage.state"]
optional = []
forbidden = [
    "system.exec",
    "network.listen",
    "network.dns",
    "network.egress",
    "media.upload",
    "media.download",
]

[provides.operations."sqlite.query"]
description = "Execute a read-only parameterized SQL query"
capability = "sqlite.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"

[provides.operations."sqlite.query".input_schema]
type = "object"
required = ["sql"]

[provides.operations."sqlite.query".input_schema.properties.sql]
type = "string"
description = "A single read-only SQL statement"

[provides.operations."sqlite.query".input_schema.properties.params]
type = "array"
description = "Positional query parameters"

[provides.operations."sqlite.query".input_schema.properties.txn_id]
type = "string"
description = "Active transaction id when querying inside a transaction"

[provides.operations."sqlite.query".output_schema]
type = "object"
required = ["result"]

[provides.operations."sqlite.query".output_schema.properties.result]
type = "object"

[provides.operations."sqlite.query".network_constraints]
host_allow = ["none.invalid"]
port_allow = [0]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = false
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 0
max_redirects = 0
connect_timeout_ms = 1000
total_timeout_ms = 15000
max_response_bytes = 52428800

[provides.operations."sqlite.execute"]
description = "Execute a mutating SQL statement"
capability = "sqlite.write"
risk_level = "medium"
safety_tier = "risky"
requires_approval = "interactive"
idempotency = "none"

[provides.operations."sqlite.execute".input_schema]
