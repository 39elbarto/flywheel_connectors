[sandbox]
profile = "strict"
memory_mb = 256
cpu_percent = 25
wall_clock_timeout_ms = 300000
fs_readonly_paths = ["/usr", "/lib"]
fs_writable_paths = ["$CONNECTOR_STATE"]
deny_exec = true
deny_ptrace = true

[[rate_limits.pools]]
id = "sqlite.read"
requests = 300
window_ms = 60000
burst = 30
scope = "instance"

[[rate_limits.pools]]
id = "sqlite.write"
requests = 120
window_ms = 60000
burst = 20
scope = "instance"

[[rate_limits.pools]]
id = "sqlite.admin"
requests = 30
window_ms = 60000
burst = 5
scope = "instance"

[rate_limits.operation_pools]
"sqlite.query" = ["sqlite.read"]
"sqlite.explain" = ["sqlite.read"]
"sqlite.schema.tables" = ["sqlite.read"]
"sqlite.schema.columns" = ["sqlite.read"]
"sqlite.health" = ["sqlite.read"]
"sqlite.pragma" = ["sqlite.read"]
"sqlite.execute" = ["sqlite.write"]
"sqlite.transaction.begin" = ["sqlite.write"]
"sqlite.transaction.commit" = ["sqlite.write"]
"sqlite.transaction.rollback" = ["sqlite.write"]
"sqlite.batch" = ["sqlite.write"]
"sqlite.vacuum" = ["sqlite.admin"]
