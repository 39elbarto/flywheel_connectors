[provides.operations."sqlite.execute".input_schema.properties.txn_id]
type = "string"
description = "Active transaction id when executing inside a transaction"

[provides.operations."sqlite.execute".output_schema]
type = "object"
required = ["result"]

[provides.operations."sqlite.execute".output_schema.properties.result]
