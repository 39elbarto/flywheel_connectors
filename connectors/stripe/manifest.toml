# ── Events ──────────────────────────────────────────────────────

[event_caps]
streaming = true
replay = true
min_buffer_events = 100

# ── Sandbox ─────────────────────────────────────────────────────

[sandbox]
profile = "strict"
memory_mb = 128
cpu_percent = 25
wall_clock_timeout_ms = 60000
fs_readonly_paths = ["/usr", "/lib"]
fs_writable_paths = ["$CONNECTOR_STATE"]
deny_exec = true
deny_ptrace = true

# ── Rate Limits ─────────────────────────────────────────────────

[[rate_limits.pools]]
id = "stripe.read"
requests = 100
window_ms = 1000
burst = 25
scope = "instance"

[[rate_limits.pools]]
id = "stripe.write"
requests = 100
window_ms = 1000
burst = 25
scope = "instance"

[[rate_limits.pools]]
id = "stripe.payment"
requests = 50
window_ms = 1000
burst = 10
scope = "instance"

[rate_limits.operation_pools]
"stripe.create_customer" = ["stripe.write"]
"stripe.get_customer" = ["stripe.read"]
"stripe.list_customers" = ["stripe.read"]
"stripe.create_payment_intent" = ["stripe.payment"]
"stripe.get_payment_intent" = ["stripe.read"]
"stripe.create_refund" = ["stripe.payment"]
"stripe.create_subscription" = ["stripe.payment"]
"stripe.cancel_subscription" = ["stripe.payment"]
"stripe.list_invoices" = ["stripe.read"]
"stripe.get_balance" = ["stripe.read"]
