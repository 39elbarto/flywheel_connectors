[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = []
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:69191e3a337e8bcb15e3d89b492f6246e7bffaf7f5673bb71bcf1db220ca6339"

[connector]
id = "fcp.stripe"
name = "Stripe Connector"
version = "0.1.0"
description = "FCP connector for Stripe (payments, customers, subscriptions, invoices, refunds)"
archetypes = ["operational", "streaming"]
format = "wasi"

[connector.state]
model = "singleton_writer"
state_schema_version = "1"
migration_hint = "init"

[zones]
home = "z:private"
allowed_sources = ["z:owner", "z:private"]
allowed_targets = ["z:private"]
forbidden = ["z:public", "z:work"]

[capabilities]
required = ["network.dns", "network.egress", "network.tls.sni", "storage.state"]
optional = []
forbidden = ["system.exec", "network.listen"]

# ── Operations ──────────────────────────────────────────────────

[provides.operations."stripe.create_customer"]
description = "Create a new Stripe customer"
capability = "stripe.write"
risk_level = "medium"
safety_tier = "risky"
requires_approval = "policy"
idempotency = "none"

[provides.operations."stripe.create_customer".input_schema]
required = ["email"]
type = "object"
[provides.operations."stripe.create_customer".input_schema.properties.email]
type = "string"
[provides.operations."stripe.create_customer".input_schema.properties.name]
type = "string"

[provides.operations."stripe.create_customer".output_schema]
required = ["customer"]
type = "object"
[provides.operations."stripe.create_customer".output_schema.properties.customer]
type = "object"

[provides.operations."stripe.create_customer".network_constraints]
host_allow = ["api.stripe.com"]
port_allow = [443]
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 0
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 1048576

[provides.operations."stripe.create_customer".ai_hints]
when_to_use = "Create a new customer record in Stripe."
common_mistakes = ["Not checking for duplicate customers by email"]
examples = ['{"email": "user@example.com", "name": "Jane Doe"}']
related = ["stripe.get_customer", "stripe.list_customers"]

