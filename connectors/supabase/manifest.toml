[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = []
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:ec526cda2b9845d2128c1b5e47baa72100ca65fb991773f314d02323b9016f8a"

[connector]
id = "fcp.supabase"
name = "Supabase Connector"
version = "0.1.0"
description = "FCP connector for Supabase PostgREST tables, RPC functions, schema discovery, and Storage objects"
archetypes = [
    "storage",
    "operational",
]
format = "native"

[connector.state]
model = "stateless"
state_schema_version = "1"
migration_hint = "No durable connector state; configuration is injected at runtime per instance."

[zones]
home = "z:work"
allowed_sources = [
    "z:owner",
    "z:private",
    "z:work",
]
allowed_targets = ["z:work"]
forbidden = [
    "z:public",
    "z:community",
]

[capabilities]
required = [
    "network.dns",
    "network.egress",
    "network.tls.sni",
]
optional = []
forbidden = [
    "system.exec",
    "network.listen",
]

[provides.operations."supabase.delete"]
description = "Delete rows from a Supabase table"
capability = "supabase.write"
risk_level = "high"
safety_tier = "dangerous"
requires_approval = "interactive"
idempotency = "strict"

[provides.operations."supabase.delete".input_schema]
required = [
    "table",
    "filters",
]
type = "object"

[provides.operations."supabase.delete".input_schema.properties.filters]
type = "array"

[provides.operations."supabase.delete".input_schema.properties.returning]
