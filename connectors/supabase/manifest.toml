[provides.operations."supabase.delete".output_schema.properties.content_type]
type = "string"

[provides.operations."supabase.delete".output_schema.properties.data]
description = "Returned row payload or empty object when PostgREST returns no representation"

[provides.operations."supabase.delete".output_schema.properties.status_code]
type = "integer"

[provides.operations."supabase.delete".network_constraints]
host_allow = ["*.supabase.co"]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 0
connect_timeout_ms = 5000
total_timeout_ms = 30000
max_response_bytes = 8388608

[provides.operations."supabase.delete".ai_hints]
