[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = []
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:5ad63e43198e4f2173ceee7958cda7c2a640d5222919940a61e19ea0742967fe"

[connector]
id = "fcp.synology-chat"
name = "Synology Chat"
version = "0.1.0"
description = "Synology Chat webhook connector for self-hosted chat delivery, forwarded outgoing-webhook normalization, and health checks"
archetypes = ["operational"]
format = "native"

[zones]
home = "z:work"
allowed_sources = ["z:owner", "z:private", "z:work", "z:project:*"]
allowed_targets = ["z:work", "z:project:*"]

[capabilities]
required = [
    "network.dns",
    "network.outbound",
    "synology_chat.read",
    "synology_chat.write",
    "synology_chat.webhook",
]
optional = []
forbidden = ["system.exec", "system.privileged", "network.listen"]

# Synology Chat deployments are operator-configured and may live on public,
# private, or tailnet addresses, so host-level constraints are intentionally
# left to runtime configuration instead of being hardcoded here.

[provides.operations.send_message]
description = "Send a Synology Chat message through an incoming webhook"
capability = "synology_chat.write"
risk_level = "medium"
safety_tier = "risky"
requires_approval = "none"
idempotency = "none"
input_schema = { type = "object", required = ["text"] }
output_schema = { type = "object" }

[provides.operations.send_message.ai_hints]
when_to_use = "When you need to deliver a chat message into a Synology Chat webhook target"

[provides.operations.send_file_url]
description = "Send a SSRF-checked Synology Chat media or file URL"
capability = "synology_chat.write"
risk_level = "medium"
safety_tier = "risky"
requires_approval = "none"
idempotency = "none"
input_schema = { type = "object", required = ["file_url"] }
output_schema = { type = "object" }

[provides.operations.send_file_url.ai_hints]
when_to_use = "When you need Synology Chat to fetch a media or file URL and want the connector to enforce URL SSRF policy before dispatch"

[provides.operations.send_payload]
description = "Send a raw Synology Chat webhook payload"
capability = "synology_chat.write"
risk_level = "medium"
safety_tier = "risky"
requires_approval = "none"
idempotency = "none"
input_schema = { type = "object", required = ["payload"] }
output_schema = { type = "object" }

[provides.operations.send_payload.ai_hints]
when_to_use = "When you need advanced webhook payload control for cards or attachments and intentionally accept unchecked provider-specific passthrough"

[provides.operations.ingest_outgoing_webhook]
description = "Validate and normalize a host-forwarded Synology Chat outgoing-webhook payload"
capability = "synology_chat.webhook"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"
input_schema = { type = "object", required = ["payload"] }
output_schema = { type = "object" }

[provides.operations.ingest_outgoing_webhook.ai_hints]
when_to_use = "When fcp-host forwards an outgoing-webhook payload and you need stable channel, thread, sender, and attachment metadata"

[provides.operations.webhook_normalize]
description = "Normalize a raw inbound Synology Chat webhook payload into a stable event envelope"
capability = "synology_chat.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"
input_schema = { type = "object", required = ["payload"] }
output_schema = { type = "object" }

[provides.operations.webhook_normalize.ai_hints]
when_to_use = "When you need to normalize any inbound Synology Chat webhook payload into a stable event shape with optional token verification"

[provides.operations.health]
description = "Report Synology Chat connector configuration and delivery target"
capability = "synology_chat.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"
input_schema = { type = "object" }
output_schema = { type = "object" }

[provides.operations.health.ai_hints]
when_to_use = "When you need to confirm the Synology Chat connector is configured"

[sandbox]
profile = "strict"
memory_mb = 64
cpu_percent = 25
wall_clock_timeout_ms = 30000
deny_exec = true
deny_ptrace = true
