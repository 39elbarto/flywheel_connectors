[package]
name = "fcp-tavily"
description = "Tavily connector for the Flywheel Connector Protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "fcp_tavily"
path = "src/lib.rs"

[[bin]]
name = "fcp-tavily"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
fcp-async-core = { path = "../../crates/fcp-async-core" }
fcp-core = { path = "../../crates/fcp-core" }
fcp-prelude = { path = "../../crates/fcp-prelude" }
fcp-sdk = { path = "../../crates/fcp-sdk" }

anyhow.workspace = true
thiserror.workspace = true
reqwest = { workspace = true, features = ["json"] }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true

[dev-dependencies]
fcp-e2e = { path = "../../crates/fcp-e2e", default-features = false }
wiremock.workspace = true
