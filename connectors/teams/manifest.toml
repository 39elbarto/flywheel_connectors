[provides.operations."teams.ingest_activity".ai_hints]
when_to_use = "When the host delivers a Teams Bot Framework activity for normalization."
common_mistakes = ["This does not open a webhook listener; it validates payloads the host already received."]
examples = ['{"type":"message","conversation":{"id":"chat_1"}}']
related = ["teams.get_conversation_state"]

[provides.operations."teams.get_conversation_state"]
description = "Returns the connector's latest normalized state for a Teams conversation."
capability = "teams.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"
revocation_freshness = "safe"

[provides.operations."teams.get_conversation_state".input_schema]
type = "object"
required = ["conversation_id"]
additionalProperties = true

[provides.operations."teams.get_conversation_state".input_schema.properties.conversation_id]
type = "string"

[provides.operations."teams.get_conversation_state".output_schema]
type = "object"

[provides.operations."teams.get_conversation_state".output_schema.properties.conversation_state]
type = "object"

[provides.operations."teams.get_conversation_state".ai_hints]
when_to_use = "When you need the last known routing and installation state for a Teams conversation."
common_mistakes = ["Conversation state only exists after activity ingestion or outbound messaging creates it."]
examples = ['{"conversation_id":"chat_1"}']
related = ["teams.ingest_activity"]

[provisioning]
note = "Requires a non-production Microsoft 365 tenant plus Azure AD app registration with the exact Microsoft Graph permissions you intend to exercise. `/me`-backed flows such as health, list_teams, and list_chats, plus standard send/reply/update message operations, require a delegated user bearer token; `credential_id` mode requires the host to inject that token at runtime. App-only client credentials require tenant admin consent and only cover a narrower subset of Graph reads plus migration-only Teams message send permissions, so they do not prove full connector readiness."
