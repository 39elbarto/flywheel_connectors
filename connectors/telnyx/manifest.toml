[provides.operations."telnyx.call.gather".ai_hints]
when_to_use = "Use when the agent needs to ask an active caller for DTMF digits using Telnyx gather_using_speak."
common_mistakes = [
  "Using speak when the workflow needs keypad input; speak does not collect digits.",
  "Leaving digit bounds or terminator unspecified when the prompt needs a predictable completion condition.",
]
examples = ['{"call_control_id":"call-control-123","payload":"Press 1 for deploy status or 2 for incident summary.","minimum_digits":1,"maximum_digits":1,"terminator":"#"}']

