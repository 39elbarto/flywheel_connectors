[provides.operations."telnyx.webhook.validate_signature".ai_hints]
when_to_use = "Use when the agent needs to verify Telnyx webhook Ed25519 headers and replay state before trusting the event body."
common_mistakes = [
  "Treating Telnyx signatures like Twilio HMAC signatures; Telnyx uses Ed25519 headers.",
  "Validating the parsed JSON body instead of the exact raw body bytes that Telnyx signed.",
]
examples = ['{"headers":{"Telnyx-Timestamp":"1770000000","Telnyx-Signature-Ed25519":"base64-ed25519-signature"},"raw_body":"{\"data\":{\"event_type\":\"call.initiated\"}}","body":{"data":{"event_type":"call.initiated"}}}']

