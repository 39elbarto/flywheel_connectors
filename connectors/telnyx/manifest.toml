connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 1048576

[provides.operations."telnyx.call.end"]
description = "Hang up a Telnyx call"
capability = "telnyx.voice"
risk_level = "high"
safety_tier = "dangerous"
requires_approval = "policy"
idempotency = "best_effort"
input_schema = { type = "object", required = ["call_control_id"] }
output_schema = { type = "object" }

[provides.operations."telnyx.call.end".ai_hints]
when_to_use = "Use when the agent has approval to hang up an active Telnyx call."
common_mistakes = [
  "Ending the wrong call because stale call_control_id values were kept after a transfer or reconnect.",
  "Using end as a cleanup shortcut before persisting the final call status or audit outcome.",
]
examples = ['{"call_control_id":"call-control-123"}']

[provides.operations."telnyx.call.end".network_constraints]
