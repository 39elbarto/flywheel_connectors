[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = []
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:6d745a88ffc9c6c52b345b077c676267b2db20ad199928ad3c4b62696dbc23c7"

[connector]
id = "fcp.telnyx"
name = "Telnyx Connector"
version = "0.1.0"
description = "FCP voice-call connector for Telnyx Call Control"
archetypes = ["operational", "streaming", "bidirectional"]
format = "wasi"
status = "proven"

[connector.state]
model = "singleton_writer"
state_schema_version = "1"
migration_hint = "init"

[zones]
home = "z:work"
allowed_sources = ["z:owner", "z:private", "z:work"]
allowed_targets = ["z:work"]
forbidden = ["z:public"]

[capabilities]
required = ["network.dns", "network.egress", "network.tls.sni", "storage.state"]
optional = ["telnyx.voice", "telnyx.read", "telnyx.webhook"]
forbidden = ["system.exec", "network.listen"]

[provides.operations."telnyx.call.initiate"]
description = "Initiate an outbound Telnyx voice call with FCP callback/session binding"
capability = "telnyx.voice"
risk_level = "high"
safety_tier = "dangerous"
requires_approval = "policy"
idempotency = "none"
input_schema = { type = "object", required = ["to", "from", "connection_id"] }
output_schema = { type = "object" }

[provides.operations."telnyx.call.initiate".ai_hints]
when_to_use = "Use when the agent has explicit approval to place a new outbound Telnyx Call Control call."
common_mistakes = [
  "Starting a call without confirming the requested caller and callee numbers; this operation creates external telephone traffic.",
  "Omitting webhook_url or stream_url when the downstream workflow depends on signed callback or media-session binding.",
]
examples = ['{"to":"+15551230000","from":"+15559870000","connection_id":"conn-workflow","webhook_url":"https://voice.example.com/telnyx","timeout_secs":30}']

[provides.operations."telnyx.call.initiate".network_constraints]
host_allow = ["api.telnyx.com"]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 0
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 1048576

[provides.operations."telnyx.call.continue"]
description = "Answer or continue a Telnyx call"
capability = "telnyx.voice"
risk_level = "medium"
safety_tier = "risky"
requires_approval = "policy"
idempotency = "best_effort"
input_schema = { type = "object", required = ["call_control_id"] }
output_schema = { type = "object" }

[provides.operations."telnyx.call.continue".ai_hints]
when_to_use = "Use when the agent needs to answer or continue a pending Telnyx call that already has a call_control_id."
common_mistakes = [
  "Calling this before a Telnyx webhook or status lookup has supplied the current call_control_id.",
  "Treating answer as idempotent across provider retries; repeated continue requests can change the live call state.",
]
examples = ['{"call_control_id":"call-control-123"}']

[provides.operations."telnyx.call.continue".network_constraints]
host_allow = ["api.telnyx.com"]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 0
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 1048576

[provides.operations."telnyx.call.speak"]
description = "Speak text into a Telnyx call"
capability = "telnyx.voice"
risk_level = "medium"
safety_tier = "risky"
requires_approval = "policy"
idempotency = "none"
input_schema = { type = "object", required = ["call_control_id", "payload"] }
output_schema = { type = "object" }

[provides.operations."telnyx.call.speak".ai_hints]
when_to_use = "Use when the agent should speak short synthesized text into an active Telnyx call."
common_mistakes = [
  "Sending long transcripts or unreviewed generated text into a live call instead of a concise approved prompt.",
  "Confusing speak with gather; use telnyx.call.gather when the next step requires DTMF input.",
]
examples = ['{"call_control_id":"call-control-123","payload":"Your build finished successfully.","voice":"female","language":"en-US"}']

[provides.operations."telnyx.call.speak".network_constraints]
host_allow = ["api.telnyx.com"]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
