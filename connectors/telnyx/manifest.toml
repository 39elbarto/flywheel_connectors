capability = "telnyx.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"
input_schema = { type = "object", required = ["call_control_id"] }
output_schema = { type = "object" }

[provides.operations."telnyx.call.status".ai_hints]
when_to_use = "Use when the agent needs the current Telnyx provider state for a known call_control_id without changing the call."
common_mistakes = [
  "Polling status as a substitute for signed webhooks in event-driven call flows.",
  "Assuming a missing call is safe to ignore; provider 404 or 422 responses should be surfaced as call-state evidence.",
]
examples = ['{"call_control_id":"call-control-123"}']

