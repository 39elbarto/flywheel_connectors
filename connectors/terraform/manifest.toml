safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"

[provides.operations."terraform.validate".input_schema]
required = ["working_dir"]
type = "object"

[provides.operations."terraform.validate".input_schema.properties.working_dir]
description = "Path to Terraform configuration directory"
type = "string"

[provides.operations."terraform.validate".output_schema]
required = ["valid"]
type = "object"

[provides.operations."terraform.validate".output_schema.properties.diagnostics]
description = "Validation errors and warnings"
type = "array"

[provides.operations."terraform.validate".output_schema.properties.valid]
type = "boolean"

[provides.operations."terraform.validate".network_constraints]
host_allow = [
    "registry.terraform.io",
    "releases.hashicorp.com",
]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 4
max_redirects = 3
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 1048576

[provides.operations."terraform.validate".ai_hints]
when_to_use = "Check configuration for syntax errors before planning."
common_mistakes = ["Running validate without init (providers must be installed first)."]
examples = ['{"working_dir": "/infra/production"}']
related = [
    "terraform.init",
    "terraform.plan",
]

[sandbox]
profile = "strict"
memory_mb = 512
cpu_percent = 75
wall_clock_timeout_ms = 1800000
fs_readonly_paths = [
    "/usr",
    "/lib",
]
fs_writable_paths = [
    "$CONNECTOR_STATE",
    "$TERRAFORM_WORKDIR",
]
deny_exec = false
deny_ptrace = true

[[rate_limits.pools]]
id = "terraform.plan"
description = "Plan and read-only operations"
requests = 100
window_ms = 3600000
burst = 10
scope = "instance"

[[rate_limits.pools]]
id = "terraform.apply"
description = "Apply and destroy operations (infrastructure mutations)"
requests = 20
window_ms = 3600000
burst = 3
scope = "instance"

[[rate_limits.pools]]
id = "terraform.state"
description = "State inspection operations"
requests = 500
window_ms = 3600000
burst = 25
scope = "instance"

[[rate_limits.pools]]
id = "terraform.state_write"
description = "State modification operations (import)"
requests = 50
window_ms = 3600000
burst = 5
scope = "instance"

[rate_limits.operation_pools]
"terraform.state_list" = ["terraform.state"]
"terraform.state_show" = ["terraform.state"]
"terraform.destroy" = ["terraform.apply"]
"terraform.validate" = ["terraform.plan"]
"terraform.init" = ["terraform.plan"]
"terraform.output" = ["terraform.state"]
"terraform.detect_drift" = ["terraform.plan"]
"terraform.import" = ["terraform.state_write"]
"terraform.list_modules" = ["terraform.plan"]
"terraform.apply" = ["terraform.apply"]
"terraform.plan" = ["terraform.plan"]
"terraform.show_plan" = ["terraform.plan"]
