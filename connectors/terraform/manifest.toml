[sandbox]
profile = "strict"
memory_mb = 512
cpu_percent = 75
wall_clock_timeout_ms = 1800000
fs_readonly_paths = [
    "/usr",
    "/lib",
]
fs_writable_paths = ["$CONNECTOR_STATE"]
deny_exec = true
deny_ptrace = true

[[rate_limits.pools]]
id = "terraform.plan"
requests = 100
window_ms = 3600000
burst = 10
scope = "instance"

[[rate_limits.pools]]
id = "terraform.apply"
requests = 20
window_ms = 3600000
burst = 3
scope = "instance"

[[rate_limits.pools]]
id = "terraform.state"
requests = 200
window_ms = 3600000
burst = 20
scope = "instance"

[[rate_limits.pools]]
id = "terraform.state_write"
requests = 50
window_ms = 3600000
burst = 5
scope = "instance"

[rate_limits.operation_pools]
"terraform.output" = ["terraform.state"]
"terraform.plan" = ["terraform.plan"]
"terraform.detect_drift" = ["terraform.plan"]
"terraform.validate" = ["terraform.plan"]
