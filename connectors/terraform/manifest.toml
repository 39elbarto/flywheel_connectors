[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = []
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:d264ec6b3430649d5af43f764c8e5334a09a6c05fd392d05b08d75e6241e0c43"

[connector]
id = "fcp.terraform"
name = "Terraform Connector"
version = "0.1.0"
description = "FCP connector for Terraform Cloud/Enterprise IaC management"
archetypes = ["operational"]
format = "native"
status = "ready"

[connector.state]
model = "singleton_writer"
state_schema_version = "1"
migration_hint = "Stores plan artifact hashes and drift checkpoints."

[zones]
home = "z:infra"
allowed_sources = [
    "z:owner",
    "z:infra",
]
allowed_targets = ["z:infra"]
forbidden = [
    "z:public",
    "z:community",
    "z:work",
]

[capabilities]
required = [
    "network.dns",
    "network.egress",
    "network.tls.sni",
    "storage.state",
]
optional = [
    "terraform.plan",
    "terraform.apply",
    "terraform.state",
    "terraform.state_write",
]
forbidden = [
    "system.exec",
    "network.listen",
    "media.download",
    "media.upload",
]

[provides.operations."terraform.apply"]
description = "Apply a previously generated plan to modify infrastructure"
capability = "terraform.apply"
risk_level = "high"
safety_tier = "dangerous"
requires_approval = "interactive"
idempotency = "best_effort"
revocation_freshness = "safe"

[provides.operations."terraform.apply".input_schema]
required = ["run_id"]
type = "object"

[provides.operations."terraform.apply".output_schema]
required = [
    "status",
    "applied",
]
type = "object"

[provides.operations."terraform.apply".network_constraints]
host_allow = [
    "app.terraform.io",
    "*.terraform.io",
]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 5
connect_timeout_ms = 10000
total_timeout_ms = 60000
max_response_bytes = 10485760

[provides.operations."terraform.apply".ai_hints]
when_to_use = "Apply a previously generated plan to create, update, or destroy infrastructure resources."
common_mistakes = [
    "Applying without reviewing the plan first — always inspect resource_changes from terraform.plan or terraform.show_plan.",
    "Applying a stale plan after infrastructure has changed — the plan may no longer be valid.",
    "Not understanding that apply acquires and holds a state lock for the entire duration.",
    "Applying to the wrong workspace — double-check run_id maps to the intended environment.",
]
examples = ['{"run_id": "run-abc123"}']
related = [
    "terraform.plan",
    "terraform.show_plan",
]

[provides.operations."terraform.destroy"]
description = "Destroy all resources managed by a configuration"
capability = "terraform.apply"
risk_level = "high"
safety_tier = "dangerous"
requires_approval = "interactive"
idempotency = "best_effort"
revocation_freshness = "safe"

[provides.operations."terraform.destroy".input_schema]
required = ["workspace_id"]
type = "object"

[provides.operations."terraform.destroy".output_schema]
required = [
    "status",
    "destroyed",
]
type = "object"

[provides.operations."terraform.destroy".network_constraints]
host_allow = [
    "app.terraform.io",
    "*.terraform.io",
]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 5
connect_timeout_ms = 10000
total_timeout_ms = 60000
max_response_bytes = 10485760

[provides.operations."terraform.destroy".ai_hints]
when_to_use = "Destroy all resources managed by a Terraform workspace. This is irreversible for most resources."
common_mistakes = [
    "Destroying production workspaces without confirming the target — this deletes ALL managed resources.",
    "Not checking for resources with prevent_destroy lifecycle rules — destroy will fail partway through.",
    "Forgetting that destroy acquires a state lock and may take a long time for large configurations.",
    "Not planning a destroy first to review what will be removed.",
]
examples = ['{"workspace_id": "ws-abc123"}']
related = [
    "terraform.plan",
    "terraform.state_list",
]

