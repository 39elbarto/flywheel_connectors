common_mistakes = [
    "Using the wrong resource_id format — each provider has its own ID format (e.g., AWS ARN vs Azure resource ID vs GCP self-link).",
    "Not writing the corresponding resource block in configuration before importing — import adds state but not config.",
    "Importing into the wrong resource_address — double-check module path and resource name.",
    "Not running plan after import to verify the configuration matches the imported resource's actual attributes.",
]
