# ---------------------------------------------------------------------------
# Streaming / Event Capabilities
# ---------------------------------------------------------------------------

[event_caps]
streaming = true
replay = false
min_buffer_events = 50

# ---------------------------------------------------------------------------
# Sandbox
# ---------------------------------------------------------------------------

[sandbox]
profile = "strict"
memory_mb = 256
cpu_percent = 50
wall_clock_timeout_ms = 120000
fs_readonly_paths = [
    "/usr",
    "/lib",
]
fs_writable_paths = ["$CONNECTOR_STATE"]
deny_exec = true
deny_ptrace = true

# ---------------------------------------------------------------------------
# Rate Limit Pools
# ---------------------------------------------------------------------------

[[rate_limits.pools]]
id = "twilio.read"
description = "Read operations against Twilio REST API"
requests = 100
window_ms = 60000
burst = 20
scope = "instance"

[[rate_limits.pools]]
id = "twilio.message"
description = "Message send operations"
requests = 60
window_ms = 60000
burst = 10
scope = "instance"

[[rate_limits.pools]]
id = "twilio.voice"
description = "Voice call operations"
requests = 30
window_ms = 60000
burst = 5
scope = "instance"

[[rate_limits.pools]]
id = "twilio.media"
description = "Media and recording download operations"
requests = 30
window_ms = 60000
burst = 10
scope = "instance"

[rate_limits.operation_pools]
"twilio.send_message" = ["twilio.message"]
"twilio.get_message" = ["twilio.read"]
"twilio.list_messages" = ["twilio.read"]
"twilio.list_media" = ["twilio.read"]
"twilio.get_media" = ["twilio.read"]
"twilio.create_call" = ["twilio.voice"]
"twilio.get_call" = ["twilio.read"]
