[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = []
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:6296fd0f664d3408a8297f6c3328bcf35a07c3143acc11306b9c1e0094105db7"

[connector]
id = "fcp.twilio"
name = "Twilio Connector"
version = "0.1.0"
description = "FCP connector for Twilio communications platform (SMS, voice, messaging, media, video)"
archetypes = [
    "operational",
    "streaming",
    "bidirectional",
]
format = "wasi"

[connector.state]
model = "singleton_writer"
state_schema_version = "1"
migration_hint = "init"

[zones]
home = "z:work"
allowed_sources = [
    "z:owner",
    "z:private",
    "z:work",
]
allowed_targets = ["z:work"]
forbidden = ["z:public"]

[capabilities]
required = [
    "network.dns",
    "network.egress",
    "network.tls.sni",
    "storage.state",
]
optional = [
    "media.download",
    "twilio.message",
    "twilio.read",
    "twilio.voice",
    "twilio.whatsapp",
    "twilio.conversations",
    "twilio.conversations.participants",
    "twilio.verify",
    "twilio.video.rooms.write",
    "twilio.video.rooms.read",
    "twilio.video.participants.read",
    "twilio.video.recordings.read",
    "twilio.webhook",
]
forbidden = [
    "system.exec",
    "network.listen",
]

