[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = []
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:cad192754bafec58697eb1586b65802c7583067d9ad9661aa7d40e5c310ff4af"

[connector]
id = "fcp.twilio"
name = "Twilio Connector"
version = "0.1.0"
description = "FCP connector for Twilio communications platform (SMS, voice, messaging, media)"
archetypes = [
    "operational",
    "streaming",
    "bidirectional",
]
format = "wasi"

[connector.state]
model = "singleton_writer"
state_schema_version = "1"
migration_hint = "init"

[zones]
home = "z:work"
allowed_sources = [
    "z:owner",
    "z:private",
    "z:work",
]
allowed_targets = ["z:work"]
forbidden = ["z:public"]

[capabilities]
required = [
    "network.dns",
    "network.egress",
    "network.tls.sni",
    "storage.state",
]
optional = ["media.download"]
forbidden = [
    "system.exec",
    "network.listen",
]

# ---------------------------------------------------------------------------
# Operations: Messaging (SMS/MMS)
# ---------------------------------------------------------------------------

[provides.operations."twilio.send_message"]
description = "Send an SMS or MMS message via Twilio"
capability = "twilio.message"
risk_level = "high"
safety_tier = "risky"
requires_approval = "policy"
idempotency = "none"

[provides.operations."twilio.send_message".rate_limit]
max = 60
per_ms = 60000

[provides.operations."twilio.send_message".input_schema]
required = [
    "to",
    "from",
    "body",
]
type = "object"

[provides.operations."twilio.send_message".input_schema.properties.to]
description = "Destination phone number in E.164 format (e.g., '+15551234567')"
pattern = "^\\+[1-9]\\d{1,14}$"
type = "string"

[provides.operations."twilio.send_message".input_schema.properties.from]
description = "Twilio phone number or messaging service SID"
type = "string"

[provides.operations."twilio.send_message".input_schema.properties.body]
description = "Message body (max 1600 characters for SMS)"
maxLength = 1600
type = "string"

[provides.operations."twilio.send_message".input_schema.properties.media_url]
description = "URLs of media to attach (MMS, max 10)"
type = "array"
[provides.operations."twilio.send_message".input_schema.properties.media_url.items]
type = "string"

[provides.operations."twilio.send_message".input_schema.properties.status_callback]
description = "URL to receive delivery status webhooks"
type = "string"

[provides.operations."twilio.send_message".output_schema]
required = [
    "sid",
    "status",
    "to",
    "from",
    "date_created",
]
type = "object"

[provides.operations."twilio.send_message".output_schema.properties.sid]
description = "Message SID (unique identifier)"
type = "string"

[provides.operations."twilio.send_message".output_schema.properties.status]
description = "Message status (queued, sending, sent, delivered, failed, etc.)"
type = "string"

[provides.operations."twilio.send_message".output_schema.properties.to]
type = "string"

[provides.operations."twilio.send_message".output_schema.properties.from]
type = "string"

[provides.operations."twilio.send_message".output_schema.properties.date_created]
type = "string"

[provides.operations."twilio.send_message".output_schema.properties.price]
description = "Cost of the message (available after delivery)"
type = "string"

[provides.operations."twilio.send_message".network_constraints]
host_allow = ["api.twilio.com"]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 0
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 1048576

[provides.operations."twilio.send_message".ai_hints]
when_to_use = "Send an SMS or MMS. Requires a Twilio phone number or messaging service as the sender."
common_mistakes = [
    "Not using E.164 format for phone numbers.",
    "Exceeding 1600 character SMS limit without segmentation awareness.",
    "Using a non-Twilio number as the 'from' field.",
    "Sending to unverified numbers on trial accounts.",
]
examples = ['{"to": "+15551234567", "from": "+15559876543", "body": "Hello from FCP!"}']
