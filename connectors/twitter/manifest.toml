[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = []
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:ebd059ded9632c3497eb76dd0448805d1a4521f82b508a570afaf7209b3be62a"

[connector]
id = "fcp.twitter"
name = "Twitter/X Connector"
version = "0.1.0"
description = "FCP connector for Twitter/X API with REST operations and filtered stream support"
archetypes = [
    "operational",
    "streaming",
    "bidirectional",
]
format = "native"

[connector.state]
model = "stateless"
state_schema_version = "1"
migration_hint = "init"

[zones]
home = "z:work"
allowed_sources = [
    "z:owner",
    "z:private",
    "z:work",
]
allowed_targets = ["z:work"]
forbidden = ["z:public"]

[capabilities]
required = [
    "network.dns",
    "network.egress",
    "network.tls.sni",
]
optional = []
forbidden = [
    "system.exec",
    "network.listen",
    "storage.state",
]

