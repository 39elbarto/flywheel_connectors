[package]
name = "fcp-vectordb"
description = "Provider-selectable vector database connector (Pinecone, Qdrant) for the Flywheel Connector Protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "fcp_vectordb"
path = "src/lib.rs"

[[bin]]
name = "fcp-vectordb"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
fcp-core = { path = "../../crates/fcp-core" }
fcp-prelude = { path = "../../crates/fcp-prelude" }
fcp-async-core = { path = "../../crates/fcp-async-core" }
fcp-sdk = { path = "../../crates/fcp-sdk" }

anyhow.workspace = true
async-trait.workspace = true
bytes.workspace = true
reqwest = { workspace = true, features = ["json"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
chrono.workspace = true

[dev-dependencies]
ciborium.workspace = true
wiremock.workspace = true
fcp-async-core = { path = "../../crates/fcp-async-core" }
fcp-crypto = { path = "../../crates/fcp-crypto" }
fcp-testkit = { path = "../../crates/fcp-testkit" }
