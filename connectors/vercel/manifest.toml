input_schema = { type = "object", required = ["project_id_or_name", "name"], additionalProperties = false, properties = { project_id_or_name = { type = "string", description = "Vercel project ID or name" }, name = { type = "string", description = "Domain name to attach" }, git_branch = { type = "string", description = "Optional Git branch scope" }, redirect = { type = "string", description = "Optional redirect target" }, redirect_status_code = { type = "integer", description = "Optional redirect status code" } } }
