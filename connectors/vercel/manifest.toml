safety_tier = "dangerous"
idempotency = "strict"
input_schema = { type = "object", required = ["project_id_or_name"], additionalProperties = false, properties = { project_id_or_name = { type = "string", description = "Vercel project ID or name to delete" } } }
output_schema = { type = "object", required = ["deleted", "project_id_or_name"], additionalProperties = false, properties = { deleted = { type = "boolean", const = true }, project_id_or_name = { type = "string", description = "Deleted Vercel project ID or name" } } }

[provides.operations.projects_delete.network_constraints]
host_allow = ["api.vercel.com"]
port_allow = [443]
require_tls = true
deny_localhost = true
deny_private_ranges = true
max_redirects = 0

[provides.operations.projects_delete.ai_hints]
when_to_use = "When you need to permanently remove a Vercel project and its deployment surface"

[provides.operations.domains_list]
