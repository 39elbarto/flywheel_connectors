port_allow = [443]
require_tls = true
deny_localhost = true
deny_private_ranges = true
max_redirects = 0

[provides.operations.get_deployment.ai_hints]
when_to_use = "When you need status or details of a specific deployment"

[provides.operations.create_deployment]
summary = "Trigger a new deployment"
capability = "vercel.deployments.write"
risk = "medium"
safety_tier = "risky"
idempotency = "strict"

[provides.operations.create_deployment.network_constraints]
host_allow = ["api.vercel.com"]
port_allow = [443]
require_tls = true
deny_localhost = true
deny_private_ranges = true
max_redirects = 0

[provides.operations.create_deployment.ai_hints]
when_to_use = "When you need to trigger a new Vercel deployment"

[provides.operations.cancel_deployment]
summary = "Cancel an in-progress deployment"
capability = "vercel.deployments.write"
risk = "medium"
safety_tier = "risky"
idempotency = "strict"

[provides.operations.cancel_deployment.network_constraints]
host_allow = ["api.vercel.com"]
port_allow = [443]
require_tls = true
deny_localhost = true
deny_private_ranges = true
