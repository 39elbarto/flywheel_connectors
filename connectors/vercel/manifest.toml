input_schema = { type = "object", required = ["project_id_or_name"], additionalProperties = false, properties = { project_id_or_name = { type = "string", description = "Vercel project ID or name" } } }
output_schema = { type = "object", required = ["domains"], additionalProperties = false, properties = { domains = { type = "array", items = { type = "object" }, description = "Vercel project domains" }, pagination = { type = "object" } } }

[provides.operations.domains_list.network_constraints]
host_allow = ["api.vercel.com"]
