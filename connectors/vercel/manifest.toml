safety_tier = "safe"
idempotency = "none"
input_schema = { type = "object", required = ["project_id_or_name"], additionalProperties = false, properties = { project_id_or_name = { type = "string", description = "Vercel project ID or name" } } }
output_schema = { type = "object" }

[provides.operations.projects_get.network_constraints]
host_allow = ["api.vercel.com"]
port_allow = [443]
require_tls = true
deny_localhost = true
deny_private_ranges = true
max_redirects = 0

[provides.operations.projects_get.ai_hints]
when_to_use = "When you need configuration and metadata for a specific Vercel project"

[provides.operations.projects_create]
summary = "Create a project"
capability = "vercel.projects.write"
risk = "medium"
safety_tier = "risky"
idempotency = "strict"
input_schema = { type = "object", required = ["name"], additionalProperties = false, properties = { name = { type = "string", description = "New Vercel project name" }, framework = { type = "string", description = "Optional framework preset" }, rootDirectory = { type = "string", description = "Optional monorepo root directory" }, publicSource = { type = "boolean", description = "Whether source is public" }, buildCommand = { type = "string", description = "Optional build command" }, installCommand = { type = "string", description = "Optional install command" }, outputDirectory = { type = "string", description = "Optional output directory" }, devCommand = { type = "string", description = "Optional dev command" } } }
output_schema = { type = "object" }

[provides.operations.projects_create.network_constraints]
host_allow = ["api.vercel.com"]
port_allow = [443]
