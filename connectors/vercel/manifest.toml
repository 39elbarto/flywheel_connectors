[format]
type = "fcp-connector-manifest"
schema_version = "2.1"

[connector]
id = "fcp.vercel"
name = "Vercel"
version = "0.1.0"
description = "Vercel connector for deployments, projects, domains, and environment variables"
archetype = "cloud-control-plane"
homepage = "https://vercel.com/docs/rest-api"

[zones]
home = "z:work"
allowed_sources = ["z:work", "z:private"]
allowed_targets = ["z:work"]
tailscale_tag = "tag:fcp-work"

[capabilities]
required = ["network.outbound"]
optional = []
forbidden = ["system.exec", "system.privileged"]

[provides.operations.list_projects]
summary = "List all Vercel projects"
capability = "vercel.projects.read"
risk = "low"
safety_tier = "safe"
idempotency = "strict"

[provides.operations.list_projects.network_constraints]
host_allow = ["api.vercel.com"]
port_allow = [443]
require_tls = true
deny_localhost = true
deny_private_ranges = true
max_redirects = 0

[provides.operations.list_projects.ai_hints]
when_to_use = "When you need to list all projects in a Vercel account"

[provides.operations.get_project]
summary = "Get Vercel project details"
capability = "vercel.projects.read"
risk = "low"
safety_tier = "safe"
idempotency = "strict"

[provides.operations.get_project.network_constraints]
host_allow = ["api.vercel.com"]
port_allow = [443]
require_tls = true
deny_localhost = true
deny_private_ranges = true
max_redirects = 0

[provides.operations.get_project.ai_hints]
when_to_use = "When you need details about a specific Vercel project"

[provides.operations.list_deployments]
summary = "List deployments for a project"
capability = "vercel.deployments.read"
risk = "low"
safety_tier = "safe"
idempotency = "strict"

[provides.operations.list_deployments.network_constraints]
host_allow = ["api.vercel.com"]
port_allow = [443]
require_tls = true
deny_localhost = true
