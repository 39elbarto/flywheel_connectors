[provides.operations.list_deployments.ai_hints]
when_to_use = "When you need to see deployment history for a project"

[provides.operations.get_deployment]
summary = "Get deployment details"
capability = "vercel.deployments.read"
risk = "low"
safety_tier = "safe"
idempotency = "strict"

[provides.operations.get_deployment.network_constraints]
