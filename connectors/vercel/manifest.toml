[format]
type = "fcp-connector-manifest"
schema_version = "2.1"

[connector]
id = "fcp.vercel"
name = "Vercel"
version = "0.1.0"
description = "Vercel connector for projects, deployments, domains, and environment variable management"
archetype = "cloud-control-plane"
homepage = "https://docs.vercel.com/rest-api/reference"

[zones]
home = "z:work"
allowed_sources = ["z:work", "z:private"]
allowed_targets = ["z:work"]
tailscale_tag = "tag:fcp-work"

[capabilities]
required = ["network.outbound"]
optional = []
forbidden = ["system.exec", "system.privileged"]

[sandbox]
profile = "strict"
memory_mb = 128
cpu_percent = 25
wall_clock_timeout_ms = 60000
deny_exec = true
deny_ptrace = true

[provides.operations.health]
summary = "Check Vercel API credential health"
capability = "vercel.projects.read"
risk = "low"
safety_tier = "safe"
idempotency = "strict"
input_schema = { type = "object", additionalProperties = false, properties = {} }
output_schema = { type = "object", required = ["status"], additionalProperties = false, properties = { status = { type = "string", const = "ok", description = "Vercel credential health status" } } }

[provides.operations.health.network_constraints]
host_allow = ["api.vercel.com"]
port_allow = [443]
require_tls = true
deny_localhost = true
deny_private_ranges = true
max_redirects = 0

[provides.operations.health.ai_hints]
when_to_use = "When you need to verify that the configured Vercel token is valid"

[provides.operations.deployments_list]
summary = "List Vercel deployments"
capability = "vercel.deployments.read"
risk = "low"
safety_tier = "safe"
idempotency = "none"
input_schema = { type = "object", additionalProperties = false, properties = { project_id = { type = "string", description = "Optional Vercel project ID" }, limit = { type = "integer", description = "Maximum deployments to return" } } }
output_schema = { type = "object", required = ["deployments"], additionalProperties = false, properties = { deployments = { type = "array", items = { type = "object" }, description = "Vercel deployments" }, pagination = { type = "object" } } }

[provides.operations.deployments_list.network_constraints]
host_allow = ["api.vercel.com"]
port_allow = [443]
require_tls = true
deny_localhost = true
deny_private_ranges = true
max_redirects = 0

[provides.operations.deployments_list.ai_hints]
when_to_use = "When you need to review recent deployments for a Vercel account or project"

[provides.operations.deployments_get]
summary = "Get deployment details"
capability = "vercel.deployments.read"
risk = "low"
safety_tier = "safe"
idempotency = "none"
input_schema = { type = "object", required = ["deployment_id_or_url"], additionalProperties = false, properties = { deployment_id_or_url = { type = "string", description = "Vercel deployment ID or URL slug" } } }
output_schema = { type = "object" }

[provides.operations.deployments_get.network_constraints]
host_allow = ["api.vercel.com"]
port_allow = [443]
require_tls = true
deny_localhost = true
deny_private_ranges = true
max_redirects = 0

[provides.operations.deployments_get.ai_hints]
when_to_use = "When you need deployment state, URL, or readiness details for a specific deployment"

[provides.operations.deployments_create]
summary = "Create a deployment"
capability = "vercel.deployments.write"
risk = "high"
safety_tier = "risky"
idempotency = "strict"
input_schema = { type = "object", required = ["name"], additionalProperties = false, properties = { name = { type = "string", description = "Deployment name" }, project = { type = "string", description = "Optional Vercel project name" }, target = { type = "string", description = "Optional deployment target" }, git_source = { type = "object", required = ["type", "ref"], additionalProperties = false, properties = { type = { type = "string", description = "Git provider type, such as github" }, ref = { type = "string", description = "Git branch, tag, or ref" }, repoId = { type = "string", description = "Git provider repository ID" }, sha = { type = "string", description = "Git commit SHA" }, projectId = { type = "string", description = "Vercel project ID" } } }, meta = { type = "object" } } }
output_schema = { type = "object" }

[provides.operations.deployments_create.network_constraints]
host_allow = ["api.vercel.com"]
port_allow = [443]
require_tls = true
deny_localhost = true
deny_private_ranges = true
max_redirects = 0

[provides.operations.deployments_create.ai_hints]
when_to_use = "When you need to trigger a new Vercel deployment from a project or Git source"

[provides.operations.deployments_delete]
summary = "Delete a deployment"
capability = "vercel.deployments.write"
risk = "high"
safety_tier = "dangerous"
idempotency = "strict"
input_schema = { type = "object", required = ["deployment_id"], additionalProperties = false, properties = { deployment_id = { type = "string", description = "Vercel deployment ID to delete" } } }
output_schema = { type = "object", required = ["deleted"], additionalProperties = false, properties = { deleted = { type = "boolean", description = "Whether the resource was deleted" }, resource_id = { type = ["string", "null"], description = "Deleted Vercel resource ID" }, status = { type = ["string", "null"], description = "Optional provider status" }, state = { type = ["string", "null"], description = "Optional provider state" } } }

[provides.operations.deployments_delete.network_constraints]
host_allow = ["api.vercel.com"]
port_allow = [443]
require_tls = true
deny_localhost = true
deny_private_ranges = true
max_redirects = 0

[provides.operations.deployments_delete.ai_hints]
when_to_use = "When you need to remove a deployment that should no longer be accessible"

[provides.operations.projects_list]
summary = "List Vercel projects"
capability = "vercel.projects.read"
risk = "low"
safety_tier = "safe"
idempotency = "none"
input_schema = { type = "object", additionalProperties = false, properties = { limit = { type = "integer", description = "Maximum projects to return" } } }
output_schema = { type = "object", required = ["projects"], additionalProperties = false, properties = { projects = { type = "array", items = { type = "object" }, description = "Vercel projects" }, pagination = { type = "object" } } }

[provides.operations.projects_list.network_constraints]
host_allow = ["api.vercel.com"]
port_allow = [443]
require_tls = true
deny_localhost = true
deny_private_ranges = true
