[provides.operations.health]
summary = "Check API token health"
capability = "vercel.projects.read"
risk = "low"
safety_tier = "safe"
idempotency = "strict"

[provides.operations.health.network_constraints]
host_allow = ["api.vercel.com"]
port_allow = [443]
require_tls = true
deny_localhost = true
deny_private_ranges = true
max_redirects = 0

[provides.operations.health.ai_hints]
when_to_use = "When you need to verify Vercel API credentials"

[sandbox]
profile = "strict"
memory_mb = 128
cpu_percent = 25
wall_clock_timeout_ms = 30000
deny_exec = true
deny_ptrace = true
