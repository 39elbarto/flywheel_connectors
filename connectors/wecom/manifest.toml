output_schema = { type = "object", required = ["delivery", "callback", "policy", "event"], additionalProperties = false, properties = { delivery = { type = "object", required = ["id", "transport", "verified", "msg_signature_hash", "timestamp", "timestamp_skew_secs", "nonce_hash", "nonce_key_hash", "receive_id_hash", "replay"], additionalProperties = false, properties = { id = { type = "string", minLength = 1 }, transport = { type = "string", enum = ["callback_http"] }, verified = { type = "boolean" }, msg_signature_hash = { type = "string", pattern = "^sha256:[0-9a-f]{16}$" }, timestamp = { type = "string" }, timestamp_skew_secs = { type = "integer", minimum = 0 }, nonce_hash = { type = "string", pattern = "^sha256:[0-9a-f]{16}$" }, nonce_key_hash = { type = "string", pattern = "^sha256:[0-9a-f]{16}$" }, message_key_hash = { type = ["string", "null"], pattern = "^sha256:[0-9a-f]{16}$" }, receive_id_hash = { type = "string", pattern = "^sha256:[0-9a-f]{16}$" }, replay = { type = "boolean" } } }, callback = { type = "object", required = ["outer", "message", "plaintext_xml"], additionalProperties = false, properties = { outer = { type = ["object", "null"], additionalProperties = { type = "string" } }, message = { type = ["object", "null"], additionalProperties = { type = "string" } }, plaintext_xml = { type = ["string", "null"] } } }, policy = { type = "object", required = ["model", "decision", "reason", "sender_user_hash", "external_user_hash", "room_hash", "persisted_replay_state", "redaction_status"], additionalProperties = false, properties = { model = { type = "string", enum = ["host_forwarded_callback_replay_and_policy"] }, decision = { type = "string", enum = ["accepted", "rejected", "duplicate"] }, reason = { type = "string" }, sender_user_hash = { type = ["string", "null"], pattern = "^sha256:[0-9a-f]{16}$" }, external_user_hash = { type = ["string", "null"], pattern = "^sha256:[0-9a-f]{16}$" }, room_hash = { type = ["string", "null"], pattern = "^sha256:[0-9a