[format]
type = "fcp-connector-manifest"
schema_version = "2.1"

[connector]
id = "fcp.wecom"
name = "WeCom Enterprise Messaging"
version = "0.1.0"
description = "Tenant-scoped WeCom connector for enterprise app messaging, host-forwarded callback ingest, media transfer, directory lookups, and health verification"
archetype = "operational"
homepage = "https://developer.work.weixin.qq.com/"

# Auth and scope model:
# - One connector instance is bound to one WeCom tenant application.
# - Authentication uses `corp_id`, `agent_id`, and `agent_secret`.
# - The operator provisions that application out of band and grants the app the
#   tenant permissions needed for outbound messaging and directory reads.
# - Optional callback verification uses a host-forwarded HTTP callback model with
#   `callback_token` and `callback_encoding_aes_key`; the connector never owns a listener socket.
# - Host-forwarded callback ingest enforces timestamp skew, nonce/MsgId replay,
#   sender/room policy, and redaction-safe decision evidence before emitting events.
# - The connector acts as the configured enterprise application; user impersonation and
#   websocket delivery remain out of scope.

[zones]
home = "z:work"
allowed_sources = ["z:owner", "z:private", "z:work", "z:project:*"]
allowed_targets = ["z:work", "z:project:*"]
tailscale_tag = "tag:fcp-work"

[capabilities]
required = ["network.dns", "network.outbound", "network.tls.sni"]
optional = []
forbidden = ["system.exec", "system.privileged", "network.listen"]

[provides.operations.messages_send_text]
summary = "Send a WeCom text message"
capability = "wecom.messages.write"
risk = "medium"
safety_tier = "risky"
idempotency = "none"
input_schema = { type = "object", required = ["content"], anyOf = [{ required = ["touser"] }, { required = ["toparty"] }, { required = ["totag"] }], additionalProperties = false, properties = { content = { type = "string", minLength = 1, pattern = "\\S" }, touser = { type = "string", minLength = 1, pattern = "\\S" }, toparty = { type = "string", minLength = 1, pattern = "\\S" }, totag = { type = "string", minLength = 1, pattern = "\\S" }, safe = { anyOf = [{ type = "boolean" }, { type = "integer", enum = [0, 1] }] }, enable_duplicate_check = { anyOf = [{ type = "boolean" }, { type = "integer", enum = [0, 1] }] }, duplicate_check_interval = { type = "integer", minimum = 0, maximum = 4294967295 } } }
output_schema = { type = "object", additionalProperties = true, properties = { errcode = { type = "integer" }, errmsg = { type = "string" }, msgid = { type = "string" }, invaliduser = { type = "string" }, invalidparty = { type = "string" }, invalidtag = { type = "string" }, response_code = { type = "string" } } }
network_constraints = { host_allow = ["qyapi.weixin.qq.com"], port_allow = [443], ip_allow = [], cidr_deny = [], require_sni = true, spki_pins = [], deny_localhost = true, deny_private_ranges = true, deny_tailnet_ranges = true, deny_ip_literals = true, require_host_canonicalization = true, dns_max_ips = 16, max_redirects = 0, connect_timeout_ms = 10000, total_timeout_ms = 30000, max_response_bytes = 1048576 }

