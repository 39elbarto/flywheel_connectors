# ---------------------------------------------------------------------------
# Auth
# ---------------------------------------------------------------------------

[auth]
scheme = "bearer"
header = "Authorization"
credential_type = "api_key"
secretless_supported = true
credential_id_header = "X-FCP-Credential-Id"

[auth.fields.api_key]
type = "string"
required = true
description = "OpenAI API key for Whisper access"
secret = true

# ---------------------------------------------------------------------------
# Config
# ---------------------------------------------------------------------------

[config]
type = "object"
required = []

[config.properties.api_key]
type = "string"
description = "OpenAI API key (alternative to credential_id)"
secret = true

[config.properties.credential_id]
type = "string"
description = "FCP credential ID for secretless auth via egress proxy"

[config.properties.base_url]
type = "string"
description = "Override API base URL (default: https://api.openai.com/v1)"
default = "https://api.openai.com/v1"

# ---------------------------------------------------------------------------
# Event capabilities and sandbox
# ---------------------------------------------------------------------------

[event_caps]
streaming = false
replay = false
min_buffer_events = 10

[sandbox]
profile = "strict"
memory_mb = 256
cpu_percent = 50
wall_clock_timeout_ms = 120000
fs_readonly_paths = [
    "/usr",
    "/lib",
]
fs_writable_paths = ["$CONNECTOR_STATE"]
deny_exec = true
deny_ptrace = true
