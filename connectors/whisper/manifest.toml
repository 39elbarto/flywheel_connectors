[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = []
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:PLACEHOLDER_HASH"

[connector]
id = "fcp.whisper"
name = "Whisper Connector"
version = "0.1.0"
description = "FCP connector for OpenAI Whisper API with audio transcription, translation, and language detection"
archetypes = [
    "operational",
]
format = "native"

[connector.state]
model = "stateless"
state_schema_version = "1"
migration_hint = "init"

[zones]
home = "z:work"
allowed_sources = [
    "z:owner",
    "z:private",
    "z:work",
]
allowed_targets = ["z:work"]
forbidden = ["z:public"]

[capabilities]
required = [
    "network.dns",
    "network.egress",
    "network.tls.sni",
]
optional = []
forbidden = [
    "system.exec",
    "network.listen",
    "storage.state",
]

# ---------------------------------------------------------------------------
# Operation: whisper.transcribe
# ---------------------------------------------------------------------------

[provides.operations."whisper.transcribe"]
description = "Transcribe audio to text"
capability = "whisper.transcription"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"

[provides.operations."whisper.transcribe".rate_limit]
max = 60
per_ms = 60000

[provides.operations."whisper.transcribe".input_schema]
type = "object"

[provides.operations."whisper.transcribe".input_schema.properties.audio_base64]
type = "string"
description = "Base64-encoded audio data"

[provides.operations."whisper.transcribe".input_schema.properties.audio_url]
type = "string"
description = "URL to audio file"

[provides.operations."whisper.transcribe".input_schema.properties.model]
type = "string"
default = "whisper-1"
description = "Model to use (default: whisper-1)"

[provides.operations."whisper.transcribe".input_schema.properties.language]
type = "string"
description = "Language code (ISO 639-1)"

[provides.operations."whisper.transcribe".input_schema.properties.response_format]
type = "string"
description = "Output format (json, text, srt, verbose_json, vtt)"
enum = [
    "json",
    "text",
    "srt",
    "verbose_json",
    "vtt",
]

[provides.operations."whisper.transcribe".input_schema.properties.temperature]
type = "number"
description = "Sampling temperature (0.0-1.0)"
minimum = 0
maximum = 1

[provides.operations."whisper.transcribe".output_schema]
type = "object"

[provides.operations."whisper.transcribe".output_schema.properties.text]
type = "string"
description = "Transcribed text"

[provides.operations."whisper.transcribe".output_schema.properties.language]
type = "string"
description = "Detected language"

[provides.operations."whisper.transcribe".output_schema.properties.duration_seconds]
type = "number"
description = "Audio duration in seconds"

[provides.operations."whisper.transcribe".output_schema.properties.segments]
type = "array"
description = "Transcription segments"

[provides.operations."whisper.transcribe".network_constraints]
host_allow = ["api.openai.com"]
port_allow = [443]
ip_allow = []
cidr_deny = []
methods = ["POST"]
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 5
connect_timeout_ms = 10000
total_timeout_ms = 120000
max_response_bytes = 10485760

[provides.operations."whisper.transcribe".ai_hints]
when_to_use = "Use to convert audio files or streams to text. Supports mp3, mp4, wav, webm, flac, ogg, and more."
common_mistakes = [
    "Forgetting to provide either audio_base64 or audio_url.",
    "Exceeding the 25 MB file size limit.",
    "Passing an unsupported audio format.",
]
examples = [
    '{"audio_url": "https://example.com/recording.mp3"}',
    '{"audio_base64": "<base64-data>", "language": "en", "model": "whisper-1"}',
]
related = [
    "whisper.transcribe_verbose",
    "whisper.translate",
    "whisper.detect_language",
]

