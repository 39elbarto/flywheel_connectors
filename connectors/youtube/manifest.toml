[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = []
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:fd052561fb03cdaa6f589dcf32c69c74c2cd9eb5b471d88f1702bb7933e88ecc"

[connector]
id = "fcp.youtube"
name = "YouTube Connector"
version = "0.1.0"
description = "FCP connector for YouTube Data API (videos, channels, playlists, comments, search)"
archetypes = ["knowledge", "operational"]
format = "wasi"

[connector.state]
model = "singleton_writer"
state_schema_version = "1"
migration_hint = "init"

[zones]
home = "z:work"
allowed_sources = ["z:owner", "z:private", "z:work"]
allowed_targets = ["z:work"]
forbidden = ["z:public"]

[capabilities]
required = ["network.dns", "network.egress", "network.tls.sni", "storage.state"]
optional = ["media.download"]
forbidden = ["system.exec", "network.listen"]

# ── Operations ──────────────────────────────────────────────────

[provides.operations."youtube.search"]
description = "Search for videos, channels, or playlists"
capability = "youtube.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"

[provides.operations."youtube.search".input_schema]
required = ["query"]
type = "object"
[provides.operations."youtube.search".input_schema.properties.query]
type = "string"
[provides.operations."youtube.search".input_schema.properties.max_results]
type = "integer"
[provides.operations."youtube.search".input_schema.properties.type]
type = "string"

[provides.operations."youtube.search".output_schema]
required = ["items", "total_results"]
type = "object"
[provides.operations."youtube.search".output_schema.properties.items]
type = "array"
[provides.operations."youtube.search".output_schema.properties.total_results]
type = "integer"

[provides.operations."youtube.search".network_constraints]
host_allow = ["www.googleapis.com"]
port_allow = [443]
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 0
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 5242880

[provides.operations."youtube.search".ai_hints]
when_to_use = "Search YouTube for videos, channels, or playlists."
common_mistakes = ["Search quota costs 100 units — use sparingly"]
examples = ['{"query": "rust programming tutorial", "max_results": 10, "type": "video"}']
related = ["youtube.get_video"]

