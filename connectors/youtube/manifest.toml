# ────────────────────────────────────────────────────────────────

# ── Sandbox ─────────────────────────────────────────────────────

[sandbox]
profile = "strict"
memory_mb = 256
cpu_percent = 50
wall_clock_timeout_ms = 120000
fs_readonly_paths = ["/usr", "/lib"]
fs_writable_paths = ["$CONNECTOR_STATE"]
deny_exec = true
deny_ptrace = true

# ── Rate Limits ─────────────────────────────────────────────────

[[rate_limits.pools]]
id = "youtube.read"
requests = 100
window_ms = 1000
burst = 10
scope = "instance"

[[rate_limits.pools]]
id = "youtube.write"
requests = 50
window_ms = 1000
burst = 5
scope = "instance"

[rate_limits.operation_pools]
"youtube.search" = ["youtube.read"]
"youtube.get_video" = ["youtube.read"]
"youtube.list_videos" = ["youtube.read"]
"youtube.get_channel" = ["youtube.read"]
"youtube.list_playlists" = ["youtube.read"]
"youtube.list_playlist_items" = ["youtube.read"]
"youtube.list_comments" = ["youtube.read"]
"youtube.post_comment" = ["youtube.write"]
"youtube.get_captions" = ["youtube.read"]
"youtube.get_caption_transcript" = ["youtube.read"]
"youtube.upload_caption" = ["youtube.write"]
