[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = []
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:a85ca41d35bbb0e0b79559063dee527c99cb9b7afa90261c1a13d6be6099b67c"

[connector]
id = "fcp.zalo"
name = "Zalo"
version = "0.1.0"
description = "Experimental Zalo Bot API connector with live bot identity, outbound send, photo send, long polling, host-forwarded webhook ingest, replay/rate policy, media bounds, webhook management, and local webhook token verification"
archetypes = [
    "bidirectional",
    "streaming",
    "operational",
]
format = "native"
status = "experimental"

[connector.state]
model = "stateless"
state_schema_version = "1"
migration_hint = "Experimental Bot API slice: bot identity, message send, photo send, long-poll update normalization, host-forwarded webhook ingest, webhook setup, and webhook token verification."

[zones]
home = "z:community"
allowed_sources = [
    "z:owner",
    "z:work",
    "z:community",
]
allowed_targets = ["z:community"]
forbidden = []

[capabilities]
required = [
    "network.dns",
    "network.egress",
    "network.tls.sni",
]
optional = [
    "zalo.messages",
    "zalo.updates",
    "zalo.webhook",
    "zalo.events",
    "zalo.media",
]
forbidden = [
    "network.listen",
    "system.exec",
]

[provides.operations."zalo.messages.send"]
description = "Send a text message to a Zalo user via sendMessage"
capability = "zalo.messages"
risk_level = "medium"
safety_tier = "safe"
requires_approval = "none"
idempotency = "best_effort"
revocation_freshness = "safe"

[provides.operations."zalo.messages.send".network_constraints]
host_allow = ["bot-api.zaloplatforms.com"]
port_allow = [443]
require_sni = true
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 0
connect_timeout_ms = 10000
total_timeout_ms = 60000
max_response_bytes = 10485760

[provides.operations."zalo.messages.send".input_schema]
required = [
    "recipient_id",
    "message",
]
type = "object"

[provides.operations."zalo.messages.send".input_schema.properties.message]
description = "Message text to send"
type = "string"

[provides.operations."zalo.messages.send".input_schema.properties.recipient_id]
description = "Zalo user ID of the recipient"
type = "string"

[provides.operations."zalo.messages.send".output_schema]
type = "object"

[provides.operations."zalo.messages.send".output_schema.properties.message_id]
type = "string"

[provides.operations."zalo.messages.send".ai_hints]
when_to_use = "When you need to send a text message to a Zalo user through the bot."
common_mistakes = []
examples = []
related = []

