[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = []
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:a913c7d4d7467d11b909c01962453f9883006dc65050cd729d0374c98ee53ee8"

[connector]
id = "fcp.zalo"
name = "Zalo"
version = "0.1.0"
description = "Experimental Zalo Bot API connector with live bot identity, outbound send, photo send, long polling, webhook management, and local webhook token verification"
archetypes = [
    "bidirectional",
    "streaming",
    "operational",
]
format = "native"
status = "experimental"

[connector.state]
model = "stateless"
state_schema_version = "1"
migration_hint = "Live Bot API slice: bot identity, message send, photo send, long-poll updates, webhook setup, and webhook token verification."

[zones]
home = "z:community"
allowed_sources = [
    "z:owner",
    "z:work",
    "z:community",
]
allowed_targets = ["z:community"]
forbidden = []

[capabilities]
required = [
    "network.dns",
    "network.egress",
    "network.tls.sni",
]
optional = [
    "zalo.messages",
    "zalo.updates",
    "zalo.webhook",
]
forbidden = [
    "network.listen",
    "system.exec",
]

[provides.operations."zalo.messages.send"]
description = "Send a text message to a Zalo user via sendMessage"
capability = "zalo.messages"
risk_level = "medium"
safety_tier = "safe"
requires_approval = "none"
idempotency = "best_effort"
revocation_freshness = "safe"

[provides.operations."zalo.messages.send".input_schema]
required = [
    "recipient_id",
    "message",
]
type = "object"

[provides.operations."zalo.messages.send".input_schema.properties.message]
description = "Message text to send"
type = "string"

[provides.operations."zalo.messages.send".input_schema.properties.recipient_id]
description = "Zalo user ID of the recipient"
type = "string"

[provides.operations."zalo.messages.send".output_schema]
type = "object"

[provides.operations."zalo.messages.send".output_schema.properties.message_id]
type = "string"

[provides.operations."zalo.messages.send".ai_hints]
when_to_use = "When you need to send a text message to a Zalo user through the bot."
common_mistakes = []
examples = []
related = []

[provides.operations."zalo.messages.send_photo"]
description = "Send a photo message to a Zalo user via sendPhoto after public HTTPS URL validation"
capability = "zalo.messages"
risk_level = "medium"
safety_tier = "safe"
requires_approval = "none"
idempotency = "best_effort"
revocation_freshness = "safe"

[provides.operations."zalo.messages.send_photo".input_schema]
required = [
    "recipient_id",
    "photo_url",
]
type = "object"

[provides.operations."zalo.messages.send_photo".input_schema.properties.photo_url]
description = "HTTPS URL of the photo to send"
type = "string"

[provides.operations."zalo.messages.send_photo".input_schema.properties.recipient_id]
description = "Zalo user ID of the recipient"
type = "string"

[provides.operations."zalo.messages.send_photo".output_schema]
type = "object"

[provides.operations."zalo.messages.send_photo".output_schema.properties.message_id]
type = "string"

[provides.operations."zalo.messages.send_photo".ai_hints]
when_to_use = "When you need to send a photo message through the Zalo bot."
common_mistakes = ["Passing a non-HTTPS photo URL."]
examples = []
related = []

[provides.operations."zalo.self.get_me"]
description = "Get the current Zalo bot identity through getMe"
capability = "zalo.messages"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"
revocation_freshness = "safe"

[provides.operations."zalo.self.get_me".input_schema]
type = "object"

[provides.operations."zalo.self.get_me".output_schema]
type = "object"

[provides.operations."zalo.self.get_me".output_schema.properties.bot_id]
type = "string"

[provides.operations."zalo.self.get_me".ai_hints]
when_to_use = "When you need to confirm which Zalo bot account is active."
common_mistakes = []
