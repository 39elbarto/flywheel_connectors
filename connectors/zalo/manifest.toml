[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = []
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:39e3af8dcc64602ced02afdce33b3671b0df3f84e562abb69da56a1d93e8dd09"

[connector]
id = "fcp.zalo"
name = "Zalo"
version = "0.1.0"
status = "incubating"
description = "Incubating Zalo Bot API scaffold with only local webhook token verification implemented; bot identity, outbound send, long polling, and webhook management are planned"
archetypes = ["bidirectional", "streaming", "operational"]
format = "native"

[connector.state]
model = "stateless"
state_schema_version = "1"
migration_hint = "First slice: bot identity, message send, photo send, long-poll updates, webhook setup, and webhook token verification."

[zones]
home = "z:community"
allowed_sources = ["z:owner", "z:work", "z:community"]
allowed_targets = ["z:community"]

[capabilities]
required = ["network.dns", "network.egress", "network.tls.sni"]
optional = ["zalo.messages", "zalo.updates", "zalo.webhook"]
forbidden = ["network.listen", "system.exec"]

[sandbox]
profile = "strict"
memory_mb = 96
cpu_percent = 25
wall_clock_timeout_ms = 60000
deny_exec = true
deny_ptrace = true

[provides.operations."zalo.self.get_me"]
description = "Planned operation to get the current Zalo bot identity"
capability = "zalo.messages"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"

[provides.operations."zalo.self.get_me".input_schema]
type = "object"

[provides.operations."zalo.self.get_me".output_schema]
type = "object"

[provides.operations."zalo.self.get_me".output_schema.properties.bot_id]
type = "string"

[provides.operations."zalo.self.get_me".ai_hints]
when_to_use = "When you need to confirm which Zalo bot account is active."
common_mistakes = []
examples = []
related = []

