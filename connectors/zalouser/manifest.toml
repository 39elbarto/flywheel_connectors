[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = []
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:de1046d2cba6595464ea525fbf2946573103ecf19d2eb8851ffc89932b8df852"

[connector]
id = "fcp.zalouser"
name = "Zalo User"
version = "0.1.0"
status = "quarantined"
description = "Guarded helper-process connector for Zalo personal account automation"
archetypes = ["cli-process"]
format = "native"

[connector.state]
model = "local-cache"
state_schema_version = "1"
migration_hint = "First slice: explicit helper-process contract only. No bundled personal-account runtime is shipped in this crate."

[zones]
home = "z:owner"
allowed_sources = ["z:owner"]
allowed_targets = ["z:owner"]

[capabilities]
required = ["system.exec"]
optional = ["network.egress", "network.dns", "network.tls.sni"]
forbidden = ["network.listen"]

[sandbox]
profile = "medium"
memory_mb = 96
cpu_percent = 25
wall_clock_timeout_ms = 60000
deny_exec = false
deny_ptrace = true

[provides.operations."zalouser.get_status"]
description = "Check the status of the Zalo personal-account helper process"
capability = "zalouser.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"

[provides.operations."zalouser.get_status".input_schema]
type = "object"

[provides.operations."zalouser.get_status".output_schema]
type = "object"

[provides.operations."zalouser.get_status".output_schema.properties.running]
type = "boolean"

[provides.operations."zalouser.get_status".output_schema.properties.pid]
type = "integer"

[provides.operations."zalouser.get_status".ai_hints]
when_to_use = "When you need to check if the Zalo helper process is running."
common_mistakes = []
examples = []
related = []

