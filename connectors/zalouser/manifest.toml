[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = []
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:401f65a8b8a6d6b5891b375a4bc76f4db5b28b537d97bc1028cf016845a2c6e4"

[connector]
id = "fcp.zalouser"
name = "Zalo User"
version = "0.1.0"
status = "quarantined"
description = "Planned-only Zalo personal account automation connector"
archetypes = ["operational"]
format = "native"

[connector.state]
model = "stateless"
state_schema_version = "1"
migration_hint = "First slice: planned-only helper-process contract. No bundled personal-account runtime or exec grant is shipped in this crate."

[zones]
home = "z:owner"
allowed_sources = ["z:owner"]
allowed_targets = ["z:owner"]

[capabilities]
required = []
optional = ["zalouser.helper", "network.egress", "network.dns", "network.tls.sni"]
forbidden = ["network.listen", "system.exec"]

[sandbox]
profile = "strict"
memory_mb = 96
cpu_percent = 25
wall_clock_timeout_ms = 60000
deny_exec = true
deny_ptrace = true

[provides.operations."zalouser.helper.exec"]
description = "Planned guarded helper operation for a future Zalo personal-account runtime"
capability = "zalouser.helper"
risk_level = "high"
safety_tier = "risky"
requires_approval = "policy"
idempotency = "none"

[provides.operations."zalouser.helper.exec".input_schema]
required = ["action"]
type = "object"

[provides.operations."zalouser.helper.exec".input_schema.properties.action]
description = "Guarded helper action to execute"
type = "string"

[provides.operations."zalouser.helper.exec".output_schema]
type = "object"

[provides.operations."zalouser.helper.exec".output_schema.properties.ok]
type = "boolean"

[provides.operations."zalouser.helper.exec".ai_hints]
when_to_use = "When you intentionally need to drive the guarded Zalo helper process."
common_mistakes = []
examples = []
related = []
