[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = []
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:954d5a806ca6c72cfc552965b905ab78150b5ce89eacbd45c7a2ba0ff7d962e5"

[connector]
id = "fcp.zendesk"
name = "Zendesk Connector"
version = "0.1.0"
description = "FCP connector for Zendesk Support (tickets, knowledge base, customers, macros)"
archetypes = [
    "operational",
    "streaming",
    "knowledge",
]
format = "wasi"

[connector.state]
model = "singleton_writer"
state_schema_version = "1"
migration_hint = "init"

[zones]
home = "z:work"
allowed_sources = [
    "z:owner",
    "z:private",
    "z:work",
]
allowed_targets = ["z:work"]
forbidden = ["z:public"]

[capabilities]
required = [
    "network.dns",
    "network.egress",
    "network.tls.sni",
    "storage.state",
]
optional = ["media.download"]
forbidden = [
    "system.exec",
    "network.listen",
]

# ---------------------------------------------------------------------------
# Operations: Ticket CRUD
# ---------------------------------------------------------------------------

[provides.operations."zendesk.create_ticket"]
description = "Create a new support ticket"
capability = "zendesk.write"
risk_level = "medium"
safety_tier = "risky"
requires_approval = "policy"
idempotency = "none"

[provides.operations."zendesk.create_ticket".rate_limit]
max = 100
per_ms = 60000

[provides.operations."zendesk.create_ticket".input_schema]
required = ["subject"]
type = "object"

[provides.operations."zendesk.create_ticket".input_schema.properties.subject]
description = "Ticket subject line"
maxLength = 255
type = "string"

[provides.operations."zendesk.create_ticket".input_schema.properties.description]
description = "Ticket description body (first comment)"
type = "string"

[provides.operations."zendesk.create_ticket".input_schema.properties.priority]
description = "Ticket priority"
enum = ["urgent", "high", "normal", "low"]
type = "string"

[provides.operations."zendesk.create_ticket".input_schema.properties.status]
description = "Ticket status"
enum = ["new", "open", "pending", "hold", "solved", "closed"]
type = "string"

[provides.operations."zendesk.create_ticket".input_schema.properties.type]
description = "Ticket type"
enum = ["problem", "incident", "question", "task"]
type = "string"

[provides.operations."zendesk.create_ticket".input_schema.properties.requester_id]
description = "Requester user ID"
type = "integer"

[provides.operations."zendesk.create_ticket".input_schema.properties.assignee_id]
description = "Assignee agent ID"
type = "integer"

[provides.operations."zendesk.create_ticket".input_schema.properties.group_id]
description = "Assigned group ID"
type = "integer"

[provides.operations."zendesk.create_ticket".input_schema.properties.tags]
description = "Tags to apply"
type = "array"
[provides.operations."zendesk.create_ticket".input_schema.properties.tags.items]
type = "string"

[provides.operations."zendesk.create_ticket".input_schema.properties.custom_fields]
description = "Array of {id, value} pairs for custom fields"
type = "array"
[provides.operations."zendesk.create_ticket".input_schema.properties.custom_fields.items]
type = "object"

[provides.operations."zendesk.create_ticket".output_schema]
required = ["ticket"]
type = "object"
[provides.operations."zendesk.create_ticket".output_schema.properties.ticket]
description = "Created ticket object with id, url, status"
type = "object"

[provides.operations."zendesk.create_ticket".network_constraints]
host_allow = ["*.zendesk.com"]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 5
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 1048576

[provides.operations."zendesk.create_ticket".ai_hints]
when_to_use = "Create a new support ticket. At minimum requires a subject."
common_mistakes = [
    "Not providing a description (creates an empty ticket).",
    "Using group name instead of group_id.",
]
examples = ['{"subject": "Login issue", "description": "Cannot log in since update", "priority": "high", "type": "problem"}']
related = [
    "zendesk.get_ticket",
    "zendesk.update_ticket",
    "zendesk.search_tickets",
]

