# ---------------------------------------------------------------------------
# Streaming / Event Capabilities
# ---------------------------------------------------------------------------

[event_caps]
streaming = true
replay = false
min_buffer_events = 50

# ---------------------------------------------------------------------------
# Sandbox
# ---------------------------------------------------------------------------

[sandbox]
profile = "strict"
memory_mb = 256
cpu_percent = 50
wall_clock_timeout_ms = 120000
fs_readonly_paths = [
    "/usr",
    "/lib",
]
fs_writable_paths = ["$CONNECTOR_STATE"]
deny_exec = true
deny_ptrace = true

# ---------------------------------------------------------------------------
# Rate Limit Pools
# ---------------------------------------------------------------------------

[[rate_limits.pools]]
id = "zendesk.read"
description = "Read operations against Zendesk API"
requests = 200
window_ms = 60000
burst = 40
scope = "instance"

[[rate_limits.pools]]
id = "zendesk.write"
description = "Write/mutation operations"
requests = 100
window_ms = 60000
burst = 20
scope = "instance"

[[rate_limits.pools]]
id = "zendesk.delete"
description = "Destructive operations"
requests = 20
window_ms = 60000
burst = 5
scope = "instance"

[[rate_limits.pools]]
id = "zendesk.search"
description = "Search operations (lower rate limit per Zendesk policy)"
requests = 100
window_ms = 60000
burst = 15
scope = "instance"

[rate_limits.operation_pools]
"zendesk.create_ticket" = ["zendesk.write"]
"zendesk.get_ticket" = ["zendesk.read"]
"zendesk.update_ticket" = ["zendesk.write"]
"zendesk.delete_ticket" = ["zendesk.delete"]
"zendesk.search_tickets" = ["zendesk.search"]
"zendesk.list_ticket_comments" = ["zendesk.read"]
