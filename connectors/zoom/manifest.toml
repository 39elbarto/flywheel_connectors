[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = []
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:bb8f3dc63a53a8b3a94340892904151f7837672e9718929668f8e5998a93e1a2"

[connector]
id = "fcp.zoom"
name = "Zoom"
version = "0.1.0"
description = "Account-scoped Zoom REST connector for meetings, users, recordings, webinar inventory, and health probes"
archetypes = ["operational"]
format = "native"

[connector.state]
model = "stateless"
state_schema_version = "1"
migration_hint = "One Zoom Server-to-Server OAuth account binding plus retry and timeout settings are injected at runtime; the connector keeps no durable local state."

[zones]
home = "z:work"
allowed_sources = ["z:work"]
allowed_targets = ["z:work"]
forbidden = ["z:community", "z:public"]

[capabilities]
required = ["network.dns", "network.egress", "network.tls.sni"]
optional = []
forbidden = ["system.exec", "network.listen", "system.privileged"]

[provides.operations."zoom.meetings.list"]
description = "List meetings scheduled by a Zoom user."
capability = "zoom.meetings.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "none"

[provides.operations."zoom.meetings.list".input_schema]
type = "object"

[provides.operations."zoom.meetings.list".input_schema.properties.user_id]
type = "string"
description = "User ID or email. Defaults to `me`."
default = "me"

[provides.operations."zoom.meetings.list".input_schema.properties.page_size]
type = "integer"
description = "Number of records per page, up to 300."
default = 30

[provides.operations."zoom.meetings.list".input_schema.properties.next_page_token]
type = "string"
description = "Pagination token from a prior response."

[provides.operations."zoom.meetings.list".output_schema]
type = "object"

[provides.operations."zoom.meetings.list".output_schema.properties.meetings]
type = "array"

[provides.operations."zoom.meetings.list".output_schema.properties.total_records]
type = "integer"

[provides.operations."zoom.meetings.list".output_schema.properties.next_page_token]
type = "string"

[provides.operations."zoom.meetings.list".network_constraints]
host_allow = ["api.zoom.us", "zoom.us"]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 0
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 1048576

[provides.operations."zoom.meetings.list".ai_hints]
when_to_use = "When listing meetings scheduled by a Zoom user."
common_mistakes = ["Use `me` for the authenticated user when no explicit user ID is needed."]
examples = []
related = ["zoom.meetings.get"]

