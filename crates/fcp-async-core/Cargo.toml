[package]
name = "fcp-async-core"
description = "Shared async runtime substrate for FCP crates"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
asupersync = { path = "/dp/asupersync", default-features = false, features = ["tracing-integration"] }
asupersync-tokio-compat = { path = "/dp/asupersync/asupersync-tokio-compat", features = ["tokio-io"] }
fcp-async-core-macros = { path = "../fcp-async-core-macros" }
futures-util.workspace = true
thiserror.workspace = true
tokio = { version = "1", default-features = false, features = ["io-std", "rt"] }
