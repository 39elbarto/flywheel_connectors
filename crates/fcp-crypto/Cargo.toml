[package]
name = "fcp-crypto"
description = "FCP crypto primitives and helpers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
# Shared auth-claim schema (single source of truth for label layout)
fcp-auth-schema = { path = "../fcp-auth-schema" }
fcp-cbor = { path = "../fcp-cbor" }

# Signatures
ed25519-dalek.workspace = true
curve25519-dalek = { version = "4.1", features = ["group"] }
frost-ed25519 = "2.2"

# Post-quantum signatures (FIPS 204 ML-DSA-65, br-kyopb.1.1.3)
# `signature` is re-exported by `ml-dsa` so we do NOT pull our own; pulling
# both produces two incompatible versions of `signature::Verifier`.
ml-dsa = { version = "0.1.0-rc.9", default-features = false, features = ["alloc", "rand_core", "zeroize"] }
# Post-quantum KEM hybrid (X-Wing draft-06, X25519 + ML-KEM-768) for V4
# zone-key sealing (br-kyopb.1.2.1).
x-wing = { version = "0.1.0-rc.0", default-features = false, features = ["zeroize"] }
# `getrandom` v0.3 backs the rand_core v0.10 RNG adapter we wrap for ml-dsa's
# randomized signing path (br-kyopb.1.1.3).
getrandom = "0.3"
rand_core_pq = { package = "rand_core", version = "0.10" }

# Key exchange
x25519-dalek.workspace = true

# Hashing
blake3.workspace = true
sha2.workspace = true

# Key derivation
hkdf.workspace = true

# AEAD
chacha20poly1305.workspace = true

# HPKE (RFC 9180)
hpke.workspace = true

# COSE/CWT
coset.workspace = true

# Serialization (for COSE/CBOR)
ciborium.workspace = true
serde.workspace = true
serde_bytes = "0.11"

# Memory safety
zeroize.workspace = true
subtle.workspace = true

# Randomness
rand.workspace = true
rand_core.workspace = true

# Bytes
bytes.workspace = true
hex.workspace = true

# Error handling
thiserror.workspace = true

# Time (for token validation)
chrono.workspace = true

# Structured logging — fail-safe paths (br-zp1xx) warn on malformed
# inputs instead of panicking.
tracing.workspace = true

[dev-dependencies]
# Testing
serde_json.workspace = true
bincode = "1.3.3"
rand_chacha = "0.3"
proptest.workspace = true
tracing-subscriber.workspace = true
criterion.workspace = true
# Self-audit metamorphic harness (6po63.1)
semver.workspace = true

[[bench]]
name = "crypto_benchmarks"
harness = false
