[package]
name = "fcp-host"
version = "0.1.0"
edition = "2024"
description = "FCP Host - Node Gateway/Orchestrator for the Flywheel Connector Protocol"
license = "Apache-2.0"
repository = "https://github.com/flywheel-ai/flywheel_connectors"
keywords = ["fcp", "host", "gateway", "orchestrator"]
categories = ["network-programming", "asynchronous"]

[lints.rust]
unsafe_code = "forbid"

[dependencies]
# Core FCP types
fcp-core = { path = "../fcp-core" }
fcp-async-core = { path = "../fcp-async-core" }
asupersync-tokio-compat = { path = "/dp/asupersync/asupersync-tokio-compat", features = ["tokio-io"] }

# Async runtime
async-trait = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "2"

# Tracing
tracing = "0.1"
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }

# Semver for version comparison
semver = { version = "1", features = ["serde"] }

# HTTP server (doctor endpoint)
axum = { version = "0.8", features = ["json"] }
fcp-sandbox = { version = "0.1.0", path = "../fcp-sandbox" }

[dev-dependencies]
fcp-conformance = { path = "../fcp-conformance" }
fcp-e2e = { path = "../fcp-e2e" }
fcp-testkit = { path = "../fcp-testkit" }
reqwest.workspace = true
tempfile = "3"
