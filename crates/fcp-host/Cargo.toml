[package]
name = "fcp-host"
version = "0.1.0"
edition = "2024"
description = "FCP Host - Node Gateway/Orchestrator for the Flywheel Connector Protocol"
license = "Apache-2.0"
repository = "https://github.com/flywheel-ai/flywheel_connectors"
keywords = ["fcp", "host", "gateway", "orchestrator"]
categories = ["network-programming", "asynchronous"]

[lints.rust]
unsafe_code = "deny"

[dependencies]
# Core FCP types
fcp-audit = { path = "../fcp-audit" }
fcp-core = { path = "../fcp-core" }
# Canonical type-import surface (orw5s migration target).
fcp-prelude = { path = "../fcp-prelude" }
fcp-evidence = { path = "../fcp-evidence" }
fcp-kernel = { path = "../fcp-kernel" }
fcp-mesh = { path = "../fcp-mesh" }
fcp-policy = { path = "../fcp-policy" }
fcp-async-core = { path = "../fcp-async-core" }
fcp-cbor = { path = "../fcp-cbor" }
fcp-crypto = { path = "../fcp-crypto" }
fcp-ratelimit = { path = "../fcp-ratelimit" }
fcp-store = { path = "../fcp-store" }

# Async runtime
async-trait = "0.1"
futures-util = { workspace = true }
asupersync = { version = "0.3.1" }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
ciborium = { workspace = true }
subtle = { workspace = true }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "2"

# Tracing
tracing = "0.1"
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }

# Semver for version comparison
semver = { version = "1", features = ["serde"] }

# HTTP server (doctor endpoint)
axum = { version = "0.8", features = ["json"] }
hyper = "1.8.1"
hyper-util = { version = "0.1.20", features = ["server", "service", "http1", "http2"] }
tower = { version = "0.5.3", features = ["util"] }
fcp-sandbox = { version = "0.1.0", path = "../fcp-sandbox" }

[target.'cfg(target_os = "macos")'.dependencies]
fcp-raptorq = { path = "../fcp-raptorq" }
mach2 = "0.4"

[dev-dependencies]
fcp-testkit = { path = "../fcp-testkit" }
reqwest.workspace = true
tempfile = "3"
insta.workspace = true
criterion.workspace = true

[[bench]]
name = "cold_start"
harness = false

[[bench]]
name = "memory_overhead"
harness = false

[[bench]]
name = "local_invoke"
harness = false

[[bench]]
name = "tailnet_invoke"
harness = false

[[bench]]
name = "cpu_overhead"
harness = false
