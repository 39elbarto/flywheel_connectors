[package]
name = "fcp-mesh"
description = "FCP mesh node orchestration (routing, admission, gossip, leases)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
blake3.workspace = true
bytes.workspace = true
chrono.workspace = true
constant_time_eq = "0.4"
fcp-core = { path = "../fcp-core" }
fcp-crypto = { path = "../fcp-crypto" }
fcp-policy = { path = "../fcp-policy" }
fcp-protocol = { path = "../fcp-protocol" }
fcp-raptorq = { path = "../fcp-raptorq" }
fcp-store = { path = "../fcp-store" }
fcp-telemetry = { path = "../fcp-telemetry" }
fcp-tailscale = { path = "../fcp-tailscale" }
hex.workspace = true
hkdf = "0.12"
hmac = "0.12"
ciborium.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
thiserror.workspace = true
tracing.workspace = true
xorf.workspace = true
zeroize.workspace = true

[dev-dependencies]
criterion.workspace = true
fcp-async-core = { path = "../fcp-async-core" }
fcp-cbor = { path = "../fcp-cbor" }
insta = { workspace = true, features = ["json"] }
jsonschema.workspace = true
proptest.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }

semver.workspace = true
serde_json.workspace = true

[[bench]]
name = "mesh_benchmarks"
harness = false
