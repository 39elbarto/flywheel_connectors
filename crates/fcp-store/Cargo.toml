[package]
name = "fcp-store"
description = "FCP2 object and symbol stores (placement, repair, retention)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
bytes.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde = { workspace = true, features = ["derive"] }
parking_lot.workspace = true
async-trait.workspace = true

# Internal crates
fcp-async-core = { path = "../fcp-async-core" }
fcp-core = { path = "../fcp-core" }
fcp-raptorq = { path = "../fcp-raptorq" }
fcp-telemetry = { path = "../fcp-telemetry" }

[dev-dependencies]
jsonschema.workspace = true
semver.workspace = true
fcp-cbor = { path = "../fcp-cbor" }
fcp-testkit = { path = "../fcp-testkit" }
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
rand.workspace = true
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "symbol_store"
harness = false

[[bench]]
name = "repair_controller"
harness = false
