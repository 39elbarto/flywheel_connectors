[package]
name = "fcp-store"
description = "FCP object and symbol stores (placement, repair, retention)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
bytes.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
ciborium.workspace = true
parking_lot.workspace = true
async-trait.workspace = true
blake3.workspace = true
semver.workspace = true
tokio.workspace = true

# Internal crates
fcp-async-core = { path = "../fcp-async-core" }
fcp-cbor = { path = "../fcp-cbor" }
fcp-core = { path = "../fcp-core" }
fcp-evidence = { path = "../fcp-evidence" }
fcp-prelude = { path = "../fcp-prelude" }
fcp-crypto = { path = "../fcp-crypto" }
fcp-raptorq = { path = "../fcp-raptorq" }
fcp-telemetry = { path = "../fcp-telemetry" }

[dev-dependencies]
jsonschema.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
rand.workspace = true
proptest.workspace = true
criterion = { version = "0.8", features = ["html_reports"] }
tempfile = "3"

[features]
# Opt-in runtime deadlock detection via parking_lot's built-in cycle
# detector. Debug/test-only — enabling this changes parking_lot's Mutex
# implementation to track lock ownership globally, which has overhead
# unsuitable for release builds. Pair with a background thread that
# calls `parking_lot::deadlock::check_deadlock()` on an interval (see
# the workspace README "Deadlock detection" section for an example).
#
# Usage:
#   cargo test -p fcp-store --features deadlock-detection
deadlock-detection = ["parking_lot/deadlock_detection"]

[[bench]]
name = "symbol_store"
harness = false

[[bench]]
name = "repair_controller"
harness = false

[[bench]]
name = "repair_queue"
harness = false
