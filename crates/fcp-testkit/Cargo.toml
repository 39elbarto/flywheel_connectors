[package]
name = "fcp-testkit"
description = "Testing framework and mock infrastructure for FCP connectors"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
# Core FCP types
fcp-async-core = { path = "../fcp-async-core" }
fcp-conformance = { path = "../fcp-conformance" }
fcp-core = { path = "../fcp-core" }
fcp-prelude = { path = "../fcp-prelude" }
fcp-sdk = { path = "../fcp-sdk" }

# Async runtime
async-trait.workspace = true
futures-util.workspace = true

# Serialization
jsonschema.workspace = true
serde.workspace = true
serde_json.workspace = true
fcp-cbor = { path = "../fcp-cbor" }
semver.workspace = true

# Error handling
thiserror.workspace = true
anyhow.workspace = true

# Mock HTTP server
wiremock.workspace = true

# Logging/tracing for tests
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }

# Identifiers
uuid.workspace = true
chrono.workspace = true
blake3.workspace = true

# HTTP client for test assertions
reqwest.workspace = true

# Log scanning
regex.workspace = true

# Webhook signature helpers
sha2.workspace = true
hmac.workspace = true
hex.workspace = true

[dev-dependencies]
insta.workspace = true
proptest = { workspace = true }
