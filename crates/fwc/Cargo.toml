[package]
name = "fwc"
description = "Standalone Flywheel connectors CLI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[[bin]]
name = "fwc"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
chrono.workspace = true
clap = { workspace = true, features = ["derive", "env"] }
fcp-core.workspace = true
fcp-cbor.workspace = true
fcp-crypto.workspace = true
fcp-host.workspace = true
fcp-manifest.workspace = true
fcp-mesh.workspace = true
fcp-sandbox.workspace = true
fcp-telemetry.workspace = true
handlebars.workspace = true
jaq-core = "2.2.1"
jaq-json = { version = "1.1.3", features = ["serde_json"] }
jaq-std = "2.1.2"
chacha20poly1305.workspace = true
rand.workspace = true
base64.workspace = true
blake3.workspace = true
hex.workspace = true
ipnet = "2.9"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
reqwest = { workspace = true, features = ["blocking"] }
semver.workspace = true
tokio = { version = "1.49", features = ["io-std", "io-util", "macros", "rt"] }
toml.workspace = true
tracing.workspace = true
toon = { package = "tru", path = "/dp/toon_rust" }
url.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile = "3"
